// ---------- framing helpers (vertical) ----------
const aim=(a,b,x,y,F,z)=>shot(a,b,x,y+(1010-F)/z,z), sq=p=>p*p;

// eyes), and a broad lapis-and-gold collar. Drawn in head space so it turns with the head (r.face * r.hf).
function crown(r,k=1){const [x,y]=r.head,s=r.s,f=r.face*(r.hf||1),ED={stroke:'#6A4A12','stroke-width':4};
  return G(`translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${(s*f).toFixed(3)} ${s.toFixed(3)})`,
    P('M-52 -46L-56 -96L-30 -70L-2 -108L26 -70L54 -98L52 -46Z',GOLD,ED)+R(-56,-52,110,16,4,'#C8902A',ED)+
    [-34,-2,30].map(xx=>C(xx,-44,5,LAPIS)).join('')+C(-2,-90,6,'#E0574D'));}
const collarK=(r)=>{const [x,y]=r.neck,s=r.s;return Ell(x,y+10*s,46*s,16*s,LAPIS)+Ell(x,y+8*s,40*s,11*s,GOLD);};
function king(x,y,s,o={},extra=()=>''){

}

// ---------- props and set pieces ----------
const jar=(x,y,s=1,c='#C8703A')=>P(`M${x-22*s} ${y}Q${x-34*s} ${y-40*s} ${x-16*s} ${y-62*s}H${x+16*s}Q${x+34*s} ${y-40*s} ${x+22*s} ${y}Z`,c,{stroke:'#6A2E14','stroke-width':4*s})+R(x-18*s,y-72*s,36*s,12*s,4*s,mix(c,'#000000',.15));
const column=(x,y,h,w=90,c='#E8D2A0')=>R(x-w/2,y-h,w,h,6,c,{stroke:'#8A6A3A','stroke-width':5})+R(x-w/2-16,y-h-30,w+32,34,6,mix(c,'#C8A060',.4),{stroke:'#8A6A3A','stroke-width':5})+
  P(`M${x-w/2-10} ${y-h}Q${x} ${y-h-60} ${x+w/2+10} ${y-h}`,'#5AA060',{stroke:'#2A5A2A','stroke-width':4})+R(x-w/2-10,y-24,w+20,24,4,mix(c,'#000000',.1))+
  [.3,.5,.7].map(u=>L(x-w/2+8,y-h*u,x+w/2-8,y-h*u,'#B88A4A',4,{opacity:.6})).join('');
const sunDisc=(x,y,r,k=1)=>glow(x,y,r*2.4,'#FFC24C',.35*k)+C(x,y,r,mix('#5A4A3A','#FFC24C',k),{stroke:'#8A5A12','stroke-width':6})+C(x,y,r*.7,mix('#4A3A2A','#FFE07A',k))+
  [-1,1].map(f=>P(`M${x+f*r*.9} ${y+r*.2}Q${x+f*r*1.8} ${y-r*.2} ${x+f*r*2.4} ${y+r*.6}Q${x+f*r*1.7} ${y+r*.5} ${x+f*r*.9} ${y+r*.7}Z`,mix('#4A3A2A','#E8B53A',k))).join('');
// Egypt's "gods" are carved things on pedestals (never a figure of the true God): a river emblem, a frog, a cow, a sky arch, the sun.
const pedestal=(x,y,w=150,h=120,c='#B89A6A')=>R(x-w/2,y-h,w,h,8,c,{stroke:'#6A5030','stroke-width':5})+R(x-w/2-14,y-h-16,w+28,20,6,mix(c,'#ffffff',.2),{stroke:'#6A5030','stroke-width':4});
function idol(kind,x,y,s=1,crack=0){
  let g='';const c='#C8B08A',dk='#6A5030';
  if(kind==='river')g=R(x-46*s,y-170*s,92*s,170*s,40*s,c,{stroke:dk,'stroke-width':5})+[0,1,2].map(i=>P(`M${x-32*s} ${y-120*s+i*36*s}q16 -14 32 0t32 0`,'none',{stroke:NILE,'stroke-width':8*s})).join('');
  else if(kind==='frog')g=frog(0,x,y,1.6*s,{stone:true});
  else if(kind==='cow')g=SC.animal(0,'cow',x,y,.75*s,{col:GOLD,face:1});
  else if(kind==='sky')g=P(`M${x-80*s} ${y}V${y-110*s}Q${x} ${y-200*s} ${x+80*s} ${y-110*s}V${y}Z`,'#3A5AA8',{stroke:dk,'stroke-width':5})+[0,1,2,3,4].map(i=>C(x-50*s+i*25*s,y-100*s-Math.sin(i/4*Math.PI)*40*s,6*s,'#FFE9A8')).join('');
  else if(kind==='sun')g=sunDisc(x,y-90*s,60*s,1);
  if(crack>0)g+=mark(`M${x-10*s} ${y-180*s}L${x+12*s} ${y-120*s}L${x-8*s} ${y-80*s}L${x+14*s} ${y-20*s}`,crack,'#1A1010',7*s);
  return g;
}
// A frog (feet at x,y; s=1 is about 60 wide). hop 0..1 lifts it; stone draws it as a carved statue.
function frog(t,x,y,s=1,o={}){
  const hop=o.hop||0,col=o.stone?'#B8A07A':(o.col||'#4AAA3A'),dk=o.stone?'#6A5030':'#1E5A1A',f=o.face||1,yy=y-hop*40*s;
  return G(`translate(${x} ${yy}) scale(${s*f} ${s})`,
    Ell(-14,-6,16,10,dk)+Ell(22,-4,12,8,dk)+Ell(0,-22,34,22,col,{stroke:dk,'stroke-width':3})+
    C(14,-40,11,col,{stroke:dk,'stroke-width':3})+C(-6,-40,11,col,{stroke:dk,'stroke-width':3})+C(15,-41,5,o.stone?dk:'#111')+C(-5,-41,5,o.stone?dk:'#111')+
    P('M2 -18Q14 -12 28 -20','none',{stroke:dk,'stroke-width':2.5})+(o.stone?'':Ell(-4,-16,12,6,'#8AD86A',{opacity:.6})));
}
// A swarm: n small marks drifting in a box. kind 'gnat' | 'fly' | 'locust'.
function swarm(t,x0,y0,w,h,n,kind,o={}){
  let g='';const col=o.col||(kind==='locust'?'#7A5A2A':'#1A1A1A'),seed=o.seed||1,dx=o.dx||0;
  for(let i=0;i<n;i++){const u=hash(i,seed),v=hash(i,seed+3),sp=.6+hash(i,seed+5);
    const x=x0+((u*w+t*dx*sp+Math.sin(t*3*sp+i)*30)%w+w)%w,y=y0+v*h+Math.cos(t*2.6*sp+i*1.3)*24;
    if(kind==='gnat')g+=C(x,y,3+hash(i,seed+7)*2,col,{opacity:.85});
    else if(kind==='fly')g+=Ell(x,y,6,4,col)+Ell(x-3,y-5,5,3,'#DDE6EE',{opacity:.6})+Ell(x+3,y-5,5,3,'#DDE6EE',{opacity:.6});
    else g+=G(`translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(-20+hash(i,seed+9)*40).toFixed(0)})`,Ell(0,0,16,5,col)+Ell(-2,-4,12,4,'#B8A06A',{opacity:.7})+L(-8,2,-16,10,col,2)+L(4,2,10,10,col,2));}
  return g;

// Hail with fire inside it, falling in slanted streaks.
function hailFall(t,x0,x1,y0,y1,n,k=1){let g='';
  for(let i=0;i<n;i++){const u=hash(i,41),sp=900+hash(i,43)*500,y=y0+((t*sp+hash(i,47)*(y1-y0))%(y1-y0)),x=x0+u*(x1-x0)-(y-y0)*.25,r=8+hash(i,49)*10;

    if(i%3===0)g+=glow(x,y,r*3,'#FF8A3C',.6*k)+C(x,y,r*.5,'#FFB04C',{opacity:k});}
  return g;}
const lightning=(t,a,x,y0,y1)=>{const p=prog(t,a,a+.35);if(p<=0||p>=1)return '';let d=`M${x} ${y0}`,xx=x;for(let i=1;i<=6;i++){xx+=(hash(i,x|0)-.5)*120;d+=`L${xx} ${y0+(y1-y0)*i/6}`;}

// God is never a figure: his presence is a soft oval of light, or rings of light going out.
const presence=(t,x,y,r,k=1)=>k<=0?'':glow(x,y,r*2.6,'#FFF6DA',.5*k)+glow(x,y,r*1.2,'#FFFFFF',.65*k)+
  Ell(x,y,r*.74,r,'none',{stroke:'#FFFBEA','stroke-width':8,opacity:(.75*k).toFixed(2)})+Ell(x,y,r*.6,r*.82,'#FFFBEA',{opacity:(.22*k*(1+.25*Math.sin(t*2))).toFixed(2)});
const xMark=(cx,cy,r,p)=>mark(`M${cx-r} ${cy-r}L${cx+r} ${cy+r}`,p*2,CORAL,10)+mark(`M${cx+r} ${cy-r}L${cx-r} ${cy+r}`,p*2-1,CORAL,10);
// A mud-brick house in the collage style (base centre x, ground y, scale s). Built from: brick courses on a plinth, a flat
// roof with a parapet and round beam ends, an optional upper room, a ladder to the roof, a palm-frond awning over the
// door, a lattice window, lamplight spilling from the door onto the ground, jars and a basket by the door, laundry on
// the roof, and smoke from a cooking fire. o: w/h (size factors), wall, lit 0..1, mark 0..1 (blood painted on the lintel
// and both posts, with a hyssop bunch and a bowl), egypt (whitewashed, blue trim, no awning), storey, ladder, cloth,
// smoke, seed, night (cooler, darker wall), dim 0..1 (an unlit house under the shadow).
function mudHouse(t,x,y,s,o={}){
  const sd=o.seed||((x*7+y)|0),r=rng(sd),W=300*s*(o.w||1),Hh=210*s*(o.h||1),lit=o.lit??1,mk=o.mark||0,eg=!!o.egypt,night=!!o.night;
  let wall=o.wall||(eg?'#EEE4CE':['#C89A62','#B8865A','#D4A872','#A87A4E'][sd%4]);
  if(night)wall=SC.mx(wall,'#3A3A58',.45);if(o.dim)wall=SC.mx(wall,'#1A1A28',o.dim*.6);

  let g='';

  if(o.storey){const uw=W*.45,ux=o.storey>0?x0+W-uw-14*s:x0+14*s,uh=Hh*.55;
    g+=R(ux,top-uh,uw,uh+6*s,4*s,SC.mx(wall,'#000000',.06),{stroke:dk,'stroke-width':4*s})+R(ux+uw*.35,top-uh*.7,uw*.3,uh*.45,uw*.12,lit?SC.mx('#2A1C14','#FFD27A',.8*lit):'#2A1C14',{stroke:dk,'stroke-width':3*s})+
      R(ux-6*s,top-uh-10*s,uw+12*s,14*s,3*s,lt,{stroke:dk,'stroke-width':3*s});}
  // main block, plinth, brick courses (offset rows, a few bricks a shade darker or lighter)
  g+=R(x0,top,W,Hh,4*s,wall,{stroke:dk,'stroke-width':5*s})+R(x0-4*s,y-22*s,W+8*s,24*s,3*s,SC.mx(wall,'#5A3A1E',.3));
  if(!eg){for(let row=0;row<Math.floor(Hh/(26*s))-1;row++){const yy=top+14*s+row*26*s;g+=L(x0+6*s,yy,x0+W-6*s,yy,dk,1.6*s,{opacity:.35});
    for(let bx=x0+(row%2?18:44)*s;bx<x0+W-10*s;bx+=52*s){g+=L(bx,yy,bx,yy+26*s,dk,1.4*s,{opacity:.3});if(r()<.18)g+=R(bx+3*s,yy+3*s,46*s,20*s,2*s,r()<.5?lt:SC.mx(wall,'#5A3A1E',.2),{opacity:.55});}}}
  else{g+=R(x0,top,W,16*s,2*s,'#2A6AB8',{opacity:.8})+R(x0,y-40*s,W,10*s,2*s,'#2A6AB8',{opacity:.6});}
  // flat roof: parapet with a gap, round beam ends under it
  g+=R(x0-8*s,top-16*s,W+16*s,20*s,3*s,lt,{stroke:dk,'stroke-width':4*s})+R(x0-4*s,top-34*s,W*.42,20*s,3*s,lt,{stroke:dk,'stroke-width':3*s})+R(x0+W*.58,top-34*s,W*.42+4*s,20*s,3*s,lt,{stroke:dk,'stroke-width':3*s});
  for(let bx=x0+20*s;bx<x0+W-10*s;bx+=44*s)g+=C(bx,top+8*s,6*s,'#6A4422',{stroke:'#3A2410','stroke-width':2*s});

  if(o.cloth!==false&&!o.dim){const cy=top-60*s;g+=L(x0+20*s,cy-30*s,x0+20*s,top-16*s,'#5A3A1E',4*s)+L(x0+W*.55,cy-30*s,x0+W*.55,top-16*s,'#5A3A1E',4*s)+P(`M${x0+20*s} ${cy-26*s}Q${x0+W*.3} ${cy-12*s} ${x0+W*.55} ${cy-26*s}`,'none',{stroke:'#3A2410','stroke-width':2*s});
    [['#C8483A',.12],['#E8D8B0',.3],['#2E7AB8',.45]].forEach(([c,u],i)=>{const cx=x0+20*s+u*(W*.55-20*s)*1.6,sw=Math.sin(t*2+i+sd)*4*s;g+=P(`M${cx} ${cy-20*s}h${30*s}l${sw} ${36*s}h${-30*s}Z`,c,{opacity:.95});});}
  // ladder to the roof
  if(o.ladder){const lx=o.ladder>0?x0+W+6*s:x0-34*s;g+=L(lx,y,lx+8*s,top-30*s,'#7A5432',5*s)+L(lx+28*s,y,lx+36*s,top-30*s,'#7A5432',5*s);for(let k=1;k<7;k++){const yy=y-(y-top+30*s)*k/7;g+=L(lx+k*1.1*s,yy,lx+28*s+k*1.1*s,yy,'#7A5432',4*s);}}
  // door (arched), lamplight on the ground; lattice window
  const dx=x+(o.doorX||-.12)*W,dw=86*s,dh=140*s;
  if(lit>0)g+=P(`M${dx-dw/2} ${y}L${dx+dw/2} ${y}L${dx+dw*1.4} ${y+70*s}L${dx-dw*1.4} ${y+70*s}Z`,'#FFC86A',{opacity:(.28*lit).toFixed(2)});

function forePapyrus(t,cx,z,o={}){const [xl,xr]=EDG(cx,z),c=o.cols||['#1E3A1A','#3A6A2A','#7AA050'];let g=R(cx-800,1080,1600,900,0,o.water||'#1E4A6A')+R(cx-800,1080,1600,40,0,'#FFFFFF',{opacity:.12});
  [[xl-60,1],[xr+60,-1]].forEach(([x,k])=>{for(let i=0;i<7;i++){const bx=x+k*(i*40-60),top=1080-220-hash(i,91)*260,sw=Math.sin(t*1.2+i)*12;
    g+=P(`M${bx} 1900Q${bx+sw*.5} ${(1900+top)/2} ${bx+sw} ${top}`,'none',{stroke:c[i%2+1],'stroke-width':10});
    for(let j=0;j<11;j++){const a=-Math.PI*.95+j/10*Math.PI*.9;g+=L(bx+sw,top,bx+sw+Math.cos(a)*70,top+Math.sin(a)*70,c[2],3);}g+=C(bx+sw,top,9,c[1]);}});
  return g+SC.fore(t,{y:1150,edges:[xl,xr],cols:c,reeds:true,rocks:0,density:.4,seed:o.seed||11,over:o.over||''});}
// palace: stone steps across the frame and the bases of two big columns at the edges
function foreSteps(t,cx,z,o={}){const [xl,xr]=EDG(cx,z),c=o.col||'#D8C090';let g='';
  // floor tiles below the steps
  for(let r=0;r<6;r++)for(let k=0;k<10;k++)g+=R(cx-800+k*170+(r%2)*85,1370+r*90,166,86,4,(r+k)%2?'#C8A878':'#B89060',{stroke:'#8A6A3A','stroke-width':3});
  g+=R(cx-260,1400,520,520,10,'#8A2A2A',{stroke:GOLD,'stroke-width':10,opacity:.9})+R(cx-220,1440,440,440,6,'none',{stroke:'#2A4AA8','stroke-width':8,opacity:.8});
  for(let i=0;i<5;i++)g+=R(cx-800,1070+i*60,1600,62,4,SC.mx(c,'#000000',i*.06),{stroke:SC.mx(c,'#000000',.35),'stroke-width':4});
  [xl-80,xr+80].forEach(x=>{g+=R(x-130,1000,260,900,8,'#E8D2A0',{stroke:'#8A6A3A','stroke-width':6})+R(x-160,1240,320,80,6,'#C8A870',{stroke:'#8A6A3A','stroke-width':6})+[0,1,2].map(k=>L(x-120,1060+k*60,x+120,1060+k*60,'#B88A4A',5,{opacity:.6})).join('');});
  if(o.jar!==false)g+=jar(cx+260,1300,2.4,'#C8703A')+jar(cx-300,1360,2.0,'#2E7AB8');
  return g;}
// fields: barley stalks with heads close to the camera, swaying
function foreBarley(t,cx,z,o={}){const [xl,xr]=EDG(cx,z),c=o.cols||['#8A6A20','#C8A040','#F0D070'],bare=o.bare||0;let g=R(cx-800,1080,1600,900,0,o.soil||'#6A4A20');

// village: a low mud-brick wall across the bottom with jars, a basket, a sleeping dog shape, and a lamp
function foreWall(t,cx,z,o={}){const [xl,xr]=EDG(cx,z),night=!!o.night,c=night?'#4A3A3A':'#B8865A',dk=SC.mx(c,'#000000',.4);

// ---------- Babylon pieces ----------
// Glazed-brick wall in lapis blue with gold beasts in relief (the Ishtar Gate look); a ziggurat with a shrine on top.
function lapisWall(t,x0,x1,y,h,o={}){const c=o.col||LAPIS,dk=SC.mx(c,'#000000',.3);let g=R(x0,y-h,x1-x0,h,0,c,{stroke:'#0E2A60','stroke-width':5});
  for(let r=0;r<Math.floor(h/36);r++)for(let i=0;i<(x1-x0)/72;i++){const xx=x0+i*72+(r%2)*36;if(xx<x1-10)g+=R(xx,y-h+r*36+3,68,32,2,hash(i,r)>.6?dk:c,{opacity:.6});}
  for(let i=0;i<(x1-x0)/260;i++){const bx=x0+130+i*260,by=y-h*.55;g+=P(`M${bx-60} ${by}q20 -40 60 -36q30 -30 50 -6l10 30q-30 -6 -44 10l-6 30h-16l-4 -26h-30l-6 26h-16Z`,GOLD,{stroke:'#8A5A12','stroke-width':3,opacity:.9});}
  for(let i=0;i<(x1-x0)/60;i++)g+=P(`M${x0+i*60} ${y-h}v-26h40v26Z`,c,{stroke:'#0E2A60','stroke-width':4});
  return g+R(x0,y-h+18,x1-x0,10,0,GOLD,{opacity:.8})+R(x0,y-30,x1-x0,10,0,GOLD,{opacity:.8});}
function ishtarGate(t,x,y,s=1){const w=420*s,h=520*s;let g=lapisWall(t,x-w/2,x+w/2,y,h);
  g+=P(`M${x-110*s} ${y}V${y-250*s}Q${x} ${y-360*s} ${x+110*s} ${y-250*s}V${y}Z`,'#0A1430')+P(`M${x-110*s} ${y-250*s}Q${x} ${y-360*s} ${x+110*s} ${y-250*s}`,'none',{stroke:GOLD,'stroke-width':10*s});
  [x-w/2-40*s,x+w/2-50*s].forEach(tx=>g+=lapisWall(t,tx,tx+90*s,y,h+120*s));return g;}
function ziggurat(x,y,s=1,c='#C89A5A',lit=1){let g='';const ws=[620,480,340,200];ws.forEach((w,i)=>{const yy=y-i*120*s,ww=w*s;
  g+=R(x-ww/2,yy-120*s,ww,120*s,4,SC.mx(c,'#000000',i*.06),{stroke:SC.mx(c,'#000000',.35),'stroke-width':5})+R(x-ww/2,yy-120*s,ww,14*s,0,SC.mx(c,'#ffffff',.2));
  for(let k=0;k<Math.floor(ww/90);k++)g+=R(x-ww/2+20*s+k*90*s,yy-90*s,40*s,40*s,4,'#2A1A10',{opacity:.55});});
  g+=P(`M${x-60*s} ${y-480*s}h${120*s}v${-90*s}h${-120*s}Z`,LAPIS,{stroke:'#0E2A60','stroke-width':5})+P(`M${x-80*s} ${y-570*s}h${160*s}l${-80*s} ${-50*s}Z`,GOLD);
  g+=P(`M${x-24*s} ${y}V${y-480*s}h${48*s}V${y}Z`,SC.mx(c,'#000000',.25),{opacity:.6});
  return g+glow(x,y-520*s,160*s,'#FFC24C',.3*lit);}
// Babylon from the palace roof: a dusk sky, the ziggurat, the lapis walls and gate, flat roofs and palms, the river.
function babylonCity(t,o={}){const gy=o.gy??900,night=o.night||0,far=o.far??1;
  let g=eSky(t,o.sky||'dusk',{hz:gy-80,seed:o.seed||31,sun:o.sun===false?null:[o.sx??1560,o.sy??520,70],sunCol:'#FF9A5A'});
  g+=ziggurat(o.zx??620,gy-10,(o.zs??.95)*far,'#C8925A',1);
  g+=palms(t,-100,2000,gy-4,.85,undefined,o.seed||31);
  [[180,gy+10,.6,1],[430,gy+20,.7,0],[1240,gy+16,.68,1],[1500,gy+10,.62,0],[1760,gy+20,.7,1]].forEach(([x,y,s,st],i)=>g+=mudHouse(t,x,y,s*far,{storey:st?1:0,ladder:i%2,lit:.7,smoke:i===2,seed:i+31,cloth:i%2===0}));
  g+=lapisWall(t,-200,2120,gy+60+80*far,120*far)+ishtarGate(t,o.gx??1000,gy+70+80*far,.7*far);

// ================= 3. Jerusalem and the captives =================

  const burn=ease.out(prog(t,AT.besieged,AT.besieged+1.2));
  let g=eSky(t,'blood',{hz:760,seed:43,sun:false});
  g+=SC.hills(43,{y:780,amp:60,col:'#6A4A3A',light:'#8A6A4A'});
  g+=R(380,560,1160,240,0,'#B8A07A',{stroke:'#6A5030','stroke-width':6});
  for(let i=0;i<5;i++)g+=R(360+i*280,500,90,300,0,'#C8B088',{stroke:'#6A5030','stroke-width':5});
  g+=R(860,420,200,140,6,'#E8D8B0',{stroke:'#6A5030','stroke-width':5})+P('M840 420L960 340L1080 420Z','#C8A060');
  g+=FX.flames(t,[[420,560],[700,560],[1100,560],[1460,560]],{H:110*burn,seed:43})+glow(960,520,700,'#FF7A3A',.35*burn);
  g+=SC.clouds(t,{seed:47,n:4,y:-560,h:400,cols:['#3A2A2A','#1A1010','#8A4A3A'],drift:6,op:.8*burn});

// ================= pieces for the rest of the story (tree, warning, the roof, the field, the answer) =================
// The dream tree: roots, trunk, branches, a layered round canopy with fruit. g 0..1 grows it; fall 0..1 tips it over

  g+=column(240,FY+20,1100,110,'#E8D2A0')+column(1680,FY+20,1100,110,'#E8D2A0');
  const a=AT.year+.2,b=AT.nothing-.4,n=Math.floor(lerp(1,12.999,prog(t,a,b))),torn=[];
  for(let k=1;k<12;k++){const tk=lerp(a,b,k/12);torn.push([k,prog(t,tk,tk+.5)]);}
  g+=calendar(t,960,FY-260,1.2,n,torn);
  return g+floorFore(t,960,1.0);
}

function endOfDays(t,lt){
  const a=AT.endDays-.2,arc=(t-a)*1.4,day=(Math.sin(arc*Math.PI*2)+1)/2;
  const sid=S.nid();let g=`<linearGradient id="${sid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${SC.mx('#05081A','#3A78C8',day)}"/><stop offset="1" stop-color="${SC.mx('#1A2A5A','#CFE6F8',day)}"/></linearGradient><rect x="-200" y="-900" width="2400" height="1800" fill="url(#${sid})"/>`;
  for(let i=0;i<60;i++)g+=C(-150+hash(i,21)*2300,-800+hash(i,23)*1400,2+hash(i,25)*2.5,'#FFF6DA',{opacity:((1-day)*.8).toFixed(2)});
  const ph=arc%1,sa=Math.PI*(1-ph),sx=960+Math.cos(sa)*900,sy=820-Math.sin(sa)*900;
  g+=(Math.floor(arc)%2===0?SC.sun(t,sx,sy,70,{}):C(sx,sy,50,'#F4F0DC')+glow(sx,sy,200,'#CFE0FF',.4));
  g+=SC.hills(177,{y:820,amp:50,col:SC.mx('#1A2A3A','#5A8A4A',day),light:SC.mx('#2A3A4A','#8ABA6A',day)})+R(-200,FY-80,2400,1000,0,SC.mx('#1A2A2A','#5E9A46',day));
  g+=SC.ground(t,178,{y:FY-40,col:SC.mx('#1A2A2A','#5E9A46',day),col2:'#2A4A2A',stones:6,tufts:20});
  g+=crawler(t,960,FY+40,1.3,{face:1,wild:1,look:'down',expr:'calm',claw:1})+SC.animal(t,'ox',1400,FY+20,1.1,{face:-1,graze:'auto'});

}
