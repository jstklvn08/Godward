// ---------- people (videos/_kit/people.js): the same round figures as episode 1, acting together ----------
const TUN=[['#3DE0B8','#1787A8'],['#FFC24C','#E0623C'],['#B98CFF','#6A4CD8'],['#FF8FB1','#C8487A'],['#7CD4FF','#2F6FD0']];

const pplOpts=(i,x,y,s,o={})=>{const [a,b]=TUN[i%5],[sk,sh]=SKIN[i%3],face=o.flip||o.face||1,f=o.f??(i%2===1);
  const q=Object.assign({x,y,s,face,f,tunic:a,tunic2:b,skin:sk,shade:sh,hair:HAIR[i%3],phase:i*.7},o);
  q.face=face;delete q.flip;delete q.filter;delete q.reach;
  if(!o.walk)delete q.walk;

const folk=(i,x,y,s,o={})=>PPL.fig(pplOpts(i,x,y,s,o));
const person=pplOpts;
const elderOpts=(x,y,s,o={})=>{const q=pplOpts(0,x,y,s,Object.assign({tunic:'#C8A06A',tunic2:'#7A5430',skin:'#D9965E',shade:'#A86A3E',f:false,phase:.4},o));q.hair=o.hair||'#ECE8DE';return q;};
const elder=(x,y,s,o={})=>PPL.fig(elderOpts(x,y,s,o));

const bro=(who,x,y,s,o={})=>{const q=Object.assign({x,y,s,face:1},who==='cain'?CAINP:ABELP,o);q.face=o.flip||o.face||1;delete q.flip;return q;};

// A rig drawn with a prop between the body and the near (front) arm, so the hand closes over the prop.
const withProp=(o,prop)=>{const r=PPL.rig(o);return r.draw('back')+r.draw('body')+r.draw('head')+prop+r.draw('front');};

const chestOf=o=>{const r=PPL.rig(o),c=r.chest(.45),b=r.back(.45);return [(c[0]*.62+b[0]*.38),(c[1]+b[1])/2];};

// Anger as an ember in the chest: red and flickering, cooling to gold with `cool`.
const ember=(t,x,y,r,cool=0,k=1)=>{if(k<=0)return '';const fl=.78+.22*Math.sin(t*7)+.08*Math.sin(t*13),hot=mix(RED,'#FFD86B',cool);
  return glow(x,y,r*3.4,hot,.6*fl*k)+Ell(x,y,r,r*.7,mix('#8A1A10','#B8862C',cool),{opacity:k.toFixed(2)})+
    Ell(x-r*.14,y-r*.1,r*.66,r*.42,mix('#FF5A2C','#FFE07A',cool),{opacity:(k*fl).toFixed(2)})+Ell(x-r*.22,y-r*.17,r*.3,r*.16,'#FFF1C0',{opacity:(k*fl).toFixed(2)});};
// God is never a figure: his presence is a soft oval of light; his voice goes out as rings.
const presence=(t,x,y,r,k=1)=>k<=0?'':glow(x,y,r*2.6,'#FFF6DA',.5*k)+glow(x,y,r*1.2,'#FFFFFF',.65*k)+
  Ell(x,y,r*.74,r,'none',{stroke:'#FFFBEA','stroke-width':8,opacity:(.75*k).toFixed(2)})+Ell(x,y,r*.6,r*.82,'#FFFBEA',{opacity:(.22*k*(1+.25*Math.sin(t*2))).toFixed(2)});

  for(let k=0;k<n;k++){const p=clamp(sp*1.6-k*.18);if(p>0&&p<1)g+=C(x,y,60+p*R0,'none',{stroke:'#FFF6DA','stroke-width':12*(1-p)+2,opacity:(1-p).toFixed(2)});}return g;};
// A shaft of light from above (God's presence), k 0..1.
const shaft=(t,x,top,bot,w0,w1,k)=>k<=0?'':P(`M${x-w0*1.8} ${top}L${x+w0*1.8} ${top}L${x+w1*1.7} ${bot}L${x-w1*1.7} ${bot}Z`,'#FFF6DA',{opacity:(.1*k).toFixed(3)})+
  P(`M${x-w0} ${top}L${x+w0} ${top}L${x+w1} ${bot}L${x-w1} ${bot}Z`,'#FFF6DA',{opacity:(.24*k).toFixed(3)})+
  P(`M${x-w0*.35} ${top}L${x+w0*.35} ${top}L${x+w1*.35} ${bot}L${x-w1*.35} ${bot}Z`,'#FFFBEC',{opacity:(.2*k).toFixed(3)})+glow(x,bot,w1*3,'#FFF6DA',.45*k);
const heartP=(x,y,r)=>`M${x} ${y+r*.9}C${x-r*1.7} ${y-r*.1} ${x-r*.95} ${y-r*1.35} ${x} ${y-r*.42}C${x+r*.95} ${y-r*1.35} ${x+r*1.7} ${y-r*.1} ${x} ${y+r*.9}Z`;
const heart=(x,y,r,k=1)=>k<=0?'':G('',glow(x,y,r*2.2,'#FF7A6A',.5)+P(heartP(x,y,r),'#FF4A5C',{stroke:'#FFD0C8','stroke-width':Math.max(2,r*.08)})+P(heartP(x-r*.2,y-r*.15,r*.45),'#FF8A96',{opacity:.6}),k);

// ---------- scenery ----------
function cloud(x,y,w,body,rim,op,seed){
  const r=rng(seed),bl=[];
  for(let i=0;i<6;i++){const u=i/5,rx=w*(.11+r()*.06);bl.push([x+(u-.5)*w*.84,y,rx,rx*.5]);}
  for(let i=0;i<4;i++){const u=(i+.5)/4,rr=w*(.09+r()*.07)*(1-Math.abs(u-.5)*.9);bl.push([x+(u-.5)*w*.66+(r()-.5)*w*.06,y-rr*.55,rr,rr*.85]);}
  let g='';
  bl.forEach(([cx,cy,rx,ry])=>g+=Ell(cx.toFixed(0),(cy+ry*.22).toFixed(0),rx.toFixed(0),ry.toFixed(0),rim));
  bl.forEach(([cx,cy,rx,ry])=>g+=Ell(cx.toFixed(0),(cy-ry*.05).toFixed(0),(rx*.97).toFixed(0),(ry*.93).toFixed(0),body));
  return G('',g,op);
}
function bird(x,y,s,t,ph,col='#1A1420'){

}

    L(x,y-80*s,x-56*s+sw*.6,y-150*s,col,9*s)+L(x,y-96*s,x+50*s+sw*.6,y-162*s,col,8*s);

}
const gnd=(s,y,c1,c2)=>`<path d="${ridge(s,y,10,230,-120,2040,1800)}" fill="${c1}"/><path d="${ridge(s+1,y+120,8,200,-120,2040,1800)}" fill="${c2}"/>`;

const rays=(t,x,y,n,col,op,a0=-3.0,a1=-.14)=>{let g='';for(let i=0;i<n;i++){const a=lerp(a0,a1,i/(n-1))+Math.sin(t*.15+i)*.02,da=.028+.012*(i%3),Lr=2600;
  g+=P(`M${x} ${y}L${(x+Math.cos(a-da)*Lr).toFixed(0)} ${(y+Math.sin(a-da)*Lr).toFixed(0)}L${(x+Math.cos(a+da)*Lr).toFixed(0)} ${(y+Math.sin(a+da)*Lr).toFixed(0)}Z`,col,{opacity:(op*(.7+.3*Math.sin(t*.7+i*1.7))).toFixed(3)});}return g;};
const tent=(x,y,c,k=1)=>P(`M${x-90*k} ${y}L${x} ${y-120*k}L${x+90*k} ${y}Z`,c)+P(`M${x} ${y-120*k}L${x-13*k} ${y}L${x+13*k} ${y}Z`,'#2A1A10');

const skyClouds=(t,seed,y,body,rim,op=.9,spread=1)=>{const dr=t*6;let g='';for(let i=0;i<4;i++){const x=[300,1500,820,1700][i]+(i%2?-dr*.6:dr)*spread,yy=y+[0,90,220,330][i];
  g+=cloud(x,yy,[620,560,760,420][i],body,rim,op,seed+i*2);}return g;};

function lamb(x,y,s,face=1,o={}){
  const lie=o.lie||0,hy=lerp(0,14,lie);
  let g='';if(lie<.9)g+=R(-24,-8+hy,8,22-hy,3,'#3A3030')+R(14,-8+hy,8,22-hy,3,'#3A3030');
  [[-26,-30],[0,-38],[26,-30],[-14,-14],[14,-14],[0,-24]].forEach(([dx,dy])=>g+=C(dx,dy+hy,20,'#FBF7EC',{stroke:'#D8CFB8','stroke-width':2}));
  const hdy=(o.look||0)*14;
  g+=Ell(44,-38+hy+hdy,16,13,'#3A3030')+Ell(34,-48+hy+hdy,7,4,'#3A3030')+C(50,-41+hy+hdy,2.5,'#fff');
  return G(`translate(${x} ${y}) scale(${s*face} ${s})`,g);
}

    [-2,-1,0,1,2].map(i=>Ell(i*14,-60-Math.abs(i)*4,6,16,'#E8B53A')).join('')+

}

  for(let i=0;i<8;i++){const q=(t*.35+i/8)%1,sx=x+(1-straight)*q*240*s+Math.sin(t*1.3+i)*14*s,sy=y-q*lerp(150,560,straight)*s;

const slab=(w,h)=>`M${-w/2} ${h/2}V${-h/2+w*.32}Q${-w/2} ${-h/2} 0 ${-h/2}Q${w/2} ${-h/2} ${w/2} ${-h/2+w*.32}V${h/2}Z`;

    P(slab(w-24,h-24),'none',{stroke:'#5E5A52','stroke-width':3,opacity:.5}));

    let d=`M${x0} ${ly}`;for(let xx=x0;xx<x1;xx+=18)d+=`L${xx+9} ${ly+(r()-.5)*6}L${xx+18} ${ly}`;
    g+=glow((x0+x1)/2,ly,(x1-x0)*.6,'#FFD86B',.35*on);
    g+=T(x-w/2+60,ly+12,NUM[k],{size:34,font:'Georgia',weight:700,anchor:'middle',fill:mix('#4A4740','#FFF4C8',Math.min(1,on))});
    g+=P(d,'none',{stroke:'#4A4740','stroke-width':5,opacity:.8})+P(d,'none',{stroke:'#FFE9A8','stroke-width':3,opacity:(.12+.88*Math.min(1,on)).toFixed(3)});
  }

const SIXTH=(on,rest=.15)=>k=>k===5?on:rest;
// A carved line of illegible script (never a quotation).
const scriptLine=(x0,x1,y,seed,col,w=4)=>{let d=`M${x0} ${y}`;for(let x=x0;x<x1;x+=14)d+=`l5 ${((hash(x,seed)-.5)*14).toFixed(0)}l4 ${((hash(x,seed+1)-.5)*10).toFixed(0)}l5 0`;return P(d,'none',{stroke:col,'stroke-width':w,'stroke-linejoin':'round'});};

    P(`M${x} ${y-h/2+14}Q${x+w*.25} ${y-h/2-8} ${x+w/2} ${y-h/2}L${x+w/2} ${y+h/2}Q${x+w*.25} ${y+h/2-12} ${x} ${y+h/2+6}Z`,'#EFE6CE');
  g+=L(x,y-h/2+14,x,y+h/2+6,'#C8B890',3);

const nightField=(t,seed,o={})=>land(t,NIGHTL(seed,Object.assign({treeKind:'olive'},o)));

  const lp=ease.out(prog(t,AT.came,AT.came+1.2));

  const st=prog(t,AT.came-.1,AT.came+.6),x=lerp(560,720,ease.out(st)),sh=ease.out(prog(t,AT.came+.4,AT.came+1));
  g+=B('cain',x,FY,HS,{walk:st<1?t*5:0,expr:['calm','fear',sh],look:{x:1260,y:FY-330},lean:-10*sh,near:sh>.4?'cover':null,aura:RED,auraOp:.3});
  return g+foreG(t,960,1.04,{cols:GR.night,seed:57,rockAt:[[600,1560,180]]});

// 4b. After the flood: the ark resting on the mountain's ledge under a rainbow; the animals come down two by two;
//     Noah and his wife, large in the foreground, walk out hand in hand and reach for the returning dove.
// Noah's ark (Genesis 6:14-16): a long gopher-wood box hull, three decks, a roof with a window strip under it,
// a door in the side. Drawn in paper layers: hull planks, dark pitch seams, ribs, curved bow and stern, a ramp.
// x,y = keel centre on the ground; s = scale (1 = about 640 px long); o.tilt (deg), o.ramp (0..1), o.wet (0..1)
const ark=(x,y,s,o={})=>{
  const tilt=o.tilt||0,ramp=o.ramp??1,wet=o.wet??0,W='#8A5630',W2='#6E4224',DK='#3A2210',LT='#B07A48';
  let g='';
  g+=Ell(0,6,340,22,'#000',{opacity:.22});
  // hull: long box with curved bow (right) and stern (left), three plank bands
  const hull='M-320 -150 L300 -150 Q350 -150 352 -110 L340 -24 Q330 0 296 0 L-290 0 Q-326 0 -334 -26 L-342 -112 Q-344 -150 -320 -150Z';
  g+=P(hull,W,{stroke:DK,'stroke-width':6});
  for(let k=1;k<6;k++){const yy=-150+k*25;g+=P(`M-340 ${yy}L348 ${yy}`,'none',{stroke:DK,'stroke-width':2.5,opacity:.55});}
  for(let k=-5;k<=5;k++)g+=L(k*58,-150,k*58+(k*2),0,W2,5);
  // deck rails and the three decks shown by two darker bands of small square port windows
  g+=R(-330,-162,664,14,4,LT,{stroke:DK,'stroke-width':3});
  // the superstructure: long cabin with a gently pitched roof, a strip of windows under the roof (one cubit)
  g+=R(-270,-262,540,104,6,W,{stroke:DK,'stroke-width':5});
  for(let k=1;k<4;k++)g+=L(-270,-262+k*26,270,-262+k*26,DK,2);
  g+=R(-262,-250,524,20,3,'#2A180C');
  for(let k=0;k<14;k++)g+=R(-250+k*37,-247,22,14,2,'#E8C27A',{opacity:.5});
  g+=P('M-300 -258 L0 -312 L300 -258 Z',W2,{stroke:DK,'stroke-width':5})+P('M-300 -258 L300 -258','none',{stroke:LT,'stroke-width':4});
  for(let k=-4;k<=4;k++)g+=L(k*66,-262-Math.abs(k)*0+(-52+Math.abs(k)*11),k*66,-262,DK,2);
  // the door in the side of the hull and its ramp down to the ground
  g+=R(70,-138,78,96,6,'#2A180C',{stroke:DK,'stroke-width':4});
  if(ramp>0)g+=P(`M70 -42 L148 -42 L${148+150*ramp} ${0} L${70+150*ramp} 0Z`,LT,{stroke:DK,'stroke-width':4})+
    [1,2,3,4].map(k=>L(70+k*30*ramp,-42+k*8.4,148+k*30*ramp,-42+k*8.4,W2,3)).join('');
  // wet sheen after the flood, and a little weathering
  if(wet>0)g+=P('M-330 -60 L340 -60 L336 -24 Q326 0 296 0 L-290 0 Q-326 0 -334 -26Z','#2A4A5A',{opacity:(.25*wet).toFixed(2)});
  g+=C(-200,-90,10,DK,{opacity:.25})+C(220,-110,7,DK,{opacity:.25});
  return G(`translate(${x} ${y}) rotate(${tilt}) scale(${s})`,g);};
// The mountain the ark rests on (Genesis 8:4): summit upper left, a rock ledge (x 880-1340) tilted ~12 degrees on its
// right flank where the keel lies, then the flank runs down to the valley. Built with the scenery kit (_kit/scenery.js).
const FL_M=SC.profile([[-160,700],[140,440],[380,240],[470,164,10],[530,140,8],[610,190],[700,300,6],[766,356,3],[1226,452,3],[1360,534],[1560,630],[1800,700],[2100,760]],{seed:25,rough:14});

const FL_ARK=(()=>{const s=.7,ax=996,y0=SC.yAt(FL_M,ax-226),y1=SC.yAt(FL_M,ax+226),th=Math.atan2(y1-y0,452),ay=(y0+y1)/2+5;
  const W=([lx,ly])=>[ax+(lx*Math.cos(th)-ly*Math.sin(th))*s,ay+(lx*Math.sin(th)+ly*Math.cos(th))*s];
  return {s,ax,ay,th,deg:th*180/Math.PI,W,foot:W([298,0]),rampMid:W([214,-24]),door:W([109,-90])};})();
// The path the animals take down from the ramp: [x, y, scale] (scale grows as it comes toward the camera).
const FL_PATH=[[1212,452,.34],[1290,500,.4],[1322,570,.5],[1272,650,.62],[1254,730,.8],[1300,810,1.05]];
const flAt=u=>{const n=FL_PATH.length-1,k=Math.min(n-1,Math.floor(clamp(u)*n)),f=clamp(u)*n-k,a=FL_PATH[k],b=FL_PATH[k+1];
  return {x:lerp(a[0],b[0],f),y:lerp(a[1],b[1],f),s:lerp(a[2],b[2],f),face:b[0]<a[0]?-1:1};};
function floodMountain(t){
  const pts=FL_M,id='flMc';
  const [u,d]=SC.lin([[0,'#A4A8B8'],[.18,'#767C92'],[.6,'#5A6078'],[1,'#454A5E']],0,130,0,910);
  let g=d+P(SC.fill(pts,1800),u)+`<clipPath id="${id}"><path d="${SC.fill(pts,1800)}"/></clipPath><g clip-path="url(#${id})">`;
  // sunlit faces on the slopes that face the sun (upper right), rock strata, grass and wet streaks
  let lit='';for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];if(b[1]>a[1]+1)lit+=`M${a[0]} ${a[1].toFixed(0)}L${b[0]} ${b[1].toFixed(0)}L${b[0]-30} ${(b[1]+70).toFixed(0)}L${a[0]-30} ${(a[1]+70).toFixed(0)}Z`;}

    P(SC.poly(pts.map(([x,y])=>[x-k*6,y+k*58-5+Math.sin(x/90+k)*10]),false),'none',{stroke:'#C8CCD8','stroke-width':2.5,opacity:.22});

  for(let k=0;k<22;k++){const x=40+hash(k,45)*1900,y0=SC.yAt(pts,x),y=Math.max(y0+20,450+hash(k,46)*260);if(y>y0+10)g+=k%3?Ell(x,y,22+hash(k,47)*30,10+hash(k,48)*8,'#4A7A3A',{opacity:.9})+Ell(x-6,y-5,14,5,'#8AB866',{opacity:.6}):SC.tree(t,x,y+6,.24+.12*hash(k,49),{kind:'olive',flat:true});}

  // snow on the summit
  g+=P(`M420 ${SC.yAt(pts,420)}`+[...Array(12)].map((_,j)=>{const x=420+j*20;return `L${x} ${(Math.min(SC.yAt(pts,x)+40+hash(j,44)*36,SC.yAt(pts,x)+80)).toFixed(0)}`;}).join('')+`L660 ${SC.yAt(pts,660).toFixed(0)}`+[...Array(12)].map((_,j)=>{const x=660-j*20;return `L${x} ${(SC.yAt(pts,x)-2).toFixed(0)}`;}).join('')+'Z','#F2F4FA',{opacity:.9});
  return g+'</g>';

function floodS(t,lt){
  const SUN={x:1560,y:60};
  // after the storm: the sun breaks through, rays fan down, storm clouds drift off, a vivid rainbow behind the ark
  let g=SC.sky(t,{mood:'clearing',hz:770});
  g+=SC.godRays(t,SUN.x,SUN.y,{n:11,a0:1.7,a1:2.85,op:.22,len:2700,col:'#FFF2CC'});
  g+=SC.sun(t,SUN.x,SUN.y,64,{col:'#FFF4D0',rays:1});
  g+=SC.rainbow(t,900,900,830,{w:21,op:.92,p:ease.out(prog(t,AT.flood-.3,AT.flood+1))});
  g+=SC.clouds(t,{seed:251,n:7,y:-600,h:520,mood:'clearing',sun:SUN,storm:'#3A425C',drift:9,s:1.1});
  g+=SC.birds(t,{x:380,y:60,n:7,s:1.1,dx:30,col:'#2A2E44'});
  g+=SC.range(31,{y:750,h:380,peaks:6,mood:'clearing',snow:true,hazeOp:.55,sunX:SUN.x});
  // the mountain, and the ark resting on its ledge: keel on the rock, tilted with it, ramp down onto the slope
  g+=floodMountain(t);
  const A=FL_ARK;
  g+=Ell(A.ax+10,A.ay+6,250,22,'#1A1C28',{opacity:.45});
  g+=ark(A.ax,A.ay,A.s,{tilt:A.deg,ramp:1,wet:1});
  [[-250,26,.7],[-150,30,1],[-40,22,.8],[60,30,1.1],[150,26,.8],[250,18,.7]].forEach(([lx,w,k],j)=>{const [x,y]=A.W([lx,4]);g+=SC.rock(x,y+10,w*k*1.4,w*k*.8,{col:'#5E6274',seed:60+j,wet:1});});
  // two doves back on the roof
  const [rx,ry]=A.W([-120,-280]);g+=SC.animal(t,'dove',rx,ry,.7,{face:-1,phase:1})+SC.animal(t,'dove',rx+40,ry+8,.66,{phase:2.4,graze:'auto'});
  // valley: hills with olive trees, then the wet near ground
  g+=SC.hills(253,{y:790,amp:26,wave:320,col:'#5E8E4A',trees:7,treeKind:'olive',treeS:.36,hazeOp:.35,haze:'#E6EAE0',x1:1000});
  g+=SC.ground(t,254,{y:880,col:'#5C8E46',col2:'#3E6A30',wet:1,stones:16,tufts:26,flowers:['#FFFFFF','#FFE36B'],amp:8});
  // the path down from the ramp, wet earth widening toward us
  for(let i=1;i<FL_PATH.length-1;i++){const a=FL_PATH[i-1],b=FL_PATH[i];g+=L(a[0],a[1],b[0],b[1],'#8A7458',(a[2]+b[2])*26,{opacity:.4})+L(a[0],a[1]+3,b[0],b[1]+3,'#C0AA88',(a[2]+b[2])*9,{opacity:.35});}
  g+=SC.puddle(t,300,930,110,{rainbow:.7,seed:3,flat:.26})+SC.puddle(t,1560,920,130,{rainbow:.8,seed:5,flat:.26});
  // the animals two by two down the path, and Noah's sons and their wives with them (far = small)
  const W=lt*.01,items=[];
  [['camel',.0,{}],['donkey',.18,{}],['goat',.36,{}],['ox',.6,{}],['sheep',.84,{}]].forEach(([k,u,o],j)=>{
    const p=flAt(u+W),face=p.face;items.push([p.y,()=>SC.pair(t,k,p.x,p.y,p.s*(k==='camel'?.95:k==='ox'?.9:1),Object.assign({face,walk:t*5+j,gap:k==='camel'?110:80,phase:j},o))]);});
  // the second pair of camels still on the ramp, a son leading them
  const [cx,cy]=A.rampMid;items.push([cy,()=>SC.animal(t,'camel',cx,cy+4,.3,{walk:t*4,phase:3})]);
  // Shem, Ham and Japheth and their wives walk down among the animals (small: far away)
  [[.075,0],[.45,1],[.7,2]].forEach(([u,i])=>{const p=flAt(u+W),dx=-p.face*70*p.s;items.push([p.y+3,()=>folk(i+5,p.x+dx,p.y+3,p.s*1.05,{f:i===1,face:p.face,walk:t*5+i,expr:'joy',look:i===1?{x:900,y:200}:'up',near:i===1?'up':null})]);});
  items.sort((a,b)=>a[0]-b[0]).forEach(([,f])=>g+=f());
  // a second soft pass of sun shafts through the wet air, and warm light round the family
  g+=SC.godRays(t,SUN.x,SUN.y,{n:6,a0:1.95,a1:2.6,op:.08,len:2600,seed:9});
  g+=SC.light(800,700,560,'#FFE9B0',.3);
  // a dove returns with an olive leaf and comes to Noah's raised hand (Genesis 8:11)
  const k=prog(t,AT.flood+.3,AT.flood+1.5),wk=lt*12,nx=881+wk,wx=nx-375;
  // the dove flies in from the sun side and comes to Noah's outstretched hand (Genesis 8:9-11)
  const dp=ease.out(prog(lt,0,2.8)),dx=lerp(1560,nx+330,dp),dy=lerp(40,650,dp)+Math.sin(t*2.4)*10*(1-dp*.6);
  // Noah and his wife, large in the foreground, walking out hand in hand, both watching the dove
  const pa=person(0,nx,1000,2.9,{walk:t*4,face:1,expr:['awe','joy',k],look:{x:dx,y:dy},hair:'#ECE8DE',tunic:'#C8A06A',tunic2:'#7A5430',near:{x:dx-40,y:dy+50}});
  const ma=person(1,wx,968,2.38,{f:true,walk:t*4+1.3,face:1,expr:['surprised','joy',k],look:{x:dx,y:dy},tunic:'#9AC8B0',tunic2:'#4A7A6A',hair:'#5A3A2A',far:'chest'});
  g+=PPL.holdHands(ma,pa,{armB:'far'}).svg;
