// ---------- people (videos/_kit/people.js): the same round figures as episode 1, acting together ----------
const TUN=[['#3DE0B8','#1787A8'],['#FFC24C','#E0623C'],['#B98CFF','#6A4CD8'],['#FF8FB1','#C8487A'],['#7CD4FF','#2F6FD0']];

const pplOpts=(i,x,y,s,o={})=>{const [a,b]=TUN[i%5],[sk,sh]=SKIN[i%3],face=o.flip||o.face||1,f=o.f??(i%2===1);
  const q=Object.assign({x,y,s,face,f,tunic:a,tunic2:b,skin:sk,shade:sh,hair:HAIR[i%3],phase:i*.7},o);
  q.face=face;delete q.flip;delete q.filter;delete q.reach;

const person=pplOpts;
const elderOpts=(x,y,s,o={})=>{const q=pplOpts(0,x,y,s,Object.assign({tunic:'#C8A06A',tunic2:'#7A5430',skin:'#D9965E',shade:'#A86A3E',f:false,phase:.4},o));q.hair=o.hair||'#ECE8DE';return q;};

const withProp=(o,prop)=>{const r=PPL.rig(o);return r.draw('back')+r.draw('body')+r.draw('head')+prop+r.draw('front');};

const chestOf=o=>{const r=PPL.rig(o),c=r.chest(.45),b=r.back(.45);return [(c[0]*.62+b[0]*.38),(c[1]+b[1])/2];};

const ember=(t,x,y,r,cool=0,k=1)=>{if(k<=0)return '';const fl=.78+.22*Math.sin(t*7)+.08*Math.sin(t*13),hot=mix(RED,'#FFD86B',cool);
  return glow(x,y,r*3.4,hot,.6*fl*k)+Ell(x,y,r,r*.7,mix('#8A1A10','#B8862C',cool),{opacity:k.toFixed(2)})+
    Ell(x-r*.14,y-r*.1,r*.66,r*.42,mix('#FF5A2C','#FFE07A',cool),{opacity:(k*fl).toFixed(2)})+Ell(x-r*.22,y-r*.17,r*.3,r*.16,'#FFF1C0',{opacity:(k*fl).toFixed(2)});};
// God is never a figure: his presence is a soft oval of light; his voice goes out as rings.
const presence=(t,x,y,r,k=1)=>k<=0?'':glow(x,y,r*2.6,'#FFF6DA',.5*k)+glow(x,y,r*1.2,'#FFFFFF',.65*k)+
  Ell(x,y,r*.74,r,'none',{stroke:'#FFFBEA','stroke-width':8,opacity:(.75*k).toFixed(2)})+Ell(x,y,r*.6,r*.82,'#FFFBEA',{opacity:(.22*k*(1+.25*Math.sin(t*2))).toFixed(2)});

  for(let k=0;k<n;k++){const p=clamp(sp*1.6-k*.18);if(p>0&&p<1)g+=C(x,y,60+p*R0,'none',{stroke:'#FFF6DA','stroke-width':12*(1-p)+2,opacity:(1-p).toFixed(2)});}return g;};

const shaft=(t,x,top,bot,w0,w1,k)=>k<=0?'':P(`M${x-w0*1.8} ${top}L${x+w0*1.8} ${top}L${x+w1*1.7} ${bot}L${x-w1*1.7} ${bot}Z`,'#FFF6DA',{opacity:(.1*k).toFixed(3)})+
  P(`M${x-w0} ${top}L${x+w0} ${top}L${x+w1} ${bot}L${x-w1} ${bot}Z`,'#FFF6DA',{opacity:(.24*k).toFixed(3)})+
  P(`M${x-w0*.35} ${top}L${x+w0*.35} ${top}L${x+w1*.35} ${bot}L${x-w1*.35} ${bot}Z`,'#FFFBEC',{opacity:(.2*k).toFixed(3)})+glow(x,bot,w1*3,'#FFF6DA',.45*k);
const heartP=(x,y,r)=>`M${x} ${y+r*.9}C${x-r*1.7} ${y-r*.1} ${x-r*.95} ${y-r*1.35} ${x} ${y-r*.42}C${x+r*.95} ${y-r*1.35} ${x+r*1.7} ${y-r*.1} ${x} ${y+r*.9}Z`;
const heart=(x,y,r,k=1)=>k<=0?'':G('',glow(x,y,r*2.2,'#FF7A6A',.5)+P(heartP(x,y,r),'#FF4A5C',{stroke:'#FFD0C8','stroke-width':Math.max(2,r*.08)})+P(heartP(x-r*.2,y-r*.15,r*.45),'#FF8A96',{opacity:.6}),k);

// ---------- scenery ----------
function cloud(x,y,w,body,rim,op,seed){
  const r=rng(seed),bl=[];
  for(let i=0;i<6;i++){const u=i/5,rx=w*(.11+r()*.06);bl.push([x+(u-.5)*w*.84,y,rx,rx*.5]);}
  for(let i=0;i<4;i++){const u=(i+.5)/4,rr=w*(.09+r()*.07)*(1-Math.abs(u-.5)*.9);bl.push([x+(u-.5)*w*.66+(r()-.5)*w*.06,y-rr*.55,rr,rr*.85]);}
  let g='';
  bl.forEach(([cx,cy,rx,ry])=>g+=Ell(cx.toFixed(0),(cy+ry*.22).toFixed(0),rx.toFixed(0),ry.toFixed(0),rim));
  bl.forEach(([cx,cy,rx,ry])=>g+=Ell(cx.toFixed(0),(cy-ry*.05).toFixed(0),(rx*.97).toFixed(0),(ry*.93).toFixed(0),body));
  return G('',g,op);
}

}

    L(x,y-80*s,x-56*s+sw*.6,y-150*s,col,9*s)+L(x,y-96*s,x+50*s+sw*.6,y-162*s,col,8*s);

}
const gnd=(s,y,c1,c2)=>`<path d="${ridge(s,y,10,230,-120,2040,1800)}" fill="${c1}"/><path d="${ridge(s+1,y+120,8,200,-120,2040,1800)}" fill="${c2}"/>`;

const rays=(t,x,y,n,col,op,a0=-3.0,a1=-.14)=>{let g='';for(let i=0;i<n;i++){const a=lerp(a0,a1,i/(n-1))+Math.sin(t*.15+i)*.02,da=.028+.012*(i%3),Lr=2600;
  g+=P(`M${x} ${y}L${(x+Math.cos(a-da)*Lr).toFixed(0)} ${(y+Math.sin(a-da)*Lr).toFixed(0)}L${(x+Math.cos(a+da)*Lr).toFixed(0)} ${(y+Math.sin(a+da)*Lr).toFixed(0)}Z`,col,{opacity:(op*(.7+.3*Math.sin(t*.7+i*1.7))).toFixed(3)});}return g;};
const tent=(x,y,c,k=1)=>P(`M${x-90*k} ${y}L${x} ${y-120*k}L${x+90*k} ${y}Z`,c)+P(`M${x} ${y-120*k}L${x-13*k} ${y}L${x+13*k} ${y}Z`,'#2A1A10');

const skyClouds=(t,seed,y,body,rim,op=.9,spread=1)=>{const dr=t*6;let g='';for(let i=0;i<4;i++){const x=[300,1500,820,1700][i]+(i%2?-dr*.6:dr)*spread,yy=y+[0,90,220,330][i];
  g+=cloud(x,yy,[620,560,760,420][i],body,rim,op,seed+i*2);}return g;};

function lamb(x,y,s,face=1,o={}){
  const lie=o.lie||0,hy=lerp(0,14,lie);
  let g='';if(lie<.9)g+=R(-24,-8+hy,8,22-hy,3,'#3A3030')+R(14,-8+hy,8,22-hy,3,'#3A3030');
  [[-26,-30],[0,-38],[26,-30],[-14,-14],[14,-14],[0,-24]].forEach(([dx,dy])=>g+=C(dx,dy+hy,20,'#FBF7EC',{stroke:'#D8CFB8','stroke-width':2}));
  const hdy=(o.look||0)*14;
  g+=Ell(44,-38+hy+hdy,16,13,'#3A3030')+Ell(34,-48+hy+hdy,7,4,'#3A3030')+C(50,-41+hy+hdy,2.5,'#fff');

    let d=`M${x0} ${ly}`;for(let xx=x0;xx<x1;xx+=18)d+=`L${xx+9} ${ly+(r()-.5)*6}L${xx+18} ${ly}`;
    g+=glow((x0+x1)/2,ly,(x1-x0)*.6,'#FFD86B',.35*on);
    g+=T(x-w/2+60,ly+12,NUM[k],{size:34,font:'Georgia',weight:700,anchor:'middle',fill:mix('#4A4740','#FFF4C8',Math.min(1,on))});
    g+=P(d,'none',{stroke:'#4A4740','stroke-width':5,opacity:.8})+P(d,'none',{stroke:'#FFE9A8','stroke-width':3,opacity:(.12+.88*Math.min(1,on)).toFixed(3)});
  }

const SIXTH=(on,rest=.15)=>k=>k===5?on:rest;
// A carved line of illegible script (never a quotation).
const scriptLine=(x0,x1,y,seed,col,w=4)=>{let d=`M${x0} ${y}`;for(let x=x0;x<x1;x+=14)d+=`l5 ${((hash(x,seed)-.5)*14).toFixed(0)}l4 ${((hash(x,seed+1)-.5)*10).toFixed(0)}l5 0`;return P(d,'none',{stroke:col,'stroke-width':w,'stroke-linejoin':'round'});};

  g+=L(x,y-h/2+14,x,y+h/2+6,'#C8B890',3);
