// The Ten Commandments, part 6: the sixth commandment. Script: scripts/07-the-sixth-commandment.md (ESV fill).

// Guide: .claude/skills/godward-episode/reference/engine.md. K.E is the ellipse helper (Ell), window.E the engine.
const {G,R,C,L,P,T,prog,ease,lerp,mix,clamp,rng}=K, Ell=K.E;
const {hash,piece,glow,label,mark,scribble,arrow,strip,tape,torn}=S;
const {cue,end,span,shot,ridge,verse,fade,hv,stars,fireflies,INK,YEL,CORAL}=E;
const GOLD='#E8B53A', RED='#FF3A2A';

const AT={
  two:cue('Two brothers walk'), onlyOne:cue('Only one of them'), walksBack:cue('walks back'),
  firstDeath:cue('the first death'), weapon:cue('a weapon'), feeling:cue('started with a feeling'),

  brothers:cue('Cain and Abel'), ground:cue('worked the ground'), sheep:cue('kept the sheep'),
  both:cue('Both brought'), accepted:cue('God accepted'), angerBurn:cue('burned with anger'), faceFell:cue('face fell'),
  warned:cue('So God warned'), v47:cue('And if you do not'), crouching:cue('sin is crouching'), rule:span('you must rule over it'),
  animal:cue('like an animal'), closeDoor:cue('close that door'),
  didnt:cue("But Cain didn't"), field:cue('out to the field'), roseUp:cue('rose up against'), tookLife:cue('took his life'),
  oneShort:cue('one short sentence'), noDetails:cue('no details'), lifeGone:cue('Just a life'),
  came:cue('Then God came'), didntKnow:cue("he didn't know"), lookAfter:cue('look after his brother'),
  v410:cue('The voice of your'), crying:span('crying to me'), fromGround:end('from the ground'),
  nobody:cue('Nobody else saw'), godDid:cue('But God did'), mattered:cue("Abel's life mattered"),
  why:cue('Why does one life'), flood:cue('After the flood'), v96:cue('God made man'), image:span('his own image'),
  mirror:cue('reflection in a mirror'), strike:cue('strike at the one'),
  spoke:cue('So when God spoke'), sixth:cue('sixth word'), v2:cue('You shall not murder',2), notMurder2:span('not murder',2),
  older:cue('Older Bibles'), hebrew:cue('the Hebrew word'), innocent:cue('innocent life'), modern:cue('most modern Bibles'),
  without:cue('without trying'),
  jesus:cue('Then Jesus opened'), hillside:cue('On a hillside'), quoted:cue('quoted the old command'), under:cue('went underneath'),
  v522:cue('But I say to you'), angry:span('who is angry'),
  whereCain:cue('where Cain started'), notField:cue('Not the field'), theFeeling:cue('The feeling'),

  v311:cue('For this is the message'), loveOne:span('love one another'),

  everyPerson:cue('Every person you meet'), next:cue('Next time'),
};
AT.last=WORDS[WORDS.length-1][2];

// ---------- shared pieces (from part 1) ----------
const slab=(w,h)=>`M${-w/2} ${h/2}V${-h/2+w*.32}Q${-w/2} ${-h/2} 0 ${-h/2}Q${w/2} ${-h/2} ${w/2} ${-h/2+w*.32}V${h/2}Z`;
const NUM=['I','II','III','IV','V','VI','VII','VIII','IX','X'];
// One tablet with five carved lines (numerals + illegible carving, never a quotation). lit(i) 0..1 per line.
function tablet(x,y,w,h,first,lit,seed){
  const r=rng(seed);let g=G(`translate(${x} ${y})`,P(slab(w,h),'#7E7A70')+P(slab(w-24,h-24),'#9C988C')+
    P(slab(w-24,h-24),'none',{stroke:'#5E5A52','stroke-width':3,opacity:.5}));
  for(let i=0;i<5;i++){
    const k=first+i,ly=y-h/2+w*.46+i*(h-w*.5)/5.2,x0=x-w/2+92,x1=x+w/2-34-r()*40,on=lit(k);
    let d=`M${x0} ${ly}`;for(let xx=x0;xx<x1;xx+=18)d+=`L${xx+9} ${ly+(r()-.5)*6}L${xx+18} ${ly}`;
    g+=glow((x0+x1)/2,ly,(x1-x0)*.6,'#FFD86B',.35*on);
    g+=T(x-w/2+60,ly+12,NUM[k],{size:34,font:'Georgia',weight:700,anchor:'middle',fill:mix('#4A4740','#FFF4C8',on)});
    g+=P(d,'none',{stroke:'#4A4740','stroke-width':5,opacity:.8})+P(d,'none',{stroke:'#FFE9A8','stroke-width':3,opacity:(.12+.88*on).toFixed(3)});
  }
  return g;
}
const tablets=(cx,cy,s,lit)=>G(`translate(${cx} ${cy}) scale(${s}) translate(${-cx} ${-cy})`,
  glow(cx,cy,560,'#FFD86B',.12)+tablet(cx-205,cy,380,560,0,lit,21)+tablet(cx+205,cy,380,560,5,lit,33));
const SIXTH=(on,rest=.15)=>k=>k===5?on:rest;   // line VI is the sixth commandment
const strike=(x0,y,x1,p)=>mark(`M${x0} ${y+6}L${x1} ${y-6}`,p,CORAL,9);
function mountain(seed,px,py,fill,steep){
  const r=rng(seed*91+7),pts=[];
  for(let x=-140;x<=2060;x+=22){const d=Math.abs(x-px)/(900*steep);pts.push([x,py+Math.pow(d,1.25)*560+(r()-.5)*16]);}
  return P('M'+pts.map(p=>p[0].toFixed(0)+' '+Math.min(p[1],1800).toFixed(0)).join('L')+'L2060 1800L-140 1800Z',fill);
}
const TUN=[['#3DE0B8','#1787A8'],['#FFC24C','#E0623C'],['#B98CFF','#6A4CD8'],['#FF8FB1','#C8487A'],['#7CD4FF','#2F6FD0']];
function crowd(t,x0,y,n,gap,s,o={}){
  let g='';
  for(let i=0;i<n;i++){
    const [a,b]=TUN[(i+(o.k||0))%5];
    g+=E.chubby(x0+i*gap+(i%2)*10,y+(i%3)*14,s*(.92+.16*hash(i,4)),{f:i%2===1,flip:o.flip||1,tunic:a,tunic2:b,aura:o.aura||'#7CFFE6',auraOp:o.auraOp??.35,
      walk:0,lean:0,reach:o.reach||0,phase:i*.7,hair:['#2E1C52','#4A2A16','#1A1A2A'][i%3],skin:['#F5BE8E','#D9965E','#B87444'][i%3],shade:['#C4835E','#A86A3E','#8A5230'][i%3]});
  }
  return g;
}
function cutout(t,at,cx,cy,inner,name,id,o={}){
  const w=o.w||250,h=o.h||250;
  return piece(t,at,cx,cy,strip(cx-w/2,cy-h/2,w,h,id*7,o.paper||'#F6EFDC')+tape(cx,cy-h/2+4,90,-4)+inner+
    label(cx,cy+h/2+14,name,{size:hv(26,34),anchor:'middle'}),id,1.4);
}

// ---------- vertical layout ----------
// Every vertical sheet is filmed wide (zoom .84 on 960,560), so frame position (fx, fy) maps to fixed sheet coordinates.
// Vertical frame zones: verse cards 170-~520, art 560-1180, captions 1220-1340, lower labels 1380-1560.
const vx=f=>960+(f-540)/.84, vy=f=>560+(f-1010)/.84;
const X=(l,f)=>hv(l,vx(f)), Y=(l,f)=>hv(l,vy(f)), SZ=(l,f)=>hv(l,f/.84);
const tag=(t,at,x,y,s,size,id,o={})=>piece(t,at,x,y,label(x,y-size*.81,s,Object.assign({size,anchor:'middle'},o)),id,1.3);
const WIDE=[960,560,.84];

// Vertical foreground drawn inside the sheet (a copy of the engine's `fore`), so lower labels sit on top of the grass.
function meadow(t,i,gc,fc=[]){
  if(!E.VERT)return '';
  let g=`<path d="${S.ridge(500+i,1180,22,170,-120,2040,1800)}" fill="${gc[1]}" opacity=".55"/><path d="${S.ridge(510+i,1430,26,140,-120,2040,1800)}" fill="${gc[1]}"/>`;
  const it=[...Array(170)].map((_,k)=>[k,1000+Math.pow(hash(k,i*13+1),.7)*780]).sort((a,b)=>a[1]-b[1]);
  it.forEach(([k,y])=>{
    const x=hash(k,i*13+2)*2060-60,d=(y-1010)/760,sz=lerp(1.1,3.6,d),sw=Math.sin(t*1.5+k)*4*sz,c=gc[k%3];
    if(k%9===0){g+=Ell(x,y,26*sz,12*sz,gc[1])+Ell(x-6*sz,y-4*sz,14*sz,6*sz,gc[2],{opacity:.6});return;}
    for(let j=-1;j<=1;j++)g+=L(x+j*5*sz,y,x+j*9*sz+sw,y-(16+hash(k,j+5)*20)*sz,c,3.2*sz);
    if(fc.length&&k%5===0){const fy=y-(30+hash(k,9)*16)*sz,col=fc[k%fc.length];g+=L(x,y,x+sw,fy,'#0A2A3E',2.5*sz)+glow(x+sw,fy,18*sz,col,.7)+C(x+sw,fy,5*sz,col);}
  });
  return g;
}

// ---------- scenery: clouds, birds, a lone tree, wind-bent grass ----------
function cloud(x,y,w,body,rim,op,seed){
  const r=rng(seed),bl=[];
  for(let i=0;i<6;i++){const u=i/5,rx=w*(.11+r()*.06);bl.push([x+(u-.5)*w*.84,y,rx,rx*.5]);}     // flat base
  for(let i=0;i<4;i++){const u=(i+.5)/4,rr=w*(.09+r()*.07)*(1-Math.abs(u-.5)*.9);bl.push([x+(u-.5)*w*.66+(r()-.5)*w*.06,y-rr*.55,rr,rr*.85]);} // puffs on top
  let g='';
  bl.forEach(([cx,cy,rx,ry])=>g+=Ell(cx.toFixed(0),(cy+ry*.22).toFixed(0),rx.toFixed(0),ry.toFixed(0),rim));
  bl.forEach(([cx,cy,rx,ry])=>g+=Ell(cx.toFixed(0),(cy-ry*.05).toFixed(0),(rx*.97).toFixed(0),(ry*.93).toFixed(0),body));
  return G('',g,op);
}
function bird(x,y,s,t,ph,col='#1A1420'){
  const f=Math.sin(E.held(t,10)*8+ph);
  return P(`M${(x-24*s).toFixed(0)} ${(y-10*s*f).toFixed(0)}Q${(x-10*s).toFixed(0)} ${(y-14*s*(f*.5+.6)).toFixed(0)} ${x.toFixed(0)} ${y.toFixed(0)}Q${(x+10*s).toFixed(0)} ${(y-14*s*(f*.5+.6)).toFixed(0)} ${(x+24*s).toFixed(0)} ${(y-10*s*f).toFixed(0)}`,'none',{stroke:col,'stroke-width':(4*s).toFixed(1)});
}
function tree(x,y,s,col,t=0,wind=0){
  const sw=(Math.sin(t*1.4)*.5+.5)*wind*14*s;
  let g=P(`M${x-12*s} ${y}L${x-6*s} ${y-130*s}L${x+6*s} ${y-130*s}L${x+14*s} ${y}Z`,col)+
    L(x,y-80*s,x-56*s+sw*.6,y-150*s,col,9*s)+L(x,y-96*s,x+50*s+sw*.6,y-162*s,col,8*s);
  [[0,-200,88],[-66,-168,58],[66,-172,62],[-34,-240,60],[36,-246,56],[0,-150,50]].forEach(([dx,dy,r])=>g+=C((x+dx*s+sw*(-dy/250)).toFixed(0),(y+dy*s).toFixed(0),(r*s).toFixed(0),col));
  return g;
}
// Grass tufts between sheet y0 and y1, larger nearer the viewer, bent by the wind (lean + gust).
function tufts(t,seed,y0,y1,n,gc,o={}){
  const {lean=0,gust=0,tip=null,fc=[],x0=-60,x1=1980,s0=.7,s1=2.2}=o;let g='';
  const it=[...Array(n)].map((_,k)=>[k,y0+hash(k,seed)*(y1-y0)]).sort((a,b)=>a[1]-b[1]);
  it.forEach(([k,y])=>{
    const x=x0+hash(k,seed+1)*(x1-x0),sz=lerp(s0,s1,(y-y0)/(y1-y0)),c=gc[k%gc.length];
    const w=(lean+gust*(.65+.35*Math.sin(t*2.4+x*.004)))*sz,sw=Math.sin(t*1.5+k)*3*sz+w;
    for(let j=-1;j<=1;j++){const h=(16+hash(k,j+5)*20)*sz,ex=x+j*9*sz+sw,ey=y-h;
      g+=P(`M${(x+j*5*sz).toFixed(0)} ${y.toFixed(0)}Q${(x+j*7*sz+sw*.25).toFixed(0)} ${(y-h*.6).toFixed(0)} ${ex.toFixed(0)} ${ey.toFixed(0)}`,'none',{stroke:c,'stroke-width':(3*sz).toFixed(1)});
      if(tip)g+=C(ex.toFixed(0),ey.toFixed(0),(1.7*sz).toFixed(1),tip,{opacity:.75});}
    if(fc.length&&k%7===0){const col=fc[k%fc.length],fy=y-(26+hash(k,9)*14)*sz,fx=x+sw*.8;g+=glow(fx,fy,14*sz,col,.6)+C(fx.toFixed(0),fy.toFixed(0),(4*sz).toFixed(1),col);}
  });
  return g;
}
// A path of worn earth from the viewer to a point on the horizon.
const track=(hx,hy,bx0,bx1,by,col,op)=>P(`M${hx-10} ${hy}L${hx+10} ${hy}L${bx1} ${by}L${bx0} ${by}Z`,col,{opacity:op});

// ---------- the two brothers ----------
const CAIN={tunic:'#C8743A',tunic2:'#8A3E1C',hair:'#2A1A10',skin:'#D9965E',shade:'#A86A3E'};
const ABEL={tunic:'#7CD4FF',tunic2:'#2F6FD0',hair:'#4A2A16',skin:'#F5BE8E',shade:'#C4835E',phase:1.3};
const bro=(who,x,y,s,o={})=>E.chubby(x,y,s,Object.assign({},who==='cain'?CAIN:ABEL,{aura:who==='cain'?'#FFB04C':'#FFE9A8',auraOp:.4},o));
// Abel as a paper cut-out that tears in two (p 0..1) and loses its glow. A symbol, not an injury.
let tearN=0;
function tornFigure(t,x,y,s,p,o={}){
  const id='tear'+(tearN++),cut=`M${x-200} ${y-500}L${x+6} ${y-500}L${x-14} ${y-330}L${x+18} ${y-210}L${x-10} ${y-110}L${x+14} ${y+40}L${x-200} ${y+40}Z`;
  const cut2=`M${x+200} ${y-500}L${x+6} ${y-500}L${x-14} ${y-330}L${x+18} ${y-210}L${x-10} ${y-110}L${x+14} ${y+40}L${x+200} ${y+40}Z`;
  const d=ease.out(p),fig=bro('abel',x,y,s,Object.assign({auraOp:.4*(1-d)},o)),grey=1-.75*d;
  return `<clipPath id="${id}a"><path d="${cut}"/></clipPath><clipPath id="${id}b"><path d="${cut2}"/></clipPath>`+
    G(`translate(${(-10*d).toFixed(1)} ${(4*d).toFixed(1)}) rotate(${(-5*d).toFixed(2)} ${x} ${y})`,`<g clip-path="url(#${id}a)">${fig}</g>`,grey)+
    G(`translate(${(10*d).toFixed(1)} ${(4*d).toFixed(1)}) rotate(${(5*d).toFixed(2)} ${x} ${y})`,`<g clip-path="url(#${id}b)">${fig}</g>`,grey);
}
function lamb(x,y,s){
  let g='';[[-26,-30],[0,-38],[26,-30],[-14,-14],[14,-14],[0,-24]].forEach(([dx,dy])=>g+=C(dx,dy,20,'#FBF7EC',{stroke:'#D8CFB8','stroke-width':2}));
  return G(`translate(${x} ${y}) scale(${s})`,R(-24,-8,8,22,3,'#3A3030')+R(14,-8,8,22,3,'#3A3030')+g+Ell(44,-38,16,13,'#3A3030')+C(50,-41,2.5,'#fff'));
}
function basket(x,y,s){
  return G(`translate(${x} ${y}) scale(${s})`,C(-22,-40,14,'#E0623C')+C(4,-46,14,'#FFC24C')+C(26,-38,13,'#8BCB4A')+
    [-2,-1,0,1,2].map(i=>Ell(i*14,-60-Math.abs(i)*4,6,16,'#E8B53A')).join('')+
    P('M-46 -36H46L36 0H-36Z','#A8743E',{stroke:'#6A4420','stroke-width':4})+L(-40,-24,40,-24,'#6A4420',3)+L(-38,-12,38,-12,'#6A4420',3));
}
function altar(x,y,s){
  let g='';[[-50,-28,100],[-42,-56,84],[-34,-82,68]].forEach(([dx,dy,w],i)=>g+=R(dx,dy,w,28,6,['#8A8278','#9C9488','#7E766C'][i],{stroke:'#4A4440','stroke-width':3}));
  return G(`translate(${x} ${y}) scale(${s})`,g);
}
// Smoke from an altar: straight up into the light (straight=1) or flat and grey (straight=0).
function smoke(t,x,y,s,straight,k){
  let g='';
  for(let i=0;i<7;i++){const q=(t*.35+i/7)%1,sx=x+(1-straight)*q*220*s+Math.sin(t*1.3+i)*14*s,sy=y-q*lerp(140,420,straight)*s;
    g+=Ell(sx,sy,(26+q*50)*s,(18+q*26)*s,straight>.5?'#FFF6DA':'#7A7470',{opacity:(k*.5*(1-q)).toFixed(3)});}
  return g;
}

// ---------- 0. Cold open: two brothers walk out ----------
function coldOpen(t){
  let g=stars(t,.5,300)+glow(960,Y(700,980),1000,'#FF9A4C',.5);
  // A low sun with slow rays fanning up through the clouds.
  const sx=X(1300,700),sy=Y(760,935);
  for(let i=0;i<11;i++){const a=-Math.PI*(.08+i*.084)+Math.sin(t*.15+i)*.02,da=.028+.012*(i%3),Lr=2200;
    g+=P(`M${sx} ${sy}L${(sx+Math.cos(a-da)*Lr).toFixed(0)} ${(sy+Math.sin(a-da)*Lr).toFixed(0)}L${(sx+Math.cos(a+da)*Lr).toFixed(0)} ${(sy+Math.sin(a+da)*Lr).toFixed(0)}Z`,'#FFD8A0',{opacity:(.05+.03*Math.sin(t*.7+i*1.7)).toFixed(3)});}
  g+=glow(sx,sy,hv(300,380),'#FFC870',.85)+C(sx,sy,hv(70,105),'#FFD9A0',{opacity:.92});
  // Clouds lit from below by the setting sun, drifting slowly.
  const dr=t*hv(5,7);
  g+=cloud(X(500,250)+dr,Y(160,250),hv(520,620),'#4A2E52','#D9785A',.9,3)+cloud(X(1500,880)-dr*.6,Y(240,360),hv(480,560),'#56324E','#E8885A',.9,5)+
    cloud(X(900,430)+dr*.8,Y(380,560),hv(640,760),'#6E3A4A','#FF9E64',.92,7)+cloud(X(1650,1000)-dr*.4,Y(470,700),hv(380,440),'#7E4450','#FFB070',.85,9);
  g+=Ell(X(700,300),Y(560,800),hv(420,480),12,'#FFB070',{opacity:.35})+Ell(X(1400,820),Y(600,855),hv(360,420),9,'#FFC88A',{opacity:.3});
  // A flock crossing the sky, right to left.
  for(let i=0;i<7;i++){const bx=X(1800,1250)-(t*hv(34,40))-i*hv(60,70)+(i%2)*hv(30,40),by=Y(260,390)+Math.abs(i-3)*hv(18,24)+Math.sin(t*1.3+i)*6;g+=bird(bx,by,hv(1,1.25),t,i*1.7,'#2A1A2E');}
  // Far hills with a few trees, then the field and a worn path toward the sun.
  g+=`<path d="${ridge(5,Y(770,915),10,260)}" fill="#5A3A52"/>`;
  [[X(260,130),.75],[X(380,215),.55],[X(1660,930),.9],[X(1760,1010),.6]].forEach(([x,s])=>g+=tree(x,Y(780,925),s*hv(.8,1),'#3A2640',t,.4));
  g+=`<path d="${ridge(3,Y(800,950),14,300)}" fill="#3E5030"/><path d="${ridge(4,Y(860,1040),12,200)}" fill="#2E3E24"/>`;
  g+=track(sx,Y(800,955),X(560,280),X(1500,880),Y(1100,1920),'#4A3E26',.55)+track(sx,Y(800,955),X(720,400),X(1300,760),Y(1100,1920),'#6E5634',.45);
  for(let i=0;i<9;i++){const u=Math.pow((i+1)/10,1.6),yy=lerp(Y(800,955),Y(1100,1920),u),xx=lerp(sx,X(900,520),u)+(hash(i,77)-.5)*lerp(10,300,u);g+=Ell(xx.toFixed(0),yy.toFixed(0),(lerp(4,26,u)).toFixed(0),(lerp(2,10,u)).toFixed(0),'#8A7454',{opacity:.6});}
  g+=meadow(t,0,['#2E3E24','#26341E','#3A4E2A'],['#FFD08A']);
  g+=tufts(t,1,Y(800,950),Y(1000,1880),hv(120,280),['#4A6034','#3A4E2A','#56703C'],{tip:'#FFB070',lean:3,fc:['#FFD08A','#FFF4DA'],s0:.6,s1:3});
  g+=fireflies(t,0,Y(820,1000),1920,hv(300,500),'#FFD08A',10,.55);
  // The sixth line of the tablets, faint in the sky.
  const tb=ease.out(prog(t,AT.v1-.6,AT.v1+.6));
  if(tb>0){const ty=Y(330,700),ss=hv(.5,.58);g+=G('',G(`translate(960 ${ty}) scale(${ss}) translate(-960 -560)`,tablets(960,560,1,SIXTH(1.1,.12))),.85*tb);}
  // Walking out together; Abel's glow goes out; Cain walks back alone.
  const out=ease.inOut(prog(t,.3,AT.onlyOne)),back=ease.inOut(prog(t,AT.walksBack,AT.walksBack+2.6));
  const fy=Y(900,1195),s=hv(.8,1.85),cx=lerp(X(300,90),X(820,300),out)-lerp(0,X(820,300)-X(300,150),back);
  const walking=(t<AT.onlyOne)||(t>AT.walksBack&&t<AT.walksBack+2.6);

// ---------- 6. Underneath it: the ember of anger ----------
function under(t,lt){
  let g=glow(960,560,1200,'#FFE9B0',.5)+fireflies(t,0,-600,1920,2300,'#FFF6DA',16,.6);
  {const dr=lt*hv(5,7);  // a bright hillside sky: soft clouds and sun rays from above
    for(let i=0;i<9;i++){const an=Math.PI*(.25+i*.0625),x0=X(960,540),y0=Y(-400,-300);g+=P(`M${x0} ${y0}L${(x0+Math.cos(an-.03)*2800).toFixed(0)} ${(y0+Math.sin(an-.03)*2800).toFixed(0)}L${(x0+Math.cos(an+.03)*2800).toFixed(0)} ${(y0+Math.sin(an+.03)*2800).toFixed(0)}Z`,'#FFFFFF',{opacity:.12});}
    g+=cloud(X(440,200)+dr,Y(140,600),hv(480,540),'#FFFFFF','#F0D8A8',.8,51)+cloud(X(1500,900)-dr*.6,Y(240,690),hv(440,500),'#FFFDF4','#F0C890',.75,53);
    g+=`<path d="${ridge(90,Y(820,960),10,280)}" fill="#E0B070" opacity=".8"/>`;}
  g+=`<path d="${ridge(91,Y(860,1010),12,300)}" fill="#D8A060"/><path d="${ridge(92,Y(920,1100),8,220)}" fill="#C08A4A"/>`;
  g+=meadow(t,6,['#B07A3A','#9A6A30','#C89050'],['#FFE9A8']);
  const ex=X(960,540),ey=Y(700,960);
  // The ember (anger), glowing hot, with roots spreading below it.
  const reveal=ease.inOut(prog(t,AT.under-.2,AT.under+.9));
  if(reveal>0){
    const fl=.7+.3*Math.sin(t*7)+.1*Math.sin(t*13);
    g+=glow(ex,ey,220,RED,.6*fl*reveal)+Ell(ex,ey,62,40,'#8A1A10',{opacity:reveal.toFixed(2)})+Ell(ex-8,ey-6,40,24,'#FF5A2C',{opacity:(reveal*fl).toFixed(2)})+Ell(ex-14,ey-10,18,10,'#FFD06B',{opacity:(reveal*fl).toFixed(2)});
    const rp=ease.inOut(prog(t,AT.root-.2,AT.root+1));
    [-1,-.5,0,.5,1].forEach((k,i)=>g+=mark(`M${ex+k*30} ${ey+36}Q${ex+k*90} ${ey+90} ${ex+k*170} ${ey+hv(150,170)+Math.abs(k)*-30}`,rp,'#8A1A10',8));
  }
  // The command as a torn paper lid that lifts away.
  const lid=strip(ex-hv(360,320),ey-hv(110,120),hv(720,640),hv(220,240),17,'#F6EFDC')+tape(ex,ey-hv(110,120),120,3)+
    T(ex,ey-10,'DO NOT MURDER',{size:hv(56,62),font:'Segoe UI Black',weight:900,anchor:'middle',fill:INK})+
    T(ex,ey+50,'(the hands)',{size:hv(34,38),font:'Georgia',style:'italic',anchor:'middle',fill:'#6A5A4A'});
  if(reveal<1)g+=piece(t,AT.hillside,ex,ey,G(`translate(${(reveal*hv(500,300)).toFixed(1)} ${(-reveal*hv(500,700)).toFixed(1)}) rotate(${(reveal*14).toFixed(1)} ${ex} ${ey})`,lid,1-reveal*.6),1,1.3);
  g+=verse(t,AT.quoted-.1,560,40,['You shall not murder.'],'EXODUS 20:13 ESV',{size:52,seed:5,id:8,end:AT.v522-.4});
  g+=verse(t,AT.v522-.15,300,40,['But I say to you that everyone who is angry with his brother','will be liable to judgment.'],'MATTHEW 5:22 ESV',{size:46,hl:'who is angry',hlAt:AT.angry[0],hlDur:AT.angry[1]-AT.angry[0],seed:23,id:9});
  g+=fade(t,AT.hands-.3,tag(t,AT.angry[1]+.3,ex+hv(220,0),ey+hv(0,-130),'ANGER',SZ(44,50),2,{bg:CORAL,rot:-3}));
  // Back to Cain: a small red figure and an arrow from the ember.
  const cIn=ease.out(prog(t,AT.whereCain-.2,AT.whereCain+.5));
  if(cIn>0){const cx=X(400,150),cy=Y(900,1180);g+=G('',bro('cain',cx,cy,hv(.8,.85),{aura:RED,auraOp:.5}),cIn)+
    arrow(ex-70,ey+20,lerp(ex,cx,.5),ey+hv(10,40),cx+50,cy-hv(150,160),ease.inOut(prog(t,AT.notField,AT.notField+.6)),CORAL,8);}
  g+=fade(t,AT.hands-.3,tag(t,AT.notField,X(1460,730),Y(880,1120),'NOT THE FIELD',SZ(30,34),3)+
    tag(t,AT.theFeeling,X(1460,730),Y(960,1185),'THE FEELING',SZ(34,38),4,{bg:CORAL}));
  g+=fade(t,AT.hands-.3,tag(t,AT.angryWord,960,Y(980,1395),'THE ANGRY WORD',SZ(32,38),5)+
    tag(t,AT.cruelName,960,Y(1030,1470),'THE CRUEL NAME',SZ(32,38),6)+
    tag(t,AT.coldSilence,960,Y(1080,1545),'THE COLD SILENCE',SZ(32,38),7));
  g+=tag(t,AT.hands,960,Y(1000,1420),'NOT ONLY OUR HANDS',SZ(38,44),8);
  g+=tag(t,AT.hearts,960,Y(1070,1520),'OUR HEARTS',SZ(44,52),9,{bg:CORAL,rot:-2});
  return g;
}

// ---------- 7. My brother's keeper: two glows meet ----------
function bread(cx,cy){return Ell(cx,cy+10,80,46,'#C8843A',{stroke:'#8A5420','stroke-width':4})+P(`M${cx-50} ${cy-4}q14 -14 28 0M${cx-10} ${cy-10}q14 -14 28 0M${cx+28} ${cy-4}q14 -14 28 0`,'none',{stroke:'#8A5420','stroke-width':5});}
function heartArt(cx,cy,c=CORAL){return glow(cx,cy,110,'#FFD86B',.5)+P(`M${cx} ${cy+60}C${cx-110} ${cy-10} ${cx-60} ${cy-90} ${cx} ${cy-40}C${cx+60} ${cy-90} ${cx+110} ${cy-10} ${cx} ${cy+60}Z`,c,{stroke:'#8A2A20','stroke-width':4});}
function keeper(t,lt){
  let g=glow(960,Y(500,900),1000,'#FFD08A',.45)+fireflies(t,0,-600,1920,2000,'#FFE9A8',14,.5);
  {const dr=lt*hv(5,7);
    g+=cloud(X(460,220)+dr,Y(120,200),hv(480,560),'#6A4A8A','#F0A0A0',.85,41)+cloud(X(1500,880)-dr*.6,Y(220,380),hv(440,520),'#7A5490','#FFB890',.85,43)+
      cloud(X(900,420)+dr*.5,Y(360,600),hv(560,640),'#8A5E8E','#FFC890',.8,45);
    for(let i=0;i<5;i++){const bx=X(1800,1180)-((lt*hv(30,36)+i*hv(70,80))%hv(1900,1500)),by=Y(260,440)+Math.abs(i-2)*20+Math.sin(t*1.2+i)*6;g+=bird(bx,by,hv(.9,1.1),t,i*1.3,'#3A2A50');}
    g+=`<path d="${ridge(70,Y(800,960),10,280)}" fill="#6A7A6A"/>`;
    [[X(240,90),.8],[X(360,175),.6],[X(1600,890),.85],[X(1720,990),.6]].forEach(([x,s])=>g+=tree(x,Y(810,970),s*hv(.8,1),'#4A6A50',t,.3));}
  g+=`<path d="${ridge(71,Y(840,1040),12,300)}" fill="#5E8A4A"/><path d="${ridge(72,Y(900,1110),8,220)}" fill="#4A7A3A"/>`;
  g+=meadow(t,7,['#4A7A3A','#3E6A30','#5A8A46'],['#FF7BD5','#FFD45E','#FFFFFF']);
  // The ember from section 6 cools to gold.
  const cool=ease.inOut(prog(t,AT.flip,AT.flip+1.6)),ex=960,ey=Y(700,960);
  g+=G('',glow(ex,ey,200,mix('#FF3A2A','#FFD86B',cool),.6)+Ell(ex,ey,50,32,mix('#C82A1A','#FFD86B',cool)),1-ease.inOut(prog(t,AT.makePeace-.4,AT.makePeace+.4)));
  // Two figures walk toward each other and their glows join.
  const meet=ease.inOut(prog(t,AT.makePeace,AT.makePeace+2)),fy=Y(940,1180),s=hv(.95,1.25);
  const lx=lerp(X(300,130),X(800,380),meet),rx=lerp(X(1620,900),X(1120,700),meet),mv=meet>0&&meet<1;
  if(meet>.6)g+=glow((lx+rx)/2,fy-110,320,'#FFE9A8',.7*(meet-.6)/.4);
  g+=crowd(t,lx,fy,1,0,s,{aura:'#FFE9A8',auraOp:.4,reach:meet>.9?.45:0})+crowd(t,rx,fy,1,0,s,{k:2,flip:-1,aura:'#FFE9A8',auraOp:.4,reach:meet>.9?.45:0});
  g+=cutout(t,AT.protect,X(500,300),Y(500,720),bread(X(500,300),Y(500,720)),'SHARE',21,{w:220,h:200});
  g+=cutout(t,AT.protect+.5,X(1420,780),Y(500,720),heartArt(X(1420,780),Y(500,720)),'PROTECT',22,{w:220,h:200});
  g+=fade(t,AT.v311-.2,tag(t,AT.flip,960,Y(150,520),'THE FLIP SIDE',SZ(40,46),1));
  g+=verse(t,AT.v311-.15,300,40,['For this is the message that you have heard from the beginning,','that we should love one another.'],'1 JOHN 3:11 ESV',{size:46,hl:'love one another.',hlAt:AT.loveOne[0],hlDur:AT.loveOne[1]-AT.loveOne[0],seed:29,id:6});
  g+=fade(t,AT.nextVerse-.3,tag(t,AT.makePeace,960,Y(1000,1420),'MAKE PEACE FIRST',SZ(38,44),2,{bg:CORAL}));
  g+=fade(t,AT.keeper-.3,tag(t,AT.nextVerse,960,Y(1000,1420),'THE NEXT VERSE NAMES CAIN',SZ(34,40),3));
  g+=tag(t,AT.keeper,960,Y(1000,1420),"MY BROTHER'S KEEPER?",SZ(38,44),4);
  g+=tag(t,AT.yes,960,Y(1070,1520),'YES.',SZ(56,64),5,{bg:CORAL,rot:-3});
  return g;
}

// ---------- 8. Every face, then the end card ----------
function everyFace(t,lt){
  let g=glow(960,Y(200,500),1000,'#FFF6DA',.6);

  g+=meadow(t,8,['#5E9E4A','#4E8A3E','#72B05A'],['#FF7BD5','#FFD45E','#FFFFFF']);
  g+=crowd(t,X(380,190),Y(780,990),hv(6,4),hv(220,200),hv(.55,.62),{k:3,aura:'#FFE9A8',auraOp:.35});

  // End card after the last word.
  const ec=prog(t,AT.last+.6,AT.last+1.2);
  if(ec>0){g+=G('',R(-200,-800,2400,2800,0,'#08060F',{opacity:.86})+
    T(960,Y(380,700),'THE TEN COMMANDMENTS · PART 6',{size:SZ(40,40),font:'Segoe UI Black',weight:900,anchor:'middle',fill:'#FFE9A8'})+

  return g;
}
