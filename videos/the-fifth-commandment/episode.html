const slab=(w,h)=>`M${-w/2} ${h/2}V${-h/2+w*.32}Q${-w/2} ${-h/2} 0 ${-h/2}Q${w/2} ${-h/2} ${w/2} ${-h/2+w*.32}V${h/2}Z`;
const NUM=['I','II','III','IV','V','VI','VII','VIII','IX','X'];
// One tablet with five carved lines (numerals + illegible carving, never a quotation). lit(k) 0..1, col(k) glow colour.
function tablet(x,y,w,h,first,lit,seed,col){
  const r=rng(seed);let g=G(`translate(${x} ${y})`,P(slab(w,h),'#7E7A70')+P(slab(w-24,h-24),'#9C988C')+
    P(slab(w-24,h-24),'none',{stroke:'#5E5A52','stroke-width':3,opacity:.5}));
  for(let i=0;i<5;i++){
    const k=first+i,ly=y-h/2+w*.46+i*(h-w*.5)/5.2,x0=x-w/2+92,x1=x+w/2-34-r()*40,on=lit(k),c=col(k);
    let d=`M${x0} ${ly}`;for(let xx=x0;xx<x1;xx+=18)d+=`L${xx+9} ${ly+(r()-.5)*6}L${xx+18} ${ly}`;
    g+=glow((x0+x1)/2,ly,(x1-x0)*.6,c,.35*on);
    g+=T(x-w/2+60,ly+12,NUM[k],{size:34,font:'Georgia',weight:700,anchor:'middle',fill:mix('#4A4740','#FFF4C8',Math.min(1,on))});
    g+=P(d,'none',{stroke:'#4A4740','stroke-width':5,opacity:.8})+P(d,'none',{stroke:mix('#FFE9A8',c,.4),'stroke-width':3,opacity:(.12+.88*Math.min(1,on)).toFixed(3)});
  }

}

const tablets=(cx,cy,s,lit,col=goldOrCoral,gap=0)=>G(`translate(${cx} ${cy}) scale(${s}) translate(${-cx} ${-cy})`,
  glow(cx,cy,560,'#FFD86B',.12)+tablet(cx-205-gap,cy,380,560,0,lit,21,col)+tablet(cx+205+gap,cy,380,560,5,lit,33,col));

const xMark=(cx,cy,r,p)=>mark(`M${cx-r} ${cy-r}L${cx+r} ${cy+r}`,p*2,CORAL,10)+mark(`M${cx+r} ${cy-r}L${cx-r} ${cy+r}`,p*2-1,CORAL,10);

const pplOpts=(i,x,y,s,o={})=>{const [a,b]=TUN[i%5],[sk,sh]=SKIN[i%3],face=o.flip||o.face||1,f=o.f??(i%2===1);

// A line of people holding hands (from part 1).
function chain(ps,up){

// God is never a figure: his presence is a soft oval of light; his care a column of light.
const presence=(t,x,y,r,k=1)=>k<=0?'':glow(x,y,r*2.6,'#FFF6DA',.5*k)+glow(x,y,r*1.2,'#FFFFFF',.65*k)+

const heartP=(x,y,r)=>`M${x} ${y+r*.9}C${x-r*1.7} ${y-r*.1} ${x-r*.95} ${y-r*1.35} ${x} ${y-r*.42}C${x+r*.95} ${y-r*1.35} ${x+r*1.7} ${y-r*.1} ${x} ${y+r*.9}Z`;
const heart=(x,y,r,k=1)=>glow(x,y,r*2.2,'#FF7A6A',.5*k)+P(heartP(x,y,r),'#FF4A5C',{stroke:'#FFD0C8','stroke-width':Math.max(2,r*.08)})+P(heartP(x-r*.2,y-r*.15,r*.45),'#FF8A96',{opacity:.6});
const gnd=(s,y,c1,c2)=>`<path d="${ridge(s,y,10,230)}" fill="${c1}"/><path d="${ridge(s+1,y+120,8,200)}" fill="${c2}"/>`;
const tent=(x,y,c,k=1)=>P(`M${x-90*k} ${y}L${x} ${y-120*k}L${x+90*k} ${y}Z`,c)+P(`M${x} ${y-120*k}L${x-13*k} ${y}L${x+13*k} ${y}Z`,'#2A1A10');
const sun=(x,y,r,c,k=1)=>glow(x,y,r*3.2,c,.5*k)+C(x,y,r,c,{opacity:(.95*k).toFixed(2)});
function clouds(t,seed,y,col,op=.5,n=7,sp=10){let g='';for(let i=0;i<n;i++){const x=((hash(i,seed)*2600+t*sp*(1+i%3))%2600)-340,w=170+hash(i,seed+1)*230,yy=y+hash(i,seed+2)*160;
  g+=Ell(x,yy,w,w*.2,col,{opacity:op})+Ell(x+w*.3,yy-w*.12,w*.5,w*.2,col,{opacity:op});}return g;}
const tree=(x,y,s,leaf,trunk='#5A3A22',seed=1)=>R(x-16*s,y-220*s,32*s,220*s,10*s,trunk)+P(`M${x} ${y-150*s}l${-70*s} ${-70*s}M${x} ${y-120*s}l${60*s} ${-80*s}`,'none',{stroke:trunk,'stroke-width':14*s})+
  [[0,-300,120],[-95,-245,85],[95,-240,90],[-50,-370,85],[55,-360,80]].map(([dx,dy,r],k)=>C(x+dx*s,y+dy*s,r*s,mix(leaf,'#000000',.08*(k%2)))).join('')+C(x-30*s,y-330*s,40*s,'#FFFFFF',{opacity:.08});
const olive=(x,y,s,seed)=>tree(x,y,s,'#7A9A6A','#6A5440',seed)+[0,1,2,3,4,5].map(k=>C(x+(hash(k,seed)-.5)*200*s,y-(220+hash(k,seed+3)*150)*s,7*s,'#3A3A4A')).join('');
// A small glowing paper house; on = window light.
function house(t,cx,cy,s,on,o={}){
  return G(`translate(${cx} ${cy}) scale(${s})`,glow(0,-60,260,'#FFD27A',.55*on)+
    P('M-120 0V-110H120V0Z',o.wall||'#C98A5A',{stroke:'#6A3A1E','stroke-width':5})+P('M-150 -100L0 -210L150 -100Z',o.roof||'#A8432E',{stroke:'#5A1E12','stroke-width':5})+

    R(60,-200,30,60,2,'#7A3A22'));
}
// Furniture, all standing on the floor at y 800.
const table=(x,y,w,c='#7A4E2E')=>R(x-w/2+16,y+14,16,800-y-14,3,mix(c,'#000',.25))+R(x+w/2-32,y+14,16,800-y-14,3,mix(c,'#000',.25))+R(x-w/2,y,w,20,5,c,{stroke:'#3A2414','stroke-width':3});
const stool=(x,seat,w=90,c='#8A5A34')=>R(x-w/2+8,seat+12,12,800-seat-12,3,mix(c,'#000',.3))+R(x+w/2-20,seat+12,12,800-seat-12,3,mix(c,'#000',.3))+R(x-w/2,seat,w,16,5,c,{stroke:'#3A2414','stroke-width':3});
const oilLamp=(t,x,y,k=1)=>glow(x,y-20,180*k,'#FFD27A',.6)+P(`M${x-26} ${y}Q${x} ${y+18} ${x+30} ${y}L${x+40} ${y-6}Q${x} ${y-10} ${x-26} ${y}Z`,'#C8863A',{stroke:'#6A3A1E','stroke-width':3})+
  P(`M${x+30} ${y-4}q${-8+Math.sin(t*9)*3} -18 0 -30q8 12 0 30z`,'#FFE36B')+glow(x+30,y-18,40,'#FFF6DA',.8);
const cup=(x,y,c='#E8D5B8')=>P(`M${x-16} ${y-24}H${x+16}L${x+12} ${y}H${x-12}Z`,c,{stroke:'#8A6A4A','stroke-width':3});
const loaf=(x,y)=>Ell(x,y,30,17,'#D8964A',{stroke:'#8A5A2A','stroke-width':3})+P(`M${x-12} ${y-8}l6 10M${x+2} ${y-10}l6 10`,'none',{stroke:'#8A5A2A','stroke-width':3});
const scrollP=(x,y,w,h,k=1)=>R(x-w/2*k,y-h/2,w*k,h,4,'#F6EFDC',{stroke:'#B8A888','stroke-width':3})+C(x-w/2*k,y,h*.55/2+6,'#C8B48A')+C(x+w/2*k,y,h*.55/2+6,'#C8B48A')+
  [0,1,2].map(i=>L(x-w/2*k+16,y-h/4+i*h/4,x+w/2*k-16,y-h/4+i*h/4,'#8A7A5A',3,{opacity:.6*k})).join('');
// A room: back wall to the top of the paper, beams, shelf, a window (o.win: [x,y,w,h], o.sky colour, o.rain), floor from 780.
function room(t,o){

  const r=rng(o.seed||3);for(let i=0;i<14;i++)g+=Ell(r()*2000,-600+r()*1300,90+r()*120,40+r()*60,mix(o.wall,'#FFFFFF',.06),{opacity:.6});

  if(o.win){const [x,y,w,h]=o.win;g+=R(x-12,y-12,w+24,h+24,8,mix(o.wall,'#000',.4))+R(x,y,w,h,4,o.sky||'#1A2A5A');
    if(o.stars)g+=[0,1,2,3,4,5,6].map(k=>C(x+hash(k,9)*w,y+hash(k,8)*h*.8,3,'#FFF6DA',{opacity:.5+.5*Math.sin(t*2+k)})).join('');

    for(let i=0;i<6;i++)g+=R(x-120,-60+i*40,240,40,0,c[i%3],{opacity:.9});g+=R(x-120,-60,240,240,4,'none',{stroke:'#4A2A14','stroke-width':5});

// A rainy town street: rooftops on the horizon at y hy, cobbles and puddles below.
function street(t,seed,hy,o={}){
  const r=rng(seed);let g='';
  for(let x=-80;x<2040;){const w=150+r()*170,h=150+r()*220;g+=R(x,hy-h,w,h+10,0,o.far||'#3A404E')+P(`M${x-10} ${hy-h}L${x+w/2} ${hy-h-80}L${x+w+10} ${hy-h}Z`,o.far||'#3A404E');
    for(let j=0;j<2;j++)if(r()<.5)g+=R(x+20+j*(w/2),hy-h+40,34,40,3,'#E8C27A',{opacity:(.25+.3*r()).toFixed(2)});x+=w+20+r()*40;}
  g+=R(-80,hy,2120,1800-hy,0,o.road||'#2E333E');
  for(let row=0;row<10;row++){const y=hy+30+Math.pow(row/9,1.4)*(1700-hy),sz=lerp(.6,2.2,row/9);for(let x=-60+(row%2)*40*sz;x<2000;x+=90*sz)g+=P(`M${x} ${y}h${60*sz}`,'none',{stroke:'#3E4452','stroke-width':4*sz,opacity:.7});}
  [[420,hy+120,150],[1500,hy+90,130],[960,hy+330,220]].forEach(([x,y,w],k)=>{g+=Ell(x,y,w,w*.16,'#7E8AA0',{opacity:.4});
    if(o.wet!==0)for(let j=0;j<2;j++){const ph=(t*.9+hash(k,j+11))%1;g+=Ell(x+(hash(k,j)-.5)*w,y,8+ph*60,(8+ph*60)*.25,'none',{stroke:'#C8D4E8','stroke-width':3,opacity:(.6*(1-ph)*(o.wet??1)).toFixed(2)});}});
  return g;
}
// The doorway of a house front (walls fill the paper), door panel opening to `open` 0..1 with warm light inside.
function doorFront(t,cx,wall,open,o={}){
