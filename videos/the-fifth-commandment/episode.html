<script>
// The Ten Commandments, part 5: the fifth commandment. Script: scripts/06-the-fifth-commandment.md (ESV fill).
// Every time below comes from the spoken words (words.js), so a new narration re-times the episode.
// Guide: .claude/skills/godward-episode/reference/engine.md. K.E is the ellipse helper (Ell), window.E the engine.
const {G,R,C,L,P,T,prog,ease,lerp,mix,clamp,rng}=K, Ell=K.E;
const {hash,piece,glow,label,mark,scribble,arrow,strip,tape,torn}=S;
const {cue,end,span,shot,ridge,verse,fade,hv,stars,fireflies,INK,YEL,CORAL}=E;
const GOLD='#E8B53A', WARM='#FFB27A';

const AT={
  fourIn:cue('Four commandments in'), firstFour:cue('The first four'), murder:cue('before murder'), mother:cue('about your mother'),
  v12:cue('Honor your father and your mother'), days:span('your days may be long'),
  most:cue('Most people hear'), kids:cue('little kids'), told:cue("Do what you're told"), bigger:cue("It's much bigger"),
  readers:cue('Many readers'), lovingGod:cue('loving God'), lovingN:cue('loving your neighbor'),
  firstN:cue('the very first neighbor'), closest:cue('closest to you'), cameFrom:cue('The people you came from'),
  hinge:cue('right on the hinge'), heaven:cue('Between heaven'),
  mean:cue('So what does honor actually'), hebrew:cue('In Hebrew'), heavy:cue('means heavy'), glory:cue('word for glory'),
  weight:cue('give them weight'), seriously:cue('take them seriously'), child:cue('A small child'), adult:cue('But a grown adult'),
  something:cue('comes with something'), paul:cue('The apostle Paul'), v62:cue('Honor your father and mother'),
  promise:span('first commandment with a promise'), goWell:cue('go well'), israel:cue('For Israel'), widely:cue('more widely'),
  homes:cue('homes where parents'), together:cue('hold together'),
  hard:cue('But what if your parents'), feels:cue('feels heavy'), hurt:cue('who hurt them'), left:cue('A parent who left'), knew:cue('never knew'),
  pretending:cue('the same as pretending'), wrongRight:cue('calling wrong things right'), harm:cue("staying in harm's way"),
  teachers:cue('Many Christian teachers'), respect:cue('respect the place'), grieving:cue('while grieving'),
  paulTurns:cue('Then Paul turns'), fathers:cue('Fathers, do not provoke'), bringUp:span('bring them up'), bothWays:cue('runs both ways'),
  letGo:cue('And if a father'), psalms:cue('line in the Psalms'), forsaken:cue('For my father and my mother'),
  takeMe:span('the LORD will take me in'), whoever:cue('Whoever let you go'), godNot:cue('God does not'),
  cross:cue("And then there's the cross"), dying:cue('Jesus is dying'), watching:cue('watching'),
  saw:cue('When Jesus saw'), woman:cue('Woman, behold'), behold:span('Behold, your mother'), hour:cue('from that hour'),
  suffering:cue('In the middle'), hadHome:cue('had a home'), veryEnd:cue('to the very end'),
  looksNow:cue('look like now'), phone:cue('A phone call'), patience:cue('Patience with'), forgive:cue('forgiveness'),
  safe:cue('safe distance'), giving:cue('Giving weight'), start:cue('gave you a start'),
  doorway:cue('is a doorway'), walks:cue('walks through it'), arrives:cue('arrives at home'),
  nextTime:cue('Next time'), sixth:cue('the sixth commandment'), life:cue('every human life'),
};
AT.last=WORDS[WORDS.length-1][2];

// ---------- shared pieces ----------
const slab=(w,h)=>`M${-w/2} ${h/2}V${-h/2+w*.32}Q${-w/2} ${-h/2} 0 ${-h/2}Q${w/2} ${-h/2} ${w/2} ${-h/2+w*.32}V${h/2}Z`;
const NUM=['I','II','III','IV','V','VI','VII','VIII','IX','X'];
// One tablet with five carved lines (numerals + illegible carving, never a quotation).
// lit(k) 0..1 per line; col(k) the glow colour of line k (gold for God-ward, coral/warm for neighbour-ward).
function tablet(x,y,w,h,first,lit,seed,col){
  const r=rng(seed);let g=G(`translate(${x} ${y})`,P(slab(w,h),'#7E7A70')+P(slab(w-24,h-24),'#9C988C')+
    P(slab(w-24,h-24),'none',{stroke:'#5E5A52','stroke-width':3,opacity:.5}));
  for(let i=0;i<5;i++){
    const k=first+i,ly=y-h/2+w*.46+i*(h-w*.5)/5.2,x0=x-w/2+92,x1=x+w/2-34-r()*40,on=lit(k),c=col(k);
    let d=`M${x0} ${ly}`;for(let xx=x0;xx<x1;xx+=18)d+=`L${xx+9} ${ly+(r()-.5)*6}L${xx+18} ${ly}`;
    g+=glow((x0+x1)/2,ly,(x1-x0)*.6,c,.35*on);
    g+=T(x-w/2+60,ly+12,NUM[k],{size:34,font:'Georgia',weight:700,anchor:'middle',fill:mix('#4A4740','#FFF4C8',Math.min(1,on))});
    g+=P(d,'none',{stroke:'#4A4740','stroke-width':5,opacity:.8})+P(d,'none',{stroke:mix('#FFE9A8',c,.4),'stroke-width':3,opacity:(.12+.88*Math.min(1,on)).toFixed(3)});
  }
  return g;
}
const tablets=(cx,cy,lit,col)=>glow(cx,cy,560,'#FFD86B',.12)+tablet(cx-205,cy,380,560,0,lit,21,col)+tablet(cx+205,cy,380,560,5,lit,33,col);
// Where line k sits on tablets drawn at (cx, cy) unscaled: [x0, y, x1].
const lineAt=(cx,cy,k)=>{const tx=k<5?cx-205:cx+205,i=k%5;return [tx-190+92,cy-280+380*.46+i*(560-190)/5.2,tx+190-60];};
const strike=(x0,y,x1,p)=>mark(`M${x0} ${y+6}L${x1} ${y-6}`,p,CORAL,9);
const TUN=[['#3DE0B8','#1787A8'],['#FFC24C','#E0623C'],['#B98CFF','#6A4CD8'],['#FF8FB1','#C8487A'],['#7CD4FF','#2F6FD0']];
const SKIN=[['#F5BE8E','#C4835E'],['#D9965E','#A86A3E'],['#B87444','#8A5230']];
// One glowing figure. k picks colours; o: f, s, flip, walk, reach, hair, aura, auraOp, lean.
function person(t,x,y,s,k,o={}){
  const [a,b]=TUN[k%5],[sk,sh]=SKIN[k%3];
  return E.chubby(x,y,s,Object.assign({f:k%2===1,tunic:a,tunic2:b,skin:sk,shade:sh,hair:['#2E1C52','#4A2A16','#1A1A2A'][k%3],aura:'#FFE2B0',auraOp:.35,phase:k*.7},o));
}
function crowd(t,x0,y,n,gap,s,o={}){
  let g='';
  for(let i=0;i<n;i++)g+=person(t,x0+i*gap+(i%2)*10,y+(i%3)*10,s*(.92+.16*hash(i,4)),i+(o.k0||0),{flip:o.flip||1,walk:o.walk?t*7+i:0,aura:o.aura||'#FFE2B0',auraOp:o.auraOp??.35});
  return g;
}
// A small glowing paper house.
function house(t,cx,cy,s,on){
  return G(`translate(${cx} ${cy}) scale(${s})`,glow(0,-60,260,'#FFD27A',.55*on)+
    P('M-120 0V-110H120V0Z','#C98A5A',{stroke:'#6A3A1E','stroke-width':5})+P('M-150 -100L0 -210L150 -100Z','#A8432E',{stroke:'#5A1E12','stroke-width':5})+
    R(-30,-80,60,80,6,mix('#4A2A1A','#FFD27A',on))+R(-95,-85,46,40,4,mix('#3A2A1A','#FFE9A8',on))+R(50,-85,46,40,4,mix('#3A2A1A','#FFE9A8',on))+
    R(60,-200,30,60,2,'#7A3A22'));
}
// A small cut-out on torn paper with a label underneath.
function cutout(t,at,cx,cy,inner,name,id,o={}){
  const w=o.w||250,h=o.h||250;
  return piece(t,at,cx,cy,strip(cx-w/2,cy-h/2,w,h,id*7,o.paper||'#F6EFDC')+tape(cx,cy-h/2+4,90,-4)+inner+
    label(cx,cy+h/2+14,name,{size:hv(26,34),anchor:'middle',bg:o.bg}),id,1.4);
}
// Rain streaks.
function rain(t,o,n=140){let g='';for(let i=0;i<n;i++){const x=(hash(i,1)*2200-140+t*40)%2200-140,y=((hash(i,2)*2600+t*900)%2600)-720;g+=L(x,y,x-14,y+60,'#B8C4D8',3,{opacity:(.35*o).toFixed(2)});}return g;}

// Vertical ground under the lower labels (frame y 1570-1920), drawn BEFORE the labels so grass never covers text.
function ground(t,seed,gc,fc=[],fy=1575){
  if(!E.VERT)return '';
  const y0=vy(fy);let g=`<path d="${ridge(seed,y0,14,170)}" fill="${gc[1]}"/>`;
  for(let k=0;k<70;k++){const x=hash(k,seed)*2060-60,y=y0+20+Math.pow(hash(k,seed+1),.8)*(1800-y0-20),sz=lerp(1.4,3.2,(y-y0)/(1800-y0)),sw=Math.sin(t*1.5+k)*4*sz,c=gc[k%3];
    for(let j=-1;j<=1;j++)g+=L(x+j*5*sz,y,x+j*9*sz+sw,y-(16+hash(k,j+5)*20)*sz,c,3.2*sz);
    if(fc.length&&k%5===0){const fy=y-40*sz,col=fc[k%fc.length];g+=glow(x+sw,fy,18*sz,col,.7)+C(x+sw,fy,5*sz,col);}}
  return g;
}

// Vertical terrain (frame y `top` to the bottom): three paper ridges with a rim light and scattered stones.
// o.c = [far, mid, near, rim]. Drawn before the lower labels.
function land(t,seed,o){
  if(!E.VERT)return '';
  const c=o.c,y0=vy(o.top),d0=ridge(seed,y0,o.amp||26,o.wave||260),r=rng(seed*7+3);
  let g=`<path d="${d0}" fill="${c[0]}"/><path d="${d0}" fill="none" stroke="${c[3]}" stroke-width="5" opacity="${o.rimOp??.45}"/>`+
    `<path d="${ridge(seed+1,y0+150,20,200)}" fill="${c[1]}"/><path d="${ridge(seed+2,y0+340,16,150)}" fill="${c[2]}"/>`;
  for(let k=0;k<(o.stones??22);k++){const x=r()*2000-40,y=y0+60+r()*(1720-y0-60),sz=lerp(.7,2,(y-y0)/(1720-y0)),w=(14+r()*22)*sz;
    g+=Ell(x,y,w,w*.45,c[0])+Ell(x-w*.25,y-w*.16,w*.5,w*.16,c[3],{opacity:.18});}
  return g;
}
// A row of small houses on the ground, windows lit by `on`. pts: [frameX, frameY, scale].
const village=(t,pts,on)=>pts.map(([x,y,s])=>house(t,vx(x),vy(y),s,on)).join('');
// Vertical town at dusk: far rooftops (frame y ~930-1180) and a wet street with puddles from frame y `top`.
function street(t,seed,o={}){
  if(!E.VERT)return '';
  const top=o.top||1170,y0=vy(top),r=rng(seed),wet=o.wet??1;
  let g='';
  for(let i=0,x=-80;x<2040;i++){const w=150+r()*170,h=150+r()*190,yb=y0+6,rt=r()<.5;
    g+=R(x,yb-h,w,h+10,0,o.far||'#3A404E')+(rt?P(`M${x-10} ${yb-h}L${x+w/2} ${yb-h-90}L${x+w+10} ${yb-h}Z`,o.far||'#3A404E'):R(x+w*.6,yb-h-50,26,50,0,o.far||'#3A404E'));
    for(let j=0;j<2;j++)if(r()<.55)g+=R(x+20+j*(w/2),yb-h+40,34,40,3,'#E8C27A',{opacity:(.25+.3*r()).toFixed(2)});
    x+=w+20+r()*40;}
  g+=R(-80,y0-4,2120,18,0,'#6A7280')+R(-80,y0+14,2120,1800-y0,0,o.road||'#2E333E');
  // Cobbles, nearer rows bigger.
  for(let row=0;row<9;row++){const y=y0+40+Math.pow(row/8,1.4)*(1700-y0-40),sz=lerp(.6,2.2,row/8);
    for(let x=-60+(row%2)*40*sz;x<2000;x+=90*sz)g+=P(`M${x} ${y}h${60*sz}`,'none',{stroke:'#3E4452','stroke-width':4*sz,opacity:.7});}
  // Puddles reflecting the sky, rings when it rains.
  [[300,1500,180],[1500,1440,140],[900,1640,240],[1700,1700,200],[150,1740,160]].forEach(([x,y,w],k)=>{
    if(y<y0+60)return;g+=Ell(x,y,w,w*.18,'#7E8AA0',{opacity:.45})+Ell(x-w*.2,y-w*.04,w*.5,w*.05,'#C8D4E8',{opacity:.35});
    for(let j=0;j<2;j++){const ph=(t*.9+hash(k,j+11))%1;g+=Ell(x+(hash(k,j)-.5)*w,y,8+ph*60,(8+ph*60)*.25,'none',{stroke:'#C8D4E8','stroke-width':3,opacity:(wet*.6*(1-ph)).toFixed(2)});}});
  return g;
}
// A street lamp: post from frame (fx, fy) up, warm glow at the head.
const lamp=(fx,fy,h,on=1)=>{const x=vx(fx),y=vy(fy),hy=y-h;return glow(x,hy,260,'#FFD27A',.55*on)+R(x-7,hy,14,h,3,'#1E2230')+R(x-26,hy-40,52,46,6,'#1E2230')+R(x-18,hy-32,36,30,4,mix('#5A4A2A','#FFE9A8',on));};

// ---------- vertical layout ----------
// Every vertical sheet is filmed wide (zoom .84 on 960,560), so frame position (fx, fy) maps to fixed sheet coordinates.
// Vertical frame zones: verse cards 170-~520, art 560-1180, captions 1220-1340, lower labels 1380-1560.
const vx=f=>960+(f-540)/.84, vy=f=>560+(f-1010)/.84;
const X=(l,f)=>hv(l,vx(f)), Y=(l,f)=>hv(l,vy(f)), SZ=(l,f)=>hv(l,f/.84);
const tag=(t,at,x,y,s,size,id,o={})=>piece(t,at,x,y,label(x,y-size*.81,s,Object.assign({size,anchor:'middle'},o)),id,1.3);
const WIDE=[960,560,.84];
const goldOrCoral=k=>k<4?'#FFD86B':k===4?WARM:'#FF8A70';

// ---------- 0. Cold open: four about God, then home ----------
function coldOpen(t){
  const four=ease.out(prog(t,AT.firstFour,AT.firstFour+1)),five=ease.out(prog(t,AT.mother,AT.mother+.8));
  const lit=k=>k<4?.15+.85*four:k===4?.15+1.1*five*(1+.15*Math.sin(t*3)):.12;
  let g=stars(t,.4,300)+fireflies(t,0,-600,1920,700,'#FFE9A8',14,.4);
  // Vertical: the tablets stand on a rocky mountain; a village below lights up at "your mother and father".
  if(E.VERT)g+=glow(960,vy(1180),1000,'#FFD86B',.16)+land(t,87,{top:1130,c:['#2C2638','#383046','#463C56','#FFD86B']})+
    ground(t,87,['#4A4060','#3A3250','#5A4E72'],['#FFE9A8'],1600)+glow(960,vy(1780),700,'#FFD27A',.3*five)+
    village(t,[[70,1820,.5],[270,1790,.4],[470,1830,.46],[690,1800,.38],[900,1830,.5]],five)+fireflies(t,0,vy(1380),1920,700,'#FFE9A8',12,.5);
  else g+=`<path d="${ridge(5,930,14,260)}" fill="#1E1A24"/>`;
  const cy=Y(560,860),s=hv(1,1.36);
  const [lx0,ly5,lx1]=lineAt(960,560,4);
  g+=piece(t,0,960,cy,G(`translate(960 ${cy}) scale(${s}) translate(-960 -560)`,tablets(960,560,lit,goldOrCoral)+
    mark(scribble((lx0+lx1)/2,ly5,(lx1-lx0)*.62,34,4),ease.inOut(prog(t,AT.mother-.3,AT.mother+.6)),CORAL,8)),1,1.2);
  // Top band before the verse: four about God, then your parents.
  g+=fade(t,AT.v12-.25,tag(t,AT.firstFour,960,Y(150,250),'FOUR ABOUT GOD',SZ(40,48),2)+
    tag(t,AT.murder,960,Y(240,345),'THEN... BEFORE MURDER?',SZ(30,38),3,{rot:-2})+
    tag(t,AT.mother,960,Y(330,445),'YOUR MOTHER AND FATHER',SZ(40,48),4,{bg:CORAL,rot:2}));
  g+=verse(t,AT.v12-.15,360,40,['Honor your father and your mother, that your days may be long','in the land that the LORD your God is giving you.'],'EXODUS 20:12 ESV',{size:48,hl:'Honor your father and your mother,',hlAt:AT.v12+.1,hlDur:1.4,seed:5,id:4});
  // The small reading, then bigger.
  const ky=Y(900,1420);
  g+=tag(t,AT.kids,960,ky,'A RULE FOR LITTLE KIDS?',SZ(34,42),5,{rot:-2})+strike(960-hv(240,300),ky,960+hv(240,300),ease.inOut(prog(t,AT.bigger-.3,AT.bigger+.2)));
  g+=tag(t,AT.bigger,960,Y(980,1520),'MUCH BIGGER THAN THAT',SZ(40,46),6,{bg:CORAL});
  return g;
}

// ---------- 1. The hinge: God-ward, neighbour-ward ----------
function hingeSheet(t,lt){
  let g=stars(t,.35,600)+(E.VERT?glow(960,vy(1150),900,'#FFD86B',.12)+land(t,88,{top:1150,c:['#24203A','#2E2848','#3A3258','#FFE9A8']}):'')+
    ground(t,88,['#40385E','#322C4E','#4E4672'],['#FFE9A8'],1600)+fireflies(t,0,-600,1920,2200,'#FFE9A8',16,.4);
  const gl=ease.out(prog(t,AT.lovingGod-.2,AT.lovingGod+.8)),nl=ease.out(prog(t,AT.lovingN-.2,AT.lovingN+.8)),hp=ease.out(prog(t,AT.firstN,AT.firstN+.8));
  const lit=k=>k<4?.2+.8*gl:k===4?.2+1.1*hp*(1+.15*Math.sin(t*3)):.15+.85*nl;
  const cy=Y(560,745),s=hv(.9,1.22);
  const [x0,y5,x1]=lineAt(960,560,4);
  // Bracket on line V and an arrow across to the neighbour tablet.
  let inner=tablets(960,560,lit,goldOrCoral)+mark(scribble((x0+x1)/2,y5,(x1-x0)*.62,34,7),ease.inOut(prog(t,AT.firstN,AT.firstN+.7)),CORAL,8)+
    arrow(x1+10,y5,1000,y5+40,1080,y5-30,ease.inOut(prog(t,AT.closest-.2,AT.closest+.5)),CORAL,8);
  g+=G(`translate(960 ${cy}) scale(${s}) translate(-960 -560)`,inner);
  // Labels over the two tablets (top band).
  g+=tag(t,AT.lovingGod,X(755,300),Y(150,260),'GOD-WARD',SZ(38,44),1,{bg:'#C8901E'});
  g+=tag(t,AT.lovingN,X(1165,790),Y(150,260),'NEIGHBOR-WARD',SZ(38,44),2,{bg:CORAL});
  g+=tag(t,AT.hinge,960,Y(230,390),'THE HINGE',SZ(46,56),3,{rot:-2});
  // The people you came from: a small house and a family below the tablets.
  const hp2=ease.out(prog(t,AT.cameFrom-.2,AT.cameFrom+.6));
  if(hp2>0){const hy=Y(1000,1170);g+=G('',house(t,960,hy,hv(.6,.7),hp2)+
    person(t,960-hv(190,230),hy,hv(.55,.62),0,{aura:'#FFD27A'})+person(t,960-hv(110,140),hy,hv(.38,.42),1,{aura:'#FFD27A'})+
    person(t,960+hv(190,230),hy,hv(.55,.62),3,{flip:-1,aura:'#FFD27A'}),hp2);}
  g+=tag(t,AT.cameFrom,960,Y(900,1420),'THE PEOPLE YOU CAME FROM',SZ(34,40),4);
  g+=tag(t,AT.heaven,960,Y(980,1520),'BETWEEN HEAVEN AND HOME',SZ(40,46),5,{bg:CORAL});
  return g;
}

// ---------- 2. Heavy: honor gives weight ----------
function scale(t,cx,cy,w,ang,leftIn,rightIn){
  const a=ang*Math.PI/180,dx=Math.cos(a)*w/2,dy=Math.sin(a)*w/2;
  const lx=cx-dx,ly=cy+dy,rx=cx+dx,ry=cy-dy;
  const pan=(x,y,inner)=>L(x,y,x-90,y+170,'#3A2810',5)+L(x,y,x+90,y+170,'#3A2810',5)+inner(x,y+170)+
    P(`M${x-130} ${y+170}Q${x} ${y+240} ${x+130} ${y+170}Z`,GOLD,{stroke:'#2A1A08','stroke-width':6});
  const ol={stroke:'#2A1A08','stroke-width':6};
  return P(`M${cx-26} ${cy}L${cx-60} ${cy+480}H${cx+60}L${cx+26} ${cy}Z`,'#7A4E10',ol)+R(cx-160,cy+470,320,36,8,'#4A3214',ol)+
    L(lx,ly,rx,ry,'#2A1A08',26)+L(lx,ly,rx,ry,'#C8922E',16)+C(cx,cy,24,GOLD,{stroke:'#2A1A08','stroke-width':6})+
    pan(lx,ly,leftIn)+pan(rx,ry,rightIn);
}
function heavySheet(t,lt){
  let g=glow(960,hv(520,vy(760)),hv(1000,760),'#FFF4D8',.18)+land(t,81,{top:1185,c:['#A87838','#946628','#7E5620','#FFF2C8'],rimOp:.6})+
    ground(t,81,['#C99C5E','#7E5A2A','#D8B070'],[],1620)+fireflies(t,0,-600,1920,2300,'#FFF6DA',14,.5);
  const sink=ease.back(prog(t,AT.weight-.1,AT.weight+.9)),ang=-4+sink*16+Math.sin(t*1.3)*1.2;
  const cy=Y(380,660),sc=hv(.9,1.2);
  g+=G(`translate(960 ${cy}) scale(${sc}) translate(-960 ${-cy})`,scale(t,960,cy,hv(760,640),ang,
    (x,y)=>sink>0?person(t,x,y+10,.62,0,{hair:'#D8D8E0',aura:'#FFD27A',auraOp:.55}):'',
    (x,y)=>P(`M${x-50} ${y}Q${x} ${y-70} ${x+50} ${y-10}Q${x} ${y-30} ${x-50} ${y}Z`,'#F6EFDC',{stroke:'#B8A888','stroke-width':3})));
  // Top band: the Hebrew word.
  g+=tag(t,AT.heavy,960,Y(130,250),'HONOR = "GIVE WEIGHT"',SZ(46,54),1,{bg:CORAL});
  if(t>AT.heavy+.4)g+=T(960,Y(190,330),'Hebrew kabed: "to be heavy"',{size:SZ(30,36),font:'Georgia',style:'italic',anchor:'middle',fill:'#4A3A20',op:prog(t,AT.heavy+.4,AT.heavy+.9)});
  g+=tag(t,AT.glory,960,Y(270,430),'SAME ROOT AS "GLORY"',SZ(38,44),2,{rot:-2});
  // Lower labels.
