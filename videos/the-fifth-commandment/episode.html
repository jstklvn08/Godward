    let d=`M${x0} ${ly}`;for(let xx=x0;xx<x1;xx+=18)d+=`L${xx+9} ${ly+(r()-.5)*6}L${xx+18} ${ly}`;
    g+=glow((x0+x1)/2,ly,(x1-x0)*.6,c,.35*on);

  }

}

function bigTent(x,y,s,c='#8A5A3A',o={}){const dk=mix(c,'#1A0E06',.45),lt=mix(c,'#FFE0B0',.3),w=170*s,h=150*s;

  [[160,420,5,4],[1560,-140,6,3],[760,-300,4,3]].forEach(([x0,y0,c,r],j)=>{for(let i=0;i<r;i++)for(let k=0;k<c;k++){if(hash(i*9+k,j+20)>.3)g+=R(x0+k*64+(i%2)*32,y0+i*30,58,25,3,grey?'#5A5060':'#9A5A3A',{opacity:.55});}});
  g+=R(-120,-520,2160,46,6,'#5A3A1E')+[...Array(9)].map((_,i)=>C(-60+i*250,-497,26,'#4A2A14')).join('');
  // window with open shutters: the view (day: sky and an olive tree; night: moon and roofs; grey: rain; dusk: sunset)
  if(o.win!==false){

    g+=`<clipPath id="${id}"><rect x="${x0}" y="${y0}" width="${ww}" height="${wh}"/></clipPath><g clip-path="url(#${id})">`+
      SC.sky(t,{mood:night?'night':grey?'clearing':m==='dusk'?'dusk':'day',hz:y0+wh,y0:y0-10,y1:y0+wh+10})+
      (night?SC.sun(t,wx+80,y0+80,22,{col:'#F4F0DC',rays:0,k:.6}):'')+(grey?R(x0,y0,ww,wh,0,'#3A4458',{opacity:.6}):'')+
      [[wx-100,.36],[wx+20,.42],[wx+130,.34]].map(([hx,s])=>SC.house(hx,y0+wh+4,s,{col:night||grey?'#3A3A58':'#C8A880'})+(night?R(hx+10*s,y0+wh-40*s,16*s,14*s,2,'#FFD27A'):'')).join('')+

      (grey?[...Array(30)].map((_,k)=>{const xx=x0+hash(k,1)*ww,yy=y0+((hash(k,2)*wh+t*500)%wh);return L(xx,yy,xx-6,yy+30,'#C8D4E8',3,{opacity:.6});}).join(''):'')+'</g>';

    if(m==='day'||m==='dusk')g+=P(`M${x0} ${y0+wh}L${x0+ww} ${y0+wh}L${wx-20} ${FY}L${wx-520} ${FY}Z`,m==='day'?'#FFF6C8':'#FFC890',{opacity:.13})+glow(wx,y0+150,300,'#FFF6DA',.4);

  if(o.niche!==false){const nx=o.nx??920;g+=R(nx-60,60,120,140,60,'#5A3820')+glow(nx,150,night?240:100,'#FFC86A',night?.7:.35)+Ell(nx,170,30,10,'#C8A070')+P(`M${nx} 160Q${nx-8} 136 ${nx} 118Q${nx+10} 138 ${nx} 160Z`,'#FFD27A');}
  for(let i=0;i<5;i++){const x=200+i*120;g+=L(x,-480,x,-380+hash(i,9)*40,'#6A4A2A',3)+Ell(x,-360+hash(i,9)*40,22,40,['#7A9A4A','#E8E0C8','#8AAA5A'][i%3]);}
  if(o.hang!==false){const hx=o.hx??1060;g+=R(hx-125,-330,250,330,6,'#C8483A')+[...Array(7)].map((_,i)=>R(hx-125,-310+i*44,250,14,0,['#FFD45E','#2E7A9A','#F6EFDC'][i%3])).join('')+[...Array(6)].map((_,i)=>L(hx-115+i*46,0,hx-115+i*46,30,'#C8483A',4)).join('');}
