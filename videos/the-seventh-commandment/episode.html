<script>
// The Ten Commandments, part 7: the seventh commandment. Script: scripts/08-the-seventh-commandment.md (ESV fill).
// Family-friendly throughout: promises and faithfulness, pictured as two cords in one knot, rings, hands and a home.
// Every time below comes from the spoken words (words.js), so a new narration re-times the episode.
// Guide: .claude/skills/godward-episode/reference/engine.md. K.E is the ellipse helper (Ell), window.E the engine.
const {G,R,C,L,P,T,prog,ease,lerp,mix,clamp,rng}=K, Ell=K.E;
const {hash,piece,glow,label,mark,scribble,arrow,strip,tape,torn}=S;
const {cue,end,span,shot,ridge,verse,fade,hv,stars,fireflies,INK,YEL,CORAL}=E;
const GOLD='#E8B53A', NEON='#2BF0FF', WARM='#FFE9A8';

const AT={
  cords:cue('Two cords',1), pull:cue('Pull on it'), tighter:cue('holds tighter'), picture:cue('picture of a promise'),
  seventh:cue('seventh commandment',1), keeping:cue('all about keeping'), v2014:cue('You shall not commit',1),
  means:cue('Adultery means'), lot:cue('A lot of people'), wrong:cue('one wrong thing'), faithfulness:cue('really about faithfulness'), withGod:cue('starts with God'),
  understand:cue('To understand'), garden:cue('In the garden'), firstMan:cue('first man'), therefore:cue('Therefore a man'), holdV:span('hold fast',1),
  holdFast:cue('Hold fast like'), feeling:cue('feeling that comes'), stay:cue('a promise to stay'),
  protects:cue('protects that promise'), wall:cue('wall around a home'), family:cue('Think of a family'), momDad:cue('A mom and a dad'),
  children:cue('Children who sleep'), holds:cue('promise holds'), breaks:cue('When a promise like'), everyone:cue('everyone in the house'), bigger:cue('bigger picture'),
  justGive:cue("God didn't just"), lives:cue('He lives it'), allThrough:cue('All through the Bible'), everyOne:cue('keeps every one'),
  know:cue('Know therefore'), steadfast:span('steadfast love'), faithfulMeans:cue('Faithful means'), evenWhen:cue('Even when his people'),
  didnt:cue("And his people didn't"), idols:cue('running after idols'), surprising:cue('surprising picture'), wife:cue('like a wife'), brokeHer:cue('broke her promise'),
  hosea:cue('prophet Hosea'), left:cue('His wife left'), goAnd:cue('go and bring'), home:cue('bring her home'),
  christians:cue('Christians have long'), unfaith:cue('Our unfaithfulness'), betroth:cue('I will betroth'), inFaith:span('in faithfulness'), knowLord:end('shall know the LORD'),
  centuries:cue('Centuries later'), deeper:cue('went deeper'), heard:cue('You have heard'), thenSaid:cue('Then he said'), inHeart:cue('in the heart'),
  hands:cue('your hands'), heartHolds:cue('your heart holds'), noneOfUs:cue('none of us'),
  hope:cue('any hope'), woman:cue('brought a woman'), brokenThis:cue('broken this commandment'), without:cue('without sin'), stone:cue('first stone'),
  oneByOne:cue('one by one'), walked:cue('walked away'), spoke:cue('spoke to her'), neither:cue('Neither do I'), noMore:span('sin no more'),
  didntSay:cue("He didn't say"), grace:cue('grace first'), newWay:cue('new way to live'),
  inEnd:cue("That's the seventh"), keepYour:cue('Keep your promises'), keepsHis:cue('God keeps his'), cords2:cue('Two cords',2), held:cue('held together'),
  next:cue('Next time'), eighth:cue('eighth commandment'), missing:cue('goes missing'),
};
AT.last=WORDS[WORDS.length-1][2];

// ---------- vertical layout ----------
// Every vertical sheet is filmed wide (zoom .84 on 960,560), so frame position (fx, fy) maps to fixed sheet coordinates.
// Vertical frame zones: verse cards 170-~520, art 560-1180, captions 1220-1340, lower labels 1380-1560.
const vx=f=>960+(f-540)/.84, vy=f=>560+(f-1010)/.84;
const X=(l,f)=>hv(l,vx(f)), Y=(l,f)=>hv(l,vy(f)), SZ=(l,f)=>hv(l,f/.84);
// A label that slaps on at `at`, centred on (x, y) in sheet coordinates.
const tag=(t,at,x,y,s,size,id,o={})=>piece(t,at,x,y,label(x,y-size*.81,s,Object.assign({size,anchor:'middle'},o)),id,1.3);
const WIDE=[960,560,.84];
// Lower label rows (vertical frame y 1420 and 1520), landscape rows near the bottom of the sheet.
const ROW1=()=>Y(880,1420), ROW2=()=>Y(960,1520), LS=()=>SZ(36,44);
// Ground texture for the tall frame (drawn under the labels; the engine's fore layer would cover them).
function tufts(t,seed,y0,y1,c,n=40){if(!E.VERT)return '';let g='';const r=rng(seed);
  for(let i=0;i<n;i++){const x=-60+r()*2040,y=y0+r()*(y1-y0),h=18+r()*30,sw=Math.sin(t*1.3+i)*4;
    g+=P(`M${(x-8).toFixed(0)} ${y.toFixed(0)}Q${(x-6+sw).toFixed(0)} ${(y-h*.6).toFixed(0)} ${(x-12+sw).toFixed(0)} ${(y-h).toFixed(0)}M${x.toFixed(0)} ${y.toFixed(0)}Q${(x+2+sw).toFixed(0)} ${(y-h*.7).toFixed(0)} ${(x+4+sw).toFixed(0)} ${(y-h*1.2).toFixed(0)}M${(x+8).toFixed(0)} ${y.toFixed(0)}Q${(x+10+sw).toFixed(0)} ${(y-h*.5).toFixed(0)} ${(x+16+sw).toFixed(0)} ${(y-h*.9).toFixed(0)}`,'none',{stroke:c,'stroke-width':4,opacity:.7});}
  return g;}
const strike=(x0,y,x1,p)=>mark(`M${x0} ${y+6}L${x1} ${y-6}`,p,CORAL,9);

// ---------- vertical scenery ----------
// The wide vertical camera shows sheet x 317..1603 and y -642..1643, so the tall frame needs sky above and ground below.
const V=E.VERT, f1=n=>(+n).toFixed(1);
// A four-point twinkle.
const tw4=(x,y,r,c,op)=>P(`M${f1(x)} ${f1(y-r)}L${f1(x+r*.22)} ${f1(y-r*.22)}L${f1(x+r)} ${f1(y)}L${f1(x+r*.22)} ${f1(y+r*.22)}L${f1(x)} ${f1(y+r)}L${f1(x-r*.22)} ${f1(y+r*.22)}L${f1(x-r)} ${f1(y)}L${f1(x-r*.22)} ${f1(y-r*.22)}Z`,c,{opacity:op.toFixed(3)});
function glints(t,seed,n,x0,y0,w,h,c='#FFF6D8',r0=10){const r=rng(seed);let g='';
  for(let i=0;i<n;i++){const x=x0+r()*w,y=y0+r()*h,ph=r()*6.28,sz=r0*(.5+r()),k=Math.max(0,Math.sin(t*1.6+ph));g+=tw4(x,y,sz*(.4+.6*k),c,.2+.75*k);}
  return g;}
// A small house with a lit window.
function hut(x,y,w,c,lit,roof='#2A1E3A'){const h=w*.7;
  return R(x-w/2,y-h,w,h,2,c)+P(`M${f1(x-w*.62)} ${f1(y-h)}L${x} ${f1(y-h-w*.45)}L${f1(x+w*.62)} ${f1(y-h)}Z`,roof)+
    R(x-w*.14,y-h*.62,w*.28,w*.24,1,mix('#3A3550','#FFD86B',lit))+glow(x,y-h*.5,w*.9,'#FFD86B',.35*lit);}
const moon=(x,y,r)=>glow(x,y,r*3,'#FFF4D0',.35)+C(x,y,r,'#FFF4D0')+C(x-r*.3,y-r*.2,r*.18,'#EDE0B8')+C(x+r*.35,y+r*.25,r*.12,'#EDE0B8');
const tree=(x,y,s,c1,c2)=>R(x-12*s,y-150*s,24*s,150*s,6,'#3A2414')+C(x,y-190*s,80*s,c1)+C(x-55*s,y-150*s,55*s,c2)+C(x+55*s,y-150*s,55*s,c1);
// Night valley under the knot: horizon glow, far hills with a lit village, a stream of light, a meadow.
function nightLand(t,lit=1){
  if(!V)return '';
  let g='';
  for(let i=0;i<9;i++)g+=glow(330+i*160,-600+i*75,230,'#8FA8FF',.14)+glow(360+i*160,-640+i*80,120,'#D8C8FF',.08);
  g+=glints(t,3,12,340,-620,1240,700,'#FFFFFF',9)+moon(1340,-380,46);
  g+=glow(960,800,760,'#3A5AA0',.35)+glow(960,795,420,'#FFE2A8',.14);
  g+=`<path d="${ridge(91,800,14,180)}" fill="#1E2C62"/>`;
  [[520,808,44],[600,802,36],[1270,806,40],[1355,812,50],[1440,808,34]].forEach(([x,y,w],k)=>g+=hut(x,y,w,'#34407A',lit*(k%2?1:.8)));
  g+=`<path d="${ridge(92,905,18,240)}" fill="#1A3A5E"/><path d="${ridge(93,1030,16,260)}" fill="#1D4A48"/>`;
  // The stream winds down from the horizon, catching the light.
  g+=P('M950 900Q890 1040 1010 1170Q1130 1320 900 1490Q760 1610 800 1800L1200 1800Q1090 1640 1190 1500Q1340 1320 1150 1160Q990 1040 972 900Z','#2C5A92')+
    P('M961 905Q930 1040 1060 1170Q1210 1330 1000 1500Q900 1620 990 1800','none',{stroke:'#9FD0FF','stroke-width':6,opacity:.35});
  g+=glints(t,7,16,880,920,300,860,'#DFF2FF',12);
  g+=tufts(t,1,1050,1700,'#3A7A6A',50);
  return g;}
const nightFore={grass:['#2E6A62','#1D4A48','#3E8A72'],flowers:['#FFE9A8','#9FD8FF','#FFB0C8'],top:1240};

// ---------- shared pieces ----------
const slab=(w,h)=>`M${-w/2} ${h/2}V${-h/2+w*.32}Q${-w/2} ${-h/2} 0 ${-h/2}Q${w/2} ${-h/2} ${w/2} ${-h/2+w*.32}V${h/2}Z`;
const NUM=['I','II','III','IV','V','VI','VII','VIII','IX','X'];
// One tablet with five carved lines (numerals + illegible carving, never a quotation). lit(i) 0..1 per line.
function tablet(x,y,w,h,first,lit,seed){
  const r=rng(seed);let g=G(`translate(${x} ${y})`,P(slab(w,h),'#7E7A70')+P(slab(w-24,h-24),'#9C988C')+
    P(slab(w-24,h-24),'none',{stroke:'#5E5A52','stroke-width':3,opacity:.5}));
  for(let i=0;i<5;i++){
    const k=first+i,ly=y-h/2+w*.46+i*(h-w*.5)/5.2,x0=x-w/2+92,x1=x+w/2-34-r()*40,on=lit(k);
    let d=`M${x0} ${ly}`;for(let xx=x0;xx<x1;xx+=18)d+=`L${xx+9} ${ly+(r()-.5)*6}L${xx+18} ${ly}`;
    g+=glow((x0+x1)/2,ly,(x1-x0)*.6,'#FFD86B',.35*on);
    g+=T(x-w/2+60,ly+12,NUM[k],{size:34,font:'Georgia',weight:700,anchor:'middle',fill:mix('#4A4740','#FFF4C8',Math.min(1,on))});
    g+=P(d,'none',{stroke:'#4A4740','stroke-width':5,opacity:.8})+P(d,'none',{stroke:'#FFE9A8','stroke-width':3,opacity:(.12+.88*Math.min(1,on)).toFixed(3)});
  }
  return g;
}
const tablets=(cx,cy,s,lit)=>G(`translate(${cx} ${cy}) scale(${s}) translate(${-cx} ${-cy})`,
  glow(cx,cy,560,'#FFD86B',.12)+tablet(cx-205,cy,380,560,0,lit,21)+tablet(cx+205,cy,380,560,5,lit,33));
const seventhLit=(on)=>k=>k===6?on*(1.1+.15*Math.sin(E.t*3)):.25*on;

// Two cords, gold and coral, each ending in a loop that runs through the other: one knot.
// pg/pc draw each cord on (0..1); tight pulls the loops smaller and the ends further out.
function rope(d,p,c){const o={'stroke-linecap':'round','stroke-linejoin':'round'};
  return mark(d,p,'#2A1A0C',30,o)+mark(d,p,c,21,o)+mark(d,p,'#FFF6D0',5,Object.assign({opacity:.55},o));}
function knot(cx,cy,s,pg,pc,tight=0,o={}){
  const k=1-.22*tight,W=320+70*tight,ca=o.c1||GOLD,cb=o.c2||CORAL;
  const gd=`M${-W} 8Q${-W*.55} -34 ${-90*k} ${-8*k}C${-40*k} ${-86*k} ${76*k} ${-76*k} ${64*k} 0C${54*k} ${64*k} ${-44*k} ${64*k} ${-54*k} ${12*k}`;
  const cd=`M${W} -8Q${W*.55} 34 ${90*k} ${8*k}C${40*k} ${86*k} ${-76*k} ${76*k} ${-64*k} 0C${-54*k} ${-64*k} ${44*k} ${-64*k} ${54*k} ${-12*k}`;
  let g=glow(0,0,260,WARM,.35*Math.min(pg,pc)*(1+.4*tight));
  g+=rope(gd,pg,ca)+rope(cd,pc,cb);
  // Gold passes over coral once more, so the loops read as linked.
  if(pg>=1&&pc>=1)g+=rope(`M${18*k} ${-80*k}C${52*k} ${-70*k} ${70*k} ${-40*k} ${64*k} 0`,1,ca);
  return G(`translate(${cx} ${cy}) scale(${s})`,g);
}
// Two linked rings.
function ring(cx,cy,r,c,p=1){
  if(p<=0)return '';
  return C(cx,cy,r,'none',{stroke:'#6A4410','stroke-width':(r*.3).toFixed(1)})+C(cx,cy,r,'none',{stroke:c,'stroke-width':(r*.22).toFixed(1)})+
    P(`M${cx-r*.7} ${cy-r*.7}A${r} ${r} 0 0 1 ${cx+r*.2} ${cy-r*.98}`,'none',{stroke:'#FFF8DC','stroke-width':(r*.06).toFixed(1),opacity:.8});
}
function rings(cx,cy,r,p){
  if(p<=0)return '';
  const d=lerp(r*1.8,r*.62,ease.out(p));
  return G('',glow(cx,cy,r*3,'#FFE2A0',.5*p)+ring(cx-d,cy,r,GOLD)+ring(cx+d,cy,r,'#F2D27A')+
    // the first ring passes over the second at the top crossing
    (p>=1?P(`M${cx-d+r*.94} ${cy-r*.34}A${r} ${r} 0 0 0 ${cx-d+r*.5} ${cy-r*.87}`,'none',{stroke:GOLD,'stroke-width':(r*.22).toFixed(1)}):''),Math.min(1,p*3));
}
// A crowd of small glowing people (modest tunics).
const TUN=[['#3DE0B8','#1787A8'],['#FFC24C','#E0623C'],['#B98CFF','#6A4CD8'],['#FF8FB1','#C8487A'],['#7CD4FF','#2F6FD0']];
const SKIN=[['#F5BE8E','#C4835E'],['#D9965E','#A86A3E'],['#B87444','#8A5230']];
function person(x,y,s,i,o={}){const [a,b]=TUN[i%5],[sk,sh]=SKIN[i%3];
  return E.chubby(x,y,s,Object.assign({tunic:a,tunic2:b,skin:sk,shade:sh,hair:['#2E1C52','#4A2A16','#1A1A2A'][i%3],aura:'#7CFFE6',auraOp:.35,phase:i*.7},o));}
function crowd(t,x0,y,n,gap,s,o={}){
  let g='';
  for(let i=0;i<n;i++)g+=person(x0+i*gap+(i%2)*10,y+(i%3)*14,s*(.92+.16*hash(i,4)),i,{f:i%2===1,flip:o.flip||1,aura:o.aura||'#7CFFE6',auraOp:o.auraOp??.35,reach:o.reach||0});
  return g;
}
// Small cut-out on torn paper with a label underneath.
function cutout(t,at,cx,cy,inner,name,id,o={}){
  const w=o.w||240,h=o.h||220;
  return piece(t,at,cx,cy,strip(cx-w/2,cy-h/2,w,h,id*7,o.paper||'#F6EFDC')+tape(cx,cy-h/2+4,90,-4)+inner+
    label(cx,cy+h/2+14,name,{size:hv(26,32),anchor:'middle'}),id,1.4);
}
// Gold-foil fill for idols (hard shine, no glow of its own).
let foilN=0;
const foil=(t)=>{const id='foil'+(foilN++),sh=.5+.5*Math.sin(t*1.7);
  return [`url(#${id})`,`<linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF1B0"/><stop offset="${(.3+.2*sh).toFixed(2)}" stop-color="${GOLD}"/><stop offset="1" stop-color="#8A5A12"/></linearGradient>`];};
function idol(t,cx,cy,s,kind){
  const [F,def]=foil(t);
  let g=def+R(-50,40,100,18,3,'#5A4A3A');
  if(kind===0)g+=P('M-30 40L-22 -40Q0 -70 22 -40L30 40Z',F,{stroke:'#FFF6D0','stroke-width':3})+C(0,-62,22,F,{stroke:'#FFF6D0','stroke-width':3});
  else if(kind===1)g+=P('M-36 40L-36 -10L0 -60L36 -10L36 40Z',F,{stroke:'#FFF6D0','stroke-width':3})+C(0,-6,12,'#8A5A12');
  else g+=P('M-40 40Q-46 -6 -20 -14Q10 -20 26 -40Q44 -54 52 -30Q56 -6 40 6Q30 14 30 40Z',F,{stroke:'#FFF6D0','stroke-width':3})+P('M30 -44L38 -64L44 -42Z','#FFF1B0');
  return G(`translate(${cx} ${cy}) scale(${s})`,g);
}
// A simple paper house; lit 0..1 lights the windows.
function house(cx,by,s,lit){
  const win=(x,y)=>R(x,y,70,70,4,mix('#2A2A40','#FFD86B',lit))+L(x+35,y,x+35,y+70,'#6A4A2A',5)+L(x,y+35,x+70,y+35,'#6A4A2A',5)+glow(x+35,y+35,90,'#FFD86B',.45*lit);
  const g=R(150,-430,50,110,3,'#7A3A2A')+R(-220,-300,440,300,6,'#E9D7B0',{stroke:'#B89A6A','stroke-width':4})+
    P('M-260 -290L0 -480L260 -290Z','#B0503A',{stroke:'#7A3020','stroke-width':5})+
    win(-170,-230)+win(100,-230)+R(-45,-170,90,170,8,'#7A4A2A')+C(25,-85,7,'#FFD86B');
  return G(`translate(${cx} ${by}) scale(${s})`,g);
}
// An open hand, palm up, as a mitten shape (flip mirrors it).
function hand(cx,cy,s,flip,c){const st={stroke:'#A86A3E','stroke-width':4};
  let g='';for(let i=0;i<4;i++)g+=R(-52+i*27,-118+Math.abs(i-1.5)*10,25,90,12,c,st);
  g+=`<g transform="rotate(-38 -58 -10)">`+R(-90,-24,30,74,14,c,st)+`</g>`+R(-60,-50,112,100,40,c,st)+R(-40,40,74,40,10,c,st);
  return G(`translate(${cx} ${cy}) scale(${s*flip} ${s})`,g);}
// A paper heart.
const heartPath=(cx,cy,r)=>`M${cx} ${cy+r*.9}C${cx-r*1.5} ${cy-r*.1} ${cx-r*.9} ${cy-r*1.2} ${cx} ${cy-r*.45}C${cx+r*.9} ${cy-r*1.2} ${cx+r*1.5} ${cy-r*.1} ${cx} ${cy+r*.9}Z`;

// ---------- 0. Cold open: two cords, one knot ----------
function coldOpen(t){
  let g=stars(t,.4,600)+fireflies(t,0,-600,1920,2300,WARM,16,.4);
  g+=V?nightLand(t,ease.out(prog(t,AT.picture,AT.picture+1.5))):`<path d="${ridge(5,960,12,260)}" fill="#0E1838"/>`;
  // The tablets, small at the top, line VII lit (vertical: leave before the verse card).
  const tb=ease.out(prog(t,AT.seventh-.3,AT.seventh+.6));
  if(tb>0)g+=fade(t,hv(AT.means-.3,AT.v2014-.3),G('',G(`translate(960 ${Y(200,360)}) scale(${hv(.42,.62)}) translate(-960 -560)`,tablets(960,560,1,seventhLit(1))),tb));
  // The knot: gold from the left, coral from the right, then pulled tight.
  const kx=960,ky=Y(560,800),ks=hv(1,1.5);
  const pg=ease.inOut(prog(t,0,AT.cords+1.6)),pc=ease.inOut(prog(t,.4,AT.cords+2)),tight=ease.inOut(prog(t,AT.tighter-.2,AT.tighter+.8));
  g+=knot(kx,ky,ks,pg,pc,tight);
  g+=rings(960,Y(800,1090),hv(54,80),prog(t,AT.picture,AT.picture+.8));
  g+=fade(t,AT.lot-.2,tag(t,AT.seventh,960,ROW1(),'THE SEVENTH COMMANDMENT',LS(),1)+
    tag(t,AT.means,960,ROW2(),'A BROKEN MARRIAGE PROMISE',LS(),2,{bg:CORAL}));
  const ry=ROW1();
  g+=fade(t,AT.understand-.4,tag(t,AT.lot,960,ry,'ONLY A RULE FOR GROWN-UPS?',SZ(34,40),3)+
    strike(960-hv(270,330),ry,960+hv(270,330),ease.inOut(prog(t,AT.faithfulness-.2,AT.faithfulness+.3)))+
    tag(t,AT.faithfulness,960,ROW2(),"IT'S ABOUT FAITHFULNESS",LS(),4,{bg:CORAL}));
  g+=verse(t,AT.v2014-.15,520,40,['You shall not commit adultery.'],'EXODUS 20:14 ESV',{size:56,seed:5,id:5});
  g+=fade(t,AT.understand-.4,tag(t,AT.withGod,960,Y(140,420),'IT STARTS WITH GOD',SZ(40,46),6));
  return g;
}

// ---------- 1. The garden: hold fast ----------
function garden(t,lt){
  let g=glow(960,hv(120,vy(420)),hv(500,620),'#FFE9A8',.6);
  g+=`<path d="${ridge(21,hv(760,vy(1100)),16,240)}" fill="#2E8A4E"/><path d="${ridge(22,hv(840,vy(1170)),10,180)}" fill="#1F6A3A"/>`+tufts(t,2,vy(1200),vy(1900),'#3BBF7A',60);
  // A tree behind them.
  const tx=X(1500,860),ty=Y(760,1110);
  g+=R(tx-26,ty-340,52,340,10,'#6A3E22')+C(tx,ty-400,170,'#2FA060')+C(tx-110,ty-330,110,'#3BBF7A')+C(tx+110,ty-330,110,'#26904E');
  for(let i=0;i<5;i++)g+=C(tx-120+i*60,ty-380+(i%2)*80,14,'#FF7A5C');
  // The man and the woman, modestly clothed, a little apart; their hands meet at "hold fast".
  const s=hv(1.25,1.5),gap=77.6*s*2+24,cx=960,fy=Y(860,1170);
  const meet=ease.inOut(prog(t,AT.holdV[0]-.6,AT.holdV[0]+.4)),reach=.4*meet,dx=lerp(hv(80,40),0,meet);

function heartSheet(t,lt){

    for(let x=-30;x<1960;x+=44)g+=R(x,-190,24,22,1,'#A69C88');

      g+=R(x-46,-150,92,880,3,'#D6CEBC',{stroke:'#9C9482','stroke-width':3})+L(x-18,-110,x-18,700,'#B2AA98',4)+L(x+18,-110,x+18,700,'#B2AA98',4)+

    [760,1160].forEach((x,k)=>{const sw=Math.sin(t*1.1+k)*3;g+=L(x,-150,x+sw,-40,'#5A4A3A',3)+Ell(x+sw,-28,26,14,'#8A5A2A')+P(`M${f1(x+sw-6)} -40Q${f1(x+sw)} -64 ${f1(x+sw+6)} -40Z`,'#FFC24C')+glow(x+sw,-46,70,'#FFD86B',.5);});
  }else{g+=glow(960,400,900,'#C8C0B0',.3);
    for(let i=0;i<5;i++){const x=160+i*400;g+=R(x-40,80,80,640,4,'#8A8478',{opacity:.8})+R(x-60,60,120,30,3,'#9C968A');}}
  g+=R(-100,hv(760,vy(1120)),2120,hv(400,1100),0,'#6E6A62');
  for(let i=0;i<12;i++)g+=L(-100+i*190,hv(760,vy(1120)),-300+i*230,hv(1100,vy(1780)),'#5E5A52',4);
  if(V){const [fl,fld]=E.vgrad('#8C867A','#5A564E');g+=fld+R(-100,726,2120,1100,0,fl,{opacity:.85})+R(-100,726,2120,40,0,'#4E4A44',{opacity:.35});
    const rows=[];for(let k=0;k<9;k++)rows.push(760+k*k*12+k*40);

      g+=P(`M${f1(lerp(xa,xb,ka))} ${y}L${f1(lerp(xa+190,xb+230,ka))} ${y}L${f1(lerp(xa+190,xb+230,kb))} ${y1}L${f1(lerp(xa,xb,kb))} ${y1}Z`,'#A49E90',{opacity:.35});}
      g+=L(-100,y,2020,y,'#4E4A44',4);});

  const fy=Y(820,1160),cx=960,s=hv(1,1.15);
