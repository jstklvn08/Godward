// ---------- scenery ----------
const f1=n=>(+n).toFixed(1);
const gnd=(s,y,c1,c2)=>`<path d="${ridge(s,y,10,230)}" fill="${c1}"/><path d="${ridge(s+1,y+120,8,200)}" fill="${c2}"/>`;
const FG=(a,b,c,fl=[])=>({grass:[a,b,c],flowers:fl});
const moon=(x,y,r)=>glow(x,y,r*3,'#FFF4D0',.35)+C(x,y,r,'#FFF4D0')+C(x-r*.3,y-r*.2,r*.18,'#EDE0B8')+C(x+r*.35,y+r*.25,r*.12,'#EDE0B8');
const tw4=(x,y,r,c,op)=>P(`M${f1(x)} ${f1(y-r)}L${f1(x+r*.22)} ${f1(y-r*.22)}L${f1(x+r)} ${f1(y)}L${f1(x+r*.22)} ${f1(y+r*.22)}L${f1(x)} ${f1(y+r)}L${f1(x-r*.22)} ${f1(y+r*.22)}L${f1(x-r)} ${f1(y)}L${f1(x-r*.22)} ${f1(y-r*.22)}Z`,c,{opacity:op.toFixed(3)});
function glints(t,seed,n,x0,y0,w,h,c='#FFF6D8',r0=10){const r=rng(seed);let g='';
  for(let i=0;i<n;i++){const x=x0+r()*w,y=y0+r()*h,ph=r()*6.28,sz=r0*(.5+r()),k=Math.max(0,Math.sin(t*1.6+ph));g+=tw4(x,y,sz*(.4+.6*k),c,.2+.75*k);}
  return g;}
const clouds=(t,y0,n,c='#FFFFFF',op=.6,sp=6)=>{let g='';for(let i=0;i<n;i++){const x=300+((i*310+t*sp)%1400),y=y0+i*80;g+=Ell(x,y,170-i*10,24,c,{opacity:op})+Ell(x+60,y-16,90,20,c,{opacity:op*.9});}return g;};
const birds=(t,x0,y0,n,c='#4A3A3A')=>{let g='';for(let i=0;i<n;i++){const x=x0+i*60+Math.sin(t*.8+i)*18,y=y0+(i%2)*36,w=E.held(t,8)*6+i;g+=P(`M${f1(x-16)} ${f1(y-6*Math.sin(w))}Q${f1(x-7)} ${y-9} ${f1(x)} ${y}Q${f1(x+7)} ${y-9} ${f1(x+16)} ${f1(y-6*Math.sin(w))}`,'none',{stroke:c,'stroke-width':4});}return g;};
const tree=(x,y,s,c1,c2,fruit)=>{let g=R(x-14*s,y-170*s,28*s,170*s,6,'#5A3A22')+C(x,y-220*s,95*s,c1)+C(x-70*s,y-170*s,64*s,c2)+C(x+70*s,y-170*s,64*s,c1);
  if(fruit)for(let i=0;i<6;i++)g+=C(x-80*s+i*32*s,y-(200+(i%2)*50)*s,10*s,fruit);return g;};

    P('M-260 -290L0 -480L260 -290Z',o.roof||'#B0503A',{stroke:'#7A3020','stroke-width':5})+
    win(-170,-230)+win(100,-230)+R(-45,-170,90,170,8,o.open?mix('#7A4A2A','#FFD86B',o.open):'#7A4A2A')+C(25,-85,7,'#FFD86B')+(o.open?glow(0,-80,120,'#FFD86B',.5*o.open):'');

}

const lamp=(t,x,y,k=1)=>L(x,-700,x,y-30,'#2A1A10',4)+glow(x,y,420,'#FFD27A',.45*k)+P(`M${x-34} ${y-30}L${x+34} ${y-30}L${x+24} ${y+16}L${x-24} ${y+16}Z`,'#8A5A2A')+C(x,y+4,14,'#FFF2C0',{opacity:.6+.2*Math.sin(t*9)});

  L(x,y-h/2,x,y+h/2,'#4A2A18',8)+L(x-w/2,y,x+w/2,y,'#4A2A18',8);

const bigLantern=(h,s=2.4,k=1)=>G(`translate(${h[0]} ${h[1]}) scale(${s}) translate(${-h[0]} ${-h[1]})`,lanternAt(h,k));
const lanternAt=(h,k=1)=>{const [x,y]=h;return L(x,y,x,y+20,'#3A2A1A',3)+glow(x,y+44,110,'#FFD27A',.6*k)+R(x-16,y+20,32,44,6,'#8A5A2A')+R(x-10,y+26,20,32,4,'#FFE9A8',{opacity:.9})+P(`M${x-18} ${y+20}L${x} ${y+10}L${x+18} ${y+20}Z`,'#5A3A1A');};
const stoneR=(x,y,r=16)=>Ell(x,y,r*1.15,r*.85,'#9C968A',{stroke:'#5E5A52','stroke-width':3})+Ell(x-r*.3,y-r*.3,r*.4,r*.2,'#C8C2B4',{opacity:.7});
const presence=(t,x,y,r,k=1)=>k<=0?'':glow(x,y,r*2.6,'#FFF6DA',.5*k)+glow(x,y,r*1.2,'#FFFFFF',.65*k)+
  Ell(x,y,r*.74,r,'none',{stroke:'#FFFBEA','stroke-width':8,opacity:(.75*k).toFixed(2)})+Ell(x,y,r*.6,r*.82,'#FFFBEA',{opacity:(.22*k*(1+.25*Math.sin(t*2))).toFixed(2)});
// Rings of light going out from a point, started at time a.
const lightRings=(t,a,x,y,R0=1300,n=4)=>{const sp=prog(t,a,a+2.2);if(sp<=0||sp>=1)return '';let g=glow(x,y,200+sp*700,'#FFFBEA',.6*(1-sp));
  for(let k=0;k<n;k++){const p=clamp(sp*1.6-k*.18);if(p>0&&p<1)g+=C(x,y,60+p*R0,'none',{stroke:'#FFF6DA','stroke-width':12*(1-p)+2,opacity:(1-p).toFixed(2)});}return g;};
const heartP=(x,y,r)=>`M${x} ${y+r*.9}C${x-r*1.7} ${y-r*.1} ${x-r*.95} ${y-r*1.35} ${x} ${y-r*.42}C${x+r*.95} ${y-r*1.35} ${x+r*1.7} ${y-r*.1} ${x} ${y+r*.9}Z`;
const heart=(x,y,r,k=1)=>glow(x,y,r*2.2,'#FF7A6A',.5*k)+P(heartP(x,y,r),'#FF4A5C',{stroke:'#FFD0C8','stroke-width':Math.max(2,r*.08)})+P(heartP(x-r*.2,y-r*.15,r*.45),'#FF8A96',{opacity:.6});
const smudge=(x,y,r,k)=>k<=0?'':Ell(x+r*.3,y+r*.1,r*.36*k,r*.26*k,'#3A2A34',{opacity:.8})+Ell(x+r*.1,y+r*.35,r*.2*k,r*.15*k,'#3A2A34',{opacity:.6});
// Words of light written in the dust (Jesus himself is never shown).
function dustWords(t,x,y,p,w=420){if(p<=0)return '';let d='';const n=6;
  for(let i=0;i<n;i++){const x0=x-w/2+i*w/n,y0=y+(i%2)*26;d+=`M${x0} ${y0}q${w/n*.2} -20 ${w/n*.4} 0t${w/n*.4} 0`;}
  return glow(x,y+10,w*.7,WARM,.35*p)+mark(d,p,'#FFF6DA',7,{'stroke-linecap':'round'})+mark(d,p,WARM,3,{'stroke-linecap':'round'});}
// The pillar of fire: a tall column of light standing on the tabernacle, flames at its foot.
function pillar(t,x,yb,k=1){let g=glow(x,yb-500,520,'#FF9A3C',.35*k);
  for(let i=0;i<7;i++)g+=glow(x+Math.sin(t*1.3+i)*14,yb-120-i*170,190-i*8,i%2?'#FFB04C':'#FFD27A',.42*k);
  g+=P(`M${x-70} ${yb}C${x-110} ${yb-500} ${x-70} ${yb-1000} ${x-120} -700L${x+120} -700C${x+70} ${yb-1000} ${x+110} ${yb-500} ${x+70} ${yb}Z`,'#FFC060',{opacity:(.35*k).toFixed(2)});
  g+=P(`M${x-26} ${yb}C${x-40} ${yb-500} ${x-20} ${yb-1000} ${x-40} -700L${x+40} -700C${x+20} ${yb-1000} ${x+40} ${yb-500} ${x+26} ${yb}Z`,'#FFF2C0',{opacity:(.5*k).toFixed(2)});
  return g+FX.flames(t,[[x-80,yb],[x,yb-24],[x+80,yb]],{H:220*k,sp:10,seed:3});}

// ---------- the promise pictures: cords, knot, rings, tablets ----------
function rope(d,p,c){const o={'stroke-linecap':'round','stroke-linejoin':'round'};
  return mark(d,p,'#2A1A0C',30,o)+mark(d,p,c,21,o)+mark(d,p,'#FFF6D0',5,Object.assign({opacity:.55},o));}
// Two cords, gold and coral, each ending in a loop that runs through the other: one knot. tight pulls it smaller.
function knot(cx,cy,s,pg,pc,tight=0,o={}){
  const k=1-.22*tight,W=320+70*tight,ca=o.c1||GOLD,cb=o.c2||CORAL;
  const gd=`M${-W} 8Q${-W*.55} -34 ${-90*k} ${-8*k}C${-40*k} ${-86*k} ${76*k} ${-76*k} ${64*k} 0C${54*k} ${64*k} ${-44*k} ${64*k} ${-54*k} ${12*k}`;
  const cd=`M${W} -8Q${W*.55} 34 ${90*k} ${8*k}C${40*k} ${86*k} ${-76*k} ${76*k} ${-64*k} 0C${-54*k} ${-64*k} ${44*k} ${-64*k} ${54*k} ${-12*k}`;
  let g=glow(0,0,260,WARM,.35*Math.min(pg,pc)*(1+.4*tight));
  g+=rope(gd,pg,ca)+(pc>0?rope(cd,pc,cb):'');
  if(pg>=1&&pc>=1)g+=rope(`M${18*k} ${-80*k}C${52*k} ${-70*k} ${70*k} ${-40*k} ${64*k} 0`,1,ca);
  return G(`translate(${cx} ${cy}) scale(${s})`,g);
}
const knotEnds=(cx,cy,s,tight=0)=>{const W=320+70*tight;return [[cx-W*s,cy+8*s],[cx+W*s,cy-8*s]];};
function ring(cx,cy,r,c){
  return C(cx,cy,r,'none',{stroke:'#6A4410','stroke-width':(r*.3).toFixed(1)})+C(cx,cy,r,'none',{stroke:c,'stroke-width':(r*.22).toFixed(1)})+
    P(`M${cx-r*.7} ${cy-r*.7}A${r} ${r} 0 0 1 ${cx+r*.2} ${cy-r*.98}`,'none',{stroke:'#FFF8DC','stroke-width':(r*.06).toFixed(1),opacity:.8});}
// Two wedding rings sliding together (p 0..1).
function wrings(cx,cy,r,p){
  if(p<=0)return '';
  const d=lerp(r*1.8,r*.62,ease.out(p));
  return G('',glow(cx,cy,r*3,'#FFE2A0',.5*p)+ring(cx-d,cy,r,GOLD)+ring(cx+d,cy,r,'#F2D27A')+
    (p>=1?P(`M${cx-d+r*.94} ${cy-r*.34}A${r} ${r} 0 0 0 ${cx-d+r*.5} ${cy-r*.87}`,'none',{stroke:GOLD,'stroke-width':(r*.22).toFixed(1)}):''),Math.min(1,p*3));}
const slab=(w,h)=>`M${-w/2} ${h/2}V${-h/2+w*.32}Q${-w/2} ${-h/2} 0 ${-h/2}Q${w/2} ${-h/2} ${w/2} ${-h/2+w*.32}V${h/2}Z`;
const NUM=['I','II','III','IV','V','VI','VII','VIII','IX','X'];
function tablet(x,y,w,h,first,lit,seed){
  const r=rng(seed);let g=G(`translate(${x} ${y})`,P(slab(w,h),'#7E7A70')+P(slab(w-24,h-24),'#9C988C')+P(slab(w-24,h-24),'none',{stroke:'#5E5A52','stroke-width':3,opacity:.5}));
  for(let i=0;i<5;i++){
    const k=first+i,ly=y-h/2+w*.46+i*(h-w*.5)/5.2,x0=x-w/2+92,x1=x+w/2-34-r()*40,on=Math.min(1.4,lit(k));
    let d=`M${x0} ${ly}`;for(let xx=x0;xx<x1;xx+=18)d+=`L${xx+9} ${ly+(r()-.5)*6}L${xx+18} ${ly}`;
