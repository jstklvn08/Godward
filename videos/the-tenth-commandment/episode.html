<script>
// The Ten Commandments, part 10 (series finale): the tenth commandment. Script: scripts/11-the-tenth-commandment.md (ESV fill).
// Every time below comes from the spoken words (words.js), so a new narration re-times the episode.
// Guide: .claude/skills/godward-episode/reference/engine.md. K.E is the ellipse helper (Ell), window.E the engine.
const {G,R,C,L,P,T,prog,ease,lerp,mix,clamp,rng}=K, Ell=K.E;
const {hash,piece,glow,label,mark,scribble,arrow,strip,tape,torn}=S;
const {cue,end,span,shot,ridge,fade,hv,stars,fireflies,INK,YEL,CORAL}=E;
const GOLD='#E8B53A', NEON='#2BF0FF', GREEN='#1E9A5A';

const AT={
  nine:cue('Nine of the'), lastOne:cue('The last one'), want:cue('what you want'), muscle:cue('without moving'), know:cue('nobody would know'), why:cue('So why would'),
  fromFire:cue('From the fire'), v17:cue('You shall not covet your'), house:cue("neighbor's house"), wife:cue("neighbor's wife"), servant:cue('male servant'),
  ox:cue('his ox'), donkey:cue('his donkey'), anything:cue('anything that'), liking:cue('more than liking'), wanting:cue('It is wanting'), yourself:cue('for yourself'),
  strange:cue("Here's the strange"), judge:cue('No judge'), witness:cue('witness to a wish'), evidence:cue('no evidence'), readers:cue('Many readers'),
  inHeart:cue('entirely in the heart'), hands:cue('just about hands'), hearts:cue('always about hearts'),
  firstSin:cue("And it's where"), notHand:cue('Not with a hand'), look:cue('with a look'), gen:cue('So when the woman'), saw:cue('woman saw'),
  delight:cue('a delight'), desired:cue('to be desired'), tookFruit:cue('she took of'), ate:cue('and ate'),
  sawIt:cue('She saw it'), wantedIt:cue('she wanted it'), tookIt:cue('then she took it'), seed:cue('is the seed'), grows:cue('what grows'),
  centuries:cue('Centuries later'), ahab:cue('King Ahab'), naboth:cue('his neighbour Naboth'), ahabWanted:cue('and Ahab wanted'), sell:cue("wouldn't sell"),
  sulked:cue('sulked'), wifeArr:cue('His wife arranged'), falseW:cue('false witnesses'), death:cue('put to death'), tookV:cue('took the vineyard'),
  fw2:cue('False witness'), murder:cue('murder and'), stealing:cue('stealing'), startedW:cue('started with wanting'),
  undid:cue('undid a Pharisee'), paul:cue('The apostle Paul'), blameless:cue('blameless'), pastHands:cue('straight past'), rom:cue('For I would not'),
  covetR:cue('what it is to covet'), mirror:cue('like a mirror'), notGood:cue("doesn't make us good"), help:cue('we need help'),
  cure:cue("So what's the cure"), content1:cue('is contentment'), prison:cue('from prison'), phil:cue('I have learned'), heb:cue('And Hebrews'),
  keep:cue('Keep your life'), never:span('I will never leave you'), grasping:cue('stop grasping'), held:cue('already held'),
  endSeries:cue('And here is the end'), longRead:cue('Christians have long'), loveGod:cue('love for God'), loveN:cue('love for our neighbour'),
  r139:cue('For the commandments'), loveAs:span('You shall love your neighbor as yourself'), r1310:cue('Love does no wrong'), fulfilling:span('the fulfilling of the law'),
  oneWord:cue('one word underneath'), rescuedYou:cue('who rescued you'), wholeHeart:cue('your whole heart'),
};
AT.last=WORDS[WORDS.length-1][2];

// ---------- shared pieces (as in part 1) ----------
const slab=(w,h)=>`M${-w/2} ${h/2}V${-h/2+w*.32}Q${-w/2} ${-h/2} 0 ${-h/2}Q${w/2} ${-h/2} ${w/2} ${-h/2+w*.32}V${h/2}Z`;
const NUM=['I','II','III','IV','V','VI','VII','VIII','IX','X'];
// One tablet with five carved lines (numerals + illegible carving, never a quotation). lit(i) 0..1 per line, col(i) glow colour.
function tablet(x,y,w,h,first,lit,seed,col){
  const r=rng(seed);let g=G(`translate(${x} ${y})`,P(slab(w,h),'#7E7A70')+P(slab(w-24,h-24),'#9C988C')+
    P(slab(w-24,h-24),'none',{stroke:'#5E5A52','stroke-width':3,opacity:.5}));
  for(let i=0;i<5;i++){
    const k=first+i,ly=y-h/2+w*.46+i*(h-w*.5)/5.2,x0=x-w/2+92,x1=x+w/2-34-r()*40,on=clamp(lit(k),0,1.4),c=col?col(k):'#FFD86B';
    let d=`M${x0} ${ly}`;for(let xx=x0;xx<x1;xx+=18)d+=`L${xx+9} ${ly+(r()-.5)*6}L${xx+18} ${ly}`;
    g+=glow((x0+x1)/2,ly,(x1-x0)*.6,c,.35*on);
    g+=T(x-w/2+60,ly+12,NUM[k],{size:34,font:'Georgia',weight:700,anchor:'middle',fill:mix('#4A4740','#FFF4C8',Math.min(1,on))});
    g+=P(d,'none',{stroke:'#4A4740','stroke-width':5,opacity:.8})+P(d,'none',{stroke:'#FFE9A8','stroke-width':3,opacity:(.12+.88*Math.min(1,on)).toFixed(3)});
  }
  return g;
}
const tablets=(cx,cy,s,lit,col)=>G(`translate(${cx} ${cy}) scale(${s}) translate(${-cx} ${-cy})`,
  glow(cx,cy,560,'#FFD86B',.12)+tablet(cx-205,cy,380,560,0,lit,21,col)+tablet(cx+205,cy,380,560,5,lit,33,col));
// Line k's carved row centre in tablet coordinates (tablets centred on 960,560, scale 1).
const lineY=i=>560-280+380*.46+i*(560-190)/5.2;
const strike=(x0,y,x1,p)=>mark(`M${x0} ${y+6}L${x1} ${y-6}`,p,CORAL,9);
function mountain(seed,px,py,fill,steep){
  const r=rng(seed*91+7),pts=[];
  for(let x=-140;x<=2060;x+=22){const d=Math.abs(x-px)/(900*steep);pts.push([x,py+Math.pow(d,1.25)*560+(r()-.5)*16]);}
  return P('M'+pts.map(p=>p[0].toFixed(0)+' '+Math.min(p[1],1800).toFixed(0)).join('L')+'L2060 1800L-140 1800Z',fill);
}
let foilN=0;
const foil=(t)=>{const id='foil'+(foilN++),sh=.5+.5*Math.sin(t*1.7);
  return [`url(#${id})`,`<linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF1B0"/><stop offset="${(.3+.2*sh).toFixed(2)}" stop-color="${GOLD}"/><stop offset="1" stop-color="#8A5A12"/></linearGradient>`];};
const TUN=[['#3DE0B8','#1787A8'],['#FFC24C','#E0623C'],['#B98CFF','#6A4CD8'],['#FF8FB1','#C8487A'],['#7CD4FF','#2F6FD0']];
const SKIN=[['#F5BE8E','#C4835E'],['#D9965E','#A86A3E'],['#B87444','#8A5230']];
// One glowing person (modest tunic). k picks colours.
const person=(x,y,s,k,o={})=>E.chubby(x,y,s,Object.assign({tunic:TUN[k%5][0],tunic2:TUN[k%5][1],skin:SKIN[k%3][0],shade:SKIN[k%3][1],hair:['#2E1C52','#4A2A16','#1A1A2A'][k%3],aura:'#7CFFE6',auraOp:.35,phase:k*.7},o));
function crowd(t,x0,y,n,gap,s,o={}){
  let g='';
  for(let i=0;i<n;i++)g+=person(x0+i*gap+(i%2)*10,y+(i%3)*14,s*(.92+.16*hash(i,4)),i+(o.k||0),{f:i%2===1,flip:o.flip||1,aura:o.aura||'#7CFFE6',auraOp:o.auraOp??.35,reach:o.reach||0});
  return g;
}
function cutout(t,at,cx,cy,inner,name,id,o={}){
  const w=o.w||250,h=o.h||250;
  return piece(t,at,cx,cy,strip(cx-w/2,cy-h/2,w,h,id*7,o.paper||'#F6EFDC')+tape(cx,cy-h/2+4,90,-4)+inner+
    label(cx,cy+h/2+14,name,{size:o.ls||hv(26,34),anchor:'middle'}),id,1.4);
}

// ---------- vertical layout ----------
// Every vertical sheet is filmed wide (zoom .84 on 960,560), so frame position (fx, fy) maps to fixed sheet coordinates.
// Vertical frame zones: verse cards 170-~560, art 560-1180, captions 1220-1340, lower labels 1380-1560.
const vx=f=>960+(f-540)/.84, vy=f=>560+(f-1010)/.84;
const X=(l,f)=>hv(l,vx(f)), Y=(l,f)=>hv(l,vy(f)), SZ=(l,f)=>hv(l,f/.84);
const tag=(t,at,x,y,s,size,id,o={})=>piece(t,at,x,y,label(x,y-size*.81,s,Object.assign({size,anchor:'middle'},o)),id,1.3);
const WIDE=[960,560,.84];
const LO1=1410, LO2=1535;   // lower label rows (frame y), clear of each other and of the captions
// Frame coordinates (1080x1920) -> sheet coordinates of the wide vertical shot. Lower-band scenery is drawn in frame coords.
const FR=inner=>G(E.VERT?`translate(960 560) scale(${(1/.84).toFixed(5)}) translate(-540 -1010)`:'translate(960 0) scale(.5625) translate(-540 0)',inner);
const VB=f=>E.VERT?FR(f):'';   // lower-band scenery exists only in the vertical cut
const fr=(seed,base,amp,wave,col,o={})=>`<path d="${S.ridge(seed,base,amp,wave,-80,1160,2000)}" fill="${col}"${o.op?` opacity="${o.op}"`:''}/>`;

// ---------- verse cards ----------
// Landscape: the engine's card. Vertical: the same torn card, stacked from y 170 and wrapped to 880 px, but drawn
// here (through hud) with a gentle 4% slap-on, so a full-width card never pokes past the frame edges as it lands.
const VVQ=[];
function verse(t,at,x,y,lines,ref,o={}){
  if(!E.VERT)return E.verse(t,at,x,y,lines,ref,o);
  const e=o.end!=null?o.end:E.verseEnd(at,lines);
  if(!VVQ.some(v=>v.at===at&&v.ref===ref))VVQ.push({at,end:e,lines,ref,o});
  return '';
}
function verseHud(t){
  if(!E.VERT){VVQ.length=0;return '';}
  let g='',y=E.VTOP;
  VVQ.filter(v=>t>=v.at&&t<v.end+.5).sort((a,b)=>a.at-b.at).forEach(v=>{
    const size=Math.min(54,Math.max(44,v.o.size||46)),lines=E.wrapVerse(v.lines,size,880,v.o.hl);
    const w=Math.max(...lines.map(s=>S.tw(s,size)))+100,h=lines.length*size*1.32+size*.9,x=(1080-w)/2,out=prog(t,v.end,v.end+.5);
    let c=strip(x,y,w,h,v.o.seed||7,'#F6EFDC',{ax:12,ay:4});
    if(v.o.hl){const li=lines.findIndex(s=>s.includes(v.o.hl));if(li>=0){const pre=lines[li].slice(0,lines[li].indexOf(v.o.hl)),ha=v.o.hlAt!=null?v.o.hlAt:v.at+.6;
      c+=S.highlight(x+50+S.tw(pre,size),y+size*.45+li*size*1.32,S.tw(v.o.hl,size),size*1.12,ease.inOut(prog(t,ha,ha+(v.o.hlDur||.5))),YEL);}}
    lines.forEach((s,i)=>c+=T(x+50,y+size*1.25+i*size*1.32,s,{size,font:'Georgia',fill:INK}));
    c+=tape(x+w-40,y+2,120,8)+label(x+30,y+h+10,v.ref,{size:26});
    const cx=x+w/2,cy=y+h/2,p=prog(t,v.at,v.at+.17),sc=p>=1?1:1.045-Math.floor(p*3)*.015;
    g+=G(`translate(0 ${(-50*ease.inOut(out)).toFixed(1)})`,`<g transform="${S.jit(t,v.o.id||1,cx,cy,1.2)} translate(${cx} ${cy}) scale(${sc}) translate(${-cx} ${-cy})">${c}</g>`,(1-out).toFixed(3));
    y+=h+70;
  });
  VVQ.length=0;   // re-filled by the sheets drawn for the next frame
  return g;
}

// ---------- lower-band scenery (frame coordinates) ----------
// Tiled floor in perspective, lit by an optional pool of light.
function floor(y0,y1,c1,c2,line,o={}){
  let g=R(-60,y0,1200,y1-y0,0,c1);
  const vx=o.vx||540,vy=y0-420;
  for(let i=0,y=y0;y<y1;i++){const nh=24+i*i*7;if(i%2)g+=R(-60,y,1200,nh,0,c2,{opacity:.55});y+=nh;g+=L(-60,y,1140,y,line,3);}
  for(let k=-8;k<=8;k++){const xb=vx+k*150,yb=y1+40;g+=L(xb,y0,vx+(xb-vx)*(yb-vy)/(y0-vy),yb,line,3,{opacity:.8});}
  if(o.pool)g+=Ell(o.pool[0],o.pool[1],o.pool[2],o.pool[2]*.28,o.pool[3]||'#FFE9A8',{opacity:o.pool[4]||.18});
  return g;
}
// Onlookers seen from behind (no faces): shoulders and the backs of heads, breathing a little.
function backs(t,y,n,seed,o={}){
  const r=rng(seed),cols=o.cols||['#5A3F6E','#3E5A7A','#7A4E3A','#3F6A5A'],hair=['#1A1220','#2E1C14','#3A2A1A'],cloth=['#C9A46A','#9A6AB8','#6AA8C9'],rim=o.rim||'#FFD86B';let g='';
  for(let i=0;i<n;i++){
    const x=-40+(i+.5)*(1160/n)+(r()-.5)*40,s=(o.s||1)*(.88+r()*.24),yy=y+(r()-.5)*24,b=Math.sin(E.held(t,10)*2+i*1.7)*3*s,c=cols[(i+seed)%cols.length];
    let q=P(`M${x-95*s} ${yy+130*s}Q${x-92*s} ${yy-20*s+b} ${x} ${yy-30*s+b}Q${x+92*s} ${yy-20*s+b} ${x+95*s} ${yy+130*s}Z`,c);
    q+=P(`M${x-80*s} ${yy-6*s+b}Q${x} ${yy-38*s+b} ${x+80*s} ${yy-6*s+b}`,'none',{stroke:rim,'stroke-width':5*s,opacity:.55});
    q+=C(x,yy-82*s+b,50*s,hair[(i+seed)%3]);
    if((i+seed)%3===1)q+=P(`M${x-56*s} ${yy-70*s+b}Q${x-60*s} ${yy-150*s+b} ${x} ${yy-142*s+b}Q${x+60*s} ${yy-150*s+b} ${x+56*s} ${yy-70*s+b}L${x+66*s} ${yy-20*s+b}L${x-66*s} ${yy-20*s+b}Z`,cloth[(i+seed)%3]);
    q+=P(`M${x-46*s} ${yy-100*s+b}Q${x} ${yy-146*s+b} ${x+46*s} ${yy-100*s+b}`,'none',{stroke:rim,'stroke-width':6*s,opacity:.6});
    g+=q;
  }
  return g;
}
// A row of tents (the camp of Israel) with lit doorways and small campfires, baseline y.
function tents(t,y,seed,o={}){
  const r=rng(seed),cols=o.cols||['#5A4A5E','#6A5466','#4E4258'],s0=o.s||1,xs=o.xs||[40,230,420,640,850,1050];let g='';
  xs.forEach((x0,i)=>{const s=s0*(.8+r()*.4),x=x0+(r()-.5)*50,yy=y+(r()-.5)*18,w=150*s,h=95*s,c=cols[i%cols.length],lit=.7+.3*Math.sin(t*2.3+i*1.9);
    g+=glow(x,yy-h*.3,w*.8,'#FFB04C',.12*lit);
    g+=P(`M${x-w/2} ${yy}L${x-w*.08} ${yy-h}L${x+w*.08} ${yy-h}L${x+w/2} ${yy}Z`,c)+P(`M${x-w*.08} ${yy-h}L${x+w*.08} ${yy-h}L${x+w*.3} ${yy}L${x} ${yy}Z`,'#000',{opacity:.18});
    g+=L(x-w*.08,yy-h,x-w*.18,yy-h-16*s,'#2A2026',4*s)+L(x+w*.08,yy-h,x+w*.18,yy-h-16*s,'#2A2026',4*s);
    g+=P(`M${x-w*.12} ${yy}L${x} ${yy-h*.55}L${x+w*.12} ${yy}Z`,'#FFC870',{opacity:(.55+.4*lit).toFixed(2)});
    if(i%2===0){const fx=x+w*.62,f=Math.sin(t*9+i);g+=glow(fx,yy-12*s,60*s,'#FF8A3C',.4*lit)+
      P(`M${fx-12*s} ${yy}Q${fx-8*s+f*3} ${yy-24*s} ${fx} ${yy-38*s}Q${fx+10*s} ${yy-22*s} ${fx+12*s} ${yy}Z`,'#FFB04C')+L(fx-16*s,yy+2,fx+16*s,yy+2,'#4A3020',5*s);}
  });
  return g;
}
// Grass tufts and glow-flowers between y0 and y1, drawn under the labels.
function tufts(t,cols,seed,y0,y1,n,flowers=[]){
  let g='';for(let k=0;k<n;k++){const x=hash(k,seed)*1160-40,y=y0+Math.pow(hash(k,seed+1),.8)*(y1-y0),sz=lerp(1,2.6,(y-1340)/580),sw=Math.sin(t*1.5+k)*3*sz,c=cols[k%3];
    for(let j=-1;j<=1;j++)g+=L(x+j*5*sz,y,x+j*9*sz+sw,y-(14+hash(k,j+5)*16)*sz,c,3*sz);
    if(flowers.length&&k%6===0){const fy=y-30*sz,col=flowers[k%flowers.length];g+=glow(x+sw,fy,14*sz,col,.6)+C(x+sw,fy,4*sz,col);}}
  return g;
}
// Rows of vines receding down the slope, with grapes.
function vineRows(t,y0){
  let g='';
  for(let r=0;r<5;r++){const y=y0+r*(70+r*22),sc=.6+r*.22,n=7-Math.floor(r/2),gap=1160/n;
    g+=P(`M-40 ${y+30*sc}Q540 ${y+14*sc} 1120 ${y+30*sc}`,'none',{stroke:'#5A3A1E','stroke-width':8*sc});
    for(let i=0;i<n;i++){const x=-20+(i+.5)*gap+(r%2)*gap/2,sw=Math.sin(t*1.3+i+r)*2*sc;if(x>1110)continue;
      g+=L(x,y+30*sc,x,y-30*sc,'#6A4A2A',6*sc)+C(x-22*sc+sw,y-30*sc,30*sc,'#3FA04A')+C(x+22*sc+sw,y-38*sc,28*sc,'#4CB858')+C(x+sw,y-56*sc,26*sc,'#3A9A44');
      for(let k=0;k<5;k++)g+=C(x-6*sc+(k%2)*12*sc+sw,y-6*sc+Math.floor(k/2)*11*sc,7*sc,k%2?'#7A3AA8':'#9A4ACB');}}
  return g;
}
// An olive tree, base at (x, y).
const olive=(x,y,s)=>P(`M${x-10*s} ${y}Q${x-4*s} ${y-60*s} ${x-20*s} ${y-110*s}L${x+14*s} ${y-110*s}Q${x+6*s} ${y-60*s} ${x+12*s} ${y}Z`,'#5A3E26')+
  Ell(x,y-150*s,90*s,56*s,'#6E8A4A')+Ell(x-50*s,y-120*s,56*s,38*s,'#7E9A58')+Ell(x+52*s,y-126*s,58*s,40*s,'#5E7A3E');

// ---------- small paper cut-out art (drawn around 0,0 at about +-90) ----------
const house=(F)=>P('M-80 -10L0 -80L80 -10Z','#C8483A',{stroke:'#7A2418','stroke-width':4})+R(-64,-14,128,94,3,F||'#F2D7A0',{stroke:'#8A5A2A','stroke-width':4})+
  R(-16,26,32,54,3,'#7A4A2A')+R(-52,6,26,24,2,'#FFE9A8')+R(26,6,26,24,2,'#FFE9A8')+R(36,-70,18,34,2,'#7A4A2A');
const beast=(col,dark,o={})=>{ // a side-on ox (horns) or donkey (long ears)
  let g=R(-60,6,14,52,5,dark)+R(-34,8,14,50,5,col)+R(26,6,14,52,5,dark)+R(48,8,14,50,5,col);
  g+=Ell(0,0,74,40,col,{stroke:dark,'stroke-width':4})+P('M-72 -8Q-96 4 -90 34','none',{stroke:dark,'stroke-width':6});
  if(o.ears)g+=P('M70 -40L62 -96L84 -48Z',col,{stroke:dark,'stroke-width':3})+P('M84 -40L92 -94L100 -42Z',col,{stroke:dark,'stroke-width':3});
  g+=Ell(88,-26,o.ears?26:30,o.ears?32:26,col,{stroke:dark,'stroke-width':4})+C(96,-30,4,'#1A1410');
  if(o.horns)g+=P('M70 -44Q56 -76 76 -86Q70 -64 84 -48Z','#F6EFDC',{stroke:'#8A7A5A','stroke-width':2})+P('M100 -44Q118 -74 104 -88Q104 -64 92 -48Z','#F6EFDC',{stroke:'#8A7A5A','stroke-width':2});
  if(o.ears)g+=R(66,-12,50,8,3,'#7A4A2A',{opacity:.6});
  return g;
};
const crown=(F)=>P('M-60 30L-70 -40L-32 -6L0 -60L32 -6L70 -40L60 30Z',F,{stroke:'#8A5A12','stroke-width':5})+C(0,-14,9,CORAL)+R(-62,30,124,18,3,'#8A5A12');
const coins=(F)=>{let g='';for(let i=0;i<5;i++)g+=Ell(0,40-i*16,56,17,F,{stroke:'#8A5A12','stroke-width':3});return g;};
const at0=(x,y,s,inner)=>G(`translate(${x} ${y}) scale(${s})`,inner);

// ---------- 0. Cold open: the one nobody can see ----------
function coldOpen(t){
  let g=stars(t,.4,300)+fireflies(t,0,-600,1920,700,'#FFE9A8',14,.4);
  g+=`<path d="${ridge(5,hv(930,vy(1250)),14,260)}" fill="#1E1A24"/>`;
  g+=VB(fr(6,1440,16,240,'#262030')+tents(t,1520,3,{s:.62,cols:['#3E3446','#4A3E52','#362E40']})+fr(7,1600,12,260,'#2E2638')+
    tents(t,1700,8,{s:.95,xs:[70,330,760,1010],cols:['#4A3E52','#58485E','#3E3446']})+
    backs(t,1860,6,4,{s:1.05,cols:['#3A2E4A','#2E3A50','#4A3430'],rim:'#FFD86B'}));
  // Lines I..IX light in turn on "Nine"; the tenth stays dark, then lights from inside like a heartbeat.
  const ten=ease.out(prog(t,AT.lastOne,AT.lastOne+1)),beat=Math.pow(Math.max(0,Math.sin(t*3.2)),6);
  const lit=k=>k<9?.15+.85*ease.out(prog(t,AT.nine+k*.18,AT.nine+k*.18+.4))*(1-.5*ten):ten*(1+.4*beat);
