// Remade in episode 1's style (videos/the-first-commandment/episode.html): a new setting every few seconds, the story
// acted by the round PPL figures, one slow camera move per shot, one label at a time, verse cards and end card in hud.
// Every time below comes from the spoken words (words.js), so a new narration re-times the episode.
// Guide: .claude/skills/godward-episode/reference/scene-pacing.md and engine.md. K.E is the ellipse helper (Ell).
const {G,R,C,L,P,T,prog,ease,lerp,mix,clamp,rng}=K, Ell=K.E;
const {hash,piece,glow,label,mark,scribble,arrow,strip,tape,torn}=S;
const {cue,end,span,shot,ridge,verse,fade,hv,stars,fireflies,INK,YEL,CORAL}=E;
const GOLD='#E8B53A', NEON='#2BF0FF', GREEN='#1E9A5A';

const AT={
  nine:cue('Nine of the'), lastOne:cue('The last one'), want:cue('what you want'), youCan:cue('You can break'), muscle:cue('without moving'),
  know:cue('nobody would know'), why:cue('So why would'),
  fromFire:cue('From the fire'), lastWord:cue('the last word'), v17:cue('You shall not covet your'), house:cue("neighbor's house"), wife:cue("neighbor's wife"),
  servant:cue('male servant'), female:cue('female servant'), ox:cue('his ox'), donkey:cue('his donkey'), anything:cue('anything that'),
  toCovet:cue('To covet is'), liking:cue('more than liking'), wanting:cue('It is wanting'), yourself:cue('for yourself'),
  strange:cue("Here's the strange"), judge:cue('No judge'), there:cue('There is no'), witness:cue('witness to a wish'), evidence:cue('no evidence'),

  andKing:cue('And the king took'), tookV:cue('took the vineyard'),
  fw2:cue('False witness,'), murder:cue('murder and'), stealing:cue('stealing,'), allStarted:cue('and it all started'), startedW:cue('started with wanting'),

  anyOther:cue('any other commandment'), summed:cue('are summed up'), loveAs:span('You shall love your neighbor as yourself'),
  r1310:cue('Love does no wrong'), therefore:cue('therefore love'), fulfilling:span('the fulfilling of the law'),
  tenC:cue('Ten commandments, and'), oneWord:cue('one word underneath'), godWho:cue('The God who rescued'), obedience:cue('obedience'), wants:cue('He wants your'), wholeHeart:cue('your whole heart'),

AT.last=WORDS[WORDS.length-1][2];

// ---------- framing helpers (vertical) ----------
// aim(): hold, with sheet point (x, y) at frame height F. Feet at F <= 1190 keep figures above the caption band.
const aim=(a,b,x,y,F,z)=>shot(a,b,x,y+(1010-F)/z,z), sq=p=>p*p;
// Camera specs for the sheet list (resolved to the sheet's own time window at the end of the page):
// H = one still hold; M = one slow move from framing 0 to framing 1 (y = the sheet point that lands at frame F).
const H=(x,y,z,F=1170)=>(a,b)=>[aim(a,b,x,y,F,z)];
const M=(x0,y0,z0,x1,y1,z1,F=1170,F1)=>(a,b)=>[[a,x0,y0+(1010-F)/z0,z0],[b,x1,y1+(1010-(F1??F))/z1,z1]];

// ---------- shared pieces ----------
const slab=(w,h)=>`M${-w/2} ${h/2}V${-h/2+w*.32}Q${-w/2} ${-h/2} 0 ${-h/2}Q${w/2} ${-h/2} ${w/2} ${-h/2+w*.32}V${h/2}Z`;
const NUM=['I','II','III','IV','V','VI','VII','VIII','IX','X'];
// One tablet with five carved lines (numerals + illegible carving, never a quotation). lit(k) 0..1+ per line, col(k) glow colour.
function tablet(x,y,w,h,first,lit,seed,col){
  const r=rng(seed);let g=G(`translate(${x} ${y})`,P(slab(w,h),'#7E7A70')+P(slab(w-24,h-24),'#9C988C')+
    P(slab(w-24,h-24),'none',{stroke:'#5E5A52','stroke-width':3,opacity:.5}));
  for(let i=0;i<5;i++){
    const k=first+i,ly=y-h/2+w*.46+i*(h-w*.5)/5.2,x0=x-w/2+92,x1=x+w/2-34-r()*40,on=clamp(lit(k),0,1.4),c=col?col(k):'#FFD86B';
    let d=`M${x0} ${ly}`;for(let xx=x0;xx<x1;xx+=18)d+=`L${xx+9} ${ly+(r()-.5)*6}L${xx+18} ${ly}`;
    g+=glow((x0+x1)/2,ly,(x1-x0)*.6,c,.35*on);
    g+=T(x-w/2+60,ly+12,NUM[k],{size:34,font:'Georgia',weight:700,anchor:'middle',fill:mix('#4A4740','#FFF4C8',Math.min(1,on))});
    g+=P(d,'none',{stroke:'#4A4740','stroke-width':5,opacity:.8})+P(d,'none',{stroke:k===9&&col?mix('#FFE9A8','#FF8A6B',.6):'#FFE9A8','stroke-width':3,opacity:(.12+.88*Math.min(1,on)).toFixed(3)});
  }
  return g;
}
const tablets=(cx,cy,s,lit,col)=>G(`translate(${cx} ${cy}) scale(${s}) translate(${-cx} ${-cy})`,
  glow(cx,cy,560,'#FFD86B',.12)+tablet(cx-205,cy,380,560,0,lit,21,col)+tablet(cx+205,cy,380,560,5,lit,33,col));
// Line k's carved row (tablets centred on cx,cy, scale s): its centre point.
const lineAt=(cx,cy,s,k)=>[cx+(k<5?-205:205)*s+20*s,cy+(-280+380*.46+(k%5)*(560-190)/5.2)*s];
const TENC=k=>k===9?'#FF8A6B':'#FFD86B';
let foilN=0;
const foil=(t)=>{const id='foil'+(foilN++),sh=.5+.5*Math.sin(t*1.7);
  return [`url(#${id})`,`<linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF1B0"/><stop offset="${(.3+.2*sh).toFixed(2)}" stop-color="${GOLD}"/><stop offset="1" stop-color="#8A5A12"/></linearGradient>`];};
const shake=(t,a,d,amp)=>{const p=prog(t,a,a+d);return p>0&&p<1?(hash(Math.floor(t*24),a)-.5)*2*amp*(1-p):0;};
const gnd=(s,y,c1,c2)=>`<path d="${ridge(s,y,10,230)}" fill="${c1}"/><path d="${ridge(s+1,y+120,8,200)}" fill="${c2}"/>`;
// God is never a figure: his presence is a soft oval of light.
const presence=(t,x,y,r,k=1)=>k<=0?'':glow(x,y,r*2.6,'#FFF6DA',.5*k)+glow(x,y,r*1.2,'#FFFFFF',.65*k)+
  Ell(x,y,r*.74,r,'none',{stroke:'#FFFBEA','stroke-width':8,opacity:(.75*k).toFixed(2)})+Ell(x,y,r*.6,r*.82,'#FFFBEA',{opacity:(.22*k*(1+.25*Math.sin(t*2))).toFixed(2)});
const heartP=(x,y,r)=>`M${x} ${y+r*.9}C${x-r*1.7} ${y-r*.1} ${x-r*.95} ${y-r*1.35} ${x} ${y-r*.42}C${x+r*.95} ${y-r*1.35} ${x+r*1.7} ${y-r*.1} ${x} ${y+r*.9}Z`;
const heart=(x,y,r,k=1)=>glow(x,y,r*2.2,'#FF7A6A',.5*k)+P(heartP(x,y,r),'#FF4A5C',{stroke:'#FFD0C8','stroke-width':Math.max(2,r*.08)})+P(heartP(x-r*.2,y-r*.15,r*.45),'#FF8A96',{opacity:.6});
const rings=(t,a,x,y,R0=1300,n=4)=>{const sp=prog(t,a,a+2.2);if(sp<=0||sp>=1)return '';let g=glow(x,y,200+sp*700,'#FFFBEA',.6*(1-sp));
  for(let k=0;k<n;k++){const p=clamp(sp*1.6-k*.18);if(p>0&&p<1)g+=C(x,y,60+p*R0,'none',{stroke:'#FFF6DA','stroke-width':12*(1-p)+2,opacity:(1-p).toFixed(2)});}return g;};
const xMark=(cx,cy,r,p)=>mark(`M${cx-r} ${cy-r}L${cx+r} ${cy+r}`,p*2,CORAL,10)+mark(`M${cx+r} ${cy-r}L${cx-r} ${cy+r}`,p*2-1,CORAL,10);
const tick=(x,y,r,p)=>mark(`M${x-r} ${y}L${x-r*.3} ${y+r*.7}L${x+r} ${y-r*.8}`,p,'#3BE08A',9);

// ---------- people (videos/_kit/people.js) ----------
const TUN=[['#3DE0B8','#1787A8'],['#FFC24C','#E0623C'],['#B98CFF','#6A4CD8'],['#FF8FB1','#C8487A'],['#7CD4FF','#2F6FD0']];
const SKIN=[['#F5BE8E','#C4835E'],['#D9965E','#A86A3E'],['#B87444','#8A5230']], HAIR=['#2E1C52','#4A2A16','#1A1A2A'];
// pplOpts as in episode 1: o takes the old chubby options (walk, reach, lean, flip, aura...) plus any PPL option.
const pplOpts=(i,x,y,s,o={})=>{const [a,b]=TUN[i%5],[sk,sh]=SKIN[i%3],face=o.flip||o.face||1,f=o.f??(i%2===1);
  const q=Object.assign({x,y,s,face,f,tunic:a,tunic2:b,skin:sk,shade:sh,hair:HAIR[i%3],phase:i*.7},o);
  q.face=face;delete q.flip;delete q.filter;delete q.reach;
  if(!o.walk)delete q.walk;
  if(o.reach!=null&&!o.near){const r=o.reach;q.near={x:x+lerp(52,116,r)*s*face,y:y-lerp(54,172,r)*s};
    if(r>.75&&!o.far)q.far={x:x+lerp(10,70,r)*s*face,y:y-lerp(60,178,r)*s};}
  return q;};
const folk=(i,x,y,s,o={})=>PPL.fig(pplOpts(i,x,y,s,o));
const person=pplOpts;
// The recurring cast (same colours in every scene they appear in).
const CAST={
  cov:{tunic:'#7CD4FF',tunic2:'#2F6FD0',skin:'#F5BE8E',shade:'#C4835E',hair:'#4A2A16',f:false,phase:.3},     // the man at the fence
  nei:{tunic:'#FFC24C',tunic2:'#E0623C',skin:'#B87444',shade:'#8A5230',hair:'#1A1A2A',f:false,phase:1.1},    // his neighbour
  neiW:{tunic:'#FF8FB1',tunic2:'#C8487A',skin:'#B87444',shade:'#8A5230',hair:'#2E1C52',f:true,phase:2.0},    // the neighbour's wife
  eve:{tunic:'#3DE0B8',tunic2:'#1787A8',skin:'#D9965E',shade:'#A86A3E',hair:'#4A2A16',f:true,phase:.8},
  ahab:{tunic:'#B98CFF',tunic2:'#6A4CD8',skin:'#F5BE8E',shade:'#C4835E',hair:'#2A1A12',f:false,phase:.5},
  jez:{tunic:'#FF5A48',tunic2:'#8A1A2A',skin:'#F5BE8E',shade:'#C4835E',hair:'#1A1A2A',f:true,phase:1.6},
  nab:{tunic:'#9AD86A',tunic2:'#4A8A2A',skin:'#D9965E',shade:'#A86A3E',hair:'#ECE8DE',f:false,phase:1.3},
  paul:{tunic:'#E8EEF8',tunic2:'#4A6AA8',skin:'#D9965E',shade:'#A86A3E',hair:'#3A2416',f:false,phase:.9},
};
const who=(c,x,y,s,o={})=>pplOpts(0,x,y,s,Object.assign({},CAST[c],o));
const fig=(c,x,y,s,o={})=>PPL.fig(who(c,x,y,s,o));
const rigOf=q=>PPL.rig(q);
const elderOpts=(x,y,s,o={})=>{const q=pplOpts(0,x,y,s,Object.assign({tunic:'#C8A06A',tunic2:'#7A5430',skin:'#D9965E',shade:'#A86A3E',f:false,phase:.4},o));q.hair=o.hair||'#ECE8DE';return q;};
const elder=(x,y,s,o={})=>PPL.fig(elderOpts(x,y,s,o));
// A crown sitting on a rig's head.
const crownOn=(r,F,k=1)=>{const [x,y]=r.top,s=r.s*.7*k;return G(`translate(${x.toFixed(1)} ${(y+14*r.s).toFixed(1)}) scale(${s.toFixed(3)})`,
  P('M-46 10L-54 -40L-24 -14L0 -52L24 -14L54 -40L46 10Z',F,{stroke:'#8A5A12','stroke-width':5})+C(0,-14,7,CORAL)+R(-48,6,96,12,3,'#8A5A12'));};
// Draw a figure in layers with something (a prop) between its body and its front arm.
const withProp=(q,prop)=>{const r=PPL.rig(q);return r.draw('back')+r.draw('body')+r.draw('head')+prop(r)+r.draw('front');};

// ---------- set pieces ----------
// A house (base centre x, ground y). lit: window glow 0..1. F: optional gold fill for the walls (the coveted house).
function house(x,y,s,lit=1,o={}){
  const w=300*s,h=200*s,wall=o.wall||'#E8C890',roof=o.roof||'#C8483A';
  let g=glow(x,y-h*.5,w*.9,'#FFD27A',.18*lit);
  g+=R(x-w/2,y-h,w,h,4*s,wall,{stroke:'#6A4A2A','stroke-width':5*s})+P(`M${x-w/2-24*s} ${y-h+6*s}L${x} ${y-h-150*s}L${x+w/2+24*s} ${y-h+6*s}Z`,roof,{stroke:'#5A1A10','stroke-width':5*s});
  g+=R(x+w*.22,y-h-130*s,34*s,70*s,3*s,'#7A4A2A');
  g+=R(x-30*s,y-110*s,60*s,110*s,26*s,'#5A341A');
  [-1,1].forEach(k=>{const wx=x+k*w*.3;g+=R(wx-32*s,y-h+50*s,64*s,58*s,6*s,mix('#3A2A20','#FFE29A',lit),{stroke:'#6A4A2A','stroke-width':4*s})+L(wx,y-h+50*s,wx,y-h+108*s,'#6A4A2A',4*s)+glow(wx,y-h+80*s,70*s,'#FFD27A',.35*lit);});
  return g;
}
// A low fence of posts and two rails from x0 to x1, ground y.
function fence(x0,x1,y,s=1,col='#8A5A3A'){let g=L(x0,y-56*s,x1,y-56*s,col,9*s)+L(x0,y-26*s,x1,y-26*s,col,9*s);
  for(let x=x0;x<=x1;x+=70*s)g+=R(x-8*s,y-84*s,16*s,88*s,3*s,mix(col,'#000',.15))+P(`M${x-8*s} ${y-84*s}L${x} ${y-96*s}L${x+8*s} ${y-84*s}Z`,mix(col,'#000',.15));return g;}
const tent=(x,y,c,k=1)=>P(`M${x-90*k} ${y}L${x} ${y-120*k}L${x+90*k} ${y}Z`,c)+P(`M${x} ${y-120*k}L${x-13*k} ${y}L${x+13*k} ${y}Z`,'#2A1A10');
const beast=(col,dark,o={})=>{ // a side-on ox (horns) or donkey (long ears), facing right, feet at y 58
  let g=R(-60,6,14,52,5,dark)+R(-34,8,14,50,5,col)+R(26,6,14,52,5,dark)+R(48,8,14,50,5,col);
  g+=Ell(0,0,74,40,col,{stroke:dark,'stroke-width':4})+P('M-72 -8Q-96 4 -90 34','none',{stroke:dark,'stroke-width':6});
  if(o.ears)g+=P('M70 -40L62 -96L84 -48Z',col,{stroke:dark,'stroke-width':3})+P('M84 -40L92 -94L100 -42Z',col,{stroke:dark,'stroke-width':3});
  g+=Ell(88,-26,o.ears?26:30,o.ears?32:26,col,{stroke:dark,'stroke-width':4})+C(96,-30,4,'#1A1410');
  if(o.horns)g+=P('M70 -44Q56 -76 76 -86Q70 -64 84 -48Z','#F6EFDC',{stroke:'#8A7A5A','stroke-width':2})+P('M100 -44Q118 -74 104 -88Q104 -64 92 -48Z','#F6EFDC',{stroke:'#8A7A5A','stroke-width':2});
  return g;
};
const ox=(x,y,s,t=0,walk=0)=>G(`translate(${x} ${y-58*s+(walk?Math.abs(Math.sin(walk))*3:0)}) scale(${s})`,beast('#8A5A3A','#4A2A16',{horns:true}));
const donkey=(x,y,s,load=false,flip=1)=>G(`translate(${x} ${y-58*s}) scale(${s*flip} ${s})`,beast('#9A9490','#5A5450',{ears:true})+
  (load?R(-50,-74,90,40,8,'#C8884A',{stroke:'#6A3A1A','stroke-width':4})+R(-30,-100,56,30,6,'#E8C070',{stroke:'#6A3A1A','stroke-width':4}):''));
const jar=(x,y,s=1)=>P(`M${x-22*s} ${y}Q${x-34*s} ${y-40*s} ${x-16*s} ${y-62*s}H${x+16*s}Q${x+34*s} ${y-40*s} ${x+22*s} ${y}Z`,'#C8703A',{stroke:'#6A2E14','stroke-width':4*s})+R(x-18*s,y-72*s,36*s,12*s,4*s,'#A85A2A');
const coinsP=(x,y,F,n=5,s=1)=>{let g='';for(let i=0;i<n;i++)g+=Ell(x,y-i*12*s,40*s,12*s,F,{stroke:'#8A5A12','stroke-width':3});return g;};
const purse=(x,y,s=1,F='#9A6A30')=>Ell(x,y,34*s,28*s,F,{stroke:'#4A2A14','stroke-width':4})+P(`M${x-18*s} ${y-22*s}q18 -16 36 0`,'none',{stroke:'#4A2A14','stroke-width':5})+C(x+8*s,y+4*s,6*s,GOLD);
const loaf=(x,y,s=1)=>Ell(x,y,54*s,24*s,'#D8963E',{stroke:'#8A5A1E','stroke-width':4})+[...Array(3)].map((_,i)=>L(x-26*s+i*24*s,y-14*s,x-14*s+i*24*s,y+4*s,'#F0C070',4*s)).join('');
const cup=(x,y,s=1)=>P(`M${x-20*s} ${y-44*s}H${x+20*s}L${x+14*s} ${y}H${x-14*s}Z`,'#C8C0B0',{stroke:'#6A6458','stroke-width':4*s});
const table=(x,y,w,c='#8A5A30')=>R(x-w/2,y-120,w,22,6,c,{stroke:'#4A2A14','stroke-width':4})+R(x-w/2+20,y-100,18,100,4,mix(c,'#000',.25))+R(x+w/2-38,y-100,18,100,4,mix(c,'#000',.25));
// Vineyard rows (sheet coords) with grapes; k = how many vines are still green (1) or picked bare (0).
function vines(t,x0,x1,y,s=1,k=1){let g='';for(let x=x0;x<=x1;x+=110*s){const sw=Math.sin(t*1.3+x)*2*s;
  g+=L(x,y,x,y-120*s,'#6A4A2A',7*s)+C(x-24*s+sw,y-120*s,34*s,'#3FA04A')+C(x+26*s+sw,y-132*s,32*s,'#4CB858')+C(x+sw,y-156*s,30*s,'#3A9A44');
  if(k>0)for(let j=0;j<5;j++)g+=C(x-8*s+(j%2)*14*s+sw,y-98*s+Math.floor(j/2)*12*s,8*s,j%2?'#7A3AA8':'#9A4ACB',{opacity:k.toFixed(2)});}
  return g+L(x0-40*s,y-110*s,x1+40*s,y-110*s,'#5A3A1E',4*s);}
// A palace skyline (base y).
