<script>const WORDS=[["x",0,1]];</script>
<script src="../_kit/shared.js"></script>

<script>
// Thumbnail for part 10 (the finale): a man leans on his fence at dusk, staring at his neighbour's glowing house;
// a small red heart glows in his chest (the wanting). The ten lines hang in the sky, line X burning coral.
//   thumbnail.html      Instagram feed 4:5 (1080x1350), key content inside the centre 1012 px
//   1080x1920 viewport  9:16 cover for TikTok / Reels / Shorts
const V=window.innerHeight>1500;
const W=1080,H=V?1920:1350,t=3.6;
const {G,R,C,L,P,T,mix,rng}=K;
const {tw,glow,strip,tape,label,paperDefs,hash}=S;
const INK='#141416',YEL='#FFE100',CORAL='#FF5A48';
const svg=document.querySelector('svg');svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.style.width=W+'px';svg.style.height=H+'px';
const GY=V?1520:1190, BIG=V?2.15:1.8;   // ground line, man's scale
const defs=`<defs><radialGradient id="vig" cx="50%" cy="50%" r="75%"><stop offset=".55" stop-color="#02021A" stop-opacity="0"/><stop offset="1" stop-color="#02021A" stop-opacity=".55"/></radialGradient>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141038"/><stop offset=".5" stop-color="#4A2A5A"/><stop offset=".8" stop-color="#C8604A"/><stop offset="1" stop-color="#F0A060"/></linearGradient>
  <filter id="grain2" filterUnits="userSpaceOnUse" x="0" y="0" width="${W}" height="${H}" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency=".88" numOctaves="2" seed="38"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncR type="linear" slope="2.6" intercept="-.8"/><feFuncG type="linear" slope="2.6" intercept="-.8"/><feFuncB type="linear" slope="2.6" intercept="-.8"/><feFuncA type="linear" slope="0" intercept="1"/></feComponentTransfer></filter></defs>`;
const NUM=['I','II','III','IV','V','VI','VII','VIII','IX','X'];
function tabletsSky(cx,cy,s){
  // two small glowing tablets; lines I-IX soft gold, line X burning coral
  let g=glow(cx,cy,260*s,'#FFD86B',.25);
  [[-1,0],[1,5]].forEach(([side,first])=>{const x=cx+side*95*s,w=170*s,h=240*s;
    g+=P(`M${x-w/2} ${cy+h/2}V${cy-h/2+w*.3}Q${x-w/2} ${cy-h/2} ${x} ${cy-h/2}Q${x+w/2} ${cy-h/2} ${x+w/2} ${cy-h/2+w*.3}V${cy+h/2}Z`,'#8E8A80',{stroke:'#5A564E','stroke-width':4*s});
    for(let i=0;i<5;i++){const k=first+i,ly=cy-h/2+w*.48+i*(h-w*.5)/5.1,last=k===9,c=last?CORAL:'#FFE9A8';
      g+=T(x-w/2+24*s,ly+7*s,NUM[k],{size:18*s,font:'Georgia',weight:700,anchor:'middle',fill:last?'#FFD0C8':'#FFF4C8'})+
        L(x-w/2+46*s,ly,x+w/2-16*s,ly,c,(last?5:3)*s,{opacity:last?1:.75})+(last?glow((x),ly,90*s,CORAL,.8):'');}
  });

}
function scene(){
  let g=R(0,0,W,H,0,'url(#sky)');

  const hy=GY-(V?330:260);
  g+=P(`M-40 ${hy+40}Q200 ${hy-40} 420 ${hy+10}T860 ${hy-20}T1120 ${hy+20}V${H}H-40Z`,'#5A3A5A',{opacity:.9});
  [[120,hy+30,.5],[260,hy+10,.42],[760,hy,.45],[980,hy+20,.4]].forEach(([x,y,s])=>g+=SC.house(x,y,s,{col:'#8A6A7A'}));
  g+=P(`M-40 ${hy+120}Q300 ${hy+60} 600 ${hy+110}T1120 ${hy+90}V${H}H-40Z`,'#4A3048');

  const nx=V?800:790,ny=GY-30,ns=V?1.25:1.05,nw=300*ns,nh=210*ns;
  g+=glow(nx,ny-nh*.6,nw*1.4,'#FFC870',.5);

  g+=R(nx-nw/2,ny-nh,nw,nh,8,'#E8C890',{stroke:'#6A4A2A','stroke-width':5})+P(`M${nx-nw/2-26} ${ny-nh+6}L${nx} ${ny-nh-150*ns}L${nx+nw/2+26} ${ny-nh+6}Z`,'#C8483A',{stroke:'#5A1A10','stroke-width':5});
  g+=R(nx-34*ns,ny-118*ns,68*ns,118*ns,30*ns,'#FFD27A',{stroke:'#6A4A2A','stroke-width':4});
  [-1,1].forEach(k=>{const wx=nx+k*nw*.31;g+=R(wx-34*ns,ny-nh+52*ns,68*ns,62*ns,6,'#FFE29A',{stroke:'#6A4A2A','stroke-width':4})+glow(wx,ny-nh+82*ns,80*ns,'#FFD27A',.6);});
  g+=SC.animal(t,'donkey',nx-nw*.85,ny+20,V?.85:.72,{face:1});
  // ground and the man's fence
  g+=R(-40,GY-20,W+80,H-GY+40,0,'#2A1E2C');
  g+=SC.ground(t,7,{y:GY-10,col:'#3A2A38',col2:'#2A1E2C',stones:true,tufts:true});
  // the man: big, leaning on his fence, staring at the house; a red heart glows in his chest
  const look={x:nx,y:ny-nh*.6};
  const man={x:V?250:240,y:GY+40,s:BIG,face:1,tunic:'#7CD4FF',tunic2:'#2F6FD0',skin:'#F5BE8E',shade:'#C4835E',hair:'#4A2A16',look,expr:'sad',lean:4,phase:.3,
    near:null,far:null};
  const rg=PPL.rig(man);
  g+=rg.draw('back')+rg.draw('body')+rg.draw('head');
  const hx=(V?250:240)+12*BIG,hy2=GY+40-120*BIG,hs=26*BIG/1.8;
  g+=glow(hx,hy2,110*BIG/1.8,'#FF4A5C',.6)+P(`M${hx} ${hy2+hs*.9}C${hx-hs*1.7} ${hy2-hs*.1} ${hx-hs*.95} ${hy2-hs*1.35} ${hx} ${hy2-hs*.42}C${hx+hs*.95} ${hy2-hs*1.35} ${hx+hs*1.7} ${hy2-hs*.1} ${hx} ${hy2+hs*.9}Z`,'#FF4A5C',{stroke:'#FFD0C8','stroke-width':3});
  // fence in front of his body, his hands on the top rail
  const fy=GY+30,fs=BIG*.62;let fg='';
  [62,30].forEach(h=>{fg+=R(-30,fy-h*fs*1.6-6,(V?640:620),12*fs,4,'#8A5A34',{stroke:'#4A2A14','stroke-width':3});});
  for(let x=-10;x<(V?620:600);x+=70){const hh=118*fs;fg+=P(`M${x-9} ${fy+6}V${fy-hh+9}L${x} ${fy-hh}L${x+9} ${fy-hh+9}V${fy+6}Z`,'#7A4E2C',{stroke:'#4A2A14','stroke-width':3});}
  g+=fg+rg.draw('front');
  // the ten lines in the sky
  g+=tabletsSky(V?820:830,V?820:640,V?1.15:.95);
  return g;
}
function title(){
  const x0=V?80:70,y0=V?150:60,s1='The one about',s2='your heart',a=V?78:68,b=V?134:120;
  const w1=tw(s1,a,'Georgia',700)+90,w2=tw(s2,b,'Georgia',700)+96;
  let g=`<g transform="rotate(-2.5 ${W/2} ${y0+60})">${strip(x0,y0,w1,a*1.55,3,'#F6EFDC',{ax:12,ay:4})}${T(x0+45,y0+a*1.12,s1,{size:a,font:'Georgia',weight:700,fill:INK})}${tape(x0+w1-30,y0+2,130,9)}</g>`;
  const y1=y0+a*1.55+14;
  g+=`<g transform="rotate(1.5 ${W/2} ${y1+80})">${strip(x0-20,y1,w2,b*1.32,5,'#F6EFDC',{ax:14,ay:5})}${S.highlight(x0+28,y1+20,tw(s2,b,'Georgia',700)+8,b*1.03,1,YEL)}${T(x0+30,y1+b*1.0,s2,{size:b,font:'Georgia',weight:700,fill:INK})}${tape(x0+10,y1,140,-10)}</g>`;
  g+=label(x0+10,y1+b*1.32+34,'THE TEN COMMANDMENTS · PART 10',{size:V?34:30,rot:-2});
  g+=label(V?86:74,V?1650:1268,'YOU SHALL NOT COVET',{size:V?48:40,bg:CORAL,rot:-3});
  return g;
}
svg.innerHTML=paperDefs(t)+defs+scene()+title()+R(0,0,W,H,0,'url(#vig)')+
  `<rect width="${W}" height="${H}" filter="url(#grain2)" opacity=".2" style="mix-blend-mode:overlay"/>`;
window.ready=true;
</script>
