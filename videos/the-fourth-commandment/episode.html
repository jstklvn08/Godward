// The Ten Commandments, part 4: the fourth commandment. Script: scripts/05-the-fourth-commandment.md (ESV fill).
// Every time below comes from the spoken words (words.js), so a new narration re-times the episode.
// Guide: .claude/skills/godward-episode/reference/engine.md. K.E is the ellipse helper (Ell), window.E the engine.
const {G,R,C,L,P,T,prog,ease,lerp,mix,clamp,rng}=K, Ell=K.E;
const {hash,piece,glow,label,mark,scribble,arrow,strip,tape,torn}=S;
const {cue,end,span,shot,ridge,verse,fade,hv,stars,fireflies,INK,YEL,CORAL}=E;
const GOLD='#E8B53A', NEON='#2BF0FF';

const AT={
  boss:cue('Imagine a boss'), stopWorking:cue('stop working'), holiday:cue('Not for a holiday'), oneDay:cue('One whole day'),
  fourth:cue("That's the fourth"), remember:cue('Remember the Sabbath'), keepHoly:span('to keep it holy'),

  israel:cue('Israel had just'), nobody:cue('nobody ever rested'), bricks:cue('Bricks today'), more:cue('more bricks'), noEnd:cue('no end in sight'),
  now:cue('Now God gives'), rhythm:cue('new rhythm'), fullStop:cue('a full stop'),
  six:cue('Six days you shall'), seventh1:span('the seventh day is a Sabbath'), onIt:cue('On it you shall'),
  you:cue('you, or your son'), son:cue('your son'), daughter:cue('your daughter'), male:cue('your male servant'), female:cue('your female servant'),
  livestock:cue('your livestock'), sojourner:cue('the sojourner'), gates:end('within your gates'),
  look:cue("Look who's"), sons:cue('Sons, daughters'), animals:cue('even the animals'), nobodyLeft:cue('Nobody is left'),
  why:cue('And why the seventh'), inSix:cue('In six days God'), heavens:cue('the heavens and the earth'), sea:cue('the sea, and'),
  everything:cue('everything in them'), onSeventh:cue('And on the seventh'), heRested:cue('he rested'),
  blessed:cue('So God blessed'), restedFrom:span('rested from all his work'),
  tired:cue("God wasn't tired"), finished:cue('a finished work'), invites:cue('The Sabbath invites'), hang:cue("the world doesn't hang"),
  forty:cue('Forty years later'), second:cue('a second reason'), youShall:cue('You shall remember'), slave1:span('you were a slave'),
  brought:cue('brought you out from there'), therefore:cue('Therefore the LORD'),
  slaves:cue("Slaves don't"), worth:cue('Their worth'), produce:cue('they produce'), saidIt:cue('So every Sabbath said'), notSlave:cue('not a slave any more'),
  buried:cue('But over time'), giftBuried:cue('the gift got buried'), teachers:cue('By the time of Jesus'), piled:cue('piled careful rules'),
  hungry:cue('hungry disciples'), picked:cue('picked some grain'), critics:cue('critics called it work'),
  answered:cue('Jesus answered'), rightSide:cue('right side up'), madeFor:cue('The Sabbath was made for man'), notMan:cue('not man for the Sabbath'),
  serve:cue('It was made to serve'), crush:cue('not to crush'),
  how:cue('So how do Christians'), disagree:cue('they disagree'), adventists:cue('Seventh-day Adventists'), saturday:cue('keep Saturday'),
  jewish:cue('Jewish families'), churches:cue('Many churches'), onSunday:cue('on Sunday, the day'), rose:cue('Jesus rose'),
  others:cue('Others believe'), fulfilled:cue('fulfilled it'), matters:cue('rest still matters'), agree:cue('But almost all'), madeToStop:cue('made to stop'),
  further:cue('And Jesus went further'), offered:cue('He offered the rest'), come:cue('Come to me'), giveRest:cue('give you rest'), laden:span('heavy laden'),
  deepest:cue('the deepest Sabbath'), dayOff:cue('Not just a day off'), soul:cue('rest for the soul'),
  earn:cue("You don't have to earn"), canStop:cue('You can stop'), never:cue('God never does'), next:cue('Next time'),
};
AT.last=WORDS[WORDS.length-1][2];

// ---------- shared pieces (as in part 1) ----------
const slab=(w,h)=>`M${-w/2} ${h/2}V${-h/2+w*.32}Q${-w/2} ${-h/2} 0 ${-h/2}Q${w/2} ${-h/2} ${w/2} ${-h/2+w*.32}V${h/2}Z`;
const NUM=['I','II','III','IV','V','VI','VII','VIII','IX','X'];
// One tablet with five carved lines (numerals + illegible carving, never a quotation). lit(i) 0..1 per line.
function tablet(x,y,w,h,first,lit,seed){
  const r=rng(seed);let g=G(`translate(${x} ${y})`,P(slab(w,h),'#7E7A70')+P(slab(w-24,h-24),'#9C988C')+
    P(slab(w-24,h-24),'none',{stroke:'#5E5A52','stroke-width':3,opacity:.5}));
  for(let i=0;i<5;i++){
    const k=first+i,ly=y-h/2+w*.46+i*(h-w*.5)/5.2,x0=x-w/2+92,x1=x+w/2-34-r()*40,on=lit(k);
    let d=`M${x0} ${ly}`;for(let xx=x0;xx<x1;xx+=18)d+=`L${xx+9} ${ly+(r()-.5)*6}L${xx+18} ${ly}`;
    g+=glow((x0+x1)/2,ly,(x1-x0)*.6,'#FFD86B',.35*on);
    g+=T(x-w/2+60,ly+12,NUM[k],{size:34,font:'Georgia',weight:700,anchor:'middle',fill:mix('#4A4740','#FFF4C8',Math.min(1,on))});
    g+=P(d,'none',{stroke:'#4A4740','stroke-width':5,opacity:.8})+P(d,'none',{stroke:'#FFE9A8','stroke-width':3,opacity:Math.min(1,.12+.88*on).toFixed(3)});
  }
  return g;
}
const tablets=(cx,cy,s,lit)=>G(`translate(${cx} ${cy}) scale(${s}) translate(${-cx} ${-cy})`,
  glow(cx,cy,560,'#FFD86B',.12)+tablet(cx-205,cy,380,560,0,lit,21)+tablet(cx+205,cy,380,560,5,lit,33));
const strike=(x0,y,x1,p)=>mark(`M${x0} ${y+6}L${x1} ${y-6}`,p,CORAL,9);
// Gold foil fill (hard shine, no glow of its own). Unique id per use.
let foilN=0;
const foil=(t)=>{const id='foil'+(foilN++),sh=.5+.5*Math.sin(t*1.7);
  return [`url(#${id})`,`<linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF1B0"/><stop offset="${(.3+.2*sh).toFixed(2)}" stop-color="${GOLD}"/><stop offset="1" stop-color="#8A5A12"/></linearGradient>`];};
// A crowd of small glowing people (modest tunics). tremble = jitter amount.
const TUN=[['#3DE0B8','#1787A8'],['#FFC24C','#E0623C'],['#B98CFF','#6A4CD8'],['#FF8FB1','#C8487A'],['#7CD4FF','#2F6FD0']];
const person=(t,x,y,s,i,o={})=>{const [a,b]=TUN[i%5];return E.chubby(x,y,s,Object.assign({f:i%2===1,flip:1,tunic:a,tunic2:b,aura:'#7CFFE6',auraOp:.35,phase:i*.7,
  hair:['#2E1C52','#4A2A16','#1A1A2A'][i%3],skin:['#F5BE8E','#D9965E','#B87444'][i%3],shade:['#C4835E','#A86A3E','#8A5230'][i%3]},o));};
function crowd(t,x0,y,n,gap,s,o={}){
  let g='';
  for(let i=0;i<n;i++){
    const tr=o.tremble?(hash(Math.floor(t*12),i)-.5)*o.tremble:0;
    g+=person(t,x0+i*gap+tr+(i%2)*10,y+(i%3)*14,s*(.92+.16*hash(i,4)),i,{flip:o.flip||1,aura:o.aura||'#7CFFE6',auraOp:o.auraOp??.35,
      walk:o.walk?t*7+i:0,lean:o.lean||0,reach:o.reach||0});
  }
  return g;
}
// A small cut-out on torn paper with a label underneath.
function cutout(t,at,cx,cy,inner,name,id,o={}){
  const w=o.w||250,h=o.h||250;
  return piece(t,at,cx,cy,strip(cx-w/2,cy-h/2,w,h,id*7,o.paper||'#F6EFDC')+tape(cx,cy-h/2+4,90,-4)+inner+
    label(cx,cy+h/2+14,name,{size:hv(26,34),anchor:'middle'}),id,1.4);
}
// Brick stack (Egypt). n = bricks shown.
function bricks(x,y,n){let g='';let k=0;for(let i=0;i<6&&k<n;i++)for(let j=0;j<4-(i%2)&&k<n;j++,k++)g+=R(x+j*62+(i%2)*31,y-i*30,58,26,3,'#C2703A',{stroke:'#6A2E14','stroke-width':3});return g;}
// Animals: an ox and a donkey, paper-cut, feet at (x, y).
function ox(t,x,y,s,o={}){
  const br=Math.sin(t*2.2)*2;
  let g=glow(0,-90,150,o.aura||'#FFD86B',o.auraOp??0);
  g+=R(-92,-70,22,72,8,'#5A3418')+R(52,-70,22,72,8,'#5A3418')+R(-62,-70,22,72,8,'#6E4020')+R(78,-70,22,72,8,'#6E4020');
  g+=P(`M-110 -${100+br}Q-118 -60 -96 -58Q-40 -50 60 -56Q108 -60 110 -96Q112 -150 60 -156Q-40 -164 -96 -150Q-118 -140 -110 -${100+br}Z`,'#8A5228',{stroke:'#4A2A10','stroke-width':4});
  g+=Ell(10,-110,40,22,'#A86A3E',{opacity:.6});
  g+=P('M-110 -120Q-140 -110 -138 -70','none',{stroke:'#4A2A10','stroke-width':6})+Ell(-138,-66,7,11,'#3A2010');
  g+=P('M96 -140Q140 -170 172 -136Q186 -110 176 -86Q160 -66 136 -74Q108 -86 96 -140Z','#9A5E30',{stroke:'#4A2A10','stroke-width':4});
  g+=P('M120 -150Q104 -190 128 -196Q124 -176 136 -158Z','#F3E6C8',{stroke:'#8A7A5A','stroke-width':2})+P('M160 -150Q182 -186 160 -198Q168 -176 150 -156Z','#F3E6C8',{stroke:'#8A7A5A','stroke-width':2});
  g+=Ell(166,-86,18,13,'#C89A72')+C(160,-88,3,'#3A2010')+C(172,-88,3,'#3A2010')+C(146,-122,5,'#1A0A04');
  return G(`translate(${x} ${y}) scale(${s*(o.flip||1)} ${s})`,g);
}
function donkey(t,x,y,s,o={}){
  const ear=Math.sin(t*1.7)*4;
  let g=glow(0,-90,140,o.aura||'#FFD86B',o.auraOp??0);
  g+=R(-74,-64,16,66,6,'#5E5A60')+R(46,-64,16,66,6,'#5E5A60')+R(-52,-64,16,66,6,'#77737A')+R(64,-64,16,66,6,'#77737A');
  g+=P('M-88 -96Q-92 -56 -70 -56H70Q92 -60 92 -96Q92 -138 50 -140H-56Q-90 -138 -88 -96Z','#8E8A92',{stroke:'#3E3A42','stroke-width':4});
  g+=Ell(0,-70,60,12,'#D8D2DA',{opacity:.6});
  g+=P('M-88 -110Q-106 -90 -100 -64','none',{stroke:'#3E3A42','stroke-width':5});
  g+=P('M70 -128Q96 -176 128 -170Q146 -150 140 -118Q132 -100 112 -106Q92 -112 70 -128Z','#9A96A0',{stroke:'#3E3A42','stroke-width':4});
  g+=P(`M104 -166Q${92+ear} -224 ${104+ear} -230Q116 -206 114 -168Z`,'#8E8A92',{stroke:'#3E3A42','stroke-width':3})+P(`M120 -168Q${124+ear} -226 ${136+ear} -224Q138 -200 128 -166Z`,'#8E8A92',{stroke:'#3E3A42','stroke-width':3});
  g+=Ell(136,-112,14,11,'#C8C2CA')+C(118,-146,4.5,'#1A1A1E');
  return G(`translate(${x} ${y}) scale(${s*(o.flip||1)} ${s})`,g);
}
// A pickaxe, head at (0,0) end, handle down to the right before rotation.
const pickaxe=(x,y,rot,s)=>G(`translate(${x} ${y}) rotate(${rot}) scale(${s})`,L(0,0,0,170,'#8A5A3A',12)+P('M-70 -6Q0 -30 70 -6L60 8Q0 -10 -60 8Z','#9AA0A8',{stroke:'#4A4E56','stroke-width':3}));
// A week strip: seven squares, n filled, the seventh glowing gold at `g7`.
function week(t,cx,cy,sz,n,g7){
  let g='';const gap=sz*1.18,x0=cx-gap*3;
  for(let i=0;i<7;i++){const x=x0+i*gap,on=clamp(n-i);
    if(i<6)g+=R(x-sz/2,cy-sz/2,sz,sz,8,mix('#2A2638','#7CD4FF',on),{stroke:'#F6EFDC','stroke-width':4});
    else g+=glow(x,cy,sz*1.4,'#FFD86B',.7*g7)+R(x-sz/2,cy-sz/2,sz,sz,8,mix('#2A2638','#FFD86B',g7),{stroke:'#FFF4C8','stroke-width':5});
    g+=T(x,cy+sz*.18,String(i+1),{size:sz*.5,font:'Segoe UI Black',weight:900,anchor:'middle',fill:i<6?(on>.5?INK:'#8A86A0'):(g7>.5?INK:'#8A86A0')});}
  return g;
}

// Ground tufts drawn inside the sheet (under the labels, unlike the engine's fore layer). Vertical only below the art.
function tufts(t,seed,cols,flowers=[]){
  if(!E.VERT)return '';
  const r=rng(seed);let g='';
  for(let i=0;i<70;i++){const x=-40+r()*2000,y=vy(1230)+r()*(1780-vy(1230)),h=18+r()*30,c=cols[i%cols.length],sw=Math.sin(t*1.1+i)*3;
    g+=P(`M${(x-8).toFixed(0)} ${y.toFixed(0)}l${(4+sw).toFixed(1)} ${-h.toFixed(0)}M${x.toFixed(0)} ${y.toFixed(0)}l${(sw).toFixed(1)} ${(-h*1.2).toFixed(0)}M${(x+8).toFixed(0)} ${y.toFixed(0)}l${(-4+sw).toFixed(1)} ${-h.toFixed(0)}`,'none',{stroke:c,'stroke-width':4,opacity:.8});
    if(flowers.length&&i%5===0)g+=glow(x,y-h*1.2,14,flowers[i%flowers.length],.5)+C(x,y-h*1.2,4,flowers[i%flowers.length]);}
  return g;
}

// ---------- vertical layout ----------
// Every vertical sheet is filmed wide (zoom .84 on 960,560), so frame position (fx, fy) maps to fixed sheet coordinates.
// Vertical frame zones: verse cards 170-~560, art 560-1180, captions 1220-1340, lower labels 1380-1560.
const vx=f=>960+(f-540)/.84, vy=f=>560+(f-1010)/.84;
const X=(l,f)=>hv(l,vx(f)), Y=(l,f)=>hv(l,vy(f)), SZ=(l,f)=>hv(l,f/.84);
const tag=(t,at,x,y,s,size,id,o={})=>piece(t,at,x,y,label(x,y-size*.81,s,Object.assign({size,anchor:'middle'},o)),id,1.3);
const WIDE=[960,560,.84];

// ---------- 0. Cold open: a boss who says stop ----------
function coldOpen(t){
  let g=stars(t,.4,300)+fireflies(t,0,-600,1920,700,'#FFE9A8',14,.4);
  const glowIn=ease.out(prog(t,0,AT.boss+1)),four=ease.inOut(prog(t,AT.fourth-.2,AT.fourth+.8));
  const lit=k=>k===3?glowIn*(.6+.6*four*(1+.15*Math.sin(t*3))):glowIn*(.6-.45*four);
  g+=`<path d="${ridge(5,hv(930,vy(1250)),14,260)}" fill="#1E1A24"/>`;
  const cy=Y(560,860),s=hv(1,1.3);
  const tf=`translate(960 ${cy}) scale(${s}) translate(-960 -560)`;
  // The fourth line is the last but one on the left tablet.
  g+=piece(t,0,960,cy,G(tf,tablets(960,560,1,lit)+mark(scribble(755,668,230,52,4),ease.inOut(prog(t,AT.fourth,AT.fourth+.8)),CORAL,8)),1,1.2);
  // Top band (gone before the verse): a boss who says stop, one day in seven.
  g+=fade(t,AT.remember-.25,
    tag(t,AT.boss+.2,960,Y(150,260),'A BOSS WHO SAYS STOP?',SZ(40,46),2,{bg:CORAL,rot:-2})+
    G('',week(t,960,Y(260,400),SZ(70,84),7*ease.inOut(prog(t,AT.oneDay,AT.oneDay+1.4)),ease.out(prog(t,AT.oneDay+1.4,AT.oneDay+2))),prog(t,AT.oneDay-.2,AT.oneDay+.2)));
  g+=verse(t,AT.remember-.15,420,40,['Remember the Sabbath day, to keep it holy.'],'EXODUS 20:8 ESV',{size:54,hl:'to keep it holy.',hlAt:AT.keepHoly[0],hlDur:AT.keepHoly[1]-AT.keepHoly[0],seed:5,id:4});
  const ly=Y(900,1420),half=hv(220,300);
  g+=fade(t,AT.israel-.4,
    tag(t,AT.most,960,ly,"A LIST OF DON'TS?",SZ(36,44),5,{rot:-2})+strike(960-half,ly,960+half,ease.inOut(prog(t,AT.gift-.4,AT.gift+.1)))+
    tag(t,AT.gift,960,Y(990,1530),'IT STARTED AS A GIFT',SZ(44,50),6,{bg:CORAL}));
  return g;
}

// ---------- 1. Egypt: nobody rested ----------
function egypt(t,lt){
  let g=glow(1400,180,360,'#FFB04C',.7)+C(1400,180,90,'#FFC870',{opacity:.9});
  g+=P('M260 760L560 330L860 760Z','#8A3A1E')+P('M560 330L860 760L700 760Z','#6A2A14')+P('M1060 760L1260 470L1460 760Z','#7A3218')+P('M1260 470L1460 760L1360 760Z','#5A2210');
  g+=`<path d="${ridge(11,760,10,240)}" fill="#B0602E"/><path d="${ridge(12,860,8,180)}" fill="#8E4A22"/>`+tufts(t,1,['#7A3E1C','#A0582A','#6A3214']);
  // The stack grows on "Bricks today" and again on "more bricks".
  const n=Math.round(4+8*ease.out(prog(t,AT.bricks,AT.bricks+.8))+10*ease.out(prog(t,AT.more,AT.more+1.2)));
  g+=bricks(X(1460,520),Y(820,1150),n);
  const bend=12+Math.sin(E.held(t,8)*2.5)*4;
  g+=crowd(t,X(260,120),Y(900,1180),hv(5,3),hv(170,170),.9,{lean:bend,aura:'#FFB04C',auraOp:.25});
  g+=tag(t,AT.israel+.2,960,Y(120,330),'EGYPT',SZ(46,56),1);
  g+=tag(t,AT.nobody,960,Y(220,450),'NO DAY OFF. EVER.',SZ(36,46),2,{bg:CORAL,rot:-2});
  g+=tag(t,AT.noEnd,X(1400,540),Y(900,1430),'NO END IN SIGHT',SZ(34,42),3);
  return g;
}

// ---------- 2. Six days, then stop: everyone in the house rests ----------
// Household row (vertical: two rows, clear of captions and the right-hand buttons).
function household(t,lt){
  let g=glow(960,300,900,'#FFE9B0',.35)+fireflies(t,0,-600,1920,2300,'#FFF2C8',14,.4);
  g+=`<path d="${ridge(21,hv(860,vy(1150)),12,240)}" fill="#7A9A4A"/>`+tufts(t,2,['#6A8A3E','#8AAA5A','#5A7A30'],['#FFD45E','#FFFFFF']);
  // New rhythm: six days fill, the seventh glows (art zone, before the household arrives).
  const wk=week(t,960,Y(560,720),SZ(80,96),6*ease.inOut(prog(t,AT.rhythm,AT.rhythm+1.2)),ease.out(prog(t,AT.fullStop,AT.fullStop+.6)));
  g+=fade(t,AT.onIt-.3,G('',wk,prog(t,AT.now,AT.now+.4)));
  g+=fade(t,AT.onIt-.3,tag(t,AT.fullStop,960,Y(900,1430),'6 DAYS WORK · 1 DAY STOP',SZ(36,44),1));
  // Each member lights up as the verse names them.
  const lit=a=>t<a?0:.35+.55*ease.out(prog(t,a,a+.5));
  const row1=hv(860,vy(950)),row2=hv(860,vy(1180)),s=hv(.8,.78);
  const P1=[[hv(260,vx(150)),'you'],[hv(450,vx(300)),'son'],[hv(640,vx(450)),'daughter'],[hv(830,vx(600)),'male'],[hv(1020,vx(750)),'female']];
  let ppl='';
  P1.forEach(([x,w],i)=>{ppl+=person(t,x,row1,s*(i===0?1.08:i<3?.86:1),[1,0,3,4,2][i],{f:w==='daughter'||w==='female',aura:'#FFE36B',auraOp:lit(AT[w])});});
  const animals=ox(t,hv(1240,vx(200)),row2,hv(.75,.72),{aura:'#FFE36B',auraOp:lit(AT.livestock)})+donkey(t,hv(1490,vx(470)),row2,hv(.72,.7),{aura:'#FFE36B',auraOp:lit(AT.livestock)})+
    person(t,hv(1700,vx(720)),row2,s,4,{aura:'#FFE36B',auraOp:lit(AT.sojourner),flip:-1,tunic:'#E0A050',tunic2:'#8A5A2A'})+
    G('',L(hv(1745,vx(720)+45),row2-210,hv(1760,vx(720)+60),row2,'#6A4A2A',8),1);
  g+=G('',ppl+animals,ease.out(prog(t,AT.onIt-.4,AT.onIt+.4)));
  g+=verse(t,AT.six-.15,300,40,['Six days you shall labor, and do all your work,','but the seventh day is a Sabbath to the LORD your God.'],'EXODUS 20:9-10 ESV',{size:46,hl:'the seventh day is a Sabbath',hlAt:AT.seventh1[0],hlDur:AT.seventh1[1]-AT.seventh1[0],seed:9,id:2,end:AT.onIt-.1});
  g+=verse(t,AT.onIt-.05,200,40,['On it you shall not do any work, you, or your son, or your daughter,','your male servant, or your female servant, or your livestock,','or the sojourner who is within your gates.'],'EXODUS 20:10 ESV',{size:44,seed:10,id:3});
  // After the verse: who is on the list.
  g+=tag(t,AT.sons,960,Y(920,1420),'FAMILY · SERVANTS',SZ(34,42),4);
  g+=tag(t,AT.animals,960,Y(1000,1535),'ANIMALS · FOREIGNERS',SZ(34,42),5);
  g+=tag(t,AT.nobodyLeft,960,Y(150,360),'EVERYONE STOPS',SZ(46,56),6,{bg:CORAL,rot:-2});
  return g;
}

// ---------- 3. The seventh day: creation's rest ----------
function dayIcon(k,cx,cy,r,t){
  if(k===0)return glow(cx,cy,r*1.2,'#FFFBEA',.8)+[...Array(8)].map((_,i)=>{const a=i/8*6.283;return L(cx+Math.cos(a)*r*.3,cy+Math.sin(a)*r*.3,cx+Math.cos(a)*r*.62,cy+Math.sin(a)*r*.62,'#FFF6D0',5);}).join('');
