<script>
// The Ten Plagues of Egypt. Script: scripts/12-the-ten-plagues.md (ESV fill). Built like the Ten Commandments episodes
// (videos/the-tenth-commandment): a new setting every few seconds, the story acted by the round PPL figures, one slow
// camera move per shot, one label at a time, verse cards and the end card in hud. Every time comes from the spoken words
// (words.js), so the real narration re-times the episode. God is never a figure: light, wind, a voice. Death on the last
// night is a cold wind and a shadow, never a figure and never a body.
// Guides: .claude/skills/godward-episode/reference/scene-pacing.md, engine.md, taste.md. K.E is the ellipse helper (Ell).
const {G,R,C,L,P,T,prog,ease,lerp,mix,clamp,rng}=K, Ell=K.E;
const {hash,piece,glow,label,mark,scribble,strip,tape}=S;
const {cue,end,after,shot,verse,fade,hv,fireflies,INK,YEL,CORAL}=E;
const GOLD='#E8B53A', NILE='#2E7AB8', BLOOD='#B0182A', GREEN='#1E9A5A';

const AT={
  river:cue('A river turns'), frogs0:cue('Frogs fill'), hail0:cue('Hail falls'), dark0:cue('And then comes'), most:cue('Most people'), angry:cue('An angry God'),
  read:cue('But read it'), contest:cue("It's a contest"), losing:cue("Egypt's gods are losing"),
  gens:cue('For generations'), sent:cue('Then God sent'), message:cue('one message'), laughed:cue('Pharaoh laughed'), v52:after('Pharaoh laughed',1,.35),
  question:cue('That question'), tenTimes:cue('Ten times'),
  nile:cue('First, the Nile'), worship:cue('They worshipped'), v720:after('fed the whole country',1,.35), fish:cue('The fish died'), nothing:cue('could do nothing'),
  magic:cue("Pharaoh's magicians"), shrug:cue('shrugged it off'),
  frogs:cue('Then frogs'), bedroom:cue("king's own bedroom"), goddess:cue('Egypt had a goddess'), everywhere:cue('were everywhere'),
  gnats:cue('Then gnats'), failed:cue('This time the magicians'), v819:after('told Pharaoh so',1,.35), flies:cue('Then swarms'), goshen:cue('But not in Goshen'),
  turn:cue("That's the turn"), line:cue('draws a line'), livestock:cue("Egypt's livestock"), spared:cue("Israel's are spared"), boils:cue('Then boils'),
  cantStand:cue("can't even stand"), still:cue('And still'),
  hail:cue('Then hail'), worst:cue('The worst storm'), locusts:cue('Locusts eat'), green:cue('Not one green'), darkness:cue('then, darkness'), v1022:after('then, darkness',1,.35),
  sunGod:cue("Egypt's greatest god"), gone:cue('simply gone'),
  whyTen:cue('So why ten'), saysWhy:cue('God says why'), v1212:after('says why himself',1,.35), aimed:cue('Every plague was aimed'),
  riv6:cue('The river. The land'), land6:cue('The land. The cattle'), cat6:cue('The cattle. The sky'), sky6:cue('The sky. The sun'), sun6:cue('The sun. One by'), powerless:cue('shown to be powerless'),
  last:cue('The last plague'), midnight:cue('At midnight'), firstborn:cue('every firstborn'), wayThrough:cue('But God gave'), lamb:cue('killed a lamb'), painted:cue('painted its blood'),
  v1213:after('on the doorframe',1,.35), night:cue('That night'), cry:cue('a great cry'), behind:cue('But behind the doors'), safe:cue('was safe'), morning:cue('By morning'), begging:cue('begging'),
  remember:cue("Remember Pharaoh's"), who2:cue('Who is the LORD'), knew:cue('Now all of Egypt'), soIsrael:cue('And so did Israel'),
  centuries:cue('Centuries later'), picture:cue('a picture of'), v57:after('something bigger',1,.35), rescue:cue('The rescue came first'), sea:cue('Then came the sea'),
  mountain:cue('And then, a mountain'), next:cue("But that's the next"),
};
AT.last1=WORDS[WORDS.length-1][2];

// ---------- framing helpers (vertical) ----------
const aim=(a,b,x,y,F,z)=>shot(a,b,x,y+(1010-F)/z,z), sq=p=>p*p;
const H=(x,y,z,F=1170)=>(a,b)=>[aim(a,b,x,y,F,z)];
const M=(x0,y0,z0,x1,y1,z1,F=1170,F1)=>(a,b)=>[[a,x0,y0+(1010-F)/z0,z0],[b,x1,y1+(1010-(F1??F))/z1,z1]];
const FY=1000, HS=2.7, VS=2.35;
const EDG=(cx,z)=>[cx-540/z+70,cx+540/z-70];

// ---------- people (videos/_kit/people.js) ----------
const TUN=[['#3DE0B8','#1787A8'],['#FFC24C','#E0623C'],['#B98CFF','#6A4CD8'],['#FF8FB1','#C8487A'],['#7CD4FF','#2F6FD0']];
const SKIN=[['#F5BE8E','#C4835E'],['#D9965E','#A86A3E'],['#B87444','#8A5230']], HAIR=['#2E1C52','#4A2A16','#1A1A2A'];
const pplOpts=(i,x,y,s,o={})=>{const [a,b]=TUN[i%5],[sk,sh]=SKIN[i%3],face=o.flip||o.face||1,f=o.f??(i%2===1);
  const q=Object.assign({x,y,s,face,f,tunic:a,tunic2:b,skin:sk,shade:sh,hair:HAIR[i%3],phase:i*.7},o);
  q.face=face;delete q.flip;if(!o.walk)delete q.walk;return q;};
const person=pplOpts, folk=(i,x,y,s,o={})=>PPL.fig(pplOpts(i,x,y,s,o));
// The recurring cast (same colours in every scene).
const CAST={
  moses:{tunic:'#E8DCC0',tunic2:'#8A6A40',skin:'#D9965E',shade:'#A86A3E',hair:'#ECE8DE',f:false,phase:.4},
  aaron:{tunic:'#7CD4FF',tunic2:'#2F6FD0',skin:'#D9965E',shade:'#A86A3E',hair:'#8A8A8A',f:false,phase:1.2},
  phar:{tunic:'#FFF6E0',tunic2:'#C8A060',skin:'#B87444',shade:'#8A5230',hair:'#1A1A2A',f:false,kid:true,phase:.9},
  mag1:{tunic:'#3A2A5A',tunic2:'#1A1030',skin:'#B87444',shade:'#8A5230',hair:'#1A1A2A',f:false,phase:2.1},
  mag2:{tunic:'#5A2A3A',tunic2:'#2A1018',skin:'#D9965E',shade:'#A86A3E',hair:'#1A1A2A',f:false,phase:2.9},
  dad:{tunic:'#3DE0B8',tunic2:'#1787A8',skin:'#D9965E',shade:'#A86A3E',hair:'#4A2A16',f:false,phase:.3},
  mum:{tunic:'#FF8FB1',tunic2:'#C8487A',skin:'#D9965E',shade:'#A86A3E',hair:'#2E1C52',f:true,phase:1.7},
  boy:{tunic:'#FFC24C',tunic2:'#E0623C',skin:'#D9965E',shade:'#A86A3E',hair:'#4A2A16',f:false,kid:true,phase:2.3},
  girl:{tunic:'#B98CFF',tunic2:'#6A4CD8',skin:'#D9965E',shade:'#A86A3E',hair:'#4A2A16',f:true,kid:true,phase:.8},
};
const who=(c,x,y,s,o={})=>pplOpts(0,x,y,s,Object.assign({},CAST[c],o));
const fig=(c,x,y,s,o={})=>PPL.fig(who(c,x,y,s,o));
const withProp=(q,prop)=>{const r=PPL.rig(q);return r.draw('back')+r.draw('body')+r.draw('head')+prop(r)+r.draw('front');};
// Moses with his staff, held upright in his far hand (the staff stands in front, under the gripping hand).
const staffAt=(x,y0,y1,k=1)=>L(x,y0,x+4,y1,'#4A2E16',18*k)+L(x,y0,x+4,y1,'#7A5432',11*k)+C(x,y0,12*k,'#7A5432');
function moses(x,y,s,o={}){
  const raise=o.raise||0,q=who('moses',x,y,s,Object.assign({},o));delete q.raise;
  const r0=PPL.rig(q),sh=r0.shoulder('near'),f=q.face||1;
  if(raise>0)q.near={x:sh[0]+f*lerp(40,70,raise)*s,y:sh[1]-lerp(30,75,raise)*s};
  else if(!q.near)q.near={x:x+f*62*s,y:y-96*s};
  const r=PPL.rig(q),h=r.hand('near');
  return r.draw('back')+r.draw('body')+r.draw('head')+staffAt(h[0],h[1]-lerp(110,150,raise)*s,lerp(y,h[1]+130*s,raise),s/2.4)+r.draw('front');
}
// Pharaoh: a striped headcloth (nemes) in gold and blue, and a broad collar.
// Drawn in the head's three-quarter view (the face looks toward +x): the cap stops above the brows, the back cloth
// hangs behind the head and the front lappet falls beside the cheek, so the eyes and mouth stay clear. It turns
// with the head (r.hf) as well as the body.
function nemes(r,k=1){const [x,y]=r.head,s=r.s,f=r.face*(r.hf||1),B='#2A4AA8',ED={stroke:'#6A4A12','stroke-width':4},cid=S.nid(),
    CAP='M-62 -12Q-72 -78 -2 -82Q64 -80 66 -26Q32 -42 -8 -32Q-40 -24 -62 -12Z';
  return G(`translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${(s*f).toFixed(3)} ${s.toFixed(3)})`,
    P('M-58 -22Q-76 30 -68 80L-34 80Q-42 30 -30 -14Z',GOLD,ED)+[0,1,2].map(i=>L(-70+i*1,4+i*24,-38+i*1,4+i*24,B,7)).join('')+
    `<clipPath id="${cid}"><path d="${CAP}"/></clipPath>`+P(CAP,GOLD)+
    `<g clip-path="url(#${cid})">`+[-46,-28,-10,8,26,44].map(xx=>L(xx,-90,xx+4,-10,B,7)).join('')+'</g>'+P(CAP,'none',ED)+
    P('M52 -30L68 -30L74 70L54 70Z',GOLD,ED)+[0,1,2].map(i=>L(54,0+i*24,72,0+i*24,B,6)).join('')+
    C(60,-36,6,B,{stroke:'#6A4A12','stroke-width':2})+P('M57 -40L60 -52L63 -40Z',GOLD,{stroke:'#6A4A12','stroke-width':2}));}
// A heart turned to stone: grey, cracked, with a cold sheen.
const stoneHeart=(cx,cy,r)=>P(`M${cx} ${cy+r*.9}C${cx-r*1.7} ${cy-r*.1} ${cx-r*.95} ${cy-r*1.35} ${cx} ${cy-r*.42}C${cx+r*.95} ${cy-r*1.35} ${cx+r*1.7} ${cy-r*.1} ${cx} ${cy+r*.9}Z`,'#7A7A84',{stroke:'#2A2A32','stroke-width':r*.12})+
  P(`M${cx-r*.1} ${cy-r*.4}L${cx+r*.15} ${cy}L${cx-r*.12} ${cy+r*.3}L${cx+r*.08} ${cy+r*.7}`,'none',{stroke:'#2A2A32','stroke-width':r*.09,'stroke-linejoin':'round'})+
  Ell(cx-r*.5,cy-r*.35,r*.28,r*.16,'#C8C8D2',{opacity:.6});
const collar=(r)=>{const [x,y]=r.neck,s=r.s;return Ell(x,y+10*s,46*s,16*s,'#2A4AA8')+Ell(x,y+8*s,40*s,11*s,GOLD);};
function pharaoh(x,y,s,o={},extra=()=>''){
  const q=who('phar',x,y,s,o),r=PPL.rig(q);
  return r.draw('back')+r.draw('body')+collar(r)+r.draw('head')+nemes(r)+extra(r)+r.draw('front');
}

// ---------- props and set pieces ----------
const jar=(x,y,s=1,c='#C8703A')=>P(`M${x-22*s} ${y}Q${x-34*s} ${y-40*s} ${x-16*s} ${y-62*s}H${x+16*s}Q${x+34*s} ${y-40*s} ${x+22*s} ${y}Z`,c,{stroke:'#6A2E14','stroke-width':4*s})+R(x-18*s,y-72*s,36*s,12*s,4*s,mix(c,'#000000',.15));
const column=(x,y,h,w=90,c='#E8D2A0')=>R(x-w/2,y-h,w,h,6,c,{stroke:'#8A6A3A','stroke-width':5})+R(x-w/2-16,y-h-30,w+32,34,6,mix(c,'#C8A060',.4),{stroke:'#8A6A3A','stroke-width':5})+
  P(`M${x-w/2-10} ${y-h}Q${x} ${y-h-60} ${x+w/2+10} ${y-h}`,'#5AA060',{stroke:'#2A5A2A','stroke-width':4})+R(x-w/2-10,y-24,w+20,24,4,mix(c,'#000000',.1))+
  [.3,.5,.7].map(u=>L(x-w/2+8,y-h*u,x+w/2-8,y-h*u,'#B88A4A',4,{opacity:.6})).join('');
const sunDisc=(x,y,r,k=1)=>glow(x,y,r*2.4,'#FFC24C',.35*k)+C(x,y,r,mix('#5A4A3A','#FFC24C',k),{stroke:'#8A5A12','stroke-width':6})+C(x,y,r*.7,mix('#4A3A2A','#FFE07A',k))+
  [-1,1].map(f=>P(`M${x+f*r*.9} ${y+r*.2}Q${x+f*r*1.8} ${y-r*.2} ${x+f*r*2.4} ${y+r*.6}Q${x+f*r*1.7} ${y+r*.5} ${x+f*r*.9} ${y+r*.7}Z`,mix('#4A3A2A','#E8B53A',k))).join('');
// Egypt's "gods" are carved things on pedestals (never a figure of the true God): a river emblem, a frog, a cow, a sky arch, the sun.
const pedestal=(x,y,w=150,h=120,c='#B89A6A')=>R(x-w/2,y-h,w,h,8,c,{stroke:'#6A5030','stroke-width':5})+R(x-w/2-14,y-h-16,w+28,20,6,mix(c,'#ffffff',.2),{stroke:'#6A5030','stroke-width':4});
function idol(kind,x,y,s=1,crack=0){
  let g='';const c='#C8B08A',dk='#6A5030';
  if(kind==='river')g=R(x-46*s,y-170*s,92*s,170*s,40*s,c,{stroke:dk,'stroke-width':5})+[0,1,2].map(i=>P(`M${x-32*s} ${y-120*s+i*36*s}q16 -14 32 0t32 0`,'none',{stroke:NILE,'stroke-width':8*s})).join('');
  else if(kind==='frog')g=frog(0,x,y,1.6*s,{stone:true});
  else if(kind==='cow')g=SC.animal(0,'cow',x,y,.75*s,{col:GOLD,face:1});
  else if(kind==='sky')g=P(`M${x-80*s} ${y}V${y-110*s}Q${x} ${y-200*s} ${x+80*s} ${y-110*s}V${y}Z`,'#3A5AA8',{stroke:dk,'stroke-width':5})+[0,1,2,3,4].map(i=>C(x-50*s+i*25*s,y-100*s-Math.sin(i/4*Math.PI)*40*s,6*s,'#FFE9A8')).join('');
  else if(kind==='sun')g=sunDisc(x,y-90*s,60*s,1);
  if(crack>0)g+=mark(`M${x-10*s} ${y-180*s}L${x+12*s} ${y-120*s}L${x-8*s} ${y-80*s}L${x+14*s} ${y-20*s}`,crack,'#1A1010',7*s);
  return g;
}
// A frog (feet at x,y; s=1 is about 60 wide). hop 0..1 lifts it; stone draws it as a carved statue.
function frog(t,x,y,s=1,o={}){
  const hop=o.hop||0,col=o.stone?'#B8A07A':(o.col||'#4AAA3A'),dk=o.stone?'#6A5030':'#1E5A1A',f=o.face||1,yy=y-hop*40*s;
  return G(`translate(${x} ${yy}) scale(${s*f} ${s})`,
    Ell(-14,-6,16,10,dk)+Ell(22,-4,12,8,dk)+Ell(0,-22,34,22,col,{stroke:dk,'stroke-width':3})+
    C(14,-40,11,col,{stroke:dk,'stroke-width':3})+C(-6,-40,11,col,{stroke:dk,'stroke-width':3})+C(15,-41,5,o.stone?dk:'#111')+C(-5,-41,5,o.stone?dk:'#111')+
    P('M2 -18Q14 -12 28 -20','none',{stroke:dk,'stroke-width':2.5})+(o.stone?'':Ell(-4,-16,12,6,'#8AD86A',{opacity:.6})));
}
// A swarm: n small marks drifting in a box. kind 'gnat' | 'fly' | 'locust'.
function swarm(t,x0,y0,w,h,n,kind,o={}){
  let g='';const col=o.col||(kind==='locust'?'#7A5A2A':'#1A1A1A'),seed=o.seed||1,dx=o.dx||0;
  for(let i=0;i<n;i++){const u=hash(i,seed),v=hash(i,seed+3),sp=.6+hash(i,seed+5);
    const x=x0+((u*w+t*dx*sp+Math.sin(t*3*sp+i)*30)%w+w)%w,y=y0+v*h+Math.cos(t*2.6*sp+i*1.3)*24;
    if(kind==='gnat')g+=C(x,y,3+hash(i,seed+7)*2,col,{opacity:.85});
    else if(kind==='fly')g+=Ell(x,y,6,4,col)+Ell(x-3,y-5,5,3,'#DDE6EE',{opacity:.6})+Ell(x+3,y-5,5,3,'#DDE6EE',{opacity:.6});
    else g+=G(`translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(-20+hash(i,seed+9)*40).toFixed(0)})`,Ell(0,0,16,5,col)+Ell(-2,-4,12,4,'#B8A06A',{opacity:.7})+L(-8,2,-16,10,col,2)+L(4,2,10,10,col,2));}
  return g;
}
// Hail with fire inside it, falling in slanted streaks.
function hailFall(t,x0,x1,y0,y1,n,k=1){let g='';
  for(let i=0;i<n;i++){const u=hash(i,41),sp=900+hash(i,43)*500,y=y0+((t*sp+hash(i,47)*(y1-y0))%(y1-y0)),x=x0+u*(x1-x0)-(y-y0)*.25,r=8+hash(i,49)*10;
    g+=L(x+r*1.4,y-r*5,x,y,'#DDEEFF',r*.5,{opacity:.35*k})+C(x,y,r,'#EAF4FF',{opacity:.9*k,stroke:'#9AB8D8','stroke-width':2});
    if(i%3===0)g+=glow(x,y,r*3,'#FF8A3C',.6*k)+C(x,y,r*.5,'#FFB04C',{opacity:k});}
  return g;}
const lightning=(t,a,x,y0,y1)=>{const p=prog(t,a,a+.35);if(p<=0||p>=1)return '';let d=`M${x} ${y0}`,xx=x;for(let i=1;i<=6;i++){xx+=(hash(i,x|0)-.5)*120;d+=`L${xx} ${y0+(y1-y0)*i/6}`;}
  return P(d,'none',{stroke:'#F4F8FF','stroke-width':9,opacity:(1-p).toFixed(2)})+glow(xx,y1,300,'#CFE6FF',.6*(1-p));};
// God is never a figure: his presence is a soft oval of light, or rings of light going out.
const presence=(t,x,y,r,k=1)=>k<=0?'':glow(x,y,r*2.6,'#FFF6DA',.5*k)+glow(x,y,r*1.2,'#FFFFFF',.65*k)+
  Ell(x,y,r*.74,r,'none',{stroke:'#FFFBEA','stroke-width':8,opacity:(.75*k).toFixed(2)})+Ell(x,y,r*.6,r*.82,'#FFFBEA',{opacity:(.22*k*(1+.25*Math.sin(t*2))).toFixed(2)});
const xMark=(cx,cy,r,p)=>mark(`M${cx-r} ${cy-r}L${cx+r} ${cy+r}`,p*2,CORAL,10)+mark(`M${cx+r} ${cy-r}L${cx-r} ${cy+r}`,p*2-1,CORAL,10);
// A mud-brick house in the collage style (base centre x, ground y, scale s). Built from: brick courses on a plinth, a flat
// roof with a parapet and round beam ends, an optional upper room, a ladder to the roof, a palm-frond awning over the
// door, a lattice window, lamplight spilling from the door onto the ground, jars and a basket by the door, laundry on
// the roof, and smoke from a cooking fire. o: w/h (size factors), wall, lit 0..1, mark 0..1 (blood painted on the lintel
// and both posts, with a hyssop bunch and a bowl), egypt (whitewashed, blue trim, no awning), storey, ladder, cloth,
// smoke, seed, night (cooler, darker wall), dim 0..1 (an unlit house under the shadow).
function mudHouse(t,x,y,s,o={}){
  const sd=o.seed||((x*7+y)|0),r=rng(sd),W=300*s*(o.w||1),Hh=210*s*(o.h||1),lit=o.lit??1,mk=o.mark||0,eg=!!o.egypt,night=!!o.night;
  let wall=o.wall||(eg?'#EEE4CE':['#C89A62','#B8865A','#D4A872','#A87A4E'][sd%4]);
  if(night)wall=SC.mx(wall,'#3A3A58',.45);if(o.dim)wall=SC.mx(wall,'#1A1A28',o.dim*.6);
  const dk=SC.mx(wall,'#2A1808',.45),lt=SC.mx(wall,'#FFF4DC',.25),x0=x-W/2,top=y-Hh;
  let g='';
  // upper room (set back to one side)
  if(o.storey){const uw=W*.45,ux=o.storey>0?x0+W-uw-14*s:x0+14*s,uh=Hh*.55;
    g+=R(ux,top-uh,uw,uh+6*s,4*s,SC.mx(wall,'#000000',.06),{stroke:dk,'stroke-width':4*s})+R(ux+uw*.35,top-uh*.7,uw*.3,uh*.45,uw*.12,lit?SC.mx('#2A1C14','#FFD27A',.8*lit):'#2A1C14',{stroke:dk,'stroke-width':3*s})+
      R(ux-6*s,top-uh-10*s,uw+12*s,14*s,3*s,lt,{stroke:dk,'stroke-width':3*s});}
  // main block, plinth, brick courses (offset rows, a few bricks a shade darker or lighter)
  g+=R(x0,top,W,Hh,4*s,wall,{stroke:dk,'stroke-width':5*s})+R(x0-4*s,y-22*s,W+8*s,24*s,3*s,SC.mx(wall,'#5A3A1E',.3));
  if(!eg){for(let row=0;row<Math.floor(Hh/(26*s))-1;row++){const yy=top+14*s+row*26*s;g+=L(x0+6*s,yy,x0+W-6*s,yy,dk,1.6*s,{opacity:.35});
    for(let bx=x0+(row%2?18:44)*s;bx<x0+W-10*s;bx+=52*s){g+=L(bx,yy,bx,yy+26*s,dk,1.4*s,{opacity:.3});if(r()<.18)g+=R(bx+3*s,yy+3*s,46*s,20*s,2*s,r()<.5?lt:SC.mx(wall,'#5A3A1E',.2),{opacity:.55});}}}
