    P('M92 -62Q128 -78 150 -50Q162 -30 160 -6Q158 14 140 16Q120 18 110 2Q94 -20 92 -62Z',F2,{stroke:'#FFF6D0','stroke-width':3})+

// A carved idol, feet (base) at (x, y), height h. o.gold foil, o.stone grey, o.mouth (0..1) scribbles the mouth shut.
function idol(t,x,y,h,o={}){

// ---------- ACT 0: half a log (Isaiah 44) ----------
// Rebuilt with the scenery kit (_kit/scenery.js), as ep. 6 floodS / ep. 7 rainbowArk: the carpenter big (PPL s ~2.6,
// 35-45% of the frame), every place layered in depth (sky -> range -> hills -> mid ground -> subjects -> foreground),
// life in every shot (birds, a goat, a hen, smoke, sparks, steam, dust in the sunbeam, people in the market), and
// each scene its own foreground under the captions (wood chips and ferns, shavings, a rug, cobbles, flagstones).
const FY=1000, CS=2.7;                                   // feet line and scale of the big figures
const F2=(x,z,F=1190,fy=FY)=>[x,fy+(1010-F)/z,z];          // frame: sheet point (x, fy) lands at frame height F

  CL.forEach(([dx,dy,r])=>up+=C(x+dx-18,top+dy+20,r,'#2E4E20'));
  CL.forEach(([dx,dy,r])=>up+=C(x+dx,top+dy,r,'#46702A'));
  CL.forEach(([dx,dy,r],i)=>up+=C(x+dx+r*.22,top+dy-r*.26,r*.6,i%2?'#7EA03A':'#9AB848',{opacity:.8}));
