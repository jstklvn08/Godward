// ---------- shared pieces ----------

function tablet(x,y,w,h,first,lit,seed){
  const r=rng(seed);let g=G(`translate(${x} ${y})`,P(slab(w,h),'#7E7A70')+P(slab(w-24,h-24),'#9C988C')+
    P(slab(w-24,h-24),'none',{stroke:'#5E5A52','stroke-width':3,opacity:.5}));
  for(let i=0;i<5;i++){

    g+=glow((x0+x1)/2,ly,(x1-x0)*.6,'#FFD86B',.35*on);

    g+=P(d,'none',{stroke:'#4A4740','stroke-width':5,opacity:.8})+P(d,'none',{stroke:'#FFE9A8','stroke-width':3,opacity:Math.min(1,.12+.88*on).toFixed(3)});
  }

}
const tablets=(cx,cy,s,lit)=>G(`translate(${cx} ${cy}) scale(${s}) translate(${-cx} ${-cy})`,
  glow(cx,cy,560,'#FFD86B',.12)+tablet(cx-205,cy,380,560,0,lit,21)+tablet(cx+205,cy,380,560,5,lit,33));

let foilN=0;

function calf(t,x,y,s){
  const [F2,def]=foil(t);
  const body=def+R(-120,64,250,22,4,'#5A4A3A')+R(-138,84,286,22,4,'#4A3C30')+

    R(-74,6,24,54,6,'#B07E1E')+R(52,6,24,54,6,'#B07E1E')+R(-96,6,28,56,6,F2)+R(26,6,28,56,6,F2)+
    P('M-98 -4Q-104 -50 -60 -56Q-10 -60 30 -76Q66 -92 92 -70Q110 -54 108 -20Q106 18 80 22H-80Q-98 18 -98 -4Z',F2,{stroke:'#FFF6D0','stroke-width':3})+
    P('M84 4Q100 34 120 18L112 -6Z','#C08A22')+
    P('M92 -62Q128 -78 150 -50Q162 -30 160 -6Q158 14 140 16Q120 18 110 2Q94 -20 92 -62Z',F2,{stroke:'#FFF6D0','stroke-width':3})+
    Ell(150,4,16,12,'#D9A43A')+C(146,4,2.6,'#5A3A0A')+C(156,4,2.6,'#5A3A0A')+
    P('M110 -62Q76 -66 66 -96Q84 -82 112 -74Z','#FFF1B0',{stroke:'#E8D58A','stroke-width':2})+

// A carved idol, feet (base) at (x, y), height h. o.gold foil, o.stone grey, o.mouth (0..1) scribbles the mouth shut.
function idol(t,x,y,h,o={}){
  const k=h/240;let fill=o.stone?'#B8B2A4':'#9A6A3C',def='',st=o.stone?'#6A665C':'#5A3A1C';
  if(o.gold){[fill,def]=foil(t+x*.01);st='#8A5A12';}
  let g=def+R(x-62*k,y-30*k,124*k,30*k,4,o.gold?'#8A5A12':st)+
    P(`M${x-52*k} ${y-30*k}L${x-40*k} ${y-150*k}Q${x} ${y-172*k} ${x+40*k} ${y-150*k}L${x+52*k} ${y-30*k}Z`,fill,{stroke:st,'stroke-width':3});
  if(!o.gold)for(let i=0;i<4;i++)g+=P(`M${x-30*k+i*20*k} ${y-140*k}Q${x-24*k+i*20*k} ${y-90*k} ${x-32*k+i*20*k} ${y-40*k}`,'none',{stroke:o.stone?'#8A867A':'#6A4422','stroke-width':3,opacity:.6});
  g+=P(`M${x-40*k} ${y-110*k}Q${x} ${y-80*k} ${x+40*k} ${y-110*k}`,'none',{stroke:st,'stroke-width':6});
  g+=C(x,y-200*k,46*k,fill,{stroke:st,'stroke-width':3})+P(`M${x-40*k} ${y-222*k}L${x-28*k} ${y-262*k}L${x-10*k} ${y-236*k}L${x} ${y-270*k}L${x+10*k} ${y-236*k}L${x+28*k} ${y-262*k}L${x+40*k} ${y-222*k}Z`,fill,{stroke:st,'stroke-width':3});
  g+=Ell(x-16*k,y-204*k,7*k,4*k,'#2A1A0A')+Ell(x+16*k,y-204*k,7*k,4*k,'#2A1A0A')+L(x-14*k,y-180*k,x+14*k,y-180*k,'#2A1A0A',4);
  return g;
}

// An axe held at (hx, hy), pointing along angle a (radians, 0 = right); the blade faces the swing.
const axe=(hx,hy,a,len=110)=>{const c=Math.cos(a),s=Math.sin(a),x0=hx-c*36,y0=hy-s*36,x1=hx+c*len,y1=hy+s*len,nx=-s,ny=c;
  return L(x0,y0,x1,y1,'#6A4422',11)+P(`M${(x1-c*12-nx*6).toFixed(1)} ${(y1-s*12-ny*6).toFixed(1)}L${(x1-c*16+nx*40).toFixed(1)} ${(y1-s*16+ny*40).toFixed(1)}L${(x1+c*22+nx*44).toFixed(1)} ${(y1+s*22+ny*44).toFixed(1)}L${(x1+c*14-nx*6).toFixed(1)} ${(y1+s*14-ny*6).toFixed(1)}Z`,'#B8C2CA',{stroke:'#4A5460','stroke-width':3});};

  G(`rotate(${(a*57.3).toFixed(1)} ${(hx+c*78).toFixed(1)} ${(hy+s*78).toFixed(1)})`,R(hx+c*78-16,hy+s*78-30,32,60,8,'#9A6A3C',{stroke:'#5A3A1C','stroke-width':3}));};
const candle=(t,x,y,i=0)=>R(x-9,y-56,18,56,4,'#F2E6C8')+glow(x,y-70,70,'#FFC870',.6)+P(`M${x-6} ${y-58}Q${x+Math.sin(t*9+i)*4} ${y-92} ${x+6} ${y-58}Z`,'#FFD86B');
const tent=(x,y,c,k=1)=>P(`M${x-90*k} ${y}L${x} ${y-120*k}L${x+90*k} ${y}Z`,c)+P(`M${x} ${y-120*k}L${x-13*k} ${y}L${x+13*k} ${y}Z`,'#2A1A10');

  [0,1].map(i=>{let d=`M${x-w/2+40} ${y-14+i*28}`;for(let xx=x-w/2+40;xx<x+w/2-40-i*40;xx+=24)d+=`q6 -12 12 0t12 0`;return P(d,'none',{stroke:'#3A3A50','stroke-width':5});}).join(''));

// ---------- ACT 0: half a log (Isaiah 44) ----------
// A0. Opening: a man chops a tall tree at sunset; it falls on "tree".
function treeFall(t){
  let g=glow(1260,-260,1000,'#FFB04C',.6)+C(1260,-240,120,'#FFE2A0',{opacity:.92});
  for(let i=0;i<16;i++){const x=-80+i*134+(i%2)*30,h=440+hash(i,3)*420;g+=pine(x+70,780,h,['#2E3A1A','#3A4620','#26301A'][i%3]);}
  g+=gnd(11,760,'#5A6A26','#46561E');
