// A child on the hip at the big scale: the seat sits high and close so the carrier's arm bends under the child (a
// short forearm under the seat, mostly behind the child) instead of hanging as a long pale bar; the other arm rests at the side.
function carryHip(ad,ch,o={}){
  const q=Object.assign({dx:46,dy:-50},o),c0=PPL.carry(ad,ch,q),st=c0.rc.W([10,-2]);
  const rest=PPL.rig(Object.assign({},ad,{near:null,far:null})).hand('far');
  const c=PPL.carry(Object.assign({},ad,{near:{x:st[0],y:st[1]},nearBend:'down',far:{x:rest[0],y:rest[1]}}),ch,q),ra=c.ra,rc=c.rc;
  const armC=o.out?'farArm':'nearArm',other=o.out?'nearArm':'farArm';
  return ra.draw('shadow')+ra.draw('backHair')+ra.draw('farLeg')+ra.draw('farArm')+ra.draw('body')+ra.draw('nearArm')+ra.draw('head')+
    rc.draw('backHair')+rc.draw(other)+rc.draw('farLeg')+rc.draw('body')+rc.draw('head')+rc.draw(armC)+carryHand(ra);}

// A carved idol, feet (base) at (x, y), height h. o.gold foil, o.stone grey, o.mouth (0..1) scribbles the mouth shut.
function idol(t,x,y,h,o={}){
