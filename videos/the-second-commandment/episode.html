<script>
// The Ten Commandments, part 2: the second commandment. Script: scripts/03-the-second-commandment.md (ESV fill).
// Every time below comes from the spoken words (words.js), so a new narration re-times the episode.
// Guide: .claude/skills/godward-episode/reference/engine.md. K.E is the ellipse helper (Ell), window.E the engine.
// Layout: every sheet is filmed wide (zoom .84 on 960,560). Each sheet's art is drawn inside F(...), in vertical
// FRAME pixels (1080x1920): verse cards 170-~520, art 560-1180, captions 1220-1340 (kept clear), lower labels
// 1380-1560, ground below. Keep labels left of x 940 below y 800 (platform buttons). Landscape gets the same
// column, scaled down and centred (vertical is the only delivered cut).
const {G,R,C,L,P,T,prog,ease,lerp,mix,clamp,rng}=K, Ell=K.E;
const {hash,piece,glow,label,mark,scribble,arrow,strip,tape,torn}=S;
const {cue,end,span,shot,ridge,verse,fade,hv,stars,fireflies,INK,YEL,CORAL}=E;
const GOLD='#E8B53A', NEON='#2BF0FF';

const AT={
  // 0. half a log
  cuts:cue('A man cuts'), splits:cue('splits the log'), burns:cue('he burns'), dinner:cue('his dinner'),
  otherHalf:cue('The other half'), statue:cue('into a statue'), kneels:cue('kneels down'),
  prays:cue('He prays to it'), myGod:span('you are my god'), sameTree:cue('Same tree'), firewood:cue('is firewood'), hisGod:cue('is his god'),
  isaiah:cue('The prophet Isaiah'), joke:cue('as a joke'), question:cue('a real question'), whats:cue("What's actually wrong"),
  // 1. the second word
  rightAfter:cue('Right after'), second:cue('comes the second'), v204:cue('You shall not make'), carved:span('a carved image'),
  v205:cue('You shall not bow'), bowDown:span('bow down'), notMainly:cue("It's not mainly"), religions:cue('about other'), job:cue("first commandment's job"),
  which:cue('which God you'), how:cue('is about how'), rightGod:cue('Even the right God'), wrongWay:cue('the wrong way'),
  // 2. the list
  notice:cue('Notice the list'), sky:cue('sky'), land:cue('land and'), sea:cue('and sea'), whole:cue('the whole creation'), standIn:cue('stand in for'),
  // 3. no form
  why:cue('Why be so strict'), mountain:cue('Go back to the mountain'), moses:cue('Moses later'),
  thenLORD:cue('Then the LORD spoke'), noForm:span('saw no form'), onlyVoice:span('there was only a voice'),
  biggest:cue('Their biggest meeting'), shape:cue('saw a shape'), fireWords:cue('Just fire'), lookAt:cue('something to look at'), listen:cue('someone to listen'),
  // 4. smaller and quieter
  problem:cue("So here's the problem"), smaller:cue('It makes God smaller'), carve1:cue('anything you carve'),
  quieter:cue('it makes God quieter'), putIn:cue('what you put into it'),
  calf:cue('Remember the golden calf'), feast:cue('a feast to the LORD'), replacing:cue("weren't replacing"), hold:cue('trying to hold him'),
  godHold:cue('A god you can hold'), control:cue('can control'), sinaiSpeaks:cue('The God of Sinai'), ratherNot:cue('rather not hear'),
  // 5. the image he already made
  surprise:cue("But here's the surprise"), already:cue('already has an image'), soGod:cue('So God created'), ownImage:span('in his own image'),
  maleFemale:cue('male and female'), notGold:cue("isn't gold or wood"), people:cue("it's people"),
  christians:cue('Christians have long'), dontCarve:cue("you don't carve"), meetIt:cue('You meet it'), nextTo:cue('the person next to you'),
  // 6. the ones we still carve
  mayNever:cue('We may never'), stillCarve:cue('we still carve'), notWood:cue('just not with wood'),
  agrees:cue('always agrees'), neverSays:cue('never says what'), easy:cue('easy to live with'), tooSmall:cue('much too small'),
  // 7. four against thousands
  endsWarning:cue('ends with a warning'), echoes:cue('echoes'), third:cue('third and fourth'), promise:cue('comes a promise'),
  showing:cue('but showing steadfast'), steadfast:span('steadfast love to thousands'), fourGen:cue('Four generations'), against:cue('against thousands'),
  heavy:cue('warning is heavy'), heavier:cue('mercy is heavier'), knife:cue('put down the carving knife'),
  made:cue('waiting to be made'), heard:cue('waiting to be heard'), nextTime:cue('And next time'), name:cue('about his name'),
};
AT.last=WORDS[WORDS.length-1][2];

// ---------- frame-space drawing ----------
// Sheet coordinates of the wide vertical camera: frame (fx, fy) = sheet (960+(fx-540)/.84, 560+(fy-1010)/.84).
const F=inner=>`<g transform="${E.VERT?`translate(${(960-540/.84).toFixed(2)} ${(560-1010/.84).toFixed(2)}) scale(${(1/.84).toFixed(5)})`:'translate(656 0) scale(.5625)'}">${inner}</g>`;
// A label that slaps on at `at`, centred on (x, y).
const tag=(t,at,x,y,s,size,id,o={})=>piece(t,at,x,y,label(x,y-size*.81,s,Object.assign({size,anchor:'middle'},o)),id,1.3);
const strike=(x0,y,x1,p)=>mark(`M${x0} ${y+6}L${x1} ${y-6}`,p,CORAL,9);
const xMark=(cx,cy,r,p)=>mark(`M${cx-r} ${cy-r}L${cx+r} ${cy+r}`,p*2,CORAL,10)+mark(`M${cx+r} ${cy-r}L${cx-r} ${cy+r}`,p*2-1,CORAL,10);
const WIDE=[960,560,.84];
// Ground in frame space, down to the bottom of the frame.
const groundF=(seed,y,fill,amp=12)=>`<path d="${ridge(seed,y,amp,200,-120,1200,2100)}" fill="${fill}"/>`;

// ---------- shared pieces (from part 1) ----------
const slab=(w,h)=>`M${-w/2} ${h/2}V${-h/2+w*.32}Q${-w/2} ${-h/2} 0 ${-h/2}Q${w/2} ${-h/2} ${w/2} ${-h/2+w*.32}V${h/2}Z`;
const NUM=['I','II','III','IV','V','VI','VII','VIII','IX','X'];
function tablet(x,y,w,h,first,lit,seed){
  const r=rng(seed);let g=G(`translate(${x} ${y})`,P(slab(w,h),'#7E7A70')+P(slab(w-24,h-24),'#9C988C')+
    P(slab(w-24,h-24),'none',{stroke:'#5E5A52','stroke-width':3,opacity:.5}));
  for(let i=0;i<5;i++){
    const k=first+i,ly=y-h/2+w*.46+i*(h-w*.5)/5.2,x0=x-w/2+92,x1=x+w/2-34-r()*40,on=lit(k);
    let d=`M${x0} ${ly}`;for(let xx=x0;xx<x1;xx+=18)d+=`L${xx+9} ${ly+(r()-.5)*6}L${xx+18} ${ly}`;
    g+=glow((x0+x1)/2,ly,(x1-x0)*.6,'#FFD86B',.35*on);
    g+=T(x-w/2+60,ly+12,NUM[k],{size:34,font:'Georgia',weight:700,anchor:'middle',fill:mix('#4A4740','#FFF4C8',Math.min(1,on))});
    g+=P(d,'none',{stroke:'#4A4740','stroke-width':5,opacity:.8})+P(d,'none',{stroke:'#FFE9A8','stroke-width':3,opacity:Math.min(1,.12+.88*on).toFixed(3)});
  }
  return g;
}
// Two tablets centred on (cx, cy) at scale s (unscaled: 790 x 560).
const tablets=(cx,cy,s,lit)=>G(`translate(${cx} ${cy}) scale(${s}) translate(-960 -560)`,
  glow(960,560,560,'#FFD86B',.12)+tablet(755,560,380,560,0,lit,21)+tablet(1165,560,380,560,5,lit,33));
function mountain(seed,px,py,fill,steep){
  const r=rng(seed*91+7),pts=[];
  for(let x=-140;x<=1220;x+=18){const d=Math.abs(x-px)/(520*steep);pts.push([x,py+Math.pow(d,1.25)*420+(r()-.5)*14]);}
  return P('M'+pts.map(p=>p[0].toFixed(0)+' '+Math.min(p[1],2100).toFixed(0)).join('L')+'L1220 2100L-140 2100Z',fill);
}
let foilN=0;
const foil=(t)=>{const id='foil'+(foilN++),sh=.5+.5*Math.sin(t*1.7);
  return [`url(#${id})`,`<linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF1B0"/><stop offset="${(.3+.2*sh).toFixed(2)}" stop-color="${GOLD}"/><stop offset="1" stop-color="#8A5A12"/></linearGradient>`];};
function calf(t,x,y,s){
  const [F2,def]=foil(t);
  const body=def+R(-120,64,250,22,4,'#5A4A3A')+R(-138,84,286,22,4,'#4A3C30')+
    P('M-92 -18Q-124 0 -116 44','none',{stroke:GOLD,'stroke-width':7})+Ell(-116,50,9,14,'#C08A22')+
    R(-74,6,24,54,6,'#B07E1E')+R(52,6,24,54,6,'#B07E1E')+R(-96,6,28,56,6,F2)+R(26,6,28,56,6,F2)+
    P('M-98 -4Q-104 -50 -60 -56Q-10 -60 30 -76Q66 -92 92 -70Q110 -54 108 -20Q106 18 80 22H-80Q-98 18 -98 -4Z',F2,{stroke:'#FFF6D0','stroke-width':3})+
    P('M84 4Q100 34 120 18L112 -6Z','#C08A22')+
    P('M92 -62Q128 -78 150 -50Q162 -30 160 -6Q158 14 140 16Q120 18 110 2Q94 -20 92 -62Z',F2,{stroke:'#FFF6D0','stroke-width':3})+
    Ell(150,4,16,12,'#D9A43A')+C(146,4,2.6,'#5A3A0A')+C(156,4,2.6,'#5A3A0A')+
    P('M110 -62Q76 -66 66 -96Q84 -82 112 -74Z','#FFF1B0',{stroke:'#E8D58A','stroke-width':2})+
    P('M140 -66Q174 -72 182 -104Q166 -84 138 -76Z','#FFF1B0',{stroke:'#E8D58A','stroke-width':2});
  return G(`translate(${x} ${y}) scale(${s})`,body);
}
const TUN=[['#3DE0B8','#1787A8'],['#FFC24C','#E0623C'],['#B98CFF','#6A4CD8'],['#FF8FB1','#C8487A'],['#7CD4FF','#2F6FD0']];
function crowd(t,x0,y,n,gap,s,o={}){
  let g='';
  for(let i=0;i<n;i++){
    const tr=o.tremble?(hash(Math.floor(t*12),i)-.5)*o.tremble:0,[a,b]=TUN[(i+(o.shift||0))%5];
    g+=E.chubby(x0+i*gap+tr+(i%2)*10,y+(i%3)*12,s*(.92+.16*hash(i,4+(o.shift||0))),{f:i%2===1,flip:o.flip||(i%2?-1:1),tunic:a,tunic2:b,aura:o.aura||'#7CFFE6',auraOp:o.auraOp??.35,
      lean:o.lean||0,reach:o.reach||0,phase:i*.7,hair:['#2E1C52','#4A2A16','#1A1A2A'][i%3],skin:['#F5BE8E','#D9965E','#B87444'][(i+(o.shift||0))%3],shade:['#C4835E','#A86A3E','#8A5230'][(i+(o.shift||0))%3]});
  }
  return g;
}

// ---------- new pieces ----------
// A carved idol: feet at (x, y), height h. Hard shine, no glow of its own. o.gold for foil, o.mouth (0..1) circles the mouth.
function idol(t,x,y,h,o={}){
  const k=h/240;let fill='#9A6A3C',def='',st='#5A3A1C';
  if(o.gold){[fill,def]=foil(t+x*.01);st='#8A5A12';}
  let g=def+R(x-62*k,y-30*k,124*k,30*k,4,o.gold?'#8A5A12':'#5A3A1C')+
    P(`M${x-52*k} ${y-30*k}L${x-40*k} ${y-150*k}Q${x} ${y-172*k} ${x+40*k} ${y-150*k}L${x+52*k} ${y-30*k}Z`,fill,{stroke:st,'stroke-width':3});
  if(!o.gold)for(let i=0;i<4;i++)g+=P(`M${x-30*k+i*20*k} ${y-140*k}Q${x-24*k+i*20*k} ${y-90*k} ${x-32*k+i*20*k} ${y-40*k}`,'none',{stroke:'#6A4422','stroke-width':3,opacity:.6});
  g+=P(`M${x-40*k} ${y-110*k}Q${x} ${y-80*k} ${x+40*k} ${y-110*k}`,'none',{stroke:st,'stroke-width':6});
  g+=C(x,y-200*k,46*k,fill,{stroke:st,'stroke-width':3})+P(`M${x-40*k} ${y-222*k}L${x-28*k} ${y-262*k}L${x-10*k} ${y-236*k}L${x} ${y-270*k}L${x+10*k} ${y-236*k}L${x+28*k} ${y-262*k}L${x+40*k} ${y-222*k}Z`,fill,{stroke:st,'stroke-width':3});
  g+=Ell(x-16*k,y-204*k,7*k,4*k,'#2A1A0A')+Ell(x+16*k,y-204*k,7*k,4*k,'#2A1A0A')+L(x-14*k,y-180*k,x+14*k,y-180*k,'#2A1A0A',4);
  if(o.mouth>0)g+=mark(scribble(x,y-180*k,30*k,18*k,7),o.mouth,CORAL,6)+(o.mouth>=1?xMark(x,y-180*k,12*k,prog(o.mouthX||0,0,1)):'');
  return g;
}
function flames(t,x,y,s,k){
  if(k<=0)return '';
  let g=glow(x,y-50*s,190*s,'#FF8A3C',.55*k);
  for(let i=0;i<7;i++){const f=Math.sin(t*9+i*1.7),xx=x+(i-3)*13*s,hh=(70+60*k+18*Math.sin(t*7+i))*s;
    g+=P(`M${xx-16*s} ${y}Q${xx-24*s+f*8*s} ${y-hh*.55} ${xx+f*10*s} ${y-hh}Q${xx+22*s} ${y-hh*.5} ${xx+16*s} ${y}Z`,['#FF5A2C','#FFB04C','#FFE36B'][i%3],{opacity:(.92*k).toFixed(2)});}
  return g;
}
const logPiece=(x,y,w,h)=>R(x-w/2,y-h/2,w,h,h/2,'#8A5A32',{stroke:'#5A3A1C','stroke-width':3})+
  L(x-w/2+20,y-h/6,x+w/2-30,y-h/5,'#6A4422',3)+L(x-w/2+30,y+h/6,x+w/2-20,y+h/7,'#6A4422',3)+
  Ell(x+w/2-h*.28,y,h*.28,h/2-3,'#D9A86A',{stroke:'#8A5A32','stroke-width':3})+Ell(x+w/2-h*.28,y,h*.14,h*.24,'none',{stroke:'#A8743E','stroke-width':3});
// The carpenter: a glowing round figure in a work tunic.
const CARP={tunic:'#FFC24C',tunic2:'#E0623C',hair:'#4A2A16',skin:'#D9965E',shade:'#A86A3E',aura:'#FFB04C',auraOp:.4};
const carpenter=(x,y,s,o={})=>E.chubby(x,y,s,Object.assign({},CARP,o));
// Workshop wall and floor (frame space).
function workshop(t){
  let g='';
  for(let i=0;i<9;i++)g+=R(-40+i*130,-200,124,1420,4,i%2?'#4E3220':'#563823',{opacity:.9})+L(-40+i*130+30,-200,-40+i*130+24,1220,'#3E2616',2);
  g+=R(60,520,960,16,3,'#3A2414');
  // hanging tools: saw, mallet, chisel
  g+=P('M150 560L150 620L320 620L320 600Z','#9AA6B0')+R(130,560,40,70,8,'#6A4422')+R(470,560,14,90,3,'#6A4422')+R(440,630,74,46,8,'#7A5230')+R(760,560,12,70,3,'#6A4422')+P('M760 630L772 630L770 690L762 690Z','#B8C2CA');
  g+=groundF(71,1185,'#6A4426',6)+groundF(72,1560,'#5E3C22',10)+L(-100,1300,1200,1296,'#5A3820',3)+L(-100,1460,1200,1466,'#5A3820',3)+L(-100,1650,1200,1644,'#5A3820',3);
  // shavings
  for(let i=0;i<34;i++){const x=30+hash(i,2)*1020,y=i<12?1200+hash(i,3)*90:1380+hash(i,3)*520;g+=P(`M${x} ${y}q14 -18 26 0q-10 10 -22 2`,'none',{stroke:'#E8C08A','stroke-width':5,opacity:.8});}
  return g+fireflies(t,0,-600,1920,700,'#FFD8A0',10,.25);
}

// ---------- 0. Cold open: half a log ----------
function coldOpen(t){
  let g=workshop(t);
  // chopping stump, bench
  g+=R(500,1120,170,70,10,'#7A4E2C',{stroke:'#4A2E18','stroke-width':4})+Ell(585,1120,85,16,'#C89458');
  g+=R(700,1050,230,26,4,'#7A4E2C',{stroke:'#4A2E18','stroke-width':3})+R(716,1076,18,108,3,'#5A3820')+R(896,1076,18,108,3,'#5A3820');
  // fire with a pot on a tripod
  const fk=ease.out(prog(t,AT.burns-.2,AT.burns+.8));
  g+=Ell(170,1176,110,20,'#3A2414')+L(80,1180,170,960,'#3A2414',8)+L(260,1180,170,960,'#3A2414',8);
  g+=flames(t,170,1170,1.1,fk);
  g+=L(170,960,170,1010,'#2A1A10',4)+P('M120 1010H220L208 1080Q170 1096 132 1080Z','#3A3A44',{stroke:'#1A1A22','stroke-width':3});
  if(t>AT.dinner)for(let i=0;i<3;i++){const k=(t*.5+i/3)%1;g+=P(`M${160+i*10} ${1000-k*140}q14 -20 0 -40`,'none',{stroke:'#FFF6E0','stroke-width':5,opacity:(.6*(1-k)).toFixed(2)});}
  // the log: whole on the stump, then split into two halves
  const sp=ease.inOut(prog(t,AT.splits,AT.splits+.5));
  if(sp<=0)g+=logPiece(585,1080,300,84);
  else{
    const lh=ease.inOut(prog(t,AT.burns-.7,AT.burns-.1)),rh=ease.inOut(prog(t,AT.otherHalf-.6,AT.otherHalf));
    const lx=lerp(510-sp*20,170,lh),ly=lerp(1080,1150,lh);
    if(lh<1||fk<.6)g+=G('',logPiece(lx,ly,150,80),(1-fk*.9).toFixed(2));
    else g+=logPiece(170,1160,110,40).replace(/#8A5A32/g,'#3A2414');
    const sx=lerp(660+sp*20,815,rh),sy=lerp(1080,1010,rh),morph=ease.inOut(prog(t,AT.statue,AT.statue+.8));
    if(morph<1)g+=G(`translate(${sx} ${sy}) rotate(${(-90*rh).toFixed(1)}) translate(${-sx} ${-sy})`,logPiece(sx,sy,150,80),(1-morph).toFixed(2));
    if(morph>0)g+=G('',idol(t,815,1050,250,{}),morph.toFixed(2));
    if(sp<1)g+=glow(585,1060,90,'#FFF6DA',.8*(1-sp));
  }
  // axe stroke
  const ax=prog(t,AT.splits-.35,AT.splits+.1);
  if(ax>0&&ax<1.6)g+=G(`rotate(${lerp(-70,0,((p)=>p*p*p)(ax)).toFixed(1)} 470 1150)`,L(470,1150,590,1000,'#6A4422',12)+P('M570 985L630 1000L606 1040L560 1020Z','#B8C2CA'),(1-prog(t,AT.splits+.3,AT.splits+.6)).toFixed(2));
  // the carpenter: faces the fire, then the statue, then kneels
  const kn=ease.inOut(prog(t,AT.kneels-.2,AT.kneels+.5)),toFire=t>AT.burns-.6&&t<AT.otherHalf-.6;
  g+=carpenter(lerp(400,560,kn),1190+kn*26,1.35,{flip:toFire?-1:1,lean:kn*16,reach:t>AT.prays?.55+.1*Math.sin(t*3):kn*.35});
  // same tree: the arrow and the labels
  g+=arrow(190,930,470,620,720,840,ease.inOut(prog(t,AT.sameTree,AT.sameTree+.9)),CORAL,9);
  g+=tag(t,AT.firewood,230,1420,'FIREWOOD',40,1);
  g+=tag(t,AT.hisGod,760,1420,'HIS GOD',40,2,{rot:2});
  g+=tag(t,AT.sameTree,500,1520,'SAME TREE.',46,3,{bg:CORAL,rot:-2});
  g+=tag(t,AT.isaiah,540,300,'ISAIAH 44: A JOKE',40,4);
  g+=tag(t,AT.whats,540,400,"WHAT'S WRONG WITH",46,5);
  g+=tag(t,AT.whats+.5,540,490,'A STATUE OF GOD?',52,6,{bg:CORAL});
  return F(g)+verse(t,AT.prays-.15,380,40,['He prays to it and says, Deliver me,','for you are my god!'],'ISAIAH 44:17 ESV',{size:50,hl:'for you are my god!',hlAt:AT.myGod[0]-.15,hlDur:AT.myGod[1]-AT.myGod[0]+.15,seed:3,id:9});
}

// ---------- 1. The second word ----------
function secondWord(t){
  let g=groundF(5,1210,'#1E1A24')+groundF(6,1420,'#2C2636',16)+groundF(4,1680,'#363042',18)+fireflies(t,0,1300,1080,600,'#FFE9A8',10,.35);
  const dn=ease.inOut(prog(t,AT.v204-.5,AT.v204+.3))*(1-ease.inOut(prog(t,AT.notMainly,AT.notMainly+.6)));
  const cy=lerp(880,990,dn),s=lerp(1.09,.74,dn);
  const lit=k=>k===1?1+.25*Math.sin(t*3)*prog(t,AT.second,AT.second+.6):k===0?.7:.08;
  g+=piece(t,0,540,cy,tablets(540,cy,s,lit)+G(`translate(540 ${cy}) scale(${s}) translate(-960 -560)`,mark(scribble(780,526,200,52,6),ease.inOut(prog(t,AT.second,AT.second+.8)),CORAL,9)),1,1.2);
  g+=fade(t,AT.v204-.3,tag(t,AT.rightAfter,540,330,'COMMANDMENT I: NO OTHER GODS',38,2)+tag(t,AT.second,540,430,'NOW: COMMANDMENT II',44,3,{bg:CORAL}));
  g+=fade(t,AT.which-.2,tag(t,AT.religions,540,1430,"OTHER RELIGIONS' IDOLS?",38,4)+
    strike(330,1430,750,ease.inOut(prog(t,AT.job-.2,AT.job+.3)))+tag(t,AT.job,540,1520,"THAT'S COMMANDMENT I",40,5,{bg:CORAL,rot:-2}));
  g+=tag(t,AT.which,540,1430,'I · WHICH GOD',44,6)+tag(t,AT.how,540,1520,'II · HOW',50,7,{bg:CORAL,rot:-2});
  g+=tag(t,AT.rightGod,540,330,'THE RIGHT GOD,',44,8)+tag(t,AT.wrongWay,540,420,'THE WRONG WAY',48,9,{bg:CORAL});
