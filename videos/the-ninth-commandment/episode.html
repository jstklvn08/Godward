<script>
// The Ten Commandments, part 9: the ninth commandment. Script: scripts/10-the-ninth-commandment.md (ESV fill).
// Every time below comes from the spoken words (words.js), so a new narration re-times the episode.
// Guide: .claude/skills/godward-episode/reference/engine.md. K.E is the ellipse helper (Ell), window.E the engine.
// Vertical-first: every sheet is filmed wide (zoom .84 on 960,560) and draws its art inside FR(), in FRAME
// coordinates (1080x1920: verse cards 170-~600, art 560-1180, captions 1220-1340, lower labels 1380-1560).
const {G,R,C,L,P,T,prog,ease,lerp,mix,clamp,rng}=K, Ell=K.E;
const {hash,piece,glow,label,mark,scribble,arrow,strip,tape,torn}=S;
const {cue,end,span,shot,ridge,verse,fade,hv,stars,fireflies,INK,YEL,CORAL}=E;
const GOLD='#E8B53A', NEON='#2BF0FF';

const AT={
  quiet:cue('A courtroom goes quiet'), standsUp:cue('A witness stands up'), points:cue('points at'),
  everyWord:cue('Every word he says'), lie1:cue('is a lie'), innocent:cue('innocent'), dies:cue('man dies'),
  really:cue('That really happened'), v2016:cue('You shall not bear'), neighborV:span('against your neighbor',1),
  justDont:cue("just don't lie"), readAgain:cue('read it again'), aboutNeighbor:cue("It's about your neighbor"), wordsDo:cue('what your words do'),
  ancient:cue('In ancient Israel'), cameras:cue('no cameras'), finger:cue('no fingerprints'), video:cue('no video'),
  trials:cue('Trials happened'), gate:cue('the city gate',1), oneThing:cue('rested on one thing'), safeguard:cue('safeguard'),
  only:cue('Only on the evidence'), twoW:cue('of two witnesses'), threeW:cue('of three witnesses'), established:end('be established'),
  oneVoice:cue('One voice'), partner1:cue('would need a partner'),
  butEven:cue('But even two'), bought:cue('can be bought'), ahab:cue('King Ahab'), naboth1:cue('named Naboth'), wouldnt:cue("wouldn't sell"),
  family:cue("family's land"), jezebel:cue('Queen Jezebel'), letters:cue('wrote letters'), worthless:cue('two worthless men'), accuse:cue('accuse him'),
  charge:cue('And the worthless men'), cursed:span('cursed God and the king'), itWasALie:cue('It was a lie'), onThatLie:cue('on that lie'),
  death:cue('put to death'), took:cue('took his vineyard'), ruleKept:cue('was kept'), foundPartner:cue('found a partner'),
  thatsWhy:cue("That's why the commandment"), againstN2:span('against your neighbor',2), bend:cue('bend the truth'), takes:cue('He takes something'),
  aName:cue('A name'), aHome:cue('A home'), aLife:cue('Sometimes a life'), christians:cue('Christians have long'), goodName:cue('good name'),
  centuries:cue('And centuries later'), night:cue('On the night'), looking:cue('looking for witnesses'), many:cue('For many bore'),
  notAgree:cue('did not agree'), match:cue('lies to match'), calledTruth:cue('called himself the truth'), silent:cue('stood silent'),
  dontStand:cue("We don't stand"), courtroom:cue("courtroom hasn't gone away"), chat:cue('group chat'), screenshot:cue('A screenshot'),
  comment:cue('A comment under'), rumour:cue('A rumour'), interesting:cue("because it's interesting"), justSaying:cue("I'm just saying"),
  fwToday:cue("That's false witness"), half:cue('half the story'), cropped:cue('cropped'), shared:cue("once it's shared"), takeBack:cue('take it back'),
  instead:cue('So what does God want'), therefore:cue('Therefore, having put'), speakTruth:span('speak the truth'), members:cue('Members of one'),
  tearDown:cue('Tear down'), body:cue('the body you belong'), ties:cue('Paul ties'), rather:cue('Rather, speaking'), inLove:span('speaking the truth in love'),
  opposite:cue('The opposite of false'), keepingQuiet:cue('keeping quiet'), speakingUp:cue('speaking up for someone'), notRoom:cue('not in the room'),
  before:cue('Before you pass'), isTrue:cue('Is it true'), isFair:cue('Is it fair'), toFace:cue('Would I say'),
  yourWords:cue('Your words are a witness'), makeSure:cue('Make sure'),
  remember:cue('And remember how'), notWithLie:cue('Not with a lie'), kingWanted:cue('With a king who wanted'), wasntHis:cue("wasn't his"),
  lastCmd:cue("That's the last commandment"), next:cue("and it's next"),
};
AT.last=WORDS[WORDS.length-1][2];

// ---------- frame-coordinate drawing ----------
// Vertical: the camera films every sheet wide (960,560 at .84), so this transform puts frame (x,y) exactly on screen.
// Landscape (not delivered): the same 1080x1920 drawing, scaled into the middle of the sheet.
const FR=inner=>G(E.VERT?`translate(960 560) scale(${(1/.84).toFixed(5)}) translate(-540 -1010)`:'translate(960 0) scale(.5625) translate(-540 0)',inner);
const tag=(t,at,x,y,s,size,id,o={})=>piece(t,at,x,y,label(x,y-size*.81,s,Object.assign({size,anchor:'middle'},o)),id,1.3);
const LO1=1420, LO2=1510;   // lower label rows (below the captions)
const WIDE=[960,560,.84];

// ---------- shared pieces (from part 1) ----------
const slab=(w,h)=>`M${-w/2} ${h/2}V${-h/2+w*.32}Q${-w/2} ${-h/2} 0 ${-h/2}Q${w/2} ${-h/2} ${w/2} ${-h/2+w*.32}V${h/2}Z`;
const NUM=['I','II','III','IV','V','VI','VII','VIII','IX','X'];
function tablet(x,y,w,h,first,lit,seed){
  const r=rng(seed);let g=G(`translate(${x} ${y})`,P(slab(w,h),'#7E7A70')+P(slab(w-24,h-24),'#9C988C')+
    P(slab(w-24,h-24),'none',{stroke:'#5E5A52','stroke-width':3,opacity:.5}));
  for(let i=0;i<5;i++){
    const k=first+i,ly=y-h/2+w*.46+i*(h-w*.5)/5.2,x0=x-w/2+92,x1=x+w/2-34-r()*40,on=lit(k);
    let d=`M${x0} ${ly}`;for(let xx=x0;xx<x1;xx+=18)d+=`L${xx+9} ${ly+(r()-.5)*6}L${xx+18} ${ly}`;
    g+=glow((x0+x1)/2,ly,(x1-x0)*.6,'#FFD86B',.35*on);
    g+=T(x-w/2+60,ly+12,NUM[k],{size:34,font:'Georgia',weight:700,anchor:'middle',fill:mix('#4A4740','#FFF4C8',on)});
    g+=P(d,'none',{stroke:'#4A4740','stroke-width':5,opacity:.8})+P(d,'none',{stroke:'#FFE9A8','stroke-width':3,opacity:(.12+.88*on).toFixed(3)});
  }
  return g;
}
const tablets=(cx,cy,s,lit)=>G(`translate(${cx} ${cy}) scale(${s}) translate(-960 -560)`,
  glow(960,560,560,'#FFD86B',.12)+tablet(755,560,380,560,0,lit,21)+tablet(1165,560,380,560,5,lit,33));
const xMark=(cx,cy,r,p)=>mark(`M${cx-r} ${cy-r}L${cx+r} ${cy+r}`,p*2,CORAL,10)+mark(`M${cx+r} ${cy-r}L${cx-r} ${cy+r}`,p*2-1,CORAL,10);
const strike=(x0,y,x1,p)=>mark(`M${x0} ${y+6}L${x1} ${y-6}`,p,CORAL,9);
let foilN=0;
const foil=(t)=>{const id='foil'+(foilN++),sh=.5+.5*Math.sin(t*1.7);
  return [`url(#${id})`,`<linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF1B0"/><stop offset="${(.3+.2*sh).toFixed(2)}" stop-color="${GOLD}"/><stop offset="1" stop-color="#8A5A12"/></linearGradient>`];};
const TUN=[['#3DE0B8','#1787A8'],['#FFC24C','#E0623C'],['#B98CFF','#6A4CD8'],['#FF8FB1','#C8487A'],['#7CD4FF','#2F6FD0']];
const SKIN=[['#F5BE8E','#C4835E'],['#D9965E','#A86A3E'],['#B87444','#8A5230']];
// One glowing person (modest tunic). k picks colours.
const person=(x,y,s,k,o={})=>E.chubby(x,y,s,Object.assign({f:k%2===1,tunic:TUN[k%5][0],tunic2:TUN[k%5][1],skin:SKIN[k%3][0],shade:SKIN[k%3][1],
  hair:['#2E1C52','#4A2A16','#1A1A2A'][k%3],aura:'#7CFFE6',auraOp:.35,phase:k*.7},o));
// A false witness: grey, no glow of its own, small and not frightening.
const grey=(x,y,s,o={})=>E.chubby(x,y,s,Object.assign({tunic:'#A4A4AE',tunic2:'#62626E',skin:'#C9B8A8',shade:'#9A8878',hair:'#3A3A44',eye:'#22222A',aura:null},o));
function crowd(t,x0,y,n,gap,s,o={}){let g='';for(let i=0;i<n;i++)g+=person(x0+i*gap+(i%2)*10,y+(i%3)*12,s*(.92+.16*hash(i,4)),i,Object.assign({flip:o.flip||1},o.p||{}));return g;}
function cutout(t,at,cx,cy,inner,name,id,o={}){
  const w=o.w||200,h=o.h||200;
  return piece(t,at,cx,cy,strip(cx-w/2,cy-h/2,w,h,id*7,o.paper||'#F6EFDC')+tape(cx,cy-h/2+4,80,-4)+inner+
    (name?label(cx,cy+h/2+14,name,{size:30,anchor:'middle',bg:o.bg||'#101014'}):''),id,1.4);
}
// A rubber-stamp word (coral box, slight rotation) that thumps on.
const stamp=(t,at,x,y,s,size,id,rot=-8)=>t<at?'':piece(t,at,x,y,G(`rotate(${rot} ${x} ${y})`,
  R(x-S.labelW(s,size)/2-8,y-size*.9,S.labelW(s,size)+16,size*1.8,6,'none',{stroke:CORAL,'stroke-width':7})+
  T(x,y+size*.36,s,{size,font:'Segoe UI Black',weight:900,anchor:'middle',fill:CORAL})),id,1.2);
// Speech bubble with scribbled (illegible) words.
function bubble(x,y,w,h,seed,fill='#F6EFDC',tailX=-1){
  const r=rng(seed);let g=P(`M${x-w/2+30} ${y+h/2}L${x+tailX*w*.25} ${y+h/2+44}L${x-w/2+90} ${y+h/2}Z`,fill)+R(x-w/2,y-h/2,w,h,h*.4,fill,{stroke:'#141416','stroke-width':4});
  for(let i=0;i<3;i++){const ly=y-h/2+h*(.3+i*.22);let d=`M${x-w/2+34} ${ly}`;for(let xx=x-w/2+34;xx<x+w/2-40-r()*50;xx+=16)d+=`L${xx+8} ${ly+(r()-.5)*7}L${xx+16} ${ly}`;g+=P(d,'none',{stroke:'#6A6458','stroke-width':4});}
  return g;
}
// A gold-foil crown: King Ahab is shown only as a crown.
function crown(t,x,y,s){
  const [F,def]=foil(t);
  return G(`translate(${x} ${y}) scale(${s})`,def+glow(0,-10,120,'#FFD86B',.25)+
    P('M-80 40L-92 -50L-46 -6L0 -70L46 -6L92 -50L80 40Z',F,{stroke:'#8A5A12','stroke-width':5})+R(-84,30,168,26,4,F,{stroke:'#8A5A12','stroke-width':4})+
    C(0,-6,11,CORAL)+C(-46,18,8,'#3FB0FF')+C(46,18,8,'#3FB0FF')+C(-92,-50,8,'#FFF1B0')+C(0,-70,8,'#FFF1B0')+C(92,-50,8,'#FFF1B0'));
}
// A sealed letter.
const letter=(x,y,rot)=>G(`rotate(${rot} ${x} ${y})`,R(x-70,y-46,140,92,4,'#F6EFDC',{stroke:'#8A7A5A','stroke-width':3})+
  P(`M${x-70} ${y-46}L${x} ${y+6}L${x+70} ${y-46}`,'none',{stroke:'#8A7A5A','stroke-width':3})+C(x,y+6,15,'#C0392B')+C(x,y+6,8,'#E35A4A'));
// Grass tufts and glow-flowers in the bottom band, drawn under the labels (the engine's fore layer would cover them).
function tufts(t,cols,seed,flowers=[]){
  let g='';for(let k=0;k<70;k++){const x=hash(k,seed)*1160-40,y=1560+Math.pow(hash(k,seed+1),.8)*380,sz=lerp(1,2.6,(y-1560)/380),sw=Math.sin(t*1.5+k)*3*sz,c=cols[k%3];
    for(let j=-1;j<=1;j++)g+=L(x+j*5*sz,y,x+j*9*sz+sw,y-(14+hash(k,j+5)*16)*sz,c,3*sz);
    if(flowers.length&&k%6===0){const fy=y-30*sz,col=flowers[k%flowers.length];g+=glow(x+sw,fy,14*sz,col,.6)+C(x+sw,fy,4*sz,col);}}
  return g;
}
// Vineyard: a low stone wall and rows of vines, in frame coordinates.
function vineyard(t,y0,o={}){
  let g=`<path d="M-40 ${y0}Q300 ${y0-30} 540 ${y0-10}T1120 ${y0-20}V2000H-40Z" fill="#2E7A3A"/>`;
  for(let r=0;r<5;r++){const y=y0+60+r*110,sc=.7+r*.12;
    g+=P(`M-40 ${y+40}Q540 ${y+20} 1120 ${y+40}`,'none',{stroke:'#1E5A2A','stroke-width':10});
    for(let i=0;i<7;i++){const x=40+i*170+(r%2)*85;if(x>1100)continue;
      g+=L(x,y+40,x,y-30*sc,'#6A4A2A',6)+C(x-20*sc,y-30*sc,30*sc,'#3FA04A')+C(x+22*sc,y-38*sc,28*sc,'#4CB858')+C(x,y-56*sc,26*sc,'#3A9A44');
      if(o.grapes!==false)for(let k=0;k<5;k++)g+=C(x-6*sc+(k%2)*12*sc,y-6*sc+Math.floor(k/2)*11*sc,7*sc,k%2?'#7A3AA8':'#9A4ACB');}}
  // the wall across the top
  for(let i=0;i<12;i++)g+=R(-40+i*100+(i%2)*10,y0-70,96,44,6,i%2?'#9C9488':'#B0A898',{stroke:'#6A6458','stroke-width':3})+R(-90+i*100,y0-28,96,40,6,i%2?'#B0A898':'#A49C90',{stroke:'#6A6458','stroke-width':3});
  return g;
}

// ---------- 0. Cold open: a witness stands up ----------
function coldOpen(t){
  let g=stars(t,.4,300);
  let f=R(-60,1180,1200,800,0,'#231C2C');
  for(let i=0;i<9;i++)f+=L(-60+i*150,1180,-300+i*210,1960,'#2E2638',4);
  f+=R(30,330,120,860,8,'#3A3346')+R(10,310,160,40,6,'#4A4258')+R(930,330,120,860,8,'#3A3346')+R(910,310,160,40,6,'#4A4258');
  f+=glow(540,300,320,'#FFD86B',.3)+L(540,0,540,250,'#4A4258',4)+Ell(540,270,50,20,'#FFE9A8');
  // The courtroom: elders at a bench, a witness pointing, the accused.
  let c='';
  c+=person(400,700,.55,2,{auraOp:.15})+person(540,700,.55,4,{auraOp:.15})+person(680,700,.55,0,{auraOp:.15});
  c+=R(300,640,480,110,10,'#5A4636',{stroke:'#3A2A20','stroke-width':4})+R(290,630,500,22,6,'#6E5644');
  const pt=ease.inOut(prog(t,AT.points-.2,AT.points+.4)),dim=1-ease.inOut(prog(t,AT.dies-.2,AT.dies+1.2));
  c+=piece(t,AT.standsUp-.2,250,1060,grey(250,1180,1.4,{reach:pt}),3,.8);
  c+=person(700,1180,1.45,1,{flip:-1,aura:'#7CFFE6',auraOp:.05+.4*dim});
  if(t>AT.everyWord-.1)c+=piece(t,AT.everyWord-.1,300,800,bubble(300,800,320,150,4),4,1.2);
  c+=stamp(t,AT.lie1,300,800,'LIE',72,5,-10);
  c+=tag(t,AT.innocent,700,LO1,'INNOCENT',44,6,{bg:CORAL,rot:-2});
  f+=fade(t,AT.really-.15,c);
  // Then the tablets, the ninth line glowing.
  const glowIn=ease.out(prog(t,AT.really,AT.really+1.2));
  const lit=k=>k===8?glowIn*(1+.2*Math.sin(t*3)):.12*glowIn;
  if(t>=AT.really)f+=piece(t,AT.really,540,880,tablets(540,880,.85,lit)+mark(scribble(738,972,150,40,9),ease.inOut(prog(t,AT.v2016+.2,AT.v2016+1)),CORAL,8),7,1.2);
  f+=fade(t,AT.wordsDo-.2,tag(t,AT.justDont,540,LO1,`"JUST DON'T LIE"?`,46,8)+strike(340,LO1,740,ease.inOut(prog(t,AT.readAgain-.2,AT.readAgain+.3))));
  f+=tag(t,AT.aboutNeighbor,540,LO2,'AGAINST YOUR NEIGHBOR',48,9,{bg:CORAL,rot:-2});
  f+=tag(t,AT.wordsDo,540,LO1,'WHAT YOUR WORDS DO',46,10);
  g+=FR(f);
  g+=verse(t,AT.v2016-.15,380,40,['You shall not bear false witness against your neighbor.'],'EXODUS 20:16 ESV',{size:52,hl:'against your neighbor.',hlAt:AT.neighborV[0],hlDur:AT.neighborV[1]-AT.neighborV[0]+.2,seed:5,id:4});
  return g;
}

// ---------- 1. The city gate: no cameras, only witnesses ----------
const camIcon=(cx,cy)=>R(cx-60,cy-34,120,76,10,'#3A3A44')+R(cx-24,cy-48,48,18,4,'#3A3A44')+C(cx,cy+4,26,'#7CD4FF',{stroke:'#1A1A22','stroke-width':6})+C(cx+38,cy-18,6,'#FFE36B');
const printIcon=(cx,cy)=>[0,1,2,3,4].map(i=>P(`M${cx-12-i*12} ${cy+40}Q${cx-14-i*12} ${cy-30-i*6} ${cx} ${cy-34-i*10}Q${cx+14+i*12} ${cy-30-i*6} ${cx+12+i*12} ${cy+30}`,'none',{stroke:'#8A5A3A','stroke-width':5})).join('');
const vidIcon=(cx,cy)=>R(cx-66,cy-46,132,92,10,'#3A3A44')+P(`M${cx-16} ${cy-24}L${cx+24} ${cy}L${cx-16} ${cy+24}Z`,'#FF5A48');
function gate(t){
  let f=glow(540,420,500,'#FFE2A0',.5)+R(-60,1150,1200,900,0,'#C99C5E');
  // two towers of stones and a lintel
  const r=rng(77);
  for(const [x0,x1] of [[110,370],[710,970]])for(let row=0;row<12;row++)for(let x=x0+(row%2)*30-30;x<x1;x+=60){const w=Math.min(58,x1-x);if(x+w<=x0)continue;
    const xs=Math.max(x,x0);f+=R(xs,560+row*50,Math.min(x+58,x1)-xs,46,5,mix('#B49A74','#D8C49C',r()),{stroke:'#7A6448','stroke-width':3});}
  f+=R(90,520,900,60,6,'#A88C64',{stroke:'#6A5236','stroke-width':4})+R(370,580,340,570,0,'#3A2A1C');
  f+=glow(540,900,240,'#FFB04C',.25);
  // elders on a bench inside the gateway
  f+=person(450,1000,.55,2,{auraOp:.2})+person(540,1000,.55,4,{auraOp:.2})+person(630,1000,.55,0,{auraOp:.2})+R(390,960,300,40,6,'#6A4A2E');
  // the crowd watching (foreground)
  f+=crowd(t,60,1790,5,240,.6,{p:{auraOp:.25}})+tufts(t,['#B0864A','#C99C5E','#9A7440'],11);
  // no cameras, no fingerprints, no video
  f+=fade(t,AT.trials-.15,
    cutout(t,AT.cameras,190,330,camIcon(190,320)+xMark(190,320,64,ease.inOut(prog(t,AT.cameras+.4,AT.cameras+.8))),'CAMERAS',1,{w:180,h:180})+
    cutout(t,AT.finger,540,330,printIcon(540,330)+xMark(540,320,64,ease.inOut(prog(t,AT.finger+.4,AT.finger+.8))),'FINGERPRINTS',2,{w:180,h:180})+
    cutout(t,AT.video,890,330,vidIcon(890,320)+xMark(890,320,64,ease.inOut(prog(t,AT.video+.3,AT.video+.7))),'VIDEO',3,{w:180,h:180}));
  f+=fade(t,AT.only-.3,tag(t,AT.gate,540,330,'TRIALS AT THE CITY GATE',46,4));
  f+=fade(t,AT.oneVoice-.2,tag(t,AT.oneThing+.6,540,LO1,'EVERYTHING RESTED ON WITNESSES',40,5,{bg:CORAL}));
  // two (then three) witnesses step forward with number badges
  [[AT.twoW,300,'1'],[AT.twoW+.35,540,'2'],[AT.threeW,780,'3']].forEach(([a,x,n],k)=>{
    if(t<a)return;f+=piece(t,a,x,1080,person(x,1180,1.0,k+1,{auraOp:.3})+C(x,980-130,30,INK)+T(x,980-118,n,{size:36,font:'Segoe UI Black',weight:900,anchor:'middle',fill:YEL}),6+k,1);});
  f+=tag(t,AT.oneVoice,540,LO1,'ONE VOICE: NEVER ENOUGH',42,9);
  f+=tag(t,AT.partner1,540,LO2,'A LIE WOULD NEED A PARTNER',42,10,{bg:CORAL,rot:-2});
  let g=FR(f);
  g+=verse(t,AT.only-.15,330,40,['Only on the evidence of two witnesses or of three witnesses shall a charge be established.'],'DEUTERONOMY 19:15 ESV',{size:46,hl:'two witnesses or of three witnesses',hlAt:AT.twoW,hlDur:AT.threeW-AT.twoW+.8,seed:9,id:11});
  return g;
}

// ---------- 2. Naboth's vineyard ----------
function nabothSheet(t){
  let f=glow(540,300,600,'#FFE9A8',.4);
  f+=vineyard(t,720)+tufts(t,['#256A30','#3FA04A','#2E7A3A'],21,['#9A4ACB','#FFD45E']);
  // Ahab: a crown peering over the wall; at "took his vineyard" it comes over and settles.
  if(t>AT.ahab-.2){const up=ease.out(prog(t,AT.ahab-.2,AT.ahab+.6)),tk=ease.inOut(prog(t,AT.took-.2,AT.took+1));
    f+=G(`translate(0 ${((1-up)*90).toFixed(1)})`,crown(t,lerp(820,520,tk),lerp(620,770,tk),lerp(.8,1.05,tk)));
    f+=vineyardWallFront(720,up<1);}
  f+=fade(t,AT.worthless-.2,tag(t,AT.ahab+.3,820,500,'KING AHAB',40,1)+
    tag(t,AT.naboth1,380,LO1,'NABOTH',44,2)+tag(t,AT.family,540,LO2,"HIS FAMILY'S LAND",44,3,{bg:CORAL,rot:-2}));
  // Naboth among his vines; after "put to death" he fades to a faint outline.
  const gone=ease.inOut(prog(t,AT.death,AT.death+1.4));
  f+=G('',person(360,1180,1.4,3,{aura:'#FFE36B',auraOp:.4*(1-gone)}),(1-.8*gone).toFixed(3));
