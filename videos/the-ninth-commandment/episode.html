// ---------- shared pieces ----------
const slab=(w,h)=>`M${-w/2} ${h/2}V${-h/2+w*.32}Q${-w/2} ${-h/2} 0 ${-h/2}Q${w/2} ${-h/2} ${w/2} ${-h/2+w*.32}V${h/2}Z`;
const NUM=['I','II','III','IV','V','VI','VII','VIII','IX','X'];
// One tablet with five carved lines (numerals + illegible carving, never a quotation). lit(i) 0..1 per line.
function tablet(x,y,w,h,first,lit,seed){
  const r=rng(seed);let g=G(`translate(${x} ${y})`,P(slab(w,h),'#7E7A70')+P(slab(w-24,h-24),'#9C988C')+
    P(slab(w-24,h-24),'none',{stroke:'#5E5A52','stroke-width':3,opacity:.5}));
  for(let i=0;i<5;i++){
    const k=first+i,ly=y-h/2+w*.46+i*(h-w*.5)/5.2,x0=x-w/2+92,x1=x+w/2-34-r()*40,on=lit(k);
    let d=`M${x0} ${ly}`;for(let xx=x0;xx<x1;xx+=18)d+=`L${xx+9} ${ly+(r()-.5)*6}L${xx+18} ${ly}`;
    g+=glow((x0+x1)/2,ly,(x1-x0)*.6,'#FFD86B',.35*on);
    g+=T(x-w/2+60,ly+12,NUM[k],{size:34,font:'Georgia',weight:700,anchor:'middle',fill:mix('#4A4740','#FFF4C8',on)});
    g+=P(d,'none',{stroke:'#4A4740','stroke-width':5,opacity:.8})+P(d,'none',{stroke:'#FFE9A8','stroke-width':3,opacity:(.12+.88*on).toFixed(3)});
  }
  return g;
}
const tablets=(cx,cy,s,lit)=>G(`translate(${cx} ${cy}) scale(${s}) translate(${-cx} ${-cy})`,
  glow(cx,cy,560,'#FFD86B',.12)+tablet(cx-205,cy,380,560,0,lit,21)+tablet(cx+205,cy,380,560,5,lit,33));
const xMark=(cx,cy,r,p)=>mark(`M${cx-r} ${cy-r}L${cx+r} ${cy+r}`,p*2,CORAL,10)+mark(`M${cx+r} ${cy-r}L${cx-r} ${cy+r}`,p*2-1,CORAL,10);
let foilN=0;
const foil=(t)=>{const id='foil'+(foilN++),sh=.5+.5*Math.sin(t*1.7);
  return [`url(#${id})`,`<linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF1B0"/><stop offset="${(.3+.2*sh).toFixed(2)}" stop-color="${GOLD}"/><stop offset="1" stop-color="#8A5A12"/></linearGradient>`];};
function crown(t,x,y,s){
  const [F,def]=foil(t);
  return G(`translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${s.toFixed(3)})`,def+glow(0,-10,120,'#FFD86B',.25)+
    P('M-80 40L-92 -50L-46 -6L0 -70L46 -6L92 -50L80 40Z',F,{stroke:'#8A5A12','stroke-width':5})+R(-84,30,168,26,4,F,{stroke:'#8A5A12','stroke-width':4})+
    C(0,-6,11,CORAL)+C(-46,18,8,'#3FB0FF')+C(46,18,8,'#3FB0FF')+C(-92,-50,8,'#FFF1B0')+C(0,-70,8,'#FFF1B0')+C(92,-50,8,'#FFF1B0'));
}
const letter=(x,y,rot=0,s=1)=>G(`translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot}) scale(${s})`,R(-50,-33,100,66,4,'#F6EFDC',{stroke:'#8A7A5A','stroke-width':3})+
  P('M-50 -33L0 4L50 -33','none',{stroke:'#8A7A5A','stroke-width':3})+C(0,4,11,'#C0392B')+C(0,4,6,'#E35A4A'));
const shake=(t,a,d,amp)=>{const p=prog(t,a,a+d);return p>0&&p<1?(hash(Math.floor(t*24),a)-.5)*2*amp*(1-p):0;};
// A torn paper strip of words. Dark grey with scribbled (illegible) ink = a lie; cream with gold ink = the truth.
function wordStrip(x,y,w,seed,rot=0,o={}){
  const r=rng(seed),h=o.h||40;let g=(o.glow?glow(x,y,w*.7,o.glow,.5):'')+strip(x-w/2,y-h/2,w,h,seed,o.fill||'#9C98A8',{shadow:o.shadow??true,edge:o.edge||'#D8D4E0'});
  let d=`M${x-w/2+14} ${y}`;for(let xx=x-w/2+14;xx<x+w/2-22;xx+=14)d+=`L${xx+7} ${(y+(r()-.5)*10).toFixed(1)}L${xx+14} ${y}`;
  g+=P(d,'none',{stroke:o.ink||'#2E2A38','stroke-width':4});
  if(o.crack>0){let c=`M${x+w*.08} ${y-h/2-8}`;for(let k=1;k<=4;k++)c+=`L${x+w*.08+(k%2?16:-12)} ${y-h/2-8+k*(h+16)/4}`;g+=mark(c,o.crack,CORAL,7);}
  return G(`rotate(${rot.toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)})`,g,(o.op??1).toFixed(2));
}
const truthStrip=(x,y,w,seed,rot=0,o={})=>wordStrip(x,y,w,seed,rot,Object.assign({fill:'#FFF6DA',edge:'#FFFFFF',ink:'#B8862C',glow:'#FFE9A8'},o));
// An oil lamp; k = flame 0..1 (0 = out, with a curl of smoke after `outAt`).
function lamp(t,x,y,s=1,k=1,outAt=null){
  let g=G(`translate(${x} ${y}) scale(${s})`,P('M-46 0Q-40 -26 0 -28Q40 -26 52 -14L70 -22L60 -6Q40 4 0 4Q-40 4 -46 0Z','#B8703A',{stroke:'#6A3A18','stroke-width':3})+Ell(-6,-26,20,6,'#6A3A18'));
  if(k>0)g+=glow(x+62*s,y-40*s,170*s*k,'#FFB04C',.55*k)+FX.flames(t,[[x+56*s,y-22*s],[x+62*s,y-26*s],[x+68*s,y-22*s]],{H:46*s*k,sp:6,seed:x%97});
  if(k<=0&&outAt!=null){const p=prog(t,outAt,outAt+2.4);if(p<1)for(let i=0;i<5;i++){const q=clamp(p*1.4-i*.12);if(q>0&&q<1)g+=C(x+62*s+Math.sin(q*6+i)*14*s,y-30*s-q*180*s,(8+q*18)*s,'#B8B0C0',{opacity:(.5*(1-q)).toFixed(2)});}}

}
const torch=(t,x,y,s=1,seed=1)=>R(x-6*s,y,12*s,96*s,3,'#4A2E1A')+R(x-17*s,y-8*s,34*s,18*s,5,'#6A4A2A')+glow(x,y-40*s,170*s,'#FFB04C',.5)+
  FX.flames(t,[[x-14*s,y-6*s],[x,y-12*s],[x+14*s,y-6*s]],{H:74*s,sp:7,seed});
// A column of light: the only way Jesus is shown. Never a figure.
function lightCol(t,x,y,k=1){
  if(k<=0)return '';
  let g=glow(x,y-260,520,'#FFF6DA',.45*k)+P(`M${x-90} ${y}L${x-46} -700L${x+46} -700L${x+90} ${y}Z`,'#FFF6DA',{opacity:(.2*k).toFixed(2)})+
    P(`M${x-40} ${y}L${x-18} -700L${x+18} -700L${x+40} ${y}Z`,'#FFFFFF',{opacity:(.38*k).toFixed(2)})+Ell(x,y,190,36,'#FFF6DA',{opacity:(.45*k).toFixed(2)})+
    glow(x,y-160,200,'#FFFFFF',.55*k*(1+.08*Math.sin(t*2)));
  for(let i=0;i<14;i++){const u=(t*.12+hash(i,3))%1;g+=C(x+(hash(i,5)-.5)*120,y-u*1100,3+hash(i,6)*4,'#FFFBEA',{opacity:(k*.8*(1-u)).toFixed(2)});}
  return g;
}
const heartP=(x,y,r)=>`M${x} ${y+r*.9}C${x-r*1.7} ${y-r*.1} ${x-r*.95} ${y-r*1.35} ${x} ${y-r*.42}C${x+r*.95} ${y-r*1.35} ${x+r*1.7} ${y-r*.1} ${x} ${y+r*.9}Z`;
const heart=(x,y,r,k=1)=>glow(x,y,r*2.2,'#FF7A6A',.5*k)+P(heartP(x,y,r),'#FF4A5C',{stroke:'#FFD0C8','stroke-width':Math.max(2,r*.08)})+P(heartP(x-r*.2,y-r*.15,r*.45),'#FF8A96',{opacity:.6});
const gnd=(s,y,c1,c2)=>`<path d="${ridge(s,y,10,230)}" fill="${c1}"/><path d="${ridge(s+1,y+120,8,200)}" fill="${c2}"/>`;
const FG=(a,b,c,fl=[])=>({grass:[a,b,c],flowers:fl});
const aim=(a,b,x,y,F,z)=>shot(a,b,x,y+(1010-F)/z,z);

const TUN=[['#3DE0B8','#1787A8'],['#FFC24C','#E0623C'],['#B98CFF','#6A4CD8'],['#FF8FB1','#C8487A'],['#7CD4FF','#2F6FD0']];
const SKIN=[['#F5BE8E','#C4835E'],['#D9965E','#A86A3E'],['#B87444','#8A5230']], HAIR=['#2E1C52','#4A2A16','#1A1A2A'];
const pplOpts=(i,x,y,s,o={})=>{const [a,b]=TUN[i%5],[sk,sh]=SKIN[i%3],face=o.flip||o.face||1,f=o.f??(i%2===1);

const GREY=[{tunic:'#A4A4AE',tunic2:'#5E5E6A',skin:'#D2BFAE',shade:'#A08A78',hair:'#33333C',f:false},{tunic:'#8E8E9A',tunic2:'#4E4E5A',skin:'#C4A88E',shade:'#8E7460',hair:'#22222A',f:false}];

// A line of people holding hands (ep. 1's chain).
function chain(ps,up){
  const m=[];
  for(let k=0;k+1<ps.length;k++){const a=ps[k],b=ps[k+1];if(a.free||b.free)continue;const aa=PPL.armToward(a,b.x),ab=PPL.armToward(b,a.x),ra=PPL.rig(Object.assign({},a,{near:null,far:null})),rb=PPL.rig(Object.assign({},b,{near:null,far:null}));
    const sa=ra.shoulder(aa),sb=rb.shoulder(ab),p={x:(sa[0]+sb[0])/2,y:up?Math.min(sa[1],sb[1])-60*a.s:Math.max(sa[1],sb[1])+40*a.s};a[aa]=p;b[ab]=p;m.push([p.x,p.y,a.skin,b.skin,a.s]);}
  return ps.map(o=>PPL.fig(o)).join('')+m.map(q=>PPL.clasp([q[0],q[1]],q[4],q[2],q[3])).join('');
}

// The city gate: two towers, a stone wall, the arch, paving. o.night adds stars, moon and torches.
function gateSet(t,o={}){
