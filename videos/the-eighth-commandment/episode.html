  let g=sun(1500,-200,60,'#FFE9B0')+R(-60,-700,2040,1460,0,'#8AC0A0',{opacity:.3})+house(380,760,360,420,'#E2CFAE')+gnd(203,760,'#8AAA70','#709058');
  const kn=ease.inOut(prog(t,AT.myHands+.3,AT.myHands+1.2));
  [[1100,800],[1160,812],[1220,796],[1060,815]].forEach(([x,y],k)=>g+=C(x,y-10,14,['#FF5A48','#FFC24C','#7ACB5A','#FF5A48'][k],{stroke:'#8A3A2A','stroke-width':2}));
  g+=basket(1300,792,.9)+folk(3,1360,806,.64,{face:-1,look:{x:1150,y:790},expr:'sad',near:'chest'});
  return g+who(HERO,900,800,1.15,{kneel:kn,lean:kn*18,near:kn>.5?{x:1010,y:780}:'chest',look:kn>.2?{x:1100,y:790}:{x:1340,y:640},expr:['calm','tender',kn]});
}
// H4. Hands that once took: the fist opens; lights drift out of the open hand.
function onceTook(t,lt){
  let g=R(-60,-700,2040,2600,0,'#3A2A40')+glow(960,500,700,'#FFD86B',.3+.3*prog(t,AT.once,AT.learn))+gnd(205,880,'#4A3A4A','#3A2E3A');
  const op=ease.inOut(prog(t,AT.once+1.4,AT.learn+.2));
  g+=hand(960,760,2.0,op,{sleeve:EXT.tunic,skin:EXT.skin,shade:EXT.shade,aura:'#FFE9A8',auraOp:.3+.5*op});
  if(op>0)for(let k=0;k<8;k++){const p=((t*.4+k/8)%1);g+=glow(960+Math.sin(k*2.3)*300*p,620-p*500,30,'#FFF6DA',.8*op*(1-p))+C(960+Math.sin(k*2.3)*300*p,620-p*500,8,'#FFFBEA',{opacity:(op*(1-p)).toFixed(2)});}
  return g;
}
// H5. Can learn to give: the village passes bread hand to hand: Zacchaeus, the worker, the man who looked at his hands.
function learnGive(t,lt){
  let g=sun(960,-220,100,'#FFF2C8')+glow(960,300,900,'#FFE9A8',.4)+clouds(t,46,-640,-300,'#FFFFFF',.4,4)+house(300,760,340,400,'#E2CFAE')+house(1640,760,340,400,'#EADCC0')+gnd(207,760,'#C8B070','#B09A5A');
  const ds=[pp(ZAC,620,800,.85,{expr:'joy'}),pp(EXT,750,800,1.0,{face:1,expr:'joy'}),pp(HERO,885,800,1.02,{expr:'joy'}),person(1,1020,800,.98,{face:-1,f:true,expr:'joy',tunic:'#9A8AC8',tunic2:'#5A4A8A'}),person(3,1140,806,.62,{face:-1,expr:'joy'}),pp(FARM,1265,800,1.0,{face:-1,expr:'joy'})];
  ds.forEach((o,i)=>o.look={x:960,y:500});
  g+=chain(ds,true);
  const p=((t-AT.learn)*.6%1+1)%1,lx=lerp(640,1260,p);

}
// H6. Next time, the ninth commandment: the tablets, the eighth line burning, the ninth warming; then the end card (hud).
function nextTablets(t,lt){
  let g=stars(t,.6,300)+glow(960,500,900,'#FFB04C',.35)+gnd(209,860,'#3A2A20','#2A1E16');
  const nine=ease.inOut(prog(t,AT.ninth,AT.ninth+1.2));
  return g+tablets(960,480,1.1,k=>k===7?1.1+.2*Math.sin(t*4):k===8?.2+.9*nine:.25)+fireflies(t,300,-200,1300,1000,'#FFB04C',18,.7);
}
