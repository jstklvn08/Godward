<script>
// The Ten Commandments, part 8: the eighth commandment. Script: scripts/09-the-eighth-commandment.md (ESV fill).
// Every time below comes from the spoken words (words.js), so a new narration re-times the episode.
// Guide: .claude/skills/godward-episode/reference/engine.md. K.E is the ellipse helper (Ell), window.E the engine.
const {G,R,C,L,P,T,prog,ease,lerp,mix,clamp,rng}=K, Ell=K.E;
const {hash,piece,glow,label,mark,scribble,arrow,strip,tape,torn}=S;
const {cue,end,span,shot,ridge,verse,fade,hv,stars,fireflies,INK,YEL,CORAL}=E;
const GOLD='#E8B53A', SILVER='#D8DEE6';

const AT={
  shortest:cue("It's one of the shortest"), four:cue('just four words'), steal:cue('You shall not steal'),

  heard:cue('When Israel heard'), slaves:cue('freed slaves'), nothing:cue('owned almost nothing'),
  bringing:cue('But God was bringing'), family:cue('every family would get'),
  field:cue('A field'), vineyard:cue('A vineyard'), flock:cue('A flock'),
  says:cue('So when God says'), guarding:cue('guarding'), grabs:cue('Stealing grabs'),

  most:cue('Most stealing'), robbery:cue('a robbery'), tent:cue("Achan's tent"), small:cue('small, hidden'), copying:cue('Copying'), change:cue('extra change'),
  credit:cue('Taking credit'), sees:cue('Nobody sees it'), still:cue('still stealing'),
  surprising:cue("But here's the surprising"), stopAt:cue("doesn't stop at"), farmers:cue('Farmers in Israel'), edges:cue('edges of their fields'),
  grape:cue('fallen grape'), leave:cue('You shall leave them'), poor:span('for the poor',1), lordGod:end('I am the LORD your God'),
  christians:cue('Christians have long'), otherSide:cue('other side'), tightly:cue('Holding on too tightly'), takingToo:cue('taking too'),
  centuries:cue('Centuries later'), walked:cue('walked into Jericho'), sameCity:cue('The same city where'), taxman:cue('A tax collector'),
  rich:cue('He was rich'), gotThat:cue('how he got that way'), tree:cue('He climbed a tree'), jesusSaid:cue('Jesus said'), house:cue('to his house'),
  stood:cue('And Zacchaeus stood'), behold:cue('Behold, Lord'), half:span('the half of my goods'), giveToPoor:cue('give to the poor'),
  defrauded:cue('defrauded'), fourfold:cue('fourfold'), tookHid:cue('Achan took and hid'), gaveBack:cue('Zacchaeus gave back'),
  timesOver:cue('four times over'), opposite:cue('opposite hands'),
  paul:cue('The apostle Paul'), thief:cue('Let the thief'), honest:cue('honest work'), shareW:span('share with anyone in need'),
  notice:cue('Notice where'), stopTaking:cue('stop taking'), withShare:cue('but with share'),
  oppositeOf:cue('The opposite of stealing'), yourself:cue('hands to yourself'), opening:cue("It's opening them"),
  givingGod:cue('The God who gave'), giving:cue('a giving God'), realQ:cue('So the real question'), stolen:cue('have I ever stolen'),
  myHands:cue('what are my hands'), once:cue('Hands that once took'), learn:cue('learn to give'),
  next:cue('Next time'), ninth:cue('ninth commandment'), name:cue('good name'),

AT.last=WORDS[WORDS.length-1][2];

// ---------- shared pieces (tablets, tag, cutout and the vertical helpers follow part 1) ----------
const slab=(w,h)=>`M${-w/2} ${h/2}V${-h/2+w*.32}Q${-w/2} ${-h/2} 0 ${-h/2}Q${w/2} ${-h/2} ${w/2} ${-h/2+w*.32}V${h/2}Z`;
const NUM=['I','II','III','IV','V','VI','VII','VIII','IX','X'];
// One tablet with five carved lines (numerals + illegible carving, never a quotation). lit(i) 0..1 per line.
function tablet(x,y,w,h,first,lit,seed){
  const r=rng(seed);let g=G(`translate(${x} ${y})`,P(slab(w,h),'#7E7A70')+P(slab(w-24,h-24),'#9C988C')+
    P(slab(w-24,h-24),'none',{stroke:'#5E5A52','stroke-width':3,opacity:.5}));
  for(let i=0;i<5;i++){
    const k=first+i,ly=y-h/2+w*.46+i*(h-w*.5)/5.2,x0=x-w/2+92,x1=x+w/2-34-r()*40,on=lit(k);
    let d=`M${x0} ${ly}`;for(let xx=x0;xx<x1;xx+=18)d+=`L${xx+9} ${ly+(r()-.5)*6}L${xx+18} ${ly}`;
    g+=glow((x0+x1)/2,ly,(x1-x0)*.6,'#FFD86B',.35*Math.min(on,1.2));
    g+=T(x-w/2+60,ly+12,NUM[k],{size:34,font:'Georgia',weight:700,anchor:'middle',fill:mix('#4A4740','#FFF4C8',Math.min(on,1))});
    g+=P(d,'none',{stroke:'#4A4740','stroke-width':5,opacity:.8})+P(d,'none',{stroke:'#FFE9A8','stroke-width':3,opacity:(.12+.88*Math.min(on,1)).toFixed(3)});
  }
  return g;
}
const tablets=(cx,cy,s,lit)=>G(`translate(${cx} ${cy}) scale(${s}) translate(${-cx} ${-cy})`,
  glow(cx,cy,560,'#FFD86B',.12)+tablet(cx-205,cy,380,560,0,lit,21)+tablet(cx+205,cy,380,560,5,lit,33));
// The eighth line (VIII) sits on the right tablet, third line: about (1185, 597) when the tablets are drawn at (960, 560).
const xMark=(cx,cy,r,p)=>mark(`M${cx-r} ${cy-r}L${cx+r} ${cy+r}`,p*2,CORAL,10)+mark(`M${cx+r} ${cy-r}L${cx-r} ${cy+r}`,p*2-1,CORAL,10);
const strike=(x0,y,x1,p)=>mark(`M${x0} ${y+6}L${x1} ${y-6}`,p,CORAL,9);
const TUN=[['#3DE0B8','#1787A8'],['#FFC24C','#E0623C'],['#B98CFF','#6A4CD8'],['#FF8FB1','#C8487A'],['#7CD4FF','#2F6FD0']];
const person=(x,y,s,i,o={})=>E.chubby(x,y,s,Object.assign({f:i%2===1,tunic:TUN[i%5][0],tunic2:TUN[i%5][1],aura:'#FFE9A8',auraOp:.3,phase:i*.7,
  hair:['#2E1C52','#4A2A16','#1A1A2A'][i%3],skin:['#F5BE8E','#D9965E','#B87444'][i%3],shade:['#C4835E','#A86A3E','#8A5230'][i%3]},o));
// A small cut-out on torn paper with a label underneath.
function cutout(t,at,cx,cy,inner,name,id,o={}){
  const w=o.w||250,h=o.h||250;
  return piece(t,at,cx,cy,strip(cx-w/2,cy-h/2,w,h,id*7,o.paper||'#F6EFDC')+tape(cx,cy-h/2+4,90,-4)+inner+
    label(cx,cy+h/2+14,name,{size:hv(26,34),anchor:'middle'}),id,1.4);
}
// A glowing paper-cut hand, wrist at (0,0), fingers up. open 0 = a closed fist, 1 = an open palm.
function hand(x,y,s,open,o={}){
  const flip=o.flip||1,skin=o.skin||'#F5BE8E',sh=o.shade||'#C4835E',sleeve=o.sleeve||'#3DE0B8';
  const FL=[78,94,88,70],shapes=[];
  FL.forEach((l,i)=>{const L0=lerp(18,l,open),fx=-48+i*32;shapes.push([fx-14,-104-L0,28,L0+34,14]);});
  shapes.push([-58,-112,116,112,34]);
  const th=lerp(62,-38,open);
  let edge='',fill='';
  shapes.forEach(([a,b,w,h,r])=>{edge+=R(a-6,b-6,w+12,h+12,r+6,'#FFF6E0');fill+=R(a,b,w,h,r,skin);});
  const thumb=k=>G(`translate(-50 -46) rotate(${th.toFixed(1)})`,k?R(-15,-78,30,86,15,skin):R(-21,-84,42,98,21,'#FFF6E0'));
  // Knuckle lines while closed, palm crease while open.
  let lines='';
  if(open<.6)for(let i=0;i<4;i++)lines+=P(`M${-60+i*32} ${-82}q14 -8 28 0`,'none',{stroke:sh,'stroke-width':4,opacity:(1-open/.6).toFixed(2)});
  if(open>.5)lines+=P('M-34 -40Q0 -20 30 -52','none',{stroke:sh,'stroke-width':4,opacity:((open-.5)*2).toFixed(2)});
  const g=glow(0,-90,200,o.aura||'#FFE9A8',o.auraOp??.45)+R(-66,-8,132,70,12,'#FFF6E0')+R(-60,-4,120,62,10,sleeve)+
    thumb(0)+edge+thumb(1)+fill+lines;
  return G(`translate(${x} ${y}) scale(${s*flip} ${s}) rotate(${o.rot||0})`,g);
}
// Drifting paper clouds and a sun for the daylight skies (fills the tall frame's upper band).
function sky(t,seed,sunCol='#FFF2C8'){
  const r=rng(seed);let g=glow(X(1500,820),Y(120,300),hv(300,260),sunCol,.6)+C(X(1500,820),Y(120,300),hv(60,70),'#FFF6DA',{opacity:.85});
  for(let i=0;i<5;i++){const y=E.VERT?vy(230+i*80+r()*30):60+r()*200,x=((r()*2200+t*(8+i*3))%2400)-240,w=140+r()*120;
    g+=G(`translate(${x.toFixed(1)} ${y.toFixed(1)})`,Ell(0,0,w,w*.28,'#FFFFFF',{opacity:.55})+Ell(-w*.35,-w*.12,w*.45,w*.25,'#FFFFFF',{opacity:.55})+Ell(w*.3,-w*.1,w*.4,w*.22,'#FFFFFF',{opacity:.5}));}
  return g;
}
const coin=(x,y,r,F=GOLD)=>C(x,y,r,F,{stroke:'#8A5A12','stroke-width':3})+C(x,y,r*.62,'none',{stroke:'#FFF1B0','stroke-width':2,opacity:.7});

// ---------- vertical layout ----------
// Every vertical sheet is filmed wide (zoom .84 on 960,560), so frame position (fx, fy) maps to fixed sheet coordinates.
// Vertical frame zones: verse cards 170-~520, art 560-1180, captions 1220-1340, lower labels 1380-1560.
const vx=f=>960+(f-540)/.84, vy=f=>560+(f-1010)/.84;
const X=(l,f)=>hv(l,vx(f)), Y=(l,f)=>hv(l,vy(f)), SZ=(l,f)=>hv(l,f/.84);
const tag=(t,at,x,y,s,size,id,o={})=>piece(t,at,x,y,label(x,y-size*.81,s,Object.assign({size,anchor:'middle'},o)),id,1.3);
const WIDE=[960,560,.84];
const LO1=Y(900,1410), LO2=Y(990,1535);   // the two lower label rows (clear of each other and of the captions)
// Frame position in the vertical cut to sheet coordinates (landscape gets a rough equivalent so the page still draws).
const FX=f=>E.VERT?vx(f):960+(f-540)*1.5, FY=f=>E.VERT?vy(f):40+(f-170)*.9, FS=k=>E.VERT?k/.84:k*1.1;
// Layered ground for the lower frame (frame y `from` to the bottom): three paper ridges, stones and tufts.
function vGround(seed,cols,o={}){
  if(!E.VERT)return '';
  const from=o.from||1330,r=rng(seed+9);
  let g=`<path d="${ridge(seed,FY(from),10,260)}" fill="${cols[0]}"/><path d="${ridge(seed+1,FY(from+170),14,220)}" fill="${cols[1]}"/><path d="${ridge(seed+2,FY(from+360),18,180)}" fill="${cols[2]}"/>`;
  for(let i=0;i<(o.n||28);i++){const fy=from+40+Math.pow(r(),.8)*(1880-from-40),fx=r()*1120-20,s=lerp(.7,1.9,(fy-from)/(1920-from)),x=FX(fx),y=FY(fy),hh=r();
    if(i%3===0)g+=Ell(x,y,24*s,13*s,o.stone||'#8A7A64',{stroke:'#4A3E30','stroke-width':3})+Ell(x-7*s,y-5*s,11*s,4*s,'#FFFFFF',{opacity:.2});
    else for(let j=-1;j<=1;j++)g+=L(x+j*6*s,y,x+j*11*s,y-(18+hh*16+j*3)*s,o.tuft||cols[0],4*s);}
  return g;
}

// ---------- 0. Cold open: four words ----------
// Israel's tents at the foot of the mountain, each with a small fire, across the lower frame.
function camp(t){
  if(!E.VERT)return '';
  let g=vGround(7,['#262032','#2E263C','#362C46'],{stone:'#4A4058',tuft:'#4A3E62',from:1300});
  const r=rng(15);
  [[1395,.45,6,.55],[1610,.75,4,.8],[1810,1.05,3,1]].forEach(([fy,s,n,op],row)=>{for(let i=0;i<n;i++){
    const fx=(i+.5)*1080/n+(r()-.5)*80+(row%2?50:-30),x=FX(fx),y=FY(fy+(r()-.5)*40),k=s/.84;
    const fl=.5+.25*Math.sin(t*7+i*2.1+row)+.15*Math.sin(t*11.3+i);
    g+=G('',glow(x+70*k,y-6*k,90*k,'#FF9A40',.4*fl)+P(`M${x-90*k} ${y}L${x} ${y-95*k}L${x+90*k} ${y}Z`,'#5A4656',{stroke:'#241A26','stroke-width':4})+
      P(`M${x} ${y-95*k}L${x-18*k} ${y}H${x+18*k}Z`,'#FFB860',{opacity:(.55+.3*fl).toFixed(2)})+L(x,y-95*k,x,y-122*k,'#241A26',4)+
      C(x+70*k,y-6*k,7*k,'#FFC870',{opacity:(.7+.3*fl).toFixed(2)}),op);}});
  return g;
}
function coldOpen(t){
  let g=stars(t,.4,300)+fireflies(t,0,-600,1920,700,'#FFE9A8',14,.4);
  const glowIn=ease.out(prog(t,0,AT.shortest+1)),eight=ease.inOut(prog(t,AT.four-.2,AT.four+.8));
  const lit=k=>k===7?glowIn*(.3+.9*eight)*(1+.15*Math.sin(t*3)):glowIn*(.45-.3*eight);
  g+=`<path d="${ridge(5,hv(930,vy(1250)),14,260)}" fill="#1E1A24"/>`;
  g+=camp(t);
  // The tablets shrink up when the hands arrive.
  const up=ease.inOut(prog(t,AT.bigger-.3,AT.bigger+.6));
  const cy=Y(560,lerp(860,700,up)),s=hv(1,lerp(1.36,.86,up));
  const tf=`translate(960 ${cy}) scale(${s}) translate(-960 -560)`;
  g+=piece(t,0,960,cy,G(tf,tablets(960,560,1,lit)+mark(scribble(1185,597,210,58,4),ease.inOut(prog(t,AT.four,AT.four+.8)),CORAL,8)),1,1.2);
  g+=fade(t,AT.steal-.2,tag(t,AT.four,960,Y(150,420),'JUST FOUR WORDS',SZ(40,48),2));
  g+=verse(t,AT.steal-.15,560,40,['You shall not steal.'],'EXODUS 20:15 ESV',{size:60,hl:'not steal.',hlAt:AT.steal+.3,hlDur:.7,seed:5,id:4});
  // Never robbed a bank, so: the easy one?
  g+=fade(t,AT.bigger-.3,tag(t,AT.bank,960,LO1,'NEVER ROBBED A BANK',SZ(34,42),5)+
    tag(t,AT.easy,960,LO2,'THE EASY ONE?',SZ(40,50),6,{bg:CORAL,rot:-2}));
  // Two hands: what did you take? what are your hands for?
  const hy=Y(900,1150),hs=hv(.9,1.15);
  const op=ease.inOut(prog(t,AT.handsFor,AT.handsFor+.8));
  g+=piece(t,AT.bigger,X(760,330),hy,hand(X(760,330),hy,hs,0,{flip:1,rot:-8}),7,1.4);
  g+=piece(t,AT.bigger+.15,X(1160,750),hy,hand(X(1160,750),hy,hs,op,{flip:-1,rot:8,aura:'#FFD86B',auraOp:.45+.4*op}),8,1.4);
  g+=fade(t,AT.handsFor-.1,tag(t,AT.take,960,LO1,'WHAT DID YOU TAKE?',SZ(36,44),9));
  g+=tag(t,AT.handsFor,960,LO2,'WHAT ARE YOUR HANDS FOR?',SZ(40,46),10,{bg:CORAL});
  return g;
}

// ---------- 1. Every family got a share ----------
// Four plots on a torn map; boundary stones between them.
const PLOT=k=>E.VERT?[vx([300,780,300,780][k]),vy([680,680,1020,1020][k])]:[[330,740,1180,1590][k],560];
function wheat(cx,cy){let g='';for(let i=0;i<7;i++){const x=cx-90+i*30;g+=L(x,cy+70,x+4,cy-40,'#B8862C',5)+Ell(x+4,cy-52,9,20,GOLD);}return g;}
function vines(cx,cy){let g='';for(let r=0;r<2;r++){g+=L(cx-110,cy-30+r*70,cx+110,cy-30+r*70,'#6A4A2A',6);for(let i=0;i<4;i++){const x=cx-80+i*54,y=cy-12+r*70;
  for(let j=0;j<6;j++)g+=C(x+[0,10,-10,5,-5,0][j],y+[0,0,0,10,10,20][j],8,'#7A3AB8',{stroke:'#4A1E70','stroke-width':2});g+=Ell(x+12,y-14,12,7,'#3BBF7A');}}return g;}
function sheep(x,y,s){return G(`translate(${x} ${y}) scale(${s})`,[[-20,-6],[0,-14],[20,-6],[-10,6],[12,6]].map(([a,b])=>C(a,b,20,'#F7F3EA',{stroke:'#CFC6B0','stroke-width':3})).join('')+
  Ell(36,-4,14,11,'#3A3A44')+R(-22,16,8,22,3,'#3A3A44')+R(14,16,8,22,3,'#3A3A44'));}
function flock(cx,cy){return sheep(cx-60,cy-20,1)+sheep(cx+50,cy+10,.9)+sheep(cx-20,cy+50,.8);}
function homeArt(cx,cy){return P(`M${cx-90} ${cy+50}L${cx} ${cy-60}L${cx+90} ${cy+50}Z`,'#A86A3E')+P(`M${cx} ${cy-60}L${cx-14} ${cy+50}L${cx+14} ${cy+50}Z`,'#3A2418')+Ell(cx+80,cy+40,40,30,'#3BBF7A');}
const PLOTS=[['A FIELD','field',wheat,'#D8B860'],['A VINEYARD','vineyard',vines,'#8FBF6A'],['A FLOCK','flock',flock,'#7CC27A'],['A HOME','family',homeArt,'#C9A060']];
function land(t,lt){
  let g=sky(t,3)+`<path d="${ridge(21,hv(860,vy(1240)),12,240)}" fill="#3E7A3A"/>`;
  g+=vGround(23,['#4A8A42','#3E7A3A','#356A32'],{stone:'#9C988C',tuft:'#2E5A2A',from:1300});
  const mapIn=ease.out(prog(t,AT.bringing-.2,AT.bringing+.6));
  // Before the land: a few freed slaves with nothing in their hands.
  const pre=1-ease.inOut(prog(t,AT.bringing-.3,AT.bringing+.2));
  if(pre>0)g+=G('',[0,1,2,3].map(i=>person(X(620+i*200,250+i*190),Y(760,1100),hv(.9,1.0),i,{aura:'#FFE9A8',auraOp:.25})).join('')+
    tag(t,AT.slaves,960,Y(200,560),'FREED SLAVES',SZ(40,50),1,{bg:CORAL})+tag(t,AT.nothing,960,Y(280,660),'OWNING ALMOST NOTHING',SZ(32,40),2),pre);
  if(mapIn>0){
    let m='';
    PLOTS.forEach(([name,w,fn,col],k)=>{const [cx,cy]=PLOT(k);
      m+=piece(t,AT.bringing+k*.12,cx,cy,strip(cx-185,cy-150,370,300,40+k*7,col)+fn(cx,cy-10),20+k,1.2);
      // The light passes over each plot as it is named.
      const a=AT[w],gl=prog(t,a-.1,a+.4)*(1-prog(t,a+1.4,a+2.2));
      if(gl>0)m+=glow(cx,cy,260,'#FFF2C8',.6*gl);
      if(k<3)m+=tag(t,a,cx,cy+hv(170,180),name,SZ(28,36),30+k);
    });
    // Boundary stones between the plots.
    const st=(x,y)=>Ell(x,y,18,12,'#9C988C',{stroke:'#5E5A52','stroke-width':3});
    if(E.VERT){[[540,680],[540,1020],[300,850],[780,850],[540,850]].forEach(([a,b])=>m+=st(vx(a),vy(b)));}
    else [535,960,1385].forEach(x=>m+=st(x,720));
    // A family on each plot.
    const fam=ease.out(prog(t,AT.family,AT.family+.6));
    if(fam>0)PLOTS.forEach((_,k)=>{const [cx,cy]=PLOT(k);m+=G('',person(cx+hv(120,110),cy+hv(110,120),hv(.5,.55),k,{auraOp:.5})+person(cx+hv(160,150),cy+hv(116,126),hv(.36,.4),k+2,{auraOp:.5}),fam);});
    g+=G('',m,mapIn);
  }
  g+=fade(t,AT.firstTime-.3,tag(t,AT.guarding,960,LO1,'WHAT GOD GAVE YOUR NEIGHBOR',SZ(32,38),3)+
    tag(t,AT.grabs,960,LO2,'STEALING GRABS IT',SZ(38,46),4,{bg:CORAL,rot:-2}));
  // A coral grab: an arrow from one plot reaching into the next, crossed out.
  const [ax,ay]=PLOT(0),[bx,by]=PLOT(1),gp=ease.inOut(prog(t,AT.grabs,AT.grabs+.7));
  g+=arrow(bx-hv(60,60),by+hv(30,40),(ax+bx)/2,ay-hv(120,160),ax+hv(40,40),ay-hv(10,10),gp,CORAL,9);
  return g;
}

// ---------- 2. Jericho: Achan saw, wanted, took, hid ----------
function cloak(x,y,s){return G(`translate(${x} ${y}) scale(${s})`,P('M-50 -60Q0 -80 50 -60L70 60Q0 76 -70 60Z','#C8302A',{stroke:'#FFD86B','stroke-width':5})+
  P('M-20 -66L0 -30L20 -66','none',{stroke:'#FFD86B','stroke-width':4})+P('M-40 20Q0 34 40 20','none',{stroke:'#8A1E1A','stroke-width':4}));}
function goldBar(x,y,s){return G(`translate(${x} ${y}) scale(${s})`,P('M-60 20L-40 -14H40L60 20Z',GOLD,{stroke:'#8A5A12','stroke-width':4})+P('M-36 -8H30','none',{stroke:'#FFF1B0','stroke-width':4}));}

}
