// ---------- people (the round PPL figures, as in part 1) ----------
const TUN=[['#3DE0B8','#1787A8'],['#FFC24C','#E0623C'],['#B98CFF','#6A4CD8'],['#FF8FB1','#C8487A'],['#7CD4FF','#2F6FD0']];
const SKIN=[['#F5BE8E','#C4835E'],['#D9965E','#A86A3E'],['#B87444','#8A5230']], HAIR=['#2E1C52','#4A2A16','#1A1A2A'];
// person(i,x,y,s,o): PPL options with a palette picked by index; o.reach (0..1) puts the hand where the old figure's was.
const person=(i,x,y,s,o={})=>{const [a,b]=TUN[i%5],[sk,sh]=SKIN[i%3],face=o.flip||o.face||1,f=o.f??(i%2===1);
  const q=Object.assign({x,y,s,face,f,tunic:a,tunic2:b,skin:sk,shade:sh,hair:HAIR[i%3],phase:i*.7},o);
  q.face=face;delete q.flip;delete q.reach;if(!o.walk)delete q.walk;
  if(o.reach!=null&&!o.near){const r=o.reach;q.near={x:x+lerp(52,116,r)*s*face,y:y-lerp(54,172,r)*s};
    if(r>.75&&!o.far)q.far={x:x+lerp(10,70,r)*s*face,y:y-lerp(60,178,r)*s};}
  return q;};
const folk=(i,x,y,s,o={})=>PPL.fig(person(i,x,y,s,o));
const elderOpts=(x,y,s,o={})=>{const q=person(0,x,y,s,Object.assign({tunic:'#C8A06A',tunic2:'#7A5430',skin:'#D9965E',shade:'#A86A3E',f:false,phase:.4},o));q.hair=o.hair||'#ECE8DE';return q;};
const elder=(x,y,s,o={})=>PPL.fig(elderOpts(x,y,s,o));
// draw a person with something between the body and the near (front) arm: a held prop, a sash
const withFront=(o,mid)=>{const r=PPL.rig(o);return r.draw('noFront')+mid(r)+r.draw('front');};
const MOSES={tunic:'#C9935A',tunic2:'#7A4E2A',hair:'#2A1A12',skin:'#D9965E',shade:'#A86A3E',f:false};
// Moses with his shepherd's staff: the staff stands in front of the body, the hand grips it.
function moses(x,y,s,o={}){
  const f=o.face||1,q=Object.assign({x,y,s,face:f,phase:.3},MOSES,o);if(!o.near)q.near={x:x+92*s*f,y:y-100*s};
  return withFront(q,r=>{const h=r.hand('near'),top=h[1]-88*s,bx=h[0]+6*s*f;
    return L(bx,y-2,h[0],top,'#6A4026',11*s)+P(`M${h[0]} ${top}q${(6*s*f).toFixed(1)} ${(-34*s).toFixed(1)} ${(30*s*f).toFixed(1)} ${(-24*s).toFixed(1)}`,'none',{stroke:'#6A4026','stroke-width':11*s});});
}
// a sash across the chest carrying the name: k 1 glowing gold, 0 grey and hollow
function sash(r,k){
  const a=r.W([-32,-112]),b=r.W([40,-42]),m=r.W([6,-80]),s=r.s;
  return P(`M${a[0].toFixed(1)} ${a[1].toFixed(1)}L${b[0].toFixed(1)} ${b[1].toFixed(1)}`,'none',{stroke:mix('#8A8890','#FFD86B',k),'stroke-width':(15*s).toFixed(1),opacity:(.6+.4*k).toFixed(2)})+
    glow(m[0],m[1],64*s,'#FFE9A8',.75*k)+C(m[0].toFixed(1),m[1].toFixed(1),(12*s).toFixed(1),mix('#5A5860','#FFF1C0',k),{stroke:mix('#4A4850','#E8B53A',k),'stroke-width':3});
}
const sashed=(o,k)=>withFront(o,r=>sash(r,k));
// a line of people holding hands (from part 1)
function chain(ps,up){
  const m=[];
  for(let k=0;k+1<ps.length;k++){const a=ps[k],b=ps[k+1],aa=PPL.armToward(a,b.x),ab=PPL.armToward(b,a.x),ra=PPL.rig(Object.assign({},a,{near:null,far:null})),rb=PPL.rig(Object.assign({},b,{near:null,far:null}));
    const sa=ra.shoulder(aa),sb=rb.shoulder(ab),p={x:(sa[0]+sb[0])/2,y:up?Math.min(sa[1],sb[1])-60*a.s:Math.max(sa[1],sb[1])+40*Math.min(a.s,b.s)};a[aa]=p;b[ab]=p;m.push([p.x,p.y,a.skin,b.skin,Math.min(a.s,b.s)]);}
  return ps.map(o=>PPL.fig(o)).join('')+m.map(q=>PPL.clasp([q[0],q[1]],q[4],q[2],q[3])).join('');
}

// ---------- props ----------
// The divine name as four letters on a gold plate. full 1 glowing; 0 hollow (a dashed outline with nothing inside).
function namePlate(t,cx,cy,s,full,o={}){
  const w=440,h=170,f=clamp(full),pulse=.5+.5*Math.sin(t*2.2);
  let g=glow(0,0,330,'#FFD86B',(.25+.25*pulse)*f*(o.halo??1));
  g+=R(-w/2,-h/2,w,h,28,'#E8B53A',{opacity:(.95*f).toFixed(3)})+R(-w/2+12,-h/2+12,w-24,h-24,20,'#FFE9A8',{opacity:(.55*f).toFixed(3)});
  g+=R(-w/2,-h/2,w,h,28,'none',{stroke:mix(o.hollow||'#FFFFFF','#FFE9A8',f),'stroke-width':8,'stroke-dasharray':f<.98?`${lerp(18,400,f).toFixed(0)} ${lerp(16,0,f).toFixed(0)}`:'none',opacity:.95});
  g+=T(0,38,'YHWH',{size:104,font:'Georgia',weight:700,anchor:'middle',fill:mix('#FFFFFF','#5A3A0A',f),op:(o.letters??(.35+.65*f)).toFixed(3),ls:10});
  return G(`translate(${cx} ${cy}) scale(${s}) rotate(${o.rot||0})`,g,o.op??1);
}
// a bush of neon fire whose leaves stay green (it burns and is not burned up)
function bush(t,cx,cy,s,fire,leaf=1){
  let g=glow(0,-150,420,'#FF8A3C',.55*fire)+glow(0,-150,200,'#FFE9A8',.5*fire);
  const br=[[0,0,-90,-170],[0,0,80,-190],[-40,-80,-150,-150],[40,-90,150,-140],[0,0,0,-230],[-20,-120,-60,-230],[20,-120,70,-240]];
  br.forEach(([a,b,c,d])=>g+=L(a,b,c,d,'#3A2414',14)+L(a,b,c,d,'#6A4026',6));
  const lv=[[-90,-170],[80,-190],[-150,-150],[150,-140],[0,-230],[-60,-230],[70,-240],[-120,-110],[115,-105],[-40,-190],[40,-200]];
  if(leaf>0)lv.forEach(([x,y],i)=>g+=Ell(x,y,22,12,'#3FA84A',{transform:`rotate(${(i*47)%180} ${x} ${y})`,opacity:leaf})+Ell(x,y,12,5,'#8AE08A',{transform:`rotate(${(i*47)%180} ${x} ${y})`,opacity:.7*leaf}));
  for(let l=0;l<3;l++)for(let i=0;i<9;i++){
    const x=-150+i*37+Math.sin(i*2.3)*16,base=-120-Math.sin(i*1.1)*60,f=Math.sin(t*(9+l)+i*1.7+l),k=[1,.66,.36][l];
    const ht=(110+40*Math.sin(t*7+i))*k*fire,w=34*k;if(fire<=0)continue;
    g+=P(`M${(x-w).toFixed(1)} ${base.toFixed(1)}Q${(x-w*1.2+f*10).toFixed(1)} ${(base-ht*.5).toFixed(1)} ${(x+f*14).toFixed(1)} ${(base-ht).toFixed(1)}Q${(x+w*1.2+f*10).toFixed(1)} ${(base-ht*.5).toFixed(1)} ${(x+w).toFixed(1)} ${base.toFixed(1)}Q${x.toFixed(1)} ${(base+w).toFixed(1)} ${(x-w).toFixed(1)} ${base.toFixed(1)}Z`,['#FF5A2C','#FFB04C','#FFF3C4'][l],{opacity:(.85*fire).toFixed(2)});
  }
  for(let i=0;i<8;i++){const k=(t*.5+i/8)%1,x=Math.sin(i*3.1+t)*120,y=-200-k*260;g+=C(x.toFixed(1),y.toFixed(1),4+3*(1-k),'#FFE9A8',{opacity:(fire*(1-k)).toFixed(2)});}
  return G(`translate(${cx} ${cy}) scale(${s})`,g);
}
// a clay water jar standing on (x, y); o.rot tilts it about its middle; o.water 0..1 shows water at the mouth
function jar(x,y,s,o={}){
  const c=o.c||'#C2703A',d='#6A2E14';
  let g=Ell(0,-58,46,56,c,{stroke:d,'stroke-width':4})+R(-19,-132,38,34,6,c,{stroke:d,'stroke-width':4})+Ell(0,-132,25,8,o.water?'#7CD4FF':'#2A1208',{stroke:d,'stroke-width':4})+
    P('M-30 -84Q-30 -60 -14 -54','none',{stroke:'#E89A5A','stroke-width':6,opacity:.6})+R(-46,-74,92,10,4,'#8A3A1A',{opacity:.5});
  return G(`translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${s}) rotate(${(o.rot||0).toFixed(1)} 0 -60)`,g);
}
// a speech bubble that slaps on at `at`, its tail pointing to (tx, ty)
function bubble(t,at,x,y,w,h,inner,tx,ty,id){
  if(t<at-.05)return '';
  const tail=P(`M${x-26} ${y+h/2-6}L${tx} ${ty}L${x+26} ${y+h/2-6}Z`,'#F6EFDC',{stroke:INK,'stroke-width':6});
  const body=R(x-w/2,y-h/2,w,h,Math.min(60,h/2),'#F6EFDC',{stroke:INK,'stroke-width':6})+R(x-22,y+h/2-14,44,12,0,'#F6EFDC');
  return piece(t,at,x,y,tail+body+inner,id,1.3);
}
const curseTxt=(x,y,sz)=>T(x,y+sz*.36,'#!%',{size:sz,font:'Segoe UI Black',weight:900,anchor:'middle',fill:INK});
// God is never a figure: his presence is a soft oval of light; his voice goes out as rings of light.
const presence=(t,x,y,r,k=1)=>k<=0?'':glow(x,y,r*2.6,'#FFF6DA',.5*k)+glow(x,y,r*1.2,'#FFFFFF',.65*k)+
  Ell(x,y,r*.74,r,'none',{stroke:'#FFFBEA','stroke-width':8,opacity:(.75*k).toFixed(2)})+Ell(x,y,r*.6,r*.82,'#FFFBEA',{opacity:(.22*k*(1+.25*Math.sin(t*2))).toFixed(2)});
const rings=(t,a,x,y,R0=1300,n=4)=>{const sp=prog(t,a,a+2.2);if(sp<=0||sp>=1)return '';let g=glow(x,y,200+sp*700,'#FFFBEA',.6*(1-sp));
  for(let k=0;k<n;k++){const p=clamp(sp*1.6-k*.18);if(p>0&&p<1)g+=C(x,y,(60+p*R0).toFixed(0),'none',{stroke:'#FFF6DA','stroke-width':(12*(1-p)+2).toFixed(1),opacity:(1-p).toFixed(2)});}return g;};
// words of light drifting from (x0,y0) to (x1,y1) (Jesus and God are never drawn: their words are light)
const lightWords=(t,a,x0,y0,x1,y1,n=4)=>{let g='';const wa=prog(t,a,a+2);if(wa<=0)return '';
  for(let i=0;i<n;i++){const q=clamp(wa*1.6-i*.2);if(q<=0)continue;const x=lerp(x0,x1,q),y=lerp(y0,y1,q)+i*34-Math.sin(q*3.14)*60;
    g+=glow(x,y,70,'#FFE9A8',.6*(1-q*.5))+L(x-50+i*6,y,x+50-i*6,y,'#FFFFFF',12,{opacity:(1-q*.4).toFixed(2)})+L(x-50+i*6,y,x+50-i*6,y,'#FFD27A',4,{opacity:.8});}
  return g;};
const tent=(x,y,c,k=1)=>P(`M${x-90*k} ${y}L${x} ${y-120*k}L${x+90*k} ${y}Z`,c)+P(`M${x} ${y-120*k}L${x-13*k} ${y}L${x+13*k} ${y}Z`,'#2A1A10');
const brick=(x,y,s=1)=>R(x,y,150*s,40*s,4,'#C2703A',{stroke:'#6A2E14','stroke-width':3});
const taskShadow=(x,y,s,op)=>op<=0?'':G(`translate(${x.toFixed(0)} ${y}) skewX(-38) scale(${s} ${(s*.42).toFixed(3)})`,
  C(0,-330,62,'#1A0604')+R(-58,-272,116,272,44,'#1A0604')+L(40,-232,150,-340,'#1A0604',28)+
  P('M150 -340Q270 -440 350 -300Q380 -240 310 -220','none',{stroke:'#1A0604','stroke-width':9}),op);
const flames=(t,cx,by,w,h,k=1,n=9)=>{let g='';const ht=E.held(t,12);
  for(let i=0;i<n;i++){const f=Math.sin(ht*9+i*1.7),x=cx-w/2+i*w/(n-1),hh=h*(.6+.4*Math.abs(Math.sin(i*2.3+ht*3)))*k;
    const b=w/n*1.3;g+=P(`M${(x-b).toFixed(0)} ${by}C${(x-b*1.1).toFixed(0)} ${(by-hh*.45).toFixed(0)} ${(x-b*.2+f*12).toFixed(0)} ${(by-hh*.7).toFixed(0)} ${(x+f*18).toFixed(0)} ${(by-hh).toFixed(0)}C${(x+b*.5).toFixed(0)} ${(by-hh*.6).toFixed(0)} ${(x+b*1.1).toFixed(0)} ${(by-hh*.4).toFixed(0)} ${(x+b).toFixed(0)} ${by}Z`,['#FF5A2C','#FFB04C','#FFE36B'][i%3],{opacity:.9});}
  return g;};
// stone tablets (numerals + illegible carving, never a quotation). lit(k) 0..1 per line.
const slab=(w,h)=>`M${-w/2} ${h/2}V${-h/2+w*.32}Q${-w/2} ${-h/2} 0 ${-h/2}Q${w/2} ${-h/2} ${w/2} ${-h/2+w*.32}V${h/2}Z`;
const NUM=['I','II','III','IV','V','VI','VII','VIII','IX','X'];
const lineY=(y,w,h,i)=>y-h/2+w*.46+i*(h-w*.5)/5.2;
function tablet(x,y,w,h,first,lit,seed){
  const r=rng(seed);let g=G(`translate(${x} ${y})`,P(slab(w,h),'#7E7A70')+P(slab(w-24,h-24),'#9C988C')+P(slab(w-24,h-24),'none',{stroke:'#5E5A52','stroke-width':3,opacity:.5}));
  for(let i=0;i<5;i++){const k=first+i,ly=lineY(y,w,h,i),x0=x-w/2+92,x1=x+w/2-34-r()*40,on=clamp(lit(k));
    let d=`M${x0} ${ly}`;for(let xx=x0;xx<x1;xx+=18)d+=`L${xx+9} ${(ly+(r()-.5)*6).toFixed(1)}L${xx+18} ${ly}`;
    g+=glow((x0+x1)/2,ly,(x1-x0)*.6,'#FFD86B',.35*on)+T(x-w/2+60,ly+12,NUM[k],{size:34,font:'Georgia',weight:700,anchor:'middle',fill:mix('#4A4740','#FFF4C8',on)});
    g+=P(d,'none',{stroke:'#4A4740','stroke-width':5,opacity:.8})+P(d,'none',{stroke:'#FFE9A8','stroke-width':3,opacity:(.12+.88*on).toFixed(3)});}
  return g;
}
const rain=(t,x0,x1,y0,y1,n=60)=>{let g='';for(let i=0;i<n;i++){const x=x0+hash(i,3)*(x1-x0),y=y0+((t*900+hash(i,5)*(y1-y0))%(y1-y0));g+=L(x,y,x-10,y+44,'#9AB8E0',3,{opacity:.45});}return g;};

// ---------- scenery upgrade (Nov 2026): big people, layered settings (videos/_kit/scenery.js) ----------
// Framing standard (as in ep. 6 floodS, ep. 7 rainbowArk, ep. 10): the main figures stand with their feet on sheet y FY
// at PPL scale HS and the camera holds the feet at frame ~1190 (zoom 1.0-1.3), so they fill ~35-40% of the frame.
// While a verse card is up they shrink to VS. Two big adults stand >= ~375 apart. Each scene has its own foreground.
const FY=1000, HS=2.6, VS=2.3, KS=1.5;
const EDG=(cx,z)=>[cx-540/z+70,cx+540/z-70];
const FC={night:['#0A101C','#18233A','#34466A'],sinai:['#1A0E0C','#3A2418','#8A5A34'],desert:['#6A4A22','#A07A3A','#E0B870'],
  meadow:['#1E4A1E','#3A7A2E','#7AB850'],dry:['#4A3A1E','#7A6A34','#C8B060'],dusk:['#2A1426','#4A2A3A','#8A5A5A'],
  golden:['#5A4A1E','#8A7A34','#D8C070'],red:['#2A0A08','#4A1A12','#8A3A2A'],ash:['#1A1418','#2E2630','#5A4A54']};
// a scene's own foreground framing (SC.fore) at the shot's zoom
const fr=(t,cx,z,cols,o={})=>SC.fore(t,Object.assign({y:1040,edges:EDG(cx,z),cols:FC[cols]||cols,rocks:0,density:.7,seed:7},o));
const sc=s=>Math.round(s*100)/100;
// a hanging oil lamp / a lamp on a stand
const oilLamp=(t,x,y,s=1)=>glow(x,y-20*s,140*s,'#FFC86A',.55)+Ell(x,y,26*s,10*s,'#B8683A',{stroke:'#6A2E14','stroke-width':3})+FX.flames(t,[[x+14*s,y-8*s],[x+22*s,y-12*s]],{H:30*s,sp:5,seed:x|0})+glow(x+18*s,y-26*s,50*s,'#FFE9A8',.8);
// stars + moon + thin night clouds
const nightSky=(t,o={})=>SC.sky(t,{mood:'night',hz:o.hz??860})+SC.sun(t,o.mx??1480,o.my??-160,o.mr??44,{col:'#F4F0DC',rays:0,k:o.moonK??.8})+SC.clouds(t,{seed:o.seed||3,n:5,y:-620,h:420,mood:'night',op:.4,drift:4});
// night land: sky, far range, dark hills, near ground
function nightLand(t,o={}){
