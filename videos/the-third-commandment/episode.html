const withFront=(o,mid)=>{const r=PPL.rig(o);return r.draw('noFront')+mid(r)+r.draw('front');};

function moses(x,y,s,o={}){

// a sash across the chest carrying the name: k 1 glowing gold, 0 grey and hollow

const sashed=(o,k)=>withFront(o,r=>sash(r,k));
// a line of people holding hands (from part 1)
function chain(ps,up){

    const sa=ra.shoulder(aa),sb=rb.shoulder(ab),p={x:(sa[0]+sb[0])/2,y:up?Math.min(sa[1],sb[1])-60*a.s:Math.max(sa[1],sb[1])+40*Math.min(a.s,b.s)};a[aa]=p;b[ab]=p;m.push([p.x,p.y,a.skin,b.skin,Math.min(a.s,b.s)]);}

// ---------- props ----------
// The divine name as four letters on a gold plate. full 1 glowing; 0 hollow (a dashed outline with nothing inside).

  g+=R(-w/2,-h/2,w,h,28,'none',{stroke:mix(o.hollow||'#FFFFFF','#FFE9A8',f),'stroke-width':8,'stroke-dasharray':f<.98?`${lerp(18,400,f).toFixed(0)} ${lerp(16,0,f).toFixed(0)}`:'none',opacity:.95});
  g+=T(0,38,'YHWH',{size:104,font:'Georgia',weight:700,anchor:'middle',fill:mix('#FFFFFF','#5A3A0A',f),op:(o.letters??(.35+.65*f)).toFixed(3),ls:10});

// a bush of neon fire whose leaves stay green (it burns and is not burned up)
function bush(t,cx,cy,s,fire,leaf=1){

  const br=[[0,0,-90,-170],[0,0,80,-190],[-40,-80,-150,-150],[40,-90,150,-140],[0,0,0,-230],[-20,-120,-60,-230],[20,-120,70,-240]];
  br.forEach(([a,b,c,d])=>g+=L(a,b,c,d,'#3A2414',14)+L(a,b,c,d,'#6A4026',6));
  const lv=[[-90,-170],[80,-190],[-150,-150],[150,-140],[0,-230],[-60,-230],[70,-240],[-120,-110],[115,-105],[-40,-190],[40,-200]];
  if(leaf>0)lv.forEach(([x,y],i)=>g+=Ell(x,y,22,12,'#3FA84A',{transform:`rotate(${(i*47)%180} ${x} ${y})`,opacity:leaf})+Ell(x,y,12,5,'#8AE08A',{transform:`rotate(${(i*47)%180} ${x} ${y})`,opacity:.7*leaf}));
  for(let l=0;l<3;l++)for(let i=0;i<9;i++){
    const x=-150+i*37+Math.sin(i*2.3)*16,base=-120-Math.sin(i*1.1)*60,f=Math.sin(t*(9+l)+i*1.7+l),k=[1,.66,.36][l];
    const ht=(110+40*Math.sin(t*7+i))*k*fire,w=34*k;if(fire<=0)continue;
    g+=P(`M${(x-w).toFixed(1)} ${base.toFixed(1)}Q${(x-w*1.2+f*10).toFixed(1)} ${(base-ht*.5).toFixed(1)} ${(x+f*14).toFixed(1)} ${(base-ht).toFixed(1)}Q${(x+w*1.2+f*10).toFixed(1)} ${(base-ht*.5).toFixed(1)} ${(x+w).toFixed(1)} ${base.toFixed(1)}Q${x.toFixed(1)} ${(base+w).toFixed(1)} ${(x-w).toFixed(1)} ${base.toFixed(1)}Z`,['#FF5A2C','#FFB04C','#FFF3C4'][l],{opacity:(.85*fire).toFixed(2)});
  }
  for(let i=0;i<8;i++){const k=(t*.5+i/8)%1,x=Math.sin(i*3.1+t)*120,y=-200-k*260;g+=C(x.toFixed(1),y.toFixed(1),4+3*(1-k),'#FFE9A8',{opacity:(fire*(1-k)).toFixed(2)});}

}
function sheep(t,x,y,s,flip=1,walk=0){

  g+=Ell(64,-56+b,22,18,'#3A3430')+Ell(56,-70+b,9,6,'#2A2420')+C(72,-60+b,3,'#fff');

// a speech bubble that slaps on at `at`, its tail pointing to (tx, ty)
function bubble(t,at,x,y,w,h,inner,tx,ty,id){

const lightWords=(t,a,x0,y0,x1,y1,n=4)=>{let g='';const wa=prog(t,a,a+2);if(wa<=0)return '';
