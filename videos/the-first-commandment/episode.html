<script>
// The Ten Commandments, part 1: the first commandment. Script: scripts/02-the-first-commandment.md (ESV fill).
// Every time below comes from the spoken words (words.js), so a new narration re-times the episode.
// Guide: .claude/skills/godward-episode/reference/engine.md. K.E is the ellipse helper (Ell), window.E the engine.
const {G,R,C,L,P,T,prog,ease,lerp,mix,clamp,rng}=K, Ell=K.E;
const {hash,piece,glow,label,mark,scribble,arrow,strip,tape,torn}=S;
const {cue,end,span,shot,ridge,verse,fade,hv,stars,fireflies,INK,YEL,CORAL}=E;
const GOLD='#E8B53A', NEON='#2BF0FF';

const AT={
  ten:cue('There are ten'), oneFirst:cue('But one of them'), hangs:cue('hangs'),
  murder:cue('murder'), steal:cue('steal'), itsThis:cue("It's this"),
  v203a:cue('You shall have',1), religions:cue('religions'), list:cue('on your list'), bigger:cue('bigger than both'),
  understand:cue('To understand'), heard:cue('who heard it'), slaves:cue('slaves'), walked:cue('walked out'),
  through:cue('through the middle'), sea:cue('of the sea'),
  saved:cue('Thus the LORD saved'), earn:cue("They didn't earn"), rescued:cue('They were rescued'),
  months:cue('three months'), sinai:cue('called Sinai'),
  mount:cue('Now Mount Sinai'), fire:cue('in fire'), furnace:cue('kiln'), quaked:cue('trembled greatly'),
  line:cue('behind a line'), trembling:cue('trembling'), outOf:cue('out of the fire'), speaks:cue('God speaks'),
  strange:cue("Here's the strange"), firstWords:cue('The first words'), iam:cue('I am the LORD'),
  broughtOut:span('brought you out'), bondageEnd:end('house of slavery'),
  tells:cue('Before God tells'), already:cue('already done'),
  rescueFirst:cue('The rescue comes first'), rulesSecond:cue('The rules come second'),
  earning:cue('earning'), haveIt:cue('already have it'),
  thenComes:cue('And then comes'), v203b:cue('You shall have',2), noOther2:span('no other gods',2),
  raised:cue('raised in Egypt'), everything:cue('gods for everything'),
  sun:cue('The sun'), river:cue('The river'), harvest:cue('The harvest'), king:cue('The king'),
  spread:cue('spread your trust'), beat:cue('just beat Egypt'), notHere:cue('not here'), dividing:cue('No dividing'), backup:cue('No backup'),
  look:cue('And look at'), littleWord:cue('little word'), hebrew:cue('In Hebrew'), faceW:cue('for face'),
  myFace:cue('before my face'), isnt:cue("It isn't God first"), room:cue('no one else in the room'),
  ranking:cue("isn't a ranking"), relationship:cue("It's a relationship"),
  broke:cue('And Israel broke'), forty:cue('forty days'), waiting:cue('tired of waiting'), melted:cue('melted'), calf:cue('into a calf'),
  these:cue('These are your gods'), twist:cue("Here's the twist"), feast:cue('feast'), leaving:cue('leaving God'),
  adding:cue('adding something'), see:cue('could see'), ruledOut:cue('ruled out'),
  melt:cue("We don't melt"), pull:cue('the pull'), money:cue('Money'), approval:cue('Approval'), success:cue('Success'), planB:cue('A plan B'),
  goodThings:cue('Good things'), psalm:cue('A psalm'), theyThat:cue('Those who make'), become:cue('You become'),
  centuries:cue('Centuries later'), greatest:cue('the greatest'), newRule:cue('a new rule'), insideOut:cue('inside out'),
  love:cue('You shall love'), heart:span('with all your heart'), mind:end('all your mind'),
  fence:cue('is the fence'), field:cue('the field inside'), rescuedYou:cue('who rescued you'), share:cue('a share'), allOfIt:cue('all of it'),
};
Object.assign(AT,{
  first1:cue('comes first'), itsNot:cue("It's not",1), notSteal:cue('do not steal'), gods1:cue('no other gods',1), most:cue('Most people'),
  or:cue('Or as'), putGod:cue('put God'), firstList:cue('first on your'), notNation:cue('Not a nation'), crowd:cue('A crowd'),
  egyptians:cue('Egyptians'), rescuedW:cue('rescued',1), mountain:cue('mountain',1), wrapped:cue('wrapped'), descended:cue('descended'),
  fire1:end('in fire'), smokeOf:cue('The smoke of it'), wholeMtn:cue('whole mountain'), trembled:cue('trembled'),
  peopleStand:cue('The people stand'), andThen:cue('And then',1),
});
AT.last=WORDS[WORDS.length-1][2];

// ---------- shared pieces ----------
const slab=(w,h)=>`M${-w/2} ${h/2}V${-h/2+w*.32}Q${-w/2} ${-h/2} 0 ${-h/2}Q${w/2} ${-h/2} ${w/2} ${-h/2+w*.32}V${h/2}Z`;
const NUM=['I','II','III','IV','V','VI','VII','VIII','IX','X'];
// One tablet with five carved lines (numerals + illegible carving, never a quotation). lit(i) 0..1 per line.
function tablet(x,y,w,h,first,lit,seed){
  const r=rng(seed);let g=G(`translate(${x} ${y})`,P(slab(w,h),'#7E7A70')+P(slab(w-24,h-24),'#9C988C')+
    P(slab(w-24,h-24),'none',{stroke:'#5E5A52','stroke-width':3,opacity:.5}));
  for(let i=0;i<5;i++){
    const k=first+i,ly=y-h/2+w*.46+i*(h-w*.5)/5.2,x0=x-w/2+92,x1=x+w/2-34-r()*40,on=lit(k);
    let d=`M${x0} ${ly}`;for(let xx=x0;xx<x1;xx+=18)d+=`L${xx+9} ${ly+(r()-.5)*6}L${xx+18} ${ly}`;
    g+=glow((x0+x1)/2,ly,(x1-x0)*.6,'#FFD86B',.35*on);
    g+=T(x-w/2+60,ly+12,NUM[k],{size:34,font:'Georgia',weight:700,anchor:'middle',fill:mix('#4A4740','#FFF4C8',on)});
    g+=P(d,'none',{stroke:'#4A4740','stroke-width':5,opacity:.8})+P(d,'none',{stroke:'#FFE9A8','stroke-width':3,opacity:(.12+.88*on).toFixed(3)});
  }
  return g;
}
const tablets=(cx,cy,s,lit)=>G(`translate(${cx} ${cy}) scale(${s}) translate(${-cx} ${-cy})`,
  glow(cx,cy,560,'#FFD86B',.12)+tablet(cx-205,cy,380,560,0,lit,21)+tablet(cx+205,cy,380,560,5,lit,33));
// Coral X drawn in two strokes.
const xMark=(cx,cy,r,p)=>mark(`M${cx-r} ${cy-r}L${cx+r} ${cy+r}`,p*2,CORAL,10)+mark(`M${cx+r} ${cy-r}L${cx-r} ${cy+r}`,p*2-1,CORAL,10);
const strike=(x0,y,x1,p)=>mark(`M${x0} ${y+6}L${x1} ${y-6}`,p,CORAL,9);
// Paper-cut mountain, one jagged peak.
function mountain(seed,px,py,fill,steep){
  const r=rng(seed*91+7),pts=[];
  for(let x=-140;x<=2060;x+=22){const d=Math.abs(x-px)/(900*steep);pts.push([x,py+Math.pow(d,1.25)*560+(r()-.5)*16]);}
  return P('M'+pts.map(p=>p[0].toFixed(0)+' '+Math.min(p[1],1800).toFixed(0)).join('L')+'L2060 1800L-140 1800Z',fill);
}
// Gold foil fill (hard shine, no glow of its own). Unique id per use.
let foilN=0;
const foil=(t)=>{const id='foil'+(foilN++),sh=.5+.5*Math.sin(t*1.7);
  return [`url(#${id})`,`<linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF1B0"/><stop offset="${(.3+.2*sh).toFixed(2)}" stop-color="${GOLD}"/><stop offset="1" stop-color="#8A5A12"/></linearGradient>`];};
function calf(t,x,y,s){
  const [F,def]=foil(t);
  const body=def+R(-120,64,250,22,4,'#5A4A3A')+R(-138,84,286,22,4,'#4A3C30')+
    P('M-92 -18Q-124 0 -116 44','none',{stroke:GOLD,'stroke-width':7})+Ell(-116,50,9,14,'#C08A22')+
    R(-74,6,24,54,6,'#B07E1E')+R(52,6,24,54,6,'#B07E1E')+R(-96,6,28,56,6,F)+R(26,6,28,56,6,F)+
    R(-96,56,28,8,2,'#5A3A0A')+R(26,56,28,8,2,'#5A3A0A')+R(-74,56,24,8,2,'#4A300A')+R(52,56,24,8,2,'#4A300A')+
    P('M-98 -4Q-104 -50 -60 -56Q-10 -60 30 -76Q66 -92 92 -70Q110 -54 108 -20Q106 18 80 22H-80Q-98 18 -98 -4Z',F,{stroke:'#FFF6D0','stroke-width':3})+
    P('M84 4Q100 34 120 18L112 -6Z','#C08A22')+
    P('M92 -62Q128 -78 150 -50Q162 -30 160 -6Q158 14 140 16Q120 18 110 2Q94 -20 92 -62Z',F,{stroke:'#FFF6D0','stroke-width':3})+
    Ell(150,4,16,12,'#D9A43A')+C(146,4,2.6,'#5A3A0A')+C(156,4,2.6,'#5A3A0A')+
    P('M110 -62Q76 -66 66 -96Q84 -82 112 -74Z','#FFF1B0',{stroke:'#E8D58A','stroke-width':2})+
    P('M140 -66Q174 -72 182 -104Q166 -84 138 -76Z','#FFF1B0',{stroke:'#E8D58A','stroke-width':2})+
    P('M104 -54Q88 -48 92 -40Q102 -42 108 -50Z','#C08A22')+P('M128 -40L138 -36','none',{stroke:'#3A2A10','stroke-width':4});
  return G(`translate(${x} ${y}) scale(${s})`,body);
}
// A crowd of small glowing people (modest tunics). tremble = jitter amount.
const TUN=[['#3DE0B8','#1787A8'],['#FFC24C','#E0623C'],['#B98CFF','#6A4CD8'],['#FF8FB1','#C8487A'],['#7CD4FF','#2F6FD0']];
function crowd(t,x0,y,n,gap,s,o={}){
  let g='';
  for(let i=0;i<n;i++){
    const tr=o.tremble?(hash(Math.floor(t*12),i)-.5)*o.tremble:0;
    g+=folk(i,x0+i*gap+tr+(i%2)*10,y+(i%3)*14,s*(.92+.16*hash(i,4)),{flip:o.flip||1,aura:o.aura||'#7CFFE6',auraOp:o.auraOp??.35,
      walk:o.walk?t*7+i:0,lean:o.lean||0,reach:o.reach||0});
  }
  return g;
}
// A small cut-out on torn paper with a label underneath (for Egypt's gods and the modern idols).
function cutout(t,at,cx,cy,inner,name,id,o={}){
  const w=o.w||250,h=o.h||250;
  return piece(t,at,cx,cy,strip(cx-w/2,cy-h/2,w,h,id*7,o.paper||'#F6EFDC')+tape(cx,cy-h/2+4,90,-4)+inner+
    label(cx,cy+h/2+14,name,{size:hv(26,34),anchor:'middle'}),id,1.4);
}

// ---------- vertical layout ----------
// Every vertical sheet is filmed wide (zoom .84 on 960,560), so frame position (fx, fy) maps to fixed sheet coordinates.
// Vertical frame zones: verse cards 170-~520, art 560-1180, captions 1220-1340, lower labels 1380-1560.
const vx=f=>960+(f-540)/.84, vy=f=>560+(f-1010)/.84;
const X=(l,f)=>hv(l,vx(f)), Y=(l,f)=>hv(l,vy(f)), SZ=(l,f)=>hv(l,f/.84);
// A label that slaps on at `at`, centred on (x, y) in sheet coordinates.
const tag=(t,at,x,y,s,size,id,o={})=>piece(t,at,x,y,label(x,y-size*.81,s,Object.assign({size,anchor:'middle'},o)),id,1.3);
const WIDE=[960,560,.84];
// Vertical only: two paper ridges and a few glints so night sheets have no empty band under the labels.
const floor=(t,seed,a,b,glint)=>E.VERT?`<path d="${ridge(seed,vy(1590),18,240)}" fill="${a}"/><path d="${ridge(seed+7,vy(1720),14,180)}" fill="${b}"/>`+
  fireflies(t,0,vy(1600),1920,vy(1900)-vy(1600),glint,10,.35):'';

// ---------- ACT 1 (0 s to "God speaks"): sixteen short scenes, a new shot every few seconds ----------
// Vertical camera reminder: cam point (x, y) lands at frame (540, 1010). Wide = zoom .84 (sees x 317-1603, y -642-1643).
// To put a subject at frame y F with zoom z: cam y = subjectY + (1010 - F) / z.
const SKIN=[['#F5BE8E','#C4835E'],['#D9965E','#A86A3E'],['#B87444','#8A5230']], HAIR=['#2E1C52','#4A2A16','#1A1A2A'];
// One of the people, palette picked by index. Drawn with the people rig (videos/_kit/people.js): the same round
// figures as before, but their arms bend and reach (hands meet hands, shoulders, children), their eyes look at a
// target, faces change expression, and feet stand on the ground with a soft contact shadow.
// o takes the old chubby options (walk, reach, lean, flip, aura, auraOp, tunic...) plus any PPL option
// (expr, look, near, far, kneel, sit, ...). reach r puts the hand where the old figure's hand was:
// (x + lerp(52,116,r)*s*flip, y - lerp(54,172,r)*s), so props drawn at that point stay in the hand.
const pplOpts=(i,x,y,s,o={})=>{const [a,b]=TUN[i%5],[sk,sh]=SKIN[i%3],face=o.flip||o.face||1,f=o.f??(i%2===1);
  const q=Object.assign({x,y,s,face,f,tunic:a,tunic2:b,skin:sk,shade:sh,hair:HAIR[i%3],phase:i*.7},o);
  q.face=face;delete q.flip;delete q.filter;delete q.reach;
  if(!o.walk)delete q.walk;
  if(o.reach!=null&&!o.near){const r=o.reach;q.near={x:x+lerp(52,116,r)*s*face,y:y-lerp(54,172,r)*s};
    if(r>.75&&!o.far)q.far={x:x+lerp(10,70,r)*s*face,y:y-lerp(60,178,r)*s};}
  return q;};
const folk=(i,x,y,s,o={})=>PPL.fig(pplOpts(i,x,y,s,o));
const person=pplOpts;
const shake=(t,a,d,amp)=>{const p=prog(t,a,a+d);return p>0&&p<1?(hash(Math.floor(t*24),a)-.5)*2*amp*(1-p):0;};
// A lightning bolt that flashes for 0.4 s from time a.
const bolt=(t,a,x,y0,y1)=>{const p=prog(t,a,a+.4);if(p<=0||p>=1)return '';const m=(y0+y1)/2;
  return P(`M${x} ${y0}L${x+46} ${m-80}L${x-24} ${m}L${x+34} ${y1}`,'none',{stroke:'#E9FFFF','stroke-width':9,opacity:(1-p).toFixed(2)})+glow(x,y1,280,'#CFFFFF',.55*(1-p));};
const flames=(t,cx,by,w,h,k=1,n=9)=>{let g='';const ht=E.held(t,12);
  for(let i=0;i<n;i++){const f=Math.sin(ht*9+i*1.7),x=cx-w/2+i*w/(n-1),hh=h*(.6+.4*Math.abs(Math.sin(i*2.3+ht*3)))*k;
    const b=w/n*1.3;g+=P(`M${(x-b).toFixed(0)} ${by}C${(x-b*1.1).toFixed(0)} ${(by-hh*.45).toFixed(0)} ${(x-b*.2+f*12).toFixed(0)} ${(by-hh*.7).toFixed(0)} ${(x+f*18).toFixed(0)} ${(by-hh).toFixed(0)}C${(x+b*.5).toFixed(0)} ${(by-hh*.6).toFixed(0)} ${(x+b*1.1).toFixed(0)} ${(by-hh*.4).toFixed(0)} ${(x+b).toFixed(0)} ${by}Z`,['#FF5A2C','#FFB04C','#FFE36B'][i%3],{opacity:.9});}
  return g;};
// The long shadow of a taskmaster with a raised whip, lying across the ground (never the man himself).
const taskShadow=(x,y,s,op)=>op<=0?'':G(`translate(${x.toFixed(0)} ${y}) skewX(-38) scale(${s} ${(s*.42).toFixed(3)})`,
  C(0,-330,62,'#1A0604')+R(-58,-272,116,272,44,'#1A0604')+L(40,-232,150,-340,'#1A0604',28)+
  P('M150 -340Q270 -440 350 -300Q380 -240 310 -220','none',{stroke:'#1A0604','stroke-width':9}),op);
const brick=(x,y,s=1)=>R(x,y,150*s,40*s,4,'#C2703A',{stroke:'#6A2E14','stroke-width':3});

// ---- A0. Opening: ten lines burn into stone on a storm-lit summit ----
function burning(t){
  const cx=960,cy=470,TS=hv(1,1.32),I=[cx-200*TS,cy-105*TS];
  let g=glow(960,-300,1100,'#FF5A2A',.5)+glow(960,cy,900,'#FF9A3C',.3);
  for(let i=0;i<9;i++)g+=Ell(140+i*210+Math.sin(t*.3+i)*30,-520+(i%3)*90,260,100,['#5A2418','#4A1C14','#6A2C1A'][i%3],{opacity:.9})+Ell(140+i*210,-490+(i%3)*90,180,40,'#FF8A4C',{opacity:.18});
  g+=bolt(t,.02,1340,-640,-60)+bolt(t,AT.oneFirst+1.1,560,-640,-80)+bolt(t,AT.hangs+.3,1420,-640,-40);
  g+=P('M120 1800L420 840L760 790L960 760L1180 790L1500 840L1800 1800Z','#2A1612');
  for(let i=0;i<9;i++){const x=380+i*150,y=900+(i%3)*190;g+=mark(`M${x} ${y}l40 60l-30 70l50 80`,1,'#FF6A2A',6,{opacity:(.5+.4*Math.sin(t*2+i)).toFixed(2)})+glow(x+20,y+100,90,'#FF6A2A',.25);}
  g+=fireflies(t,280,-400,1360,2000,'#FFB04C',26,.9);
  // Each line catches fire in turn ("ten"); then all but the first dim ("one of them comes first");
  // on "hangs" gold threads tie every other line to the first and they glow again.
  const dim=ease.inOut(prog(t,AT.oneFirst,AT.oneFirst+.8)),hang=ease.inOut(prog(t,AT.hangs,AT.hangs+.9));
  const lit=k=>{const on=ease.out(prog(t,.1+k*.13,.45+k*.13));return k===0?on*(1+.25*Math.sin(t*4)*dim):on*(1-.75*dim+.55*hang);};
  let tb=tablets(cx,cy,1,lit);
  for(let k=0;k<10;k++){const p=prog(t,.1+k*.13,.45+k*.13);if(p>0&&p<1){const lx=(k<5?cx-205:cx+205),ly=cy-105+(k%5)*71.2;
    tb+=G(`translate(${lerp(lx-100,lx+110,p).toFixed(0)} ${ly+6})`,flames(t,0,0,40,60,1,4));}}
  for(let k=1;k<10;k++){const tx=k<5?cx-200:cx+210,ty=cy-105+(k%5)*71.2,I0=[cx-200,cy-105],d=`M${I0[0]+110} ${I0[1]}Q${(I0[0]+tx)/2+160} ${Math.min(I0[1],ty)-90} ${tx} ${ty}`;
    tb+=mark(d,prog(hang,(k-1)*.06,(k-1)*.06+.5),GOLD,5,{opacity:.95});}
  tb+=mark(scribble(cx-200,cy-105,170,50,4),ease.inOut(prog(t,AT.first1,AT.first1+.7)),CORAL,8);
  g+=G(`translate(${cx} ${cy}) scale(${TS}) translate(${-cx} ${-cy})`,tb);
  return g;
}

// ---- A1. Not murder, not steal: a night market ----
function dagger(x,y){return G(`rotate(-35 ${x} ${y})`,P(`M${x} ${y-120}L${x-20} ${y+10}L${x+20} ${y+10}Z`,'#D8DDE6',{stroke:'#8A93A3','stroke-width':3})+
  R(x-56,y+10,112,18,6,GOLD)+R(x-11,y+28,22,64,6,'#6A3A1E')+C(x,y+98,14,GOLD));}
function market(t){
  let g=glow(1480,-260,620,'#FF8A6C',.45)+C(1480,-260,70,'#FFE2C8',{opacity:.9})+glow(960,600,900,'#FF6A4C',.18);
  const rr=rng(31);
  for(let i=0;i<9;i++){const x=180+i*190,h=200+rr()*240,w=150+rr()*40;g+=R(x,690-h,w,h,6,i%2?'#4A1626':'#5A1E2C')+P(`M${x-10} ${690-h}L${x+w/2} ${640-h}L${x+w+10} ${690-h}Z`,'#3A0E1C');
    g+=R(x+30,690-h+50,34,40,4,'#FFB04C',{opacity:(.5+.4*Math.sin(t*1.3+i)).toFixed(2)});}
  g+=`<path d="${ridge(13,690,10,240)}" fill="#4A1620"/><path d="${ridge(14,790,8,200)}" fill="#3A1018"/>`;
  for(let r=0;r<9;r++)for(let c=0;c<16;c++){const y=830+r*r*12+r*40,x=-40+c*130+(r%2)*65,k=1+r*.18;g+=Ell(x,y,52*k,16*k,r%2?'#5A1E2A':'#4E1824',{stroke:'#2A0A12','stroke-width':3});}
  [[420,860],[1240,900],[1600,840]].forEach(([x,y])=>g+=glow(x,y,160,'#FFB04C',.35)+C(x,y,10,'#FFE9A8'));
  // Not murder: a dagger, crossed out as the word is said.
  const dx=640,dy=460;
  g+=piece(t,AT.murder-.7,dx,dy,strip(dx-150,dy-160,300,320,11,'#F6EFDC')+tape(dx,dy-156,90,-4)+dagger(dx,dy),11,1.2)+
    xMark(dx,dy,130,ease.inOut(prog(t,AT.murder+.1,AT.murder+.5)));
  // Not steal: a thief creeps to a stall and reaches for the purse.
  g+=R(1330,560,280,22,4,'#6A3A1E')+R(1345,582,16,140,3,'#4A2A14')+R(1580,582,16,140,3,'#4A2A14')+
    [0,1,2,3,4].map(i=>P(`M${1320+i*58} 380h58l-10 70h-38z`,i%2?'#FF5A48':'#F6EFDC')).join('')+R(1316,372,300,12,3,'#4A2A14');
  const got=ease.inOut(prog(t,AT.steal-.2,AT.steal+.3));
  g+=G(`translate(${(-90*got).toFixed(0)} ${(-30*got).toFixed(0)})`,Ell(1450,536,38,30,'#9A6A30')+P('M1428 510q22 -18 44 0','none',{stroke:'#4A2A14','stroke-width':5})+C(1500,550,12,GOLD)+C(1514,560,12,GOLD));
  const cr=prog(t,AT.notSteal-.9,AT.notSteal+.4),x=lerp(1060,1310,ease.inOut(cr));
  g+=folk(2,x,700,1,{lean:16,walk:cr>0&&cr<1?t*9:0,reach:lerp(.1,.8,prog(t,AT.notSteal,AT.steal))});
  g+=xMark(1340,560,150,ease.inOut(prog(t,AT.steal+.3,AT.steal+.7)));
  return g;
}

// ---- A2. "It's this": close on the first line of stone ----
function firstLine(t){
  const rr=rng(77);let g='';
