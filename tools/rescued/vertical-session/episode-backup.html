<!doctype html>
<meta charset="utf-8">
<title>Creation and the Fall: Full Episode</title>
<style>html,body{margin:0;background:#000;height:100%}svg{display:block;width:100vw;max-height:100vh}</style>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"></svg>
<script src="shared.js"></script>
<script src="style-kit.js"></script>
<script>
// Full episode in the glowing-collage style of clip 6, timed to the narration
// "Creation and the fall.wav" (260.4 s). Cue times below come from a word-level transcript.
// On-screen strips show the narration's own wording, with the passage it summarises.
const {G,R,C,E,L,P,T,prog,ease,lerp,mix,sc,rng,clamp}=K;
const {tw,hash,nid,jit,piece,glow,torn,ridge,strip,tape,label,mark,scribble,arrow,highlight,paperDefs,paperOver,vignette,chubby,along,sword,wing,snake}=S;
const INK='#141416',YEL='#FFE100',CORAL='#FF5A48',STN=2100,DUR=260.4,PAN=.32;
const r0=rng(404);
const stars=[...Array(140)].map(()=>[r0()*1920,r0()*1080,1+r0()*3.2,r0()*6]);
const flies=[...Array(30)].map(()=>[r0(),r0(),r0()*6.28,r0()]);
const held=(t,fps=12)=>Math.floor(t*fps)/fps;
const grad=(id,a,b,x2=1,y2=1)=>`<linearGradient id="${id}" x1="0" y1="0" x2="${x2}" y2="${y2}"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>`;
const ADAM={f:false,tunic:'#FFC24C',tunic2:'#E0623C'},EVE={f:true,tunic:'#7CFFE6',tunic2:'#2E9AD8'};

function sheetBase(i,c1,c2){
  const id='sh'+i,inner=torn(-34,-60,1988,1200,14+i,18,0,18);
  return grad(id,c1,c2,.7,1)+`<path d="${torn(-44,-60,2008,1200,10+i,18,0,18)}" fill="#F5F0E2"/><clipPath id="${id}c"><path d="${inner}"/></clipPath><g clip-path="url(#${id}c)"><path d="${inner}" fill="url(#${id})"/>`;
}
// A torn verse strip: lines of the narration, an optional highlight on one phrase, and a reference label.
function verse(t,at,x,y,lines,ref,o={}){
  const {size=46,hl=null,hlAt=at+.6,hlDur=.5,seed=7,labelBelow=true,id=1,maxW=0}=o;
  const w=Math.max(maxW,...lines.map(s=>tw(s,size)))+100,h=lines.length*size*1.32+size*.9;
  let g=strip(x,y,w,h,seed,'#F6EFDC',{ax:12,ay:4});
  if(hl){const li=lines.findIndex(s=>s.includes(hl));if(li>=0){const pre=lines[li].slice(0,lines[li].indexOf(hl));g+=highlight(x+50+tw(pre,size),y+size*.45+li*size*1.32,tw(hl,size),size*1.12,ease.inOut(prog(t,hlAt,hlAt+hlDur)),YEL);}}
  lines.forEach((s,i)=>g+=T(x+50,y+size*1.25+i*size*1.32,s,{size,font:'Georgia',fill:INK}));
  g+=tape(x+w-40,y+2,120,8);
  if(ref)g+=labelBelow?label(x,y+h+10,ref,{size:26}):label(x+w+10,y+h*.5-20,ref,{size:26});
  return piece(t,at,x+w/2,y+h/2,g,id,1.2);
}
function firefly(t,x0,y0,w,h,col,n=24,k=1){
  let g='';
  flies.slice(0,n).forEach((f,i)=>{const x=x0+f[0]*w+Math.sin(t*.9+f[2])*26,y=y0+f[1]*h+Math.cos(t+f[2]*2)*20,pl=.5+.5*Math.sin(t*3.4+i);g+=glow(x,y,26,col,pl*.9*k)+C(x,y,3,'#fff',{opacity:pl*k});});
  return g;
}
function starfield(t,k=1,maxY=1080){
  return stars.map(s=>s[1]<maxY?C(s[0],s[1],s[2],'#fff',{opacity:k*(.3+.6*Math.sin(t*2.2+s[3])**2)}):'').join('');
}
const pair=(t,x,y,s,o={})=>{
  const f=held(t,10),b=Math.sin(f*3)*2,{gap=170,aura='#7CFFE6',auraOp=.42,ad={},ev={}}=o;
  return chubby(x-gap/2,y+b,s,Object.assign({},ADAM,{aura,auraOp,filter:'htSoft'},ad))+chubby(x+gap/2,y-b,s*.97,Object.assign({},EVE,{flip:-1,aura,auraOp,filter:'htSoft'},ev));
};

// ---------- Sheet 0: In the beginning (0-12.45) ----------
function s0(t,l){
  let g=sheetBase(0,'#10144A','#05061C');
  g+=starfield(t,.5*prog(t,.2,1.5),700);
  // The deep: dark paper waves, slowly rolling.
  for(let i=0;i<4;i++){const y=640+i*95,ph=t*.35*(i%2?1:-1);g+=`<path d="${ridge(30+i,y+Math.sin(ph)*8,22-i*3,160+i*30)}" fill="${['#0E1A44','#0A1438','#07102C','#050A20'][i]}" transform="translate(${Math.sin(t*.3+i)*30} 0)"/>`;}
  // A slow dark swirl over the waters: formless and empty.
  const sw=prog(t,3.5,5.5);
  for(let k=0;k<5;k++){const rx=520-k*90,ry=150-k*24,a=t*(8+k*4)*(k%2?1:-1);g+=`<ellipse cx="1300" cy="560" rx="${rx}" ry="${ry}" fill="none" stroke="${['#2C3F8E','#24357C','#1C2C6C','#2A4A9E','#3A5FC8'][k]}" stroke-width="${10-k}" stroke-dasharray="${60+k*30} ${40+k*20}" transform="rotate(${a} 1300 560)" opacity="${(.55-k*.06)*sw}"/>`;}
  g+=glow(1300,560,520,'#1E2C7A',.5*sw);
  g+=verse(t,.25,90,110,['In the beginning, God created','the heavens and the earth.'],'GENESIS 1:1',{size:62,hl:'the heavens and the earth.',hlAt:2.2,hlDur:1.3,seed:3,id:1});
  // Formless, empty, dark.
  g+=piece(t,5.6,1260,560,label(1180,540,'FORMLESS',{size:32}),2,1.4)+arrow(1300,600,1330,660,1250,720,ease.inOut(prog(t,5.8,6.3)),CORAL,7);
  g+=piece(t,6.9,1560,470,label(1500,450,'EMPTY',{size:32}),3,1.4)+mark(scribble(1600,770,170,70,9),ease.inOut(prog(t,7.1,7.7)),CORAL,7);
  g+=piece(t,8.2,600,560,label(520,520,'DARKNESS OVER THE DEEP',{size:32}),4,1.4);
  g+=piece(t,8.6,300,480,label(90,454,'GENESIS 1:2',{size:26}),5,1);
  // "Then God spoke": a line of light crosses the dark.
  const sp=ease.inOut(prog(t,10.1,11.6));
  if(sp>0){
    const x=lerp(-100,2000,sp);
    g+=glow(x,560,420,'#E9FFFF',.75)+L(-100,560,x,560,'#F4FFFF',5,{opacity:.9})+glow(960,560,1200,'#FFFBE6',.5*prog(t,11.2,12.4));
    g+=piece(t,10.2,960,380,label(960,350,'THEN GOD SPOKE',{size:40,anchor:'middle'}),6,1.2);
  }
  return g;
}

// ---------- Sheet 1: six days (12.45-40.2) ----------
const DAYS=[12.56,17.0,20.98,24.52,29.04,33.72];
function dayArt(i,t,lt,x,y,w,h){
  const cx=x+w/2,cy=y+h/2;let g='';
  const id=nid();g+=`<clipPath id="${id}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6"/></clipPath><g clip-path="url(#${id})">`;
  const on=ease.out(prog(lt,0,.6));
  if(i===0){ // light, separated from darkness: no source
    g+=R(x,y,w,h,0,'#05061C')+G('',glow(x+w*.72,cy,w*.75,'#FFFBE6',.95)+R(x+w*.5,y,w*.5,h,0,'#FFF6D8',{opacity:.25}),on);
    g+=L(x+w*.5,y+20,x+w*.5,y+h-20,'#FFFFFF',3,{opacity:.6*on,'stroke-dasharray':'6 10'});
  }else if(i===1){ // sky dividing the waters
    g+=R(x,y,w,h,0,'#0B2E5C')+R(x,y,w,h*.32,0,'#0C6E86',{opacity:on})+R(x,y+h*.68,w,h*.32,0,'#0C6E86',{opacity:on});
    g+=G('',`<path d="${ridge(41,y+h*.3,8,40,x,x+w,y)}" fill="#0C6E86"/>`.replace(`L${x+w} ${y}L${x} ${y}Z`,`L${x+w} ${y-200}L${x} ${y-200}Z`),on);
    g+=mark(`M${x+20} ${cy} L${x+w-20} ${cy}`,ease.inOut(prog(lt,.2,1)),'#55F0FF',6)+glow(cx,cy,w*.5,'#55F0FF',.3*on);
  }else if(i===2){ // dry land, seas and plants
    g+=R(x,y,w,h,0,'#0B3A66')+`<path d="${ridge(52,lerp(y+h+40,y+h*.62,ease.out(prog(lt,0,.9))),18,60,x-20,x+w+20,y+h+60)}" fill="#22B890"/>`;
    for(let k=0;k<7;k++){const px=x+40+k*(w-80)/6,py=y+h*.66+Math.sin(k*2)*10,gr=ease.back(prog(lt,.5+k*.08,.9+k*.08)),sw=Math.sin(t*1.6+k)*5;if(gr>0)g+=L(px,py,px+sw,py-46*gr,'#0A3A4E',5)+glow(px+sw,py-46*gr,22,k%2?'#35F2B4':'#FF7BD5',.8)+C(px+sw,py-46*gr,8*gr,k%2?'#35F2B4':'#FF7BD5');}
  }else if(i===3){ // sun, moon and stars
    g+=R(x,y,w,h,0,'#081038');
    for(let k=0;k<26;k++)g+=C(x+hash(k,7)*w,y+hash(k,8)*h,1.4+hash(k,9)*2,'#fff',{opacity:on*(.4+.5*Math.sin(t*2+k)**2)});
    const sp=ease.back(prog(lt,0,.6)),mp=ease.back(prog(lt,.3,.9));
    g+=glow(x+w*.3,cy,140*sp,'#FFD45E',.9)+C(x+w*.3,cy,48*sp,'#FFD45E');
    g+=glow(x+w*.72,cy-20,80*mp,'#CFE8FF',.6)+`<path d="M${x+w*.72-30*mp} ${cy-20} a${34*mp} ${34*mp} 0 1 0 ${44*mp} -26 a${26*mp} ${26*mp} 0 1 1 ${-44*mp} 26Z" fill="#E8F2FF"/>`;
  }else if(i===4){ // fish and birds
    g+=R(x,y,w,h*.5,0,'#123A7A')+R(x,y+h*.5,w,h*.5,0,'#0A2A5E');
    for(let k=0;k<4;k++){const bx=x+((k*140+lt*90)%(w+80))-40,by=y+50+k*26,fl=Math.sin(t*10+k)*10;g+=G('',P(`M${bx-22} ${by+fl*.4} Q${bx-10} ${by-10} ${bx} ${by} Q${bx+10} ${by-10} ${bx+22} ${by+fl*.4}`,'none',{stroke:'#FFFFFF','stroke-width':5}),on);}
    for(let k=0;k<5;k++){const fx=x+w-((k*110+lt*70)%(w+80))+40,fy=y+h*.6+k*30+Math.sin(t*2+k)*6;g+=G('',E(fx,fy,24,13,k%2?'#FF9A5C':'#7CFFE6')+P(`M${fx+20} ${fy} L${fx+38} ${fy-12} L${fx+38} ${fy+12}Z`,k%2?'#FF9A5C':'#7CFFE6')+C(fx-12,fy-3,2.6,'#081038'),on);}
  }else{ // animals of the land
    g+=R(x,y,w,h,0,'#0E3A5A')+`<path d="${ridge(61,y+h*.72,8,70,x-20,x+w+20,y+h+60)}" fill="#22B890"/>`;
    const an=(ax,ay,s,c,k)=>{const st=Math.floor(t*6+k)%2*4;return `<g transform="translate(${ax} ${ay}) scale(${s})">`+E(0,-40,46,30,c)+C(40,-62,20,c)+R(-30,-18+st*.5,12,22,5,c)+R(18,-18-st*.5,12,22,5,c)+C(46,-64,3,'#081038')+`</g>`;};
    [[.22,1,'#FFC24C'],[.52,1.3,'#B98CFF'],[.8,.8,'#FF8A7A']].forEach((a,k)=>{const p=ease.back(prog(lt,.15+k*.25,.55+k*.25));if(p>0)g+=an(x+w*a[0]+Math.sin(t+k)*10,y+h*.75,a[1]*p*.9,a[2],k);});
  }
  return g+'</g>';
}
function s1(t,l){
  let g=sheetBase(1,'#141C5E','#0A0D3A')+starfield(t,.5,1080);
  const W=500,H=360,xs=[170,710,1250],ys=[150,580];
  const fin=prog(t,37.3,38.2);
  DAYS.forEach((d,i)=>{
    const x=xs[i%3],y=ys[Math.floor(i/3)],lt=t-d,on=lt>=0;
    let c=`<path d="${torn(x-8,y-8,W+16,H+16,70+i,6,4)}" fill="#F7F2E6"/>`+R(x,y,W,H,6,'#070A26');
    if(on)c+=dayArt(i,t,lt,x,y,W,H);
    c+=label(x-8,y-30,`DAY ${i+1}`,{size:26,bg:on?INK:'#2A2E52'});
    const names=['LIGHT','SKY · WATERS','LAND · SEAS · PLANTS','SUN · MOON · STARS','SEA CREATURES · BIRDS','LAND ANIMALS'];
    if(on)c+=piece(t,d+.3,x+W-10,y+H+6,label(x+W+8,y+H-14,names[i],{size:22,anchor:'end',bg:'#14141A'}),10+i,1);
    g+=`<g transform="${jit(t,20+i,x+W/2,y+H/2,1,8)}">${G('',c,1-.35*fin*(i<5?1:0))}</g>`;
  });
  g+=piece(t,13.0,960,70,label(960,40,'GENESIS 1:3–25',{size:28,anchor:'middle'}),9,1);
  // But God wasn't finished.
  if(t>37.3){
    const x=1250,y=580;
    g+=mark(scribble(x+250,y+180,300,230,12),ease.inOut(prog(t,37.4,38.1)),CORAL,9);
    g+=piece(t,38.0,1500,1010,label(1500,990,'BUT GOD WASN’T FINISHED',{size:30,anchor:'middle',bg:CORAL}),30,1.2);
  }
  return g;
}

// ---------- Sheet 2: humanity, very good, rest (40.2-61.6) ----------
function s2(t,l){
  let g=sheetBase(2,'#16206A','#0B2F4C');
  const rest=ease.inOut(prog(t,56.2,57.6));
  g+=glow(1240,640,820,'#35F2C4',.42*(1-.5*rest))+glow(1240,640,900,'#6A4CFF',.35*rest);
  g+=starfield(t,.55+.3*rest,620);
  g+=`<path d="${ridge(80,850,20,240)}" fill="#0F4F86"/><path d="${ridge(81,905,14,180)}" fill="#22E0B4"/>`;
  g+=firefly(t,700,300,1100,520,'#7CFFE6',22,.8);
  // The two of them appear.
  const ap=ease.back(prog(t,42.9,43.5));
  if(ap>0)g+=`<g transform="${sc(1240,905,ap)}">${pair(t,1240,910,1.6,{gap:250})}</g>`;
  g+=verse(t,42.8,70,90,['God made human beings,','male and female,','in his own image.'],'GENESIS 1:27',{size:50,hl:'in his own image.',hlAt:45.2,hlDur:.9,seed:21,id:1});
  // Blessed, and given charge over the earth: creatures circle in.
  const ch=ease.out(prog(t,47.3,48.5));
  if(ch>0){
    const ic=(k)=>{const a=k/7*6.283+t*.25,x=1240+Math.cos(a)*470,y=600+Math.sin(a)*190,cols=['#FFC24C','#35F2B4','#FF7BD5','#7CFFE6','#B98CFF','#FF9A5C','#FFD45E'];return glow(x,y,46,cols[k],.7*ch)+C(x,y,14*ch,cols[k]);};
    for(let k=0;k<7;k++)g+=ic(k);
    g+=piece(t,47.6,1240,330,label(1240,300,'BLESSED · GIVEN CHARGE OVER THE EARTH',{size:28,anchor:'middle'}),2,1.2);
    g+=piece(t,47.9,1240,370,label(1240,350,'GENESIS 1:28',{size:22,anchor:'middle',bg:'#14141A'}),3,1);
  }
  // Very good.
  if(t>51.8){
    const vx=110,vy=520;
    g+=piece(t,52.6,vx+330,vy+90,strip(vx,vy,560,170,33,'#F6EFDC',{ax:14,ay:5})+highlight(vx+60,vy+42,tw('very good.',92,'Georgia'),104,ease.inOut(prog(t,54.6,55.4)),YEL)+T(vx+60,vy+125,'very good.',{size:92,font:'Georgia',fill:INK})+tape(vx+60,vy+2,140,-8),4,1.4);
    g+=piece(t,52.4,vx+250,vy-40,T(vx,vy-24,'He looked at everything he had made, and it was',{size:36,font:'Georgia',style:'italic',fill:'#DDE8FF'}),5,.8);
    g+=piece(t,52.9,vx+560,vy+190,label(vx+560,vy+182,'GENESIS 1:31',{size:26,anchor:'end'}),6,1);
    g+=mark(`M${vx+60} ${vy+150} Q${vx+250} ${vy+160} ${vx+470} ${vy+146} M${vx+80} ${vy+166} Q${vx+260} ${vy+176} ${vx+460} ${vy+162}`,ease.inOut(prog(t,55.0,55.6)),CORAL,6);
  }
  // Day seven: rest.
  if(t>56.2){
    g+=G('',R(-40,-60,2000,1200,0,'#0A0B2E'),.35*rest);
    g+=piece(t,56.5,1240,140,label(1240,110,'DAY 7 · GOD RESTED, AND MADE THE DAY HOLY',{size:30,anchor:'middle',bg:'#1A1E50'}),7,1.2);
    g+=piece(t,57.0,1240,190,label(1240,166,'GENESIS 2:2–3',{size:22,anchor:'middle',bg:'#14141A'}),8,1);
    g+=glow(1240,170,520,'#FFF4C8',.35*rest);
  }
  return g;
}

// ---------- Shared pieces for the garden sheets ----------
const fade=(t,b,inner)=>t>=b+.35?'':G('',inner,1-prog(t,b,b+.35));
const EDENP={c1:'#6A2FD8',c2:'#2E62E8',c3:'#1FE5C0',tr:'#4630A0',fruit:'#FFD45E',glow:'#2DE8C4'};
const CRIMP={c1:'#5A1060',c2:'#AA1C60',c3:'#F2404E',tr:'#4A1038',fruit:'#FFB63C',glow:'#FF5A48'};
const GREYP={c1:'#2C2A3E',c2:'#3A3850',c3:'#4C4A5E',tr:'#26243A',fruit:'#6C6068',glow:'#55506A'};
const LIFEP={c1:'#B8860B',c2:'#E0A93F',c3:'#FFE08A',tr:'#6A4A2A',fruit:'#FFF4C8',glow:'#FFE08A'};
const mixP=(a,b,p)=>Object.fromEntries(Object.keys(a).map(k=>[k,mix(a[k],b[k],p)]));
const TFR=[[-260,-540],[-140,-700],[10,-790],[140,-690],[280,-560],[-40,-520],[90,-480],[-120,-470],[300,-430]];
function bigTree(t,x,y,s,p,gk=1,o={}){
  const {skip=-1,id=8}=o;
  const tree=`<g filter="url(#htSoft)"><path d="M-110 20 C-60 -130 -80 -300 -70 -460 L80 -460 C80 -300 70 -130 124 20Z" fill="${p.tr}"/><path d="M-60 -400 C-130 -400 -220 -370 -290 -272 C-220 -336 -120 -350 -40 -350Z" fill="${p.tr}"/>
    <circle cy="-610" r="280" fill="${p.c1}"/><circle cx="-250" cy="-520" r="150" fill="${p.c1}"/><circle cx="250" cy="-520" r="160" fill="${p.c1}"/><circle cx="-110" cy="-680" r="150" fill="${p.c2}"/><circle cx="130" cy="-670" r="165" fill="${p.c2}"/><circle cy="-520" r="170" fill="${p.c3}"/></g>`;
  let g=glow(x,y-560*s,700*s,p.glow,.42*gk)+`<g transform="${jit(t,id,x,y,1,10)} translate(${x} ${y}) scale(${s})">${tree}</g>`;
  TFR.forEach((f,i)=>{if(i===skip)return;const q=.86+.14*Math.sin(t*3+i);g+=glow(x+f[0]*s,y+f[1]*s,78*q*s,p.fruit,.85*gk)+C(x+f[0]*s,y+f[1]*s,22*s,p.fruit);});
  return g;
}
const fruitAt=(t,x,y,r,col,gk=1)=>glow(x,y,r*3.4,col,.9*gk)+C(x,y,r,col)+C(x-r*.32,y-r*.36,r*.3,'#fff',{opacity:.6});
const animal=(t,ax,ay,s,c,k)=>{const st=Math.floor(t*6+k)%2*4;return `<g transform="translate(${ax} ${ay}) scale(${s})"><g filter="url(#sticker)">`+E(0,-40,46,30,c)+C(40,-62,20,c)+R(-30,-18+st*.5,12,22,5,c)+R(18,-18-st*.5,12,22,5,c)+`</g>`+C(46,-64,3,'#081038')+`</g>`;};
function gardenGround(t,top,mid,near,seed=0){
  return `<path d="${ridge(90+seed,690,30,220)}" fill="${top}"/><path d="${ridge(91+seed,800,24,170)}" fill="${mid}"/><path d="${ridge(92+seed,930,14,150)}" fill="${near}"/>`;
}
function plants(t,k=1,cols=['#35F2B4','#FF7BD5'],n=16,seed=3){
  let g='';for(let i=0;i<n;i++){const x=hash(i,seed)*1920,base=900+hash(i,seed+1)*40,h=40+hash(i,seed+2)*60,sw=Math.sin(t*1.5+i)*6,c=cols[i%2];g+=L(x,base,x+sw,base-h,'#0A2A3E',5)+glow(x+sw,base-h,30,c,.7*k)+C(x+sw,base-h,8,c);}
  return g;
}

// ---------- Sheet 3: dust and breath (61.6-71.2) ----------
function s3(t,l){
  let g=sheetBase(3,'#123C5A','#0A1C3A');
  const z=lerp(1.06,1,ease.out(prog(t,61.3,62.9)));
  let w=glow(960,700,700,'#2DE8C4',.3)+`<path d="${ridge(95,880,16,200)}" fill="#7A5A3E"/><path d="${ridge(96,930,10,150)}" fill="#5E4430"/>`;
  // Dust heap, then the dust gathers into a man.
  const form=ease.inOut(prog(t,63.4,66.6)),breath=ease.inOut(prog(t,67.0,69.4));
  for(let i=0;i<110;i++){
    const hx=960+(hash(i,1)-.5)*360,hy=900-hash(i,2)*70*(1-Math.abs(hash(i,1)-.5)*1.6);

const SHEETS=[s0,s1,s2,s3,s4,s5,s6,s7,s8,s9,s10,s11];
const CUTS=[12.45,40.2,61.6,71.2,94.5,123.9,151.8,176.3,198.8,236.9,247.1];
const camX=t=>STN*CUTS.reduce((a,c)=>a+ease.inOut(prog(t,c-PAN,c+PAN)),0);
function frame(t){
  const cx=camX(t);
  let w='';
  SHEETS.forEach((fn,i)=>{const x=i*STN-cx;if(x>-2100&&x<2100)w+=G(`translate(${x.toFixed(1)} 0)`,fn(t,t)+'</g>');});
  let g=paperDefs(t)+R(0,0,1920,1080,0,'#07071A')+w;
  g+=vignette(.42);
  g+=paperOver({tex:.2,grain:.32,blot:.12,texL:.3});
  // Fade to black at the very end.
  const fo=prog(t,259.4,260.3);
  if(fo>0)g+=R(0,0,1920,1080,0,'#000',{opacity:fo});
  return g;
}
(function(){
  const svg=document.querySelector('svg');
  window.DUR=DUR;
  window.seek=t=>{svg.innerHTML=frame(Math.max(0,Math.min(t,DUR-.001)));};
  seek(0);
  if(!location.search.includes('render')){const st=performance.now();const loop=n=>{seek(((n-st)/1000)%DUR);requestAnimationFrame(loop);};requestAnimationFrame(loop);}
})();
